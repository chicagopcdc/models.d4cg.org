ncit:
  source_url: "https://evsexplore.semantics.cancer.gov/evsexplore/"
  concepts:
    ncit:C168949:
      d4cg_label: "honest_broker_subject_id"
      description: "Subject identifier assigned by the honest broker."
      last_updated: 2026-08-17

    ncit:C168950:
      d4cg_label: "data_contributor_id"
      description: "An identifier assigned to a data contributor."
      last_updated: 2026-08-17

    ncit:C16493:
      d4cg_label: "data_source"
      description: "Source of information collected in the course of a clinical trial, specifically used to differentiate
        between data as collected versus data that are derived or calculated. NOTE: In CDISC, a metadata attribute defined
        for each dataset variable in the Define.xml document of an SDTM submission that refers to the source of a variable
        (e.g., CRF, derived, sponsor defined, PRO, etc.). See also data element originator."
      last_updated: 2026-08-17

    ncit:C48045:
      d4cg_label: "age_precision"
      description: "A quantitative representation of the degree of accuracy necessary for or associated with a particular
        action."
      last_updated: 2026-08-17

    ncit:C21480:
      d4cg_label: "relation"
      description: "A person related by blood or marriage."
      last_updated: 2026-08-17

    ncit:C28421:
      d4cg_label: "sex"
      description: "An arbitrary categorization of individuals based on the assemblage of physical properties related to reproduction,
        and commonly associated with the designation of such categories as female and male. This designation is based on a
        combination of observable information from organ inventories, morphological assessments, hormone assessments, genetic
        testing, observed primary and secondary sex characteristics, menstrual status, and/or obstetric history. Current sex
        designation may or may not be the same as an individual's sex assigned or reported at birth. IMPORTANT NOTICE: The
        NCI Thesaurus contains biomedical terminologies that NCI does not own or control. This concept contains gender-related
        content that does not comply with Executive Order 14168."
      last_updated: 2026-08-17

    ncit:C16564:
      d4cg_label: "ethnicity"
      description: "A social group characterized by a distinctive social and cultural tradition that is maintained from generation
        to generation. Members share a common history and origin and a sense of identification with the group. They have similar
        and distinctive features in their lifestyle habits and shared experiences. They often have a common genetic heritage
        which may be reflected in their experience of health and disease."
      last_updated: 2026-08-17

    ncit:C17049:
      d4cg_label: "race"
      description: "A geographic ancestral origin category that is assigned to a population group based mainly on physical
        characteristics that are thought to be distinct and inherent."
      last_updated: 2026-08-17

    ncit:C18772:
      d4cg_label: "medical_history_condition"
      description: "A collection of information about a person's health. It may include information about allergies, illnesses
        and surgeries, and dates and results of physical exams, tests, screenings, and immunizations. It may also include
        information about medicines taken and about diet and exercise."
      last_updated: 2026-08-17

    ncit:C53263:
      d4cg_label: "condition_other"
      description: "Relevant elements of medical history, including preexisting medical conditions, events and facts (e.g.,
        allergies, race, pregnancy, smoking and alcohol use, hepatic/renal dysfunction, etc.) not listed in MedWatch form."
      last_updated: 2026-08-17

    ncit:C173595:
      d4cg_label: "gene"
      description: "The gene symbol that represents either a single gene that has a mutation or the gene that comprises the
        5' portion of the coding sequence involved in a fusion gene mutation."
      last_updated: 2026-08-17

    ncit:C204195:
      d4cg_label: "alteration_effect"
      description: "The effect of a sequence change on the function of an RNA, DNA, or protein."
      last_updated: 2026-08-17

    ncit:C198546:
      d4cg_label: "hgvs_coding"
      description: "The designation of a DNA coding sequence variation based on the Human Genome Variation Society (HGVS)
        nomenclature guidelines."
      last_updated: 2026-08-17

    ncit:C97928:
      d4cg_label: "hgvs_protein"
      description: "A variation in the sequence of a specific gene product."
      last_updated: 2026-08-17

    ncit:C156450:
      d4cg_label: "iscn"
      description: "An international standard for human chromosome nomenclature, which includes band names, symbols and abbreviated
        terms used in the description of human chromosome and chromosome abnormalities."
      last_updated: 2026-08-17

    ncit:C173545:
      d4cg_label: "maf_numeric"
      description: "The determination of the ratio of variant alleles to wild-type alleles present in a sample."
      last_updated: 2026-08-17

    ncit:C92976:
      d4cg_label: "mosaicism"
      description: "The occurrence of 2 or more cell lines with different genetic or chromosomal make-up, within a single
        individual or tissue."
      last_updated: 2026-08-17

    ncit:C185629:
      d4cg_label: "result_numeric"
      description: "The result of a function test expressed as a number."
      last_updated: 2026-08-17

    ncit:C186559:
      d4cg_label: "route"
      description: "The intended area to be affected by the choice of a particular route of administration of a medication."
      last_updated: 2026-08-17

    ncit:C37987:
      d4cg_label: "Alive"
      description: "Living; showing characteristics of life."
      last_updated: 2026-08-17

    ncit:C17998:
      d4cg_label: "Unknown"
      description: "A proper value is applicable but not known."
      last_updated: 2026-08-17

    ncit:C45828:
      d4cg_label: "Approximate"
      description: "Not quite exact or correct; almost exact or correct."
      last_updated: 2026-08-17

    ncit:C86021:
      d4cg_label: "Exact"
      description: "Marked by strict and particular and complete accordance with fact."
      last_updated: 2026-08-17

    ncit:C38155:
      d4cg_label: "Relapse"
      description: "The return of a disease after a period of remission."
      last_updated: 2026-08-17

    ncit:C96572:
      d4cg_label: "Father"
      description: "A male who contributes to the genetic makeup of his offspring through the fertilization of an ovum by
        his sperm."
      last_updated: 2026-08-17

    ncit:C96580:
      d4cg_label: "Mother"
      description: "A female who contributes to the genetic makeup of her offspring from the fertilization of her ovum."
      last_updated: 2026-08-17

    ncit:C150888:
      d4cg_label: "Son"
      description: "A male progeny with genetic makeup inherited from the parent."
      last_updated: 2026-08-17

    ncit:C150887:
      d4cg_label: "Daughter"
      description: "A female progeny with genetic makeup inherited from the parent."
      last_updated: 2026-08-17

    ncit:C96570:
      d4cg_label: "Brother"
      description: "A male who shares with his sibling the genetic makeup inherited from one or both of their shared biological
        parents."
      last_updated: 2026-08-17

    ncit:C17649:
      d4cg_label: "Other"
      description: "A proper value is applicable but not known."
      last_updated: 2026-08-17

    ncit:C20197:
      d4cg_label: "Male"
      description: "A person who belongs to the sex that normally produces sperm. The term is used to indicate biological
        sex distinctions, cultural gender role distinctions, or both. [The NCI Thesaurus contains biomedical terminologies
        that NCI does not own or control. This concept contains gender-related content that does not comply with Executive
        Order 14168.]"
      last_updated: 2026-08-17

    ncit:C16576:
      d4cg_label: "Female"
      description: "A person who belongs to the sex that normally produces ova. The term is used to indicate biological sex
        distinctions, or cultural gender role distinctions, or both. [The NCI Thesaurus contains biomedical terminologies
        that NCI does not own or control. This concept contains gender-related content that does not comply with Executive
        Order 14168.]"
      last_updated: 2026-08-17

    ncit:C41438:
      d4cg_label: "Undifferentiated"
      description: "Sex could not be determined; not uniquely defined; undifferentiated."
      last_updated: 2026-08-17

    ncit:C17459:
      d4cg_label: "Hispanic or Latino"
      description: "A person of Mexican, Puerto Rican, Cuban, Central or South American or other Spanish culture or origin,
        regardless of race. (NCI)"
      last_updated: 2026-08-17

    ncit:C41222:
      d4cg_label: "Not Hispanic or Latino"
      description: "A person not of Cuban, Mexican, Puerto Rican, South or Central American, or other Spanish culture or origin,
        regardless of race."
      last_updated: 2026-08-17

    ncit:C41259:
      d4cg_label: "American Indian or Alaska Native"
      description: "A person having origins in any of the original peoples of North and South America (including Central America),
        and who maintains tribal affiliation or community attachment. (FDA)"
      last_updated: 2026-08-17

    ncit:C41260:
      d4cg_label: "Asian"
      description: "A person having origins in any of the original peoples of the Far East, Southeast Asia, or the Indian
        subcontinent including, for example, Cambodia, China, India, Japan, Korea, Malaysia, Pakistan, the Philippine Islands,
        Thailand, and Vietnam. (FDA)"
      last_updated: 2026-08-17

    ncit:C16352:
      d4cg_label: "Black or African American"
      description: "A person having origins in any of the black racial groups of Africa. Terms such as \"Haitian\" or \"Negro\"\
        \ can be used in addition to \"Black or African American.\" (FDA)"
      last_updated: 2026-08-17

    ncit:C41219:
      d4cg_label: "Native Hawaiian or Other Pacific Islander"
      description: "Denotes a person having origins in any of the original peoples of Hawaii, Guam, Samoa, or other Pacific
        Islands. The term covers particularly people who identify themselves as part-Hawaiian, Native Hawaiian, Guamanian
        or Chamorro, Carolinian, Samoan, Chuu. (FDA)"
      last_updated: 2026-08-17

    ncit:C41261:
      d4cg_label: "White"
      description: "Denotes a person with European, Middle Eastern, or North African ancestral origin who identifies, or is
        identified, as White. (FDA)"
      last_updated: 2026-08-17

    ncit:C67109:
      d4cg_label: "Multiracial"
      description: "Having ancestors of several or various races."
      last_updated: 2026-08-17

    ncit:C3117:
      d4cg_label: "Hypertension"
      description: "A blood pressure of 140/90 or higher. High blood pressure usually has no symptoms. It can harm the arteries
        and cause an increase in the risk of stroke, heart attack, kidney failure, and blindness."
      last_updated: 2026-08-17

    ncit:C87088:
      d4cg_label: "Intrauterine Growth Restriction"
      description: "A fetus whose estimated weight is below the 10th percentile for its gestational age; however, many fetuses
        who meet this definition are simply small-for-gestational-age and are constitutionally small. The diagnosis of intrauterine
        growth restriction carries an increased risk of perinatal morbidity and mortality."
      last_updated: 2026-08-17

    ncit:C38012:
      d4cg_label: "Proteinuria"
      description: "A disorder characterized by laboratory test results that indicate the presence of excessive protein in
        the urine. It is predominantly albumin, but also globulin."
      last_updated: 2026-08-17

    ncit:C55891:
      d4cg_label: "Retinopathy"
      description: "A disorder involving the retina."
      last_updated: 2026-08-17

    ncit:C114934:
      d4cg_label: "Small for Gestational Age"
      description: "A newborn infant who has weight and/or length at birth more than two standard deviations below the mean
        for the reference population of the same sex and gestational age."
      last_updated: 2026-08-17

    ncit:C49704:
      d4cg_label: "CTCAE"
      description: "A standard terminology developed and maintained by the National Cancer Institute to report adverse events
        occurring in cancer clinical trials. The CTCAE contains a grading scale for each adverse event term representing the
        severity of the event. (NCI)"
      last_updated: 2026-08-17

    ncit:C81328:
      d4cg_label: "Weight"
      description: "A measurement that describes the vertical force exerted by a mass of the patient as a result of gravity."
      last_updated: 2026-08-17

    ncit:C138901:
      d4cg_label: "BMI"
      description: "The result of a body mass index measurement."
      last_updated: 2026-08-17

    ncit:C28252:
      d4cg_label: "kg"
      description: "A basic SI unit of mass. It is defined as the mass of an international prototype in the form of a platinum-iridium
        cylinder kept at Sevres in France. A kilogram is equal to 1,000 grams and 2.2046226 pounds."
      last_updated: 2026-08-17

    ncit:C49668:
      d4cg_label: "cm"
      description: "A basic unit of length equal to one hundredth of a meter or approximately 0.393700787 inch."
      last_updated: 2026-08-17

    ncit:C174119:
      d4cg_label: "Saliva"
      description: "A small volume of saliva removed for testing or storage."
      last_updated: 2026-08-17

    ncit:C17610:
      d4cg_label: "Blood"
      description: "A small volume of blood removed for testing or storage."
      last_updated: 2026-08-17

    ncit:C449:
      d4cg_label: "DNA"
      description: "A long linear double-stranded polymer formed from nucleotides attached to a deoxyribose backbone and found
        in the nucleus of a cell; associated with the transmission of genetic information."
      last_updated: 2026-08-17

    ncit:C178987:
      d4cg_label: "Serum"
      description: "A sample of serum collected for analysis."
      last_updated: 2026-08-17

    ncit:C13283:
      d4cg_label: "Urine"
      description: "Fluid containing water and waste products. Urine is made by the kidneys, stored in the bladder, and leaves
        the body through the urethra."
      last_updated: 2026-08-17

    ncit:C49488:
      d4cg_label: "Yes"
      description: "The affirmative response to a question."
      last_updated: 2026-08-17

    ncit:C49487:
      d4cg_label: "No"
      description: "The non-affirmative response to a question."
      last_updated: 2026-08-17

    ncit:C25566:
      d4cg_label: "Present"
      description: "Pertaining to or characterized by metaplasia."
      last_updated: 2026-08-17

    ncit:C25567:
      d4cg_label: "Absent"
      description: "Refers to a tumor that has spread to anatomic sites away from the original site of growth or has reappeared
        in any anatomic site. The vast majority of such tumors are malignant."
      last_updated: 2026-08-17

    ncit:C17003:
      d4cg_label: "PCR"
      description: "A laboratory method used to make many copies of a specific DNA sequence."
      last_updated: 2026-08-17

    ncit:C101294:
      d4cg_label: "Sequencing, NGS, Whole Genome"
      description: "A DNA sequencing technique in which the entirety of the individual's genome is sequenced."
      last_updated: 2026-08-17

    ncit:C101295:
      d4cg_label: "Sequencing, NGS, Whole Exome"
      description: "A DNA sequencing technique in which all of the exons of an individual's genome are sequenced."
      last_updated: 2026-08-17

    ncit:C101293:
      d4cg_label: "Sequencing, NGS, NOS"
      description: "A type of sequencing technology that makes use of high-throughput parallel sequencing of multiple fragments
        of DNA or RNA."
      last_updated: 2026-08-17

    ncit:C45447:
      d4cg_label: "Genotyping, NOS"
      description: "The determination of the DNA sequence of an individual."
      last_updated: 2026-08-17

    ncit:C16487:
      d4cg_label: "Cytogenetics, NOS"
      description: "The branch of biology that studies the cellular aspects of heredity, especially the chromosomes. Includes
        the study of disease states caused by numerical and structural chromosome abnormalities."
      last_updated: 2026-08-17

    ncit:C16606:
      d4cg_label: "Deletion"
      description: "A deletion that results in the loss of a DNA segment encompassing an entire gene sequence."
      last_updated: 2026-08-17

    ncit:C17354:
      d4cg_label: "Frameshift"
      description: "A mutation occurring within the protein-coding region of a gene which results in a shift in the reading
        frame of the encoded protein. Frameshift mutations often result in the premature truncation of a gene product."
      last_updated: 2026-08-17

    ncit:C18133:
      d4cg_label: "Missense"
      description: "A point mutation occurring within the protein-coding region of a gene, and which codes for a different
        amino acid than expected."
      last_updated: 2026-08-17

    ncit:C45574:
      d4cg_label: "Splice Site"
      description: "An inherited single base substitution in a sequence of eukaryotic DNA located in either an acceptor (3'
        or downstream) or donor (5' or upstream) splice site of a gene. Functional single nucleotide polymorphisms in these
        intron-exon junctions can cause incorrect RNA splicing which, in turn, alters gene expression."
      last_updated: 2026-08-17

    ncit:C13371:
      d4cg_label: "5' UTR"
      description: "Sequences on the 5' end of messenger RNAs that are not translated into protein.  5'UTR extends from the
        transcription start site to just before the ATG translation initiation codon.  This region contains the ribosome binding
        site and other transcription and translation regulating sequences."
      last_updated: 2026-08-17

    ncit:C13373:
      d4cg_label: "3' UTR"
      description: "Sequences on the 3' end of messenger RNAs that are not translated into protein. The 3'UTR is involved
        in many post-transcriptional regulatory pathways, including regulating translation efficiency, mRNA stability, and
        polyadenylation signals."
      last_updated: 2026-08-17

    ncit:C168799:
      d4cg_label: "Pathogenic"
      description: "A genetic variant that is known to directly contribute to the development of disease."
      last_updated: 2026-08-17

    ncit:C168800:
      d4cg_label: "Likely Pathogenic"
      description: "A genetic variant that is known to have a high likelihood (greater than 90% certainty) to contribute to
        the development of a disease."
      last_updated: 2026-08-17

    ncit:C94187:
      d4cg_label: "Uncertain Significance"
      description: "A variation in a genetic sequence whose association with disease risk is unknown."
      last_updated: 2026-08-17

    ncit:C168801:
      d4cg_label: "Likely Benign"
      description: "A genetic variant that is not expected to contribute to the development of a disease, but the scientific
        evidence may be insufficient to prove this conclusively."
      last_updated: 2026-08-17

    ncit:C45826:
      d4cg_label: "Homozygous"
      description: "Having two identical allelic forms of a gene, one inherited from each parent, on each of the two homologous
        chromosomes."
      last_updated: 2026-08-17

    ncit:C45825:
      d4cg_label: "Heterozygous"
      description: "Having two different allelic forms of a gene, one inherited from each parent, on each of the two homologous
        chromosomes."
      last_updated: 2026-08-17

    ncit:C198518:
      d4cg_label: "Compound Heterozygous"
      description: "Having two different allelic forms of a gene, one inherited from each parent, where each allele harbors
        a different genetic variation or gene mutation."
      last_updated: 2026-08-17

    ncit:C181397:
      d4cg_label: "Autoantibodies, NOS"
      description: "A measurement of the binding autoantibody in a biological specimen."
      last_updated: 2026-08-17

    ncit:C61032:
      d4cg_label: "Total Cholesterol"
      description: "A quantitative measurement of the total amount of cholesterol present in a sample of serum."
      last_updated: 2026-08-17

    ncit:C189506:
      d4cg_label: "LDL"
      description: "A measurement of the low density lipoprotein triglyceride in a biological specimen."
      last_updated: 2026-08-17

    ncit:C64433:
      d4cg_label: "ALT"
      description: "A measurement of the alanine aminotransferase in a biological specimen."
      last_updated: 2026-08-17

    ncit:C64467:
      d4cg_label: "AST"
      description: "A measurement of the aspartate aminotransferase in a biological specimen."
      last_updated: 2026-08-17

    ncit:C48570:
      d4cg_label: "%"
      description: "A unit for expressing a number as a fraction of hundred (on the basis of a rate or proportion per hundred)."
      last_updated: 2026-08-17

    ncit:C67015:
      d4cg_label: "mg/dL"
      description: "A unit of mass concentration defined as the concentration of one milligram of a substance in unit volume
        of the mixture equal to one cubic deciliter or 100 cubic centimeters. It is also a unit of mass density (volumic mass)
        defined as the density of substance which mass equal to one milligram occupies the volume one cubic deciliter or 100
        cubic centimeters."
      last_updated: 2026-08-17

    ncit:C67456:
      d4cg_label: "U/L"
      description: "A unit of substance concentration equal to the concentration at which one liter of mixture contains one
        unit of a substance."
      last_updated: 2026-08-17

    ncit:C77607:
      d4cg_label: "U/mL"
      description: "A unit of substance content expressed in unit(s) per milliliter."
      last_updated: 2026-08-17

    ncit:C64387:
      d4cg_label: "mmol/L"
      description: "A unit of concentration (molarity unit) equal to one millimole of solute per liter of solution."
      last_updated: 2026-08-17

    ncit:C67306:
      d4cg_label: "ng/mL"
      description: "A unit of concentration or mass density equal to one nanogram of substance per milliliter of solution
        or one microgram of substance per liter of solution."
      last_updated: 2026-08-17

    ncit:C64572:
      d4cg_label: "mg/L"
      description: "A metric unit of mass concentration defined as the concentration of one gram of a substance per unit volume
        of the mixture equal to one cubic meter. The concept also refers to the metric unit of mass density (volumic mass)
        defined as the density of a substance which mass equal to one gram occupies the volume of one cubic meter."
      last_updated: 2026-08-17

    ncit:C38757:
      d4cg_label: "Negative"
      description: "A finding of normality following an examination or investigation looking for the presence of a microorganism,
        disease, or condition."
      last_updated: 2026-08-17

    ncit:C60702:
      d4cg_label: "Random"
      description: "Governed by or depending on chance; lacking any definite plan or order or purpose."
      last_updated: 2026-08-17

    ncit:C70543:
      d4cg_label: "Never"
      description: "Not ever; at no time (in the past or future)."
      last_updated: 2026-08-17

    ncit:C48660:
      d4cg_label: "Not Applicable"
      description: "A report has been received but the description provided does not appear to relate to an adverse event.
        This code allows a report to be recorded for administration purposes, even if it doesn't meet the requirements for
        adverse event reporting."
      last_updated: 2026-08-17

    ncit:C28253:
      d4cg_label: "mg"
      description: "A measure of weight.  A milligram is approximately 450,000 times smaller than a pound and 28,000 times
        smaller than an ounce."
      last_updated: 2026-08-17

    ncit:C48152:
      d4cg_label: "mcg"
      description: "A metric unit of mass equal to one millionth of a gram or one thousandth of a milligram."
      last_updated: 2026-08-17

    ncit:C48579:
      d4cg_label: "IU"
      description: "A unit used to measure the activity of many vitamins, hormones, enzymes, and drugs. An IU is the amount
        of a substance that has a certain biological effect. For each substance there is an international agreement on the
        biological effect that is expected for 1 IU."
      last_updated: 2026-08-17

so:
  source_url: "https://www.ebi.ac.uk/ols4/ontologies/so"
  concepts:
    so:0000667:
      d4cg_label: "Insertion"
      description: "The sequence of one or more nucleotides added between two adjacent nucleotides in the sequence."
      last_updated: 2026-08-17
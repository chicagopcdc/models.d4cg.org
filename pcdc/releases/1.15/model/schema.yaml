id: https://models.d4cg.org/pcdc
name: pcdc
title: PCDC Data Model
license: CC BY-NC 4.0
version: 1.15
prefixes:
  pcdc: https://example.org/pcdc/
  linkml: https://w3id.org/linkml/
  ncit: http://purl.obolibrary.org/obo/NCIT_
default_prefix: pcdc
default_range: string
imports:
- linkml:types
- slots
- enums
subsets:
  base:
    name: base
    title: Base Model
    description: The PCDC data model represents a harmonized consensus data model developed across all participating PCDC
      disease groups and consortia. It serves as the canonical model from which disease-specific and dataset-specific views
      are derived.
  aml:
    name: aml
    title: Acute Myeloid Leukemia
    description: The AML view of the PCDC data model represents consensus data modeling by an international group of pediatric
      acute myeloid leukemia experts and is maintained by Data for the Common Good (D4CG) at the University of Chicago in
      collaboration with the International Acute Myeloid Leukemia Consortium (INTERACT). It is based on the collective requirements
      of its contributors.
  gct:
    name: gct
    title: Germ Cell Tumors
    description: The GCT view of the PCDC data model represents consensus data modeling by an international group of pediatric
      germ cell tumor experts and is maintained by Data for the Common Good (D4CG) at the University of Chicago in collaboration
      with the Malignant Germ Cell International Consortium (MaGIC). It is based on the collective requirements of its contributors.
  hl:
    name: hl
    title: Hodgkin Lymphoma
    description: The HL view of the PCDC data model represents consensus data modeling by an international group of pediatric
      Hodgkin lymphoma experts and is maintained by Data for the Common Good (D4CG) at the University of Chicago in collaboration
      with the Hodgkin Lymphoma Data Collaboration (NODAL). It is based on the collective requirements of its contributors.
  nbl:
    name: nbl
    title: Neuroblastoma
    description: The NBL view of the PCDC data model represents consensus data modeling by an international group of pediatric
      neuroblastoma experts and is maintained by Data for the Common Good (D4CG) at the University of Chicago in collaboration
      with the International Neuroblastoma Risk Group (INRG). It is based on the collective requirements of its contributors.
  nrsts:
    name: nrsts
    title: Non-rhabdomyosarcoma Soft Tissue Sarcomas
    description: The NRSTS view of the PCDC data model represents consensus data modeling by an international group of pediatric
      non-rhabdomyosarcoma soft tissue sarcoma experts and is maintained by Data for the Common Good (D4CG) at the University
      of Chicago in collaboration with the International Soft Tissue Sarcoma Consortium (INSTRuCT). It is based on the collective
      requirements of its contributors.
  rms:
    name: rms
    title: Rhabdomyosarcoma
    description: The RMS view of the PCDC data model represents consensus data modeling by an international group of pediatric
      rhabdomyosarcoma experts and is maintained by Data for the Common Good (D4CG) at the University of Chicago in collaboration
      with the International Soft Tissue Sarcoma Consortium (INSTRuCT). It is based on the collective requirements of its
      contributors.

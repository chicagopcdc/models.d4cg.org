      description: "The explanation for why a test, measurement, or assessment is executed."
      last_updated: 2026-08-17

    ncit:C171043:
      d4cg_label: "NTRK Rearranged"
      description: "A molecular abnormality indicating cytogenetic rearrangement involving an NTRK family gene."
      last_updated: 2026-08-17

    ncit:C171152:
      d4cg_label: "Sequencing, NGS, Single Cell RNA-seq"
      description: "A procedure that can determine the nucleotide sequence for all of the RNA transcripts in an amplified nucleotide sample that was derived from a single cell."
      last_updated: 2026-08-17

    ncit:C171253:
      d4cg_label: "gene_fusion_partner"

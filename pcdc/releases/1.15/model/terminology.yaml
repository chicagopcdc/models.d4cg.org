    ncit:C180370:
      d4cg_label: "Sarcome-13/OS2016"
      description: "The identifier Sarcome13/OS2016 assigned to a study in an OS clinical trial."
      last_updated: 2026-08-17

    ncit:C180372:
      d4cg_label: "Anterior Skull Base"
      description: "The portion of the skull that is formed laterally by the orbital plates of the frontal bone, medially by the cribriform palate and crista galli of the ethmoid bone, and posteriorly by the planum sphenoidale and lesser wings of the sphenoid bone."
      last_updated: 2026-08-17

    ncit:C180373:
      d4cg_label: "BOCG"
      description: "A cooperative group of individuals working with pediatric osteosarcoma."
      last_updated: 2026-08-17

    ncit:C180378:
      d4cg_label: "Polymorphous Low-Grade Neuroepithelial Tumor Of The Young"
      description: "A low-grade cerebral tumor associated with seizures and in many cases refractory epilepsy. It usually occurs in the second and third decades of life. It is characterized by the presence of oligodendroglioma-like components. It may also contain astrocytic components. MAPK pathway-activating genetic alterations play a role in the development of this tumor. Causative gene alterations include mutations resulting in the expression of BRAF p.V600E and gene fusions involving FGFR2 or FGFR3 genes. IDH gene mutations and 1p/19q codeletion are not present."
      last_updated: 2026-08-17

    ncit:C180559:
      d4cg_label: "Opening Pressure"
      description: "The initial pressure of cerebrospinal fluid when sampled via lumbar puncture. It is a surrogate measurement of intracranial pressure."
      last_updated: 2026-08-17

    ncit:C18058:
      d4cg_label: "System NOS >> Partial Response"
      description: "A decrease in the size of a tumor, or in the extent of cancer in the body, in response to treatment."
      last_updated: 2026-08-17

    ncit:C18059:
      d4cg_label: "Tobacco"
      description: "Use of tobacco in any form, e.g., smoking, chewing or sniffing."
      last_updated: 2026-08-17

    ncit:C1806:
      d4cg_label: "Gemtuzumab Ozogamicin"
      description: "A monoclonal antibody combined with a toxic substance that is used to treat certain types of acute myeloid leukemia in older patients and is being studied in the treatment of other types of cancer. Monoclonal antibodies are made in the laboratory and can locate and bind to substances in the body, including cancer cells. Mylotarg is a type of antibody-drug conjugate."
      last_updated: 2026-08-17

    ncit:C18060:
      d4cg_label: "Somatic"
      description: "An alteration in DNA that occurs after conception. Somatic mutations can occur in any of the cells of the body except the germ cells (sperm and egg) and therefore are not passed on to children. These alterations can (but do not always) cause cancer or other diseases."
      last_updated: 2026-08-17

    ncit:C18063:
      d4cg_label: "Gy"
      description: "A SI derived unit of absorbed radiation dose. One gray is equal to an absorbed dose of one joule per kilogram of matter, or to 100 rads."
      last_updated: 2026-08-17

    ncit:C18068:
      d4cg_label: "rt_dose_unit"
      description: "A unit of measurement of the dose of radiation received or absorbed."
      last_updated: 2026-08-17

    ncit:C180728:
      d4cg_label: "MRI T1 with Gadolinium"
      description: "T1 weighted magnetic resonance imaging done with the addition of a contrast agent to enhance tissues."
      last_updated: 2026-08-17

    ncit:C180729:
      d4cg_label: "MRI T2"
      description: "A method of magnetic resonance imaging (MRI) that creates contrast between tissues based on differences in the transverse relaxation of a tissue's net magnetization vector; it measures the time taken for spinning protons to lose phase coherence among the nuclei spinning perpendicular to the main field. This MRI sequence is produced by using a longer time to echo (TE) and repetition time (TR) than a T1-weighted sequence."
      last_updated: 2026-08-17

    ncit:C180788:
      d4cg_label: "SOS1 Variant"
      description: "A change in the nucleotide sequence of the SOS1 gene."
      last_updated: 2026-08-17

    ncit:C18084:
      d4cg_label: "Cytogenetics, Microarray, aCGH"
      description: "Comparative genomic hybridization (CGH) is a technique that allows the detection of losses and gains in DNA copy number across the entire genome without prior knowledge of specific chromosomal abnormalities.  Comparative genomic hybridization utilizes the hybridization of differentially labeled tumor and reference DNA to generate a map of DNA copy number changes in tumor genomes. Comparative genomic hybridization is an ideal tool for analyzing chromosomal imbalances in archived tumor material and for examining possible correlations between these findings and tumor phenotypes. (from Ried et al. J Mol Med 1997 75:801-14)"
      last_updated: 2026-08-17

    ncit:C180886:
      d4cg_label: "IDIPGR"
      description: "Questions used in the case report forms of the international diffuse intrinsic pontine glioma registry for pediatric cancers."
      last_updated: 2026-08-17

    ncit:C181023:
      d4cg_label: "Per Protocol"
      description: "Subject is receiving treatment based on protocol."
      last_updated: 2026-08-17

    ncit:C181258:
      d4cg_label: "Natural Killer Cells to Lymphocytes Ratio Measurement"
      description: "A relative measurement (ratio or percentage) of the natural killer cells to lymphocytes in a biological specimen."
      last_updated: 2026-08-17

    ncit:C181278:
      d4cg_label: "Absolute Monocyte Count"
      description: "A measurement of a sub-population of monocytes in a biological specimen."
      last_updated: 2026-08-17

    ncit:C18133:
      d4cg_label: "Missense"
      description: "A point mutation occurring within the protein-coding region of a gene, and which codes for a different amino acid than expected."
      last_updated: 2026-08-17

    ncit:C18136:
      d4cg_label: "PCR, RT-PCR"
      description: "A laboratory procedure in which an RNA strand is first transcribed into a DNA complement and then subjected to PCR amplification. Transcribing an RNA strand into a DNA complement is termed reverse transcription and is done by the enzyme reverse transcriptase."
      last_updated: 2026-08-17

    ncit:C181397:
      d4cg_label: "Autoantibodies, NOS"
      description: "A measurement of the binding autoantibody in a biological specimen."
      last_updated: 2026-08-17

    ncit:C181410:
      d4cg_label: "Valproate"
      description: "A measurement of the valproate in a biological specimen."
      last_updated: 2026-08-17

    ncit:C181839:
      d4cg_label: "ann_arbor_mod_ab"
      description: "An indication whether A- or B-designations, based on the Ann Arbor lymphoma classification system guidelines, were used to modify staging classifications."
      last_updated: 2026-08-17

    ncit:C18189:
      d4cg_label: "Pathology"
      description: "The medical science, and specialty practice, concerned with all aspects of disease, but with special reference to the essential nature, causes, and development of abnormal conditions, as well as the structural and functional changes that result from the disease processes. Informally used to mean the result of such an examination."
      last_updated: 2026-08-17

    ncit:C1819:
      d4cg_label: "Hydrocortisone Sodium Succinate"
      description: "The sodium salt of hydrocortisone succinate with glucocorticoid property. Hydrocortisone sodium succinate is chemically similar to the endogenous hormone that stimulates anti-inflammatory and immunosuppressive activities, in addition to exhibiting minor mineralocorticoid effects. This agent binds to intracellular glucocorticoid receptors and is translocated into the nucleus, where it initiates the transcription of glucocorticoid-responsive genes, such as various cytokines and lipocortins. Lipocortins inhibit phospholipase A2, thereby blocking the release of arachidonic acid from membrane phospholipids and preventing the synthesis of prostaglandins and leukotrienes, both potent mediators of inflammation."
      last_updated: 2026-08-17

    ncit:C182031:
      d4cg_label: "AML-BFM Registry2017"
      description: "The identifier AMLBFMRegistry2017, assigned to a study in an AML clinical trial."
      last_updated: 2026-08-17

    ncit:C182032:
      d4cg_label: "AML-BFM1998"
      description: "The identifier AMLBFM1998, assigned to a study in an AML clinical trial."
      last_updated: 2026-08-17

    ncit:C18213:
      d4cg_label: "System NOS >> Stable Disease"
      description: "A disease that is neither decreasing nor increasing in extent or severity."
      last_updated: 2026-08-17

    ncit:C182199:
      d4cg_label: "Transverse"
      description: "A measure of the transaxial dimension of the tumor."
      last_updated: 2026-08-17

    ncit:C1822:
      d4cg_label: "Recombinant FSH"
      description: "A therapeutic glycoprotein hormone synthesized by recombinant DNA technology or purified from biological sources, whose endogenous counterpart follicle stimulating hormone (FSH) stimulates and maintains the normal functions of reproductive system in males and females. (NCI04)"
      last_updated: 2026-08-17

    ncit:C182305:
      d4cg_label: "Incomplete Resection"
      description: "A response that the resection was incomplete, between 10-90 percent."
      last_updated: 2026-08-17

    ncit:C182336:
      d4cg_label: "Myelopathy, Focal Weakness"
      description: "Impairments of brain function, the nerve or spinal cord that affect a specific region of the body."
      last_updated: 2026-08-17

    ncit:C182395:
      d4cg_label: "Cranial-Caudal"
      description: "A measure of the craniocaudal dimension of the tumor."
      last_updated: 2026-08-17

    ncit:C1829:
      d4cg_label: "Lonafarnib"
      description: "A synthetic tricyclic derivative of carboxamide with antineoplastic properties.  Lonarfanib binds to and inhibits farnesyl transferase, an enzyme involved in the post-translational modification and activation of Ras proteins.  Ras proteins participate in numerous signalling pathways (proliferation, cytoskeletal organization), and play an important role in oncogenesis.  Mutated ras proteins have been found in a wide range of human cancers. (NCI04)"
      last_updated: 2026-08-17

    ncit:C18303:
      d4cg_label: "Ploidy"
      description: "A test used to measure nuclear deoxyribonucleic acid content (ploidy or multiplicity of the basic number of chromosomes) in a cell."
      last_updated: 2026-08-17

    ncit:C1834:
      d4cg_label: "Cilengitide"
      description: "A cyclic Arg-Gly-Asp peptide with potential antineoplastic activity.  Cilengitide binds to and inhibits the activities of the alpha(v)beta(3) and alpha(v)beta(5) integrins, thereby inhibiting endothelial cell-cell interactions, endothelial cell-matrix interactions, and angiogenesis. (NCI04)"
      last_updated: 2026-08-17

    ncit:C18363:
      d4cg_label: "BRAF Gene"
      description: "A gene that makes a protein called B-RAF, which is involved in sending signals in cells and in cell growth. This gene may be mutated (changed) in many types of cancer, which causes a change in the B-RAF protein. This can increase the growth and spread of cancer cells."
      last_updated: 2026-08-17

    ncit:C18394:
      d4cg_label: "SMARCB1 Variant"
      description: "This gene plays a role in chromatin remodeling and regulation of transcription."
      last_updated: 2026-08-17

    ncit:C1844:
      d4cg_label: "Thalidomide"
      description: "A drug used to treat advanced renal cell carcinoma (a type of kidney cancer). It is also being studied in the treatment of other types of cancer. Temsirolimus blocks a protein involved in cell division, and may kill cancer cells. It is a type of rapamycin analog and a type of serine/threonine kinase inhibitor."
      last_updated: 2026-08-17

    ncit:C184425:
      d4cg_label: "Myeloid Cell Count"
      description: "A measurement of the myeloid cells in a biological specimen."
      last_updated: 2026-08-17

    ncit:C184675:
      d4cg_label: "EBV IgG"
      description: "A measurement of the Epstein-Barr virus in a biological specimen."
      last_updated: 2026-08-17

    ncit:C184790:
      d4cg_label: "Progestational Intrauterine Device"
      description: "An intrauterine device impregnated with progestin (synthetic progesterone) that can be inserted into the uterus to prevent conception."
      last_updated: 2026-08-17

    ncit:C1851:
      d4cg_label: "Bortezomib"
      description: "A dipeptide boronic acid analogue with antineoplastic activity. Bortezomib reversibly inhibits the 26S proteasome, a large protease complex that degrades ubiquinated proteins. By blocking the targeted proteolysis normally performed by the proteasome, bortezomib disrupts various cell signaling pathways, leading to cell cycle arrest, apoptosis, and inhibition of angiogenesis. Specifically, the agent inhibits nuclear factor (NF)-kappaB, a protein that is constitutively activated in some cancers, thereby interfering with NF-kappaB-mediated cell survival, tumor growth, and angiogenesis. In vivo, bortezomib delays tumor growth and enhances the cytotoxic effects of radiation and chemotherapy."
      last_updated: 2026-08-17

    ncit:C185167:
      d4cg_label: "Astrocytoma, IDH-Mutant"
      description: "An astrocytoma associated with IDH1 or IDH2 gene mutations and absence of 1p/19q codeletion. It is classified as grade 2, 3, or 4."
      last_updated: 2026-08-17

    ncit:C185197:
      d4cg_label: "Peritoneal Fluid"
      description: "A specimen of fluid from the peritoneum."
      last_updated: 2026-08-17

    ncit:C185204:
      d4cg_label: "Plasma"
      description: "A specimen of plasma."
      last_updated: 2026-08-17

    ncit:C185218:
      d4cg_label: "Diffuse Low-Grade Glioma, MAPK Pathway-Altered"
      description: "A rare, low-grade diffuse glioma with morphological features of astrocytoma or oligodendroglioma, generally affecting children. It is characterized by a gene alteration that results in a MAPK pathway abnormality. The genetic abnormalities are typically a BRAF p.V600E substitution mutation, mutations or fusions involving the FGFR1 gene and internal tandem duplication (ITD) of the sequences of FGFR1 gene encoding the tyrosine kinase domain (TKD). The tumor is IDH-wildtype and does not have a homozygous deletion of CDKN2A gene."
      last_updated: 2026-08-17

    ncit:C185240:
      d4cg_label: "Total Gastrectomy"
      description: "Surgical removal of the whole stomach along with a portion of the distal esophagus, proximal duodenum, and associated lymph nodes."
      last_updated: 2026-08-17

    ncit:C185306:
      d4cg_label: "Frontline Study"
      description: "A clinical trial for previously untreated patients that studies the use of a first line of treatment."

      last_updated: 2026-08-17

    ncit:C177306:
      d4cg_label: "del(11p15.5)"
      description: "A cytogenetic abnormality that refers to any loss of genetic material from the short arm of chromosome 11 that includes the band at 11p15.5."
      last_updated: 2026-08-17

    ncit:C177307:
      d4cg_label: "del(9p21)"
      description: "A cytogenetic abnormality that refers to any loss of genetic material from the short arm of chromosome 9 that includes the band at 9p21."
      last_updated: 2026-08-17


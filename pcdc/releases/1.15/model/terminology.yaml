    ncit:C185327:
      d4cg_label: "Staging Laparotomy"
      description: "A laparotomy performed with the intent of staging a disease from the observations."
      last_updated: 2026-08-17

    ncit:C185368:
      d4cg_label: "Diffuse Midline Glioma, H3 K27-Altered"
      description: "A diffuse midline glioma characterized by H3 K27 alteration and usually either a histone H3 K27M mutation, an EGFR mutation, or aberrant overexpression of EZHIP. The prognosis is poor."
      last_updated: 2026-08-17

    ncit:C185371:
      d4cg_label: "Diffuse Hemispheric Glioma, H3 G34-Mutant"
      description: "A WHO grade 4 diffuse glioma arising in the cerebral hemispheres. It is characterized by the presence of missense mutation of the H3-3A gene. The prognosis is poor."
      last_updated: 2026-08-17

    ncit:C1854:
      d4cg_label: "PEG-filgrastim"
      description: "A drug used to increase numbers of white blood cells in patients who are receiving chemotherapy. It is a type of colony-stimulating factor."
      last_updated: 2026-08-17

    ncit:C185467:
      d4cg_label: "Diffuse Pediatric-Type High-Grade Glioma, H3-Wildtype And IDH-Wildtype"
      description: "An aggressive, WHO grade 4 diffuse brain glioma usually affecting children, adolescents, or young adults. It is characterized by the absence of histone H3, IDH1, and IDH2 mutations. It includes the following subtypes, based on DNA methylation profiles: diffuse pediatric-type high grade glioma RTK1, diffuse pediatric-type high grade glioma RTK2, and diffuse pediatric-type high grade glioma MYCN."
      last_updated: 2026-08-17

    ncit:C185471:
      d4cg_label: "Infant-Type Hemispheric Glioma"
      description: "A high-grade cellular astrocytoma that arises in the cerebral hemisphere and occurs in early childhood. It is characterized by receptor tyrosine kinase fusions in the NTRK family, ROS1, ALK, or MET genes. It includes the following subtypes: infant-type hemispheric glioma, NTRK-altered, infant-type hemispheric glioma, ROS1-altered, infant-type hemispheric glioma, ALK-altered, and infant-type hemispheric glioma, MET-altered."
      last_updated: 2026-08-17

    ncit:C185476:
      d4cg_label: "bulk_nodal_aggregate"
      description: "Bulk at an alternate site to the thorax defined as any mass measuring 10 cm or more by any imaging study."
      last_updated: 2026-08-17

    ncit:C185482:
      d4cg_label: "Intracytoplasmic Sperm Injection"

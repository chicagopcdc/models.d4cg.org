    ncit:C185879:
      d4cg_label: "Astrocytoma With Piloid Features"
      description: "An astrocytoma characterized by high-grade piloid and/or glioblastoma-like histological features. It may occur anywhere in the central nervous system but most often arises in the posterior fossa. Alterations in the following three pathways are responsible for the pathogenesis of this tumor: MAPK pathway, retinoblastoma tumor suppressor protein cell-cycle pathway, and telomere maintenance pathway."
      last_updated: 2026-08-17

    ncit:C185935:
      d4cg_label: "Diffuse Glioneuronal Tumor with Oligodendroglioma-Like Features and Nuclear Clusters"
      description: "A provisional tumor entity described in the supratentorial brain and characterized by a distinct DNA methylation profile and monosomy of chromosome 14. It is composed of small to medium-sized cells showing perinuclear oligodendroglioma-like haloes, scattered multinucleated cells, and nuclear clusters composed of large pleomorphic nuclei. Most cases have been reported in pediatric patients."
      last_updated: 2026-08-17

    ncit:C186217:
      d4cg_label: "Oligoastrocytic Tumors"
      description: "An indication as to whether bone tumors are present."
      last_updated: 2026-08-17

    ncit:C186304:
      d4cg_label: "function_test"
      description: "The test of the function of an organ or body system."
      last_updated: 2026-08-17

    ncit:C186343:
      d4cg_label: "Supratentorial Ependymoma"
      description: "A circumscribed ependymoma that arises from the supratentorial region of the brain. The diagnosis of supratentorial ependymoma should be made either when genetic analysis did not reveal a fusion gene involving ZFTA or YAP1 genes (not elsewhere classified -NEC) or when the genetic analysis was unsuccessful or not reported (not otherwise specified-NOS)."
      last_updated: 2026-08-17

    ncit:C186350:
      d4cg_label: "Supratentorial Ependymoma, ZFTA fusion-positive"
      description: "A circumscribed ependymoma that arises from the supratentorial region of the brain. It is characterized by the presence of a fusion gene involving ZFTA gene. Available data indicate that it has the poorest prognosis of all supratentorial ependymomas."
      last_updated: 2026-08-17

    ncit:C186351:
      d4cg_label: "Supratentorial Ependymoma, YAP1 fusion-positive"
      description: "An uncommon circumscribed ependymoma that arises from the supratentorial region of the brain. It affects young children and is characterized by the presence of a fusion gene involving YAP1 gene. Available data indicate that it has a favorable prognosis as compared to other supratentorial ependymomas."
      last_updated: 2026-08-17

    ncit:C186352:
      d4cg_label: "le_sub_detail"
      description: "An added in-depth or explanation of a health problem that occurs months or years after a disease is diagnosed or after treatment has ended."
      last_updated: 2026-08-17

    ncit:C186353:
      d4cg_label: "pro_measurement_type"
      description: "The type of patient reported outcome measurement."
      last_updated: 2026-08-17

    ncit:C186439:
      d4cg_label: "PEDPRO-CTCAE"
      description: "A measurement system that characterized the frequency, severity, interference, and presence/absence of symptomatic toxicities that include pain, fatigue, nausea, and cutaneous side effects such as rash and hand-foot syndrome, all toxicities that can be meaningfully reported from the patient perspective. The pediatric module permits self-reporting by children and adolescents ages 7-17 years."
      last_updated: 2026-08-17

    ncit:C186443:
      d4cg_label: "Posterior Fossa Ependymoma"
      description: "A circumscribed ependymoma that arises in the posterior fossa. The diagnosis of posterior fossa ependymoma should be made either when molecular analysis for DNA methylation profiling cannot assign a molecular group (not elsewhere classified -NEC) or when the molecular analysis for DNA methylation profiling was unsuccessful or not reported (not otherwise specified-NOS)."
      last_updated: 2026-08-17

    ncit:C186450:
      d4cg_label: "Posterior Fossa Ependymoma, Group PFA"
      description: "A circumscribed ependymoma that arises in the posterior fossa with characteristic DNA methylation patterns, including CpG island hypermethylation, global DNA hypomethylation, reduction of nuclear H3 p.K28me3 (K27me3) expression, and EZHIP  overexpression. It usually occurs in children younger than five years. PFA ependymomas have a worst prognosis compared to PFB ependymomas."
      last_updated: 2026-08-17

    ncit:C186451:
      d4cg_label: "Posterior Fossa Ependymoma, Group PFB"
      description: "A circumscribed ependymoma that arises in the posterior fossa with characteristic DNA methylation patterns including retention of nuclear H3 p.K28me3 (K27me3) expression, absence of CpG island hypermethylation, absence of global DNA hypomethylation, and absence of EZHIP overexpression. Widespread cytogenetic abnormalities are present. Frequent chromosomal aberrations include loss of 22q, monosomy 6, and trisomy 18. It occurs in children older than five years and adults and has a relatively good prognosis."
      last_updated: 2026-08-17

    ncit:C186476:
      d4cg_label: "le_severity_grade"
      description: "A severity grade assigned to the late effects."
      last_updated: 2026-08-17

    ncit:C186494:
      d4cg_label: "Spinal Ependymoma, MYCN-Amplified"
      description: "A rare, aggressive ependymoma that arises from the spinal cord. It displays microvascular proliferation, necrosis, and high mitotic rate. It is characterized by high-level MYCN amplification. Cytogenetic abnormalities include loss of chromosome 10 and focal losses on chromosome 11q. The prognosis is poor."
      last_updated: 2026-08-17

    ncit:C186534:
      d4cg_label: "Embryonal Tumor with Multilayered Rosettes, C19MC Amplified"
      description: "A central nervous system embryonal tumor characterized by the presence of multilayered rosette formation and typically the presence of amplification of the C19MC region on chromosome 19 (19q13.42) or rarely a DICER1 mutation."
      last_updated: 2026-08-17

    ncit:C186559:
      d4cg_label: "route"
      description: "The intended area to be affected by the choice of a particular route of administration of a medication."
      last_updated: 2026-08-17

    ncit:C186573:
      d4cg_label: "KBTBD4 Variant"
      description: "A change in the nucleotide sequence of the KBTBD4 gene."
      last_updated: 2026-08-17

    ncit:C186610:
      d4cg_label: "Primary Intracranial Sarcoma  DICER1-Mutant"
      description: "A primary intracranial sarcoma composed of malignant pleomorphic or spindle neoplastic cells typically demonstrating myogenic and/or chondroid differentiation. Cytoplasmic eosinophilic globules and myxoid stroma formation are usually present. It is associated with mutations in the DICER1 gene."
      last_updated: 2026-08-17

    ncit:C186614:
      d4cg_label: "Intracranial Mesenchymal Tumor  FET-CREB Fusion-Positive"
      description: "A provisional entity that refers to a group of neoplasms with a broad morphological spectrum, characterized by fusion of a FET family gene (usually EWSR1 and rarely FUS) with a member of the CREB family of transcription factors (CREB1, ATF1, or CREM). It includes entities previously termed intracranial angiomatoid fibrous histiocytoma or intracranial myxoid mesenchymal tumor. It is usually located in the supratentorial brain and mostly affects children and young adults. There is a spectrum of clinical behaviors ranging from slowly growing tumors to rapid recurrences, and rarely metastases."
      last_updated: 2026-08-17

    ncit:C186658:
      d4cg_label: "Immunodeficiency-Related Central Nervous System Lymphoma"
      description: "A lymphoma that arises from the central nervous system in patients with acquired immunodeficiency conditions or rarely, hereditary immunodeficiency syndromes."
      last_updated: 2026-08-17

    ncit:C186692:
      d4cg_label: "Flat/Fixed"
      description: "An indication that normalization was at a fixed or flat basis."
      last_updated: 2026-08-17

    ncit:C186693:
      d4cg_label: "normalization_basis"
      description: "An indication of what method was used to normalize the data."
      last_updated: 2026-08-17

    ncit:C186743:
      d4cg_label: "COSS-GPOH"
      description: "The section of the German Society of Pediatric Oncology and Hematology dedicated to the study of osteosarcoma."
      last_updated: 2026-08-17

    ncit:C186745:
      d4cg_label: "skip_met_involvement"
      description: "A question about the areas involved in the skip metastasis."
      last_updated: 2026-08-17

    ncit:C186769:
      d4cg_label: "MAP-GR"
      description: "A control arm for patients receiving a regimen of methotrexate, doxorubicin and cisplatin (MAP) after good response to the MAP regimen pre-operatively."
      last_updated: 2026-08-17

    ncit:C186770:
      d4cg_label: "MAP-IFN-GR"
      description: "An experimental treatment arm for patients receiving a regimen of methotrexate, doxorubicin and cisplatin (MAP) plus interferon (IFN) post-operatively after good response to the MAP regimen pre-operatively."
      last_updated: 2026-08-17

    ncit:C186771:
      d4cg_label: "MAP-PR"
      description: "A control arm for patients receiving a regimen of methotrexate, doxorubicin and cisplatin (MAP) after poor response to the MAP regimen pre-operatively."
      last_updated: 2026-08-17

    ncit:C186772:
      d4cg_label: "MAP-IE-PR"
      description: "An experimental treatment arm for patients receiving a regimen of methotrexate, doxorubicin and cisplatin (MAP) plus a regimen of ifosfamide and etoposide (IE) post-operatively after poor response to the MAP regimen pre-operatively."
      last_updated: 2026-08-17

    ncit:C186773:
      d4cg_label: "MAP-NR"
      description: "A control arm for patients receiving a regimen of methotrexate, doxorubicin and cisplatin (MAP) with no response."
      last_updated: 2026-08-17

    ncit:C186775:
      d4cg_label: "POSTOP-CHEMO"
      description: "A treatment arm for patients receiving postoperative chemotherapy."
      last_updated: 2026-08-17

    ncit:C1867763:
      d4cg_label: "POSTOP-CHEMO-MIF"
      description: ""
      last_updated: 2026-08-17

    ncit:C186777:
      d4cg_label: "CHEMO-ZOL"
      description: "A treatment arm for patients receiving chemotherapy in combination with zoledronic acid."
      last_updated: 2026-08-17

    ncit:C186778:
      d4cg_label: "REG-ACTIVE"
      description: "An experimental treatment arm for patients receiving regorafenib as the active drug."
      last_updated: 2026-08-17

    ncit:C186779:
      d4cg_label: "REG-PLACEBO"
      description: "A control arm for patients receiving placebo instead of the experimental drug regorafenib."
      last_updated: 2026-08-17

    ncit:C187095:
      d4cg_label: "Course"
      description: "The type of protocol treatment course administered with respect to Course Timing."
      last_updated: 2026-08-17

    ncit:C1872:
      d4cg_label: "Midostaurin"
      description: "A substance that is being studied in the treatment of leukemia. It belongs to the family of drugs called protein kinase inhibitors."
      last_updated: 2026-08-17

    ncit:C187268:
      d4cg_label: "Increased Intracranial Pressure"
      description: "Pressure within the craniospinal compartment is increased."
      last_updated: 2026-08-17

    ncit:C187408:
      d4cg_label: "MAPK1 Variant"
      description: "A variation in the amino acid sequence for the dual specificity mitogen-activated protein kinase 1 protein."
      last_updated: 2026-08-17

    ncit:C18772:
      d4cg_label: "medical_history_condition"
      description: "A collection of information about a person's health. It may include information about allergies, illnesses and surgeries, and dates and results of physical exams, tests, screenings, and immunizations. It may also include information about medicines taken and about diet and exercise."
      last_updated: 2026-08-17

    ncit:C187802:
      d4cg_label: "Erythroid Precursors Count"
      description: "A measurement of the erythroid precursors in a biological specimen."
      last_updated: 2026-08-17

    ncit:C187947:
      d4cg_label: "Lymphoid Aggregates"
      description: "A measurement of the lymphoid aggregates in a biological specimen."
      last_updated: 2026-08-17

    ncit:C1881:
      d4cg_label: "Motexafin Gadolinium"
      description: "A substance that is being studied in the treatment of cancer. It may make tumor cells more sensitive to radiation therapy, improve tumor images using magnetic resonance imaging (MRI), and kill cancer cells. It is a type of metalloporphyrin complex."
      last_updated: 2026-08-17

    ncit:C188169:
      d4cg_label: "Cartridges"
      description: "A container that comes pre-filled with a liquid that usually contains nicotine, flavorings, and chemicals and is designed to fit an electronic cigarette."
      last_updated: 2026-08-17

    ncit:C188301:
      d4cg_label: "M1d"
      description: "A TNM finding indicating the spread of cancer to distant anatomic sites. The definition of M1d TNM finding depends on the specific type of cancer to which it refers: for example, for cutaneous melanoma it indicates distant metastasis to CNS with or without M1a, M1b, or M1c sites of disease. LDH level not recorded or unspecified."
      last_updated: 2026-08-17

    ncit:C188462:
      d4cg_label: "Cisplatin/Gemcitabine/Nab-paclitaxel"
      description: "A regimen consisting of cisplatin, gemcitabine, and nab-paclitaxel that may be used for the treatment of hepatobiliary cancers and pancreatic adenocarcinoma."
      last_updated: 2026-08-17

    ncit:C18863:
      d4cg_label: "LMP1"
      description: "Latent membrane protein 1 (386 aa, ~42 kDa) is encoded by the Epstein-Barr virus LMP1 gene. This protein is involved in both the activation of nuclear factor-kappa-B family signaling pathways and the inhibition of apoptosis of infected B-lymphocytes."
      last_updated: 2026-08-17

    ncit:C188676:
      d4cg_label: "MYCN Variant"
      description: "A variation in the amino acid sequence for N-myc proto-oncogene protein."
      last_updated: 2026-08-17

    ncit:C188680:
      d4cg_label: "Absolute Eosinophil Count"
      description: "The total number of white blood cells that are eosinophils. It is calculated by multiplying the white blood cell count by the percent of eosinophils in the differential white blood cell count."
      last_updated: 2026-08-17

    ncit:C188740:
      d4cg_label: "EZH2 Variant"
      description: "A variation in the amino acid sequence for histone-lysine N-methyltransferase EZH2."
      last_updated: 2026-08-17

    ncit:C189125:
      d4cg_label: "Stool Sample"
      description: "A fecal biospecimen."
      last_updated: 2026-08-17

    ncit:C189506:
      d4cg_label: "LDL"
      description: "A measurement of the low density lipoprotein triglyceride in a biological specimen."
      last_updated: 2026-08-17

    ncit:C189843:
      d4cg_label: "SUFU Variant"
      description: "A change in the nucleotide sequence of the SUFU gene."
      last_updated: 2026-08-17

    ncit:C189851:
      d4cg_label: "ICRB"
      description: "A classification system for intraocular retinoblastoma based on the intraocular tumor size, location, extend of serous fluid, and presence of subretinal or vitreous seeds."
      last_updated: 2026-08-17

    ncit:C189881:
      d4cg_label: "Vitreous"
      description: "The spread of tumor cells into the vitreous of the eye."
      last_updated: 2026-08-17

    ncit:C189892:
      d4cg_label: "Subretinal"
      description: "Below the retina."
      last_updated: 2026-08-17

    ncit:C189957:
      d4cg_label: "Gain"
      description: "A finding indicating the detection of more than the normal number of copies of a gene or genetic/genomic segment in a sample."
      last_updated: 2026-08-17

    ncit:C189958:
      d4cg_label: "Loss"
      description: "A finding indicating the detection of less than the normal number of copies of a gene or genetic/genomic segment in a sample."
      last_updated: 2026-08-17

    ncit:C190021:
      d4cg_label: "Bone Marrow Results"
      description: "The results of a bone marrow test."
      last_updated: 2026-08-17

    ncit:C190373:
      d4cg_label: "Familial Paraganglioma-Pheochromocytoma Syndrome"
      description: "A hereditary cancer syndrome characterized by the development of multiple paragangliomas including pheochromocytomas. It is caused by mutations in SDHA, SDHB, SDHC, SDHD, and SDHAF2 genes."
      last_updated: 2026-08-17

    ncit:C190541:
      d4cg_label: "Fluorescein Angiography"
      description: "A diagnostic procedure that uses the fluorescence of fluorescein dye to examine the blood flow in the choroid and retina."
      last_updated: 2026-08-17

    ncit:C191332:
      d4cg_label: "Visual Evoked Potentials"
      description: "A technique that measures an evoked potential caused by a visual stimulus and recorded by an electroencephalogram, and which is used for those individuals who are unable to provide a verbal response to questions, including infants, toddlers, and other non-verbal individuals."
      last_updated: 2026-08-17

    ncit:C191951:
      d4cg_label: "Central"
      description: "Review by a single person or group of laboratory test results, protocols, or other data generated from multiple locations."
      last_updated: 2026-08-17

    ncit:C192759:
      d4cg_label: "MaGIC"
      description: "A global consortium of pediatric oncologists, gynecologic oncologists, testicular cancer specialists, surgeons, pathologists, epidemiologists, statisticians, bioinformaticists, and biomedical scientists with the shared goal of developing more effective treatments for germ cell tumors through scientific inquiry."
      last_updated: 2026-08-17

    ncit:C192762:
      d4cg_label: "INRG"
      description: "A consortium launched in 2021 as a collaboration between acute myeloid leukemia researchers from Children's Oncology Group, European Pediatric Acute Leukemia, Japan Children's Cancer Group, and St. Jude Children's Research Hospital. To date, INTERACT has identified 18 studies from 10 clinical trials research groups that can be contributed to the data commons, and its statisticians are actively working to harmonize clinical data from more than 6,000 individuals who have had pediatric cancer."
      last_updated: 2026-08-17

    ncit:C192763:
      d4cg_label: "HIBiSCus"
      description: "A consortium established in 2021. The group includes experts in both osteosarcoma and Ewing sarcoma, as well as data contributions from Children's Oncology Group (COG), Cooperative Ewing Sarcoma Study Group (CESS), Cooperative Osteosarcoma Study Group (COSS), Euro Ewing Consortium (EEC), Italian Study Group (ISG), National Cancer Research Institute Sarcoma Clinical Studies Group (NCRI), Scandinavian Sarcoma Group (SSG), Spanish Sarcoma Group (GEIS) and French Bone Sarcoma Group (GROUPOS). To date, HIBiSCus has identified data from over 7,500 Ewing sarcoma patients and over 5,000 osteosarcoma patients to be included in the data commons."
      last_updated: 2026-08-17

    ncit:C192765:
      d4cg_label: "INSPiRE"
      description: "A consortium, established in September 2021, that brings together all types of central nervous system tumors in a comprehensive data resource. The group includes researchers from the Children's Oncology Group (COG), the Pacific Pediatric Neuro-Oncology Consortium (PNOC), the International DIPG/DMG Registry (IDIPGR), the European Society for Pediatric Oncology (SIOPE), the Rare Brain Tumor Consortium (RBTC) and the Children's Brain Tumor Network (CBTN)."
      last_updated: 2026-08-17

    ncit:C192766:
      d4cg_label: "Global REACH"
      description: "An international consortium created for gathering and harmonizing cohesive data sets to create a clearer picture of pediatric retinoblastoma. Global REACH includes researchers from Argentina, Brazil, Chile, Uruguay, Canada, Israel, Switzerland, and the Netherlands."
      last_updated: 2026-08-17

    ncit:C192767:
      d4cg_label: "C3P"
      description: "A multicenter collaborative research group created to improve outcomes for children at high risk for cancer due to hereditary tumor predisposition. It has created a multicenter registry, database, and biorepository for pediatric cancer predisposition syndromes (CPS)."
      last_updated: 2026-08-17

    ncit:C192770:
      d4cg_label: "JCCG"
      description: "A neuroblastoma-focused committee within the Japan Children's Cancer Group, which is a national clinical research group for childhood cancer that was established in 2014 and comprises more than 200 university, community, regional children's, and general hospitals."
      last_updated: 2026-08-17

    ncit:C192774:
      d4cg_label: "EpSSG"
      description: "An international organization of healthcare professionals devoted to the care and treatment of children and young people with soft tissue sarcoma."
      last_updated: 2026-08-17

    ncit:C192775:
      d4cg_label: "MMT"
      description: "An international pediatric oncology committee that specializes in the research of malignant mesenchymal tumors. Along with the Associazione Italiana Ematologia Oncologia Pediatrica-Soft Tissue Sarcoma Committee (AIEOP-STSC), which was formerly known as the Italian Cooperative Group (ICG), SIOP-MMT founded the European pediatric Soft tissue sarcoma Study Group (EpSSG) and the Non-rhabdomyosarcoma Soft Tissue Sarcoma (NRSTS) study in 2005 with the goal of making pediatric non-rhabdomyosarcoma soft tissue sarcoma treatment uniform across Europe."
      last_updated: 2026-08-17

    ncit:C192777:
      d4cg_label: "CWS"
      description: "An international pediatric soft tissue sarcoma study group, also known as the Cooperative Soft Tissue Sarcoma Group, that creates guidance for risk-adapted treatment of soft tissue sarcoma and soft tissue tumors in children, adolescents, and young adults in Europe."
      last_updated: 2026-08-17

    ncit:C192778:
      d4cg_label: "CBTN"
      description: "A network of member institutions affiliated with Children's Hospital of Philadelphia that is involved in the collection of donated brain tumor tissue and other biosamples, and the development cloud-based data platforms, allowing researchers to access brain tumor data and specimen with the shared goal of improving health outcomes for children and young adults with brain tumors."
      last_updated: 2026-08-17

    ncit:C192779:
      d4cg_label: "PNOC"
      description: "An international consortium committed to understanding how brain tumors develop in children, identifying personalized treatment strategies, and improving health outcomes."
      last_updated: 2026-08-17

    ncit:C192780:
      d4cg_label: "RBTR"
      description: "An international registry spearheaded by Children's National Hospital that seeks to create an infrastructure for the prospective collection of biospecimens and radiological and clinical data that would allow better understanding of the biologic mechanisms and therapeutic susceptibilities of childhood rare brain tumors and other rare entities."
      last_updated: 2026-08-17

    ncit:C192781:
      d4cg_label: "SIOPE"
      description: "A pan-European organization representing professionals working in the field of childhood cancers that was originally established in 1998 as the European branch of the International Society of Paediatric Oncology (SIOP) and became an independent organization in 2007."
      last_updated: 2026-08-17

    ncit:C192782:
      d4cg_label: "CHLA"
      description: "A nationally ranked, freestanding acute care children's hospital in the East Hollywood district of Los Angeles. Through a network of people and places across Southern California they share standards, knowledge, and people with experienced care partners to ensure that more children receive high-quality, specialized pediatrics."
      last_updated: 2026-08-17

    ncit:C192784:
      d4cg_label: "DEPICT"
      description: "An IRB approved observational trial opened in 2016 that is designed to monitor outcomes of Broward County, Florida residents with late-stage refractory cancer who undergo next generation sequencing with the goal of targeting the enrollment of underrepresented populations in oncology clinical trials to improve generalizability of clinical research."
      last_updated: 2026-08-17

    ncit:C192785:
      d4cg_label: "EuRBG"
      description: "A pan-European partnership between healthcare professionals, families, and patients affected by retinoblastoma with a goal of identifying and developing tools to address the problems with retinoblastoma management through the creation of a retinoblastoma network."
      last_updated: 2026-08-17

    ncit:C192786:
      d4cg_label: "GALOP"
      description: "A multinational cooperative group for clinical trials in childhood tumours in Latin America, created in 2008 under the auspices of the Children Oncology group for childhood tumor clinical trials in Latin America."
      last_updated: 2026-08-17

    ncit:C192975:
      d4cg_label: "Gross Tumor Volume"
      description: "The macroscopically visible, palpable, or measurable extent of a tumor."
      last_updated: 2026-08-17

    ncit:C1951:
      d4cg_label: "Human Papilloma Virus Vaccine"
      description: "A recombinant vaccine of different types of HPV proteins which are well-conserved within types with a significant inter-type variation."
      last_updated: 2026-08-17

    ncit:C19741:
      d4cg_label: "EORTC"
      description: "A group with aims to conduct, develop, coordinate, and stimulate laboratory and clinical research in Europe to improve the management of cancer and related problems by increasing survival but also patients' quality of life. There are more than 60 institutions and departments that have been recognized by EORTC as affiliated. These groups conduct, on a voluntary basis, laboratory research and/or clinical trials on all types of cancers using a multidisciplinary approach. EORTC maintains close working relationship with NCI and the British Cancer Research United Kingdom in London."
      last_updated: 2026-08-17

    ncit:C19778:
      d4cg_label: "RTOG"
      description: "A multi-institutional cooperative organization, a national cancer study research group comprised of 250 of the major research institutions nationally and in Canada, funded by NCI, headquartered in Philadelphia with almost 30 years of experience in running clinical trials. More than 40 clinical trials that involve radiation therapy either alone or in conjunction with surgery and/or chemotherapeutic drugs are active at any one time within RTOG. The group is interested in quality of life issues and their effects on the cancer patient"
      last_updated: 2026-08-17

    ncit:C197985:
      d4cg_label: "Toronto Childhood Cancer Stage Guidelines"
      description: "A malignancy-specific staging system suitable for use by population registries for 16 of the most common childhood malignancies: acute lymphoblastic leukemia, acute myeloid leukemia, Hodgkin lymphoma, non-Hodgkin lymphoma, neuroblastoma, Wilms tumor, rhabdomyosarcoma, non-rhabdomyosarcoma soft tissue sarcoma, osteosarcoma, Ewing sarcoma, retinoblastoma, hepatoblastoma, testicular and ovarian germ cell tumors, medulloblastoma, and ependymoma. The Guidelines include a two-tiered approach that provides less detailed criteria for registries with limited resources and/or limited data access (Tier 1) and more detailed criteria for better-resourced registries (Tier 2). Tier 2 stage categories may be collapsed to Tier 1 categories to preserve comparability across registries. (http://www.iacr.com.fr/index.php?option=com_content&view=article&id=153&Itemid=657)"
      last_updated: 2026-08-17

    ncit:C198025:
      d4cg_label: "Childrens Oncology Group/National Wilms Tumor Study Group Staging System >> Stage 1"
      description: "A cancer stage defined according to the Children's Oncology Group (COG)/National Wilms Tumor Study Group (NWTSG) criteria."
      last_updated: 2026-08-17

    ncit:C198278:
      d4cg_label: "IgA"
      description: "A measurement of the binding IgA autoantibody in a biological specimen."
      last_updated: 2026-08-17

    ncit:C198279:
      d4cg_label: "IgG"
      description: "A measurement of the binding IgG autoantibody in a biological specimen."
      last_updated: 2026-08-17

    ncit:C198280:
      d4cg_label: "IgM"
      description: "A measurement of the binding IgM autoantibody in a biological specimen."
      last_updated: 2026-08-17

    ncit:C198518:
      d4cg_label: "Compound Heterozygous"
      description: "Having two different allelic forms of a gene, one inherited from each parent, where each allele harbors a different genetic variation or gene mutation."
      last_updated: 2026-08-17

    ncit:C198546:
      d4cg_label: "hgvs_coding"
      description: "The designation of a DNA coding sequence variation based on the Human Genome Variation Society (HGVS) nomenclature guidelines."
      last_updated: 2026-08-17

    ncit:C198674:
      d4cg_label: "Nullisomy"
      description: "A chromosomal abnormality consisting of the absence of both copies of a pair of homologous chromosomes."
      last_updated: 2026-08-17

    ncit:C198675:
      d4cg_label: "B-Scan Ultrasonography"
      description: "A method of using ultrasound for obtaining images of the posterior segment of the eye."
      last_updated: 2026-08-17

    ncit:C198826:
      d4cg_label: "Modified Chang Staging"
      description: "A classification system for the staging of medulloblastomas based on tumor size and location of metastasis."
      last_updated: 2026-08-17

    ncit:C198837:
      d4cg_label: "Enucleation of Eye"
      description: "The removal of the entire eye."
      last_updated: 2026-08-17

    ncit:C198862:
      d4cg_label: "Modified MacDonald"
      description: "A response criteria for high-grade gliomas that utilizes measurements of contrast enhancing tumor size combined with corticosteroid dosing levels and other clinical metrics to determine treatment response and tumor progression, with response stratified into four categories: complete response (CR), partial response (PR), stable disease (SD), and progressive disease (PD)."
      last_updated: 2026-08-17

    ncit:C198863:
      d4cg_label: "RAPNO"
      description: "A response criteria for pediatric high- and low-grade gliomas, and diffuse intrinsic pontine gliomas (DIPG) that uses two-dimensional measurements of tumors, combined with clinical and functional outcomes."
      last_updated: 2026-08-17

    ncit:C198866:
      d4cg_label: "age_at_sct_harvest"
      description: "The age of subject at the time of stem cell harvest."
      last_updated: 2026-08-17

    ncit:C199207:
      d4cg_label: "Transscleral"
      description: "Administration of a drug to the posterior segment of the eye, either by direct injection through or diffusion across the sclera."
      last_updated: 2026-08-17

    ncit:C199267:
      d4cg_label: "Unacceptable Toxicity"
      description: "Therapy-related toxicity leading to multiple treatment dose reductions or delays, early treatment stoppage, unplanned hospital admission, or death."
      last_updated: 2026-08-17

    ncit:C199586:
      d4cg_label: "X Chromosome Inversion"
      description: "A cytogenetic abnormality that refers to any inversion of genomic material on the X chromosome."
      last_updated: 2026-08-17

    ncit:C199588:
      d4cg_label: "GLI2 Amplification"
      description: "A molecular genetic abnormality indicating the presence of multiple copies of the GLI2 gene."
      last_updated: 2026-08-17

    ncit:C199592:
      d4cg_label: "SOS2 Variant"
      description: "A change in the nucleotide sequence of the SOS2 gene."
      last_updated: 2026-08-17

    ncit:C199595:
      d4cg_label: "t(11;19)(q13;q13.4)"
      description: "A cytogenetic abnormality that refers to a chromosomal translocation that involves the long arm (q13) of chromosome 11 and the long arm (q13.4) of chromosome 19. It may be associated with the expression of MALAT1 gene rearrangement and undifferentiated embryonal sarcoma arising in mesenchymal hamartoma of the liver."
      last_updated: 2026-08-17

    ncit:C199598:
      d4cg_label: "t(2;22)(q33.3;q12)"
      description: "A cytogenetic abnormality that refers to a chromosomal translocation that involves the long arm (q33.3) of chromosome 2 and the long arm (q12) of chromosome 22."
      last_updated: 2026-08-17

    ncit:C199600:
      d4cg_label: "t(5;18)(q35;q11)"
      description: "A cytogenetic abnormality that refers to a chromosomal translocation that involves the long arm (q35) of chromosome 5 and the long arm (q11) of chromosome 18."
      last_updated: 2026-08-17

    ncit:C199602:
      d4cg_label: "t(9;17)(q22;q11.2)"
      description: "A cytogenetic abnormality that refers to a chromosomal translocation involving the long arm (q22) of chromosome 9 and the long arm (q11.2) of chromosome 17. It may be associated with the expression of TAF15/NR4A3 fusions and extraskeletal myxoid chondrosarcoma."
      last_updated: 2026-08-17

    ncit:C199603:
      d4cg_label: "t(9;22)(q22-23;q11-12)"
      description: "A cytogenetic abnormality that refers to a chromosomal translocation that involves the long arm (within q22-23) of chromosome 9 and the long arm (within q11-12) of chromosome 22."
      last_updated: 2026-08-17

    ncit:C199604:
      d4cg_label: "t(X;18)(p11.21;q11)"
      description: "A cytogenetic abnormality that refers to a chromosomal translocation that involves the short arm (p11.21) of the X chromosome and the long arm (q11) of chromosome 18. It is associated with the expression of SS18/SSX2 fusions and the development of synovial sarcoma."
      last_updated: 2026-08-17

    ncit:C199606:
      d4cg_label: "t(X;20)(p11.2;q13.3)"
      description: "A cytogenetic abnormality that refers to a chromosomal translocation that involves the short arm (p11.2) of the X chromosome and the long arm (q13.3) of chromosome 20."
      last_updated: 2026-08-17

    ncit:C199652:
      d4cg_label: "Eye, Stroma of Iris"
      description: "The permeable supporting tissues of the iris which contain blood vessels, nerves, and pigment granules."
      last_updated: 2026-08-17

    ncit:C199674:
      d4cg_label: "DDX3X Variant"
      description: "A change in the nucleotide sequence of the DDX3X gene."
      last_updated: 2026-08-17

    ncit:C19987:
      d4cg_label: "Cancer Progression, NOS"
      description: "A pathologic process in which alterations at the molecular level result in a more aggressive cytologic and phenotypic profile and clinical course of a malignant neoplasm."
      last_updated: 2026-08-17

    ncit:C199960:
      d4cg_label: "JCV"
      description: "A measurement of the JC virus in a biological specimen."
      last_updated: 2026-08-17

    ncit:C200:
      d4cg_label: "Acetylcysteine"
      description: "A drug usually used to reduce the thickness of mucus and ease its removal. It is also used to reverse the toxicity of high doses of acetaminophen."
      last_updated: 2026-08-17

    ncit:C200084:
      d4cg_label: "Imbalance"
      description: "The state of being out of equilibrium or out of proportion."
      last_updated: 2026-08-17

    ncit:C200181:
      d4cg_label: "Recombinant Human Hyaluronidase and Pembrolizumab"
      description: "A fixed-dose co-formulation composed of pembrolizumab, a humanized immunoglobulin G4 (IgG4) monoclonal antibody directed against human cell surface receptor PD-1 (programmed death-1; programmed cell death-1; cluster of differentiation 279; CD279), and berahyaluronidase alfa, a recombinant variant of human hyaluronidase, with potential immune checkpoint inhibitory and antineoplastic activities. Upon subcutaneous administration of berahyaluronidase alfa and pembrolizumab, berahyaluronidase alfa reversibly depolymerizes the polysaccharide hyaluronan in the subcutaneous tissue. This increases the permeability of the subcutaneous tissue and enhances the absorption of pembrolizumab into the systemic circulation. In turn, pembrolizumab binds to PD-1, an inhibitory signaling receptor expressed on the surface of activated T-cells, and blocks the binding to and activation of PD-1 by its ligands, which results in the activation of T-cell-mediated immune responses against tumor cells. The ligands for PD-1 include programmed cell death ligand 1 (PD-L1; cluster of differentiation 274; CD274), overexpressed on certain cancer cells, and programmed cell death ligand 2 (PD-L2), which is primarily expressed on antigen presenting cells (APCs). Activated PD-1 negatively regulates T-cell activation and plays a key role in tumor evasion from host immunity. When administered subcutaneously, berahyaluronidase alfa, an endoglycosidase, increases the dispersion and absorption of co-administered drugs."
      last_updated: 2026-08-17

    ncit:C200253:
      d4cg_label: "Primary Site Response"
      description: "The response at a primary site of a disease or condition to treatment."
      last_updated: 2026-08-17

    ncit:C200598:
      d4cg_label: "Atypical Teratoid/Rhabdoid Tumor, Sonic Hedgehog (ATRT-SHH)"
      description: "Atypical teratoid/rhabdoid tumor characterized by overexpression of genes in the sonic hedgehog (SHH) pathway (GLI2, BOC, PTCHD2, and MYCN)."
      last_updated: 2026-08-17

    ncit:C200599:
      d4cg_label: "Atypical Teratoid/Rhabdoid Tumor, MYC Gene (ATRT-MYC)"
      description: "Atypical teratoid/rhabdoid tumor characterized by overexpression of MYC gene."
      last_updated: 2026-08-17

    ncit:C200600:
      d4cg_label: "Atypical Teratoid/Rhabdoid Tumor, Tyrosinase Gene (ATRT-TYR)"
      description: "Atypical teratoid/rhabdoid tumor characterized by overexpression of melanosomal genes (TYR, TYRP, MITF, and OTX2)."
      last_updated: 2026-08-17

    ncit:C200641:
      d4cg_label: "Clinical"
      description: "An examination that is performed before any treatment begins to determine the extent of the spread of cancer, based on clinical observation. The latter includes physical examination, medical history, and imaging tests."
      last_updated: 2026-08-17

    ncit:C200724:
      d4cg_label: "cascade_testing"
      description: "Genetic screening that is performed on the biological relatives of individuals diagnosed with specific genetic conditions."
      last_updated: 2026-08-17

    ncit:C201180:
      d4cg_label: "CD3+ T Cells"
      description: "The measurement of the ratio of T lymphocytes, which are leukocytes that express CD3, to the total number of blood cells in a sample expressed as a percent value."
      last_updated: 2026-08-17

    ncit:C201182:
      d4cg_label: "CD4+ T Cells"
      description: "The measurement of the ratio of helper T lymphocytes, which are T lymphocytes that express CD4, to the total number of blood cells in a sample expressed as a percent value."
      last_updated: 2026-08-17

    ncit:C201184:
      d4cg_label: "CD8+ T Cells"
      description: "The measurement of the ratio of cytotoxic T lymphocytes, which are T lymphocytes that express CD8, to the total number of blood cells in a sample expressed as a percent value."
      last_updated: 2026-08-17

    ncit:C201188:
      d4cg_label: "Absolute B Lymphocyte Count"
      description: "The measurement of the number of B lymphocytes, which are leukocytes that express either CD19 or CD20, in a cubic millimeter of blood. It is calculated by multiplying 1000 by both the total leukocyte count and the percent of B-cells in the differential leukocyte count."
      last_updated: 2026-08-17

    ncit:C201193:
      d4cg_label: "CD19+ B Cells"
      description: "The measurement of the ratio of B lymphocytes, which are leukocytes that express CD19 or CD20, to the total number of blood cells in a sample expressed as a percent value."
      last_updated: 2026-08-17

    ncit:C201274:
      d4cg_label: "Partial Thickness Sclera, within the inner two-thirds"
      description: "The anterior two thirds of the tongue, roughly corresponding to the portion of the tongue anterior to the sulcus terminalis."
      last_updated: 2026-08-17

    ncit:C201465:
      d4cg_label: "Autologous, NOS"
      description: "Stem cell transfer or transplantation in which the patient is their own donor."
      last_updated: 2026-08-17

    ncit:C20178:
      d4cg_label: "Mammogram"
      description: "A low voltage X-ray photograph of the breast generally done to detect breast cancer. This method is also valuable in diagnosis of benign abnormal conditions of the breast such as fibroadenoma, mastitis, abscess, and cysts."
      last_updated: 2026-08-17

    ncit:C20195:
      d4cg_label: "Gene Fusion"
      description: "Any hybrid gene formed from two previously separate genes. Such fusions occur as a result of translocation, intersititial deletion or chromosomal inversion, and often result in gene products with functions different from the two fusion partners. Gene fusions are associated frequently with hematological cancers, sarcomas and prostate cancer."
      last_updated: 2026-08-17

    ncit:C201967:
      d4cg_label: "Pineoblastoma, MiRNA1"
      description: "Pineoblastoma characterized by alterations in genes involved in miRNA biogenesis (DICER1, DROSHA, and DGCR8). It may manifest as a sporadic tumor or part of DICER1 syndrome. It affects children."
      last_updated: 2026-08-17

    ncit:C201968:
      d4cg_label: "Pineoblastoma, MiRNA2"
      description: "Pineoblastoma characterized by alterations in genes involved in miRNA biogenesis (DICER1, DROSHA, and DGCR8). It may manifest as a sporadic tumor or part of DICER1 syndrome. It affects older children and follows a more favorable course."
      last_updated: 2026-08-17

    ncit:C201969:
      d4cg_label: "Pineoblastoma, RB1"
      description: "Pineoblastoma characterized by alterations in RB1 gene. It may develop in the setting of congenital retinoblastoma, also known as trilateral retinoblastoma. It affects young children and is associated with a dismal prognosis."
      last_updated: 2026-08-17

    ncit:C20197:
      d4cg_label: "Male"
      description: "A person who belongs to the sex that normally produces sperm. The term is used to indicate biological sex distinctions, cultural gender role distinctions, or both. [The NCI Thesaurus contains biomedical terminologies that NCI does not own or control. This concept contains gender-related content that does not comply with Executive Order 14168.]"
      last_updated: 2026-08-17

    ncit:C201973:
      d4cg_label: "Pineoblastoma, MYC/FOXR2"
      description: "Pineoblastoma characterized by MYC activation, chromosome 16 losses, and overexpression of FOXR2. It affects young children and is associated with a dismal prognosis."
      last_updated: 2026-08-17

    ncit:C202408:
      d4cg_label: "CTA"
      description: "A type of computed tomography that is used to construct images of blood vessels."
      last_updated: 2026-08-17

    ncit:C203382:
      d4cg_label: "Relapse/Refractory"
      description: "The return of a disease or a disease becoming unresponsive to the current treatment."
      last_updated: 2026-08-17

    ncit:C20401:
      d4cg_label: "Monoclonal Antibody"
      description: "A type of protein made in the laboratory that can bind to substances in the body, including tumor cells. There are many kinds of monoclonal antibodies. Each monoclonal antibody is made to find one substance. Monoclonal antibodies are being used to treat some types of cancer and are being studied in the treatment of other types. They can be used alone or to carry drugs, toxins, or radioactive materials directly to a tumor."
      last_updated: 2026-08-17

    ncit:C204195:
      d4cg_label: "alteration_effect"
      description: "The effect of a sequence change on the function of an RNA, DNA, or protein."
      last_updated: 2026-08-17

    ncit:C20429:
      d4cg_label: "Erythropoeitin"
      description: "A substance that is naturally produced by the kidneys, and that stimulates the bone marrow to make red blood cells. When erythropoietin is made in the laboratory, it is called epoetin alfa or epoetin beta."
      last_updated: 2026-08-17

    ncit:C204624:
      d4cg_label: "IgG1"
      description: "A measurement of the binding IgG1 autoantibody in a biological specimen."
      last_updated: 2026-08-17

    ncit:C204625:
      d4cg_label: "IgG2"
      description: "A measurement of the binding IgG2 autoantibody in a biological specimen."
      last_updated: 2026-08-17

    ncit:C204626:
      d4cg_label: "IgG3"
      description: "A measurement of the binding IgG3 autoantibody in a biological specimen."
      last_updated: 2026-08-17

    ncit:C204680:
      d4cg_label: "Dysplasia"
      description: "An evaluation of dysplasia in a biological specimen."
      last_updated: 2026-08-17

    ncit:C204694:
      d4cg_label: "female_pubertal_status"
      description: "An indication as to whether the individual's first menstruation event has occurred."
      last_updated: 2026-08-17

    ncit:C20493:
      d4cg_label: "Interferon"
      description: "A biological response modifier (a substance that can improve the body's natural response to infection and disease). Interferons interfere with the division of cancer cells and can slow tumor growth. There are several types of interferons, including interferon-alpha, -beta, and -gamma. These substances are normally produced by the body. They are also made in the laboratory for use in treating cancer and other diseases."
      last_updated: 2026-08-17

    ncit:C20545:
      d4cg_label: "GMCSF"
      description: "A substance that helps make more white blood cells, especially granulocytes, macrophages, and cells that become platelets. It is a cytokine that is a type of hematopoietic (blood-forming) agent."
      last_updated: 2026-08-17

    ncit:C20629:
      d4cg_label: "Synonymous"
      description: "A point mutation occurring within the protein-coding region of a gene, and which codes for the same amino acid as expected."
      last_updated: 2026-08-17

    ncit:C20826:
      d4cg_label: "Molecular"
      description: "The process of identifying a disease by studying molecules, such as proteins, DNA, and RNA, in a tissue or fluid."
      last_updated: 2026-08-17

    ncit:C20828:
      d4cg_label: "Optical Coherence Tomography (OCT)"
      description: "A procedure that uses infrared light waves to give three-dimensional (3-D) pictures of structures inside tissues and organs. The pictures are made by a computer linked to the light source."
      last_updated: 2026-08-17

    ncit:C20989:
      d4cg_label: "Physical Examination"
      description: "A systemic evaluation of the body and its functions using visual inspection, palpation, percussion and auscultation."
      last_updated: 2026-08-17

    ncit:C210425:
      d4cg_label: "Menarche"
      description: "After first menstruation (menarche)."
      last_updated: 2026-08-17

    ncit:C211623:
      d4cg_label: "Jewish"
      description: "A member of the Jewish faith."
      last_updated: 2026-08-17

    ncit:C21480:
      d4cg_label: "relation"
      description: "A person related by blood or marriage."
      last_updated: 2026-08-17

    ncit:C21481:
      d4cg_label: "First-Degree Relative, NOS"
      description: "Any individual related biologically or legally to another individual and considered immediate family as in the case of a spouse, parent, sibling or child."
      last_updated: 2026-08-17

    ncit:C21577:
      d4cg_label: "AFP"
      description: "This gene plays a role in fetal progression."
      last_updated: 2026-08-17

    ncit:C219071:
      d4cg_label: "anthropometric_measurement_type"
      description: "A set of non-invasive, quantitative measurements of body composition and nutritional status which include height, weight, head circumference, body mass index (BMI), body circumferences, and skinfold thickness."
      last_updated: 2026-08-17

    ncit:C2213:
      d4cg_label: "Daunorubicin (Liposomal)"
      description: "A liposome-encapsulated form of the citrate salt of the anthracycline antineoplastic antibiotic daunorubicin. Daunorubicin intercalates into DNA and interacts with topoisomerase II, thereby inhibiting DNA replication and repair and RNA and protein synthesis. Liposomal delivery of doxorubicin citrate improves drug penetration into tumors and decreases drug clearance, thereby increasing the duration of therapeutic drug effects."
      last_updated: 2026-08-17

    ncit:C226496:
      d4cg_label: "Pyloric Gland Adenoma"
      description: "An adenoma that arises from the digestive system and is characterized by the presence of uniform back-to-back mucinous glands forming tubular structures. It is usually located in the stomach, but has also been described in the duodenum, gallbladder, bile duct, pancreatic duct, rectum, and esophagus."
      last_updated: 2026-08-17

    ncit:C2274:
      d4cg_label: "Human Menopausal Gonadotropin (hMG)"
      description: "Follicle-Stimulating Hormone and Luteinizing Hormone excreted in the urine of post-menopausal women."
      last_updated: 2026-08-17

    ncit:C2276:
      d4cg_label: "Inhibin-B"
      description: "Inhibins are peptide hormones, secreted by the follicular cells of the ovary and by the testis, that negatively regulate the synthesis and secretion of follicle stimulating hormone from the anterior pituitary.  The detection of serum inhibins has been implicated in association with reproductive disorders, including infertility and ovarian cancers."
      last_updated: 2026-08-17

    ncit:C2296:
      d4cg_label: "Progestogen"
      description: "Substances that produce effects similar to those of progesterone, the only natural progestogen. All other progestogens are synthetic and are often referred to as progestins. All progestogens have antiestrogenic and antigonadotropic properties."
      last_updated: 2026-08-17

    ncit:C23019:
      d4cg_label: "PAS"
      description: "A microscopy staining method that utilizes Schiff's reagent, a solution composed of pararosanilin treated with sulfurous acid, which selectively reacts with and stains aldehydes pink to determine the presence of glycogen, mucin, mucoprotein, glycoprotein, as well as fungi. Periodic Acid Schiff staining is useful for outlining tissue structures such as basement membranes, capsules and blood vessels."
      last_updated: 2026-08-17

    ncit:C2302:
      d4cg_label: "Thyroxine"
      description: "A hormone synthesized and secreted by the thyroid gland containing four iodine atoms and is converted to triiodothyronine (T3) in the body, influencing metabolism and organ function."
      last_updated: 2026-08-17

    ncit:C2303:
      d4cg_label: "Triiodothyronine"
      description: "A thyroid hormone containing 3 iodine atoms generally synthesized from levothyroxine, and has greater biological activity."
      last_updated: 2026-08-17

    ncit:C240:
      d4cg_label: "Amsacrine"
      description: "An aminoacridine derivative with potential antineoplastic activity. Although its mechanism of action is incompletely defined, amsacrine may intercalate into DNA and inhibit topoisomerase II, resulting in DNA double-strand breaks, arrest of the S/G2 phase of the cell cycle, and cell death. This agent's cytotoxicity is maximal during the S phase of the cell cycle when topoisomerase levels are greatest. In addition, amsacrine may induce transcription of tumor promoter p53 protein and block p53 ubiquitination and proteasomal degradation, resulting in p53-dependent tumor cell apoptosis."
      last_updated: 2026-08-17

    ncit:C24203:
      d4cg_label: "Clavicle"
      description: ""
      last_updated: 2026-08-17

    ncit:C247:
      d4cg_label: "ACE-Inhibitor"
      description: "A drug that is used to lower blood pressure. An ACE inhibitor is a type of antihypertensive agent."
      last_updated: 2026-08-17

    ncit:C25157:
      d4cg_label: "BSA"
      description: "A measure of the 2-dimensional extent of the body surface (i.e., the skin).  Body surface area (BSA) can be calculated by mathematical formula or from a chart that relates height to weight.  BSA is often an important factor in dosing."
      last_updated: 2026-08-17

    ncit:C25188:
      d4cg_label: "marital_status"
      description: "A demographic parameter indicating a person's current conjugal status."
      last_updated: 2026-08-17

    ncit:C25193:
      d4cg_label: "occupation"
      description: "A code specifying the job performed by the employee for the employer. For example, accountant, programmer analyst, patient care associate, staff nurse, etc."
      last_updated: 2026-08-17

    ncit:C25196:
      d4cg_label: "randomized"
      description: "A way to use chance to place study participants into different study treatment groups. (https://mrctcenter.org/glossaryterm/randomization/)"
      last_updated: 2026-08-17

    ncit:C25203:
      d4cg_label: "Shoulder"
      description: "A subdivision of the pectoral complex consisting of the structures in the region of the shoulder joint (which connects the humerus, scapula and clavicle)."
      last_updated: 2026-08-17

    ncit:C25206:
      d4cg_label: "Temperature"
      description: "A measure of the average kinetic energy of a system of particles. Temperature may be quantified, in the context of thermodynamics, as the potential of one system to transfer thermal energy to another system until both systems reach a state of thermal equilibrium."
      last_updated: 2026-08-17

    ncit:C25213:
      d4cg_label: "Baseline"
      description: "A starting point to which things may be compared."
      last_updated: 2026-08-17

    ncit:C25215:
      d4cg_label: "Cytogenetics, Karyotyping"
      description: "The chromosomal morphology and number in somatic cells of an individual."
      last_updated: 2026-08-17

    ncit:C25220:
      d4cg_label: "Sternotomy"
      description: "Incision into or through the sternum."
      last_updated: 2026-08-17

    ncit:C25236:
      d4cg_label: "Proximal"
      description: "In medicine, refers to a part of the body that is closer to the center of the body than another part. For example, the knee is proximal to the toes. The opposite is distal."
      last_updated: 2026-08-17

    ncit:C25237:
      d4cg_label: "Distal"
      description: "In medicine, refers to a part of the body that is farther away from the center of the body than another part. For example, the fingers are distal to the shoulder. The opposite is proximal."
      last_updated: 2026-08-17

    ncit:C25239:
      d4cg_label: "Superficial"
      description: "Affecting cells on the surface.  Not invasive."
      last_updated: 2026-08-17

    ncit:C25240:
      d4cg_label: "Deep"
      description: "Extending relatively far inward."
      last_updated: 2026-08-17

    ncit:C25245:
      d4cg_label: "Surface"
      description: "The extended two-dimensional outer boundary of a three-dimensional object."
      last_updated: 2026-08-17

    ncit:C25269:
      d4cg_label: "symptoms_at_response"
      description: "Exhibiting the symptoms of a particular disease."
      last_updated: 2026-08-17

    ncit:C25298:
      d4cg_label: "Systolic Blood Pressure"
      description: "Systolic blood pressure value recorded closest to the time of presentation to the health care facility"
      last_updated: 2026-08-17

    ncit:C25299:
      d4cg_label: "Diastolic Blood Pressure"
      description: "Diastolic blood pressure value recorded closest to the time of presentation to the health care facility"
      last_updated: 2026-08-17

    ncit:C25304:
      d4cg_label: "Total"
      description: "Pertaining to an entirety or whole, also constituting the full quantity or extent; complete; derived by addition."
      last_updated: 2026-08-17

    ncit:C25333:
      d4cg_label: "depth"
      description: "The extent downward or inward; the perpendicular measurement from the surface downward to determine deepness."
      last_updated: 2026-08-17

    ncit:C25350:
      d4cg_label: "Urogenital"
      description: "Of or related to the genital and urinary organs or their functions."
      last_updated: 2026-08-17

    ncit:C25378:
      d4cg_label: "Partial"
      description: "Being or affecting only a part of something."
      last_updated: 2026-08-17

    ncit:C25389:
      d4cg_label: "Chest"
      description: "The anterior side of the thorax from the neck to the abdomen. The shape of the chest is often regarded as potential insight into a disease process, as in the case of barrel chest and respiratory dysfunction."
      last_updated: 2026-08-17

    ncit:C25458:
      d4cg_label: "Confirmed"
      description: "Having been established or verified."
      last_updated: 2026-08-17

    ncit:C25476:
      d4cg_label: "Delayed"
      description: "Time during which some action is awaited; inactivity resulting in something being put off until a later time; the state of being slower or later."
      last_updated: 2026-08-17

    ncit:C25484:
      d4cg_label: "Discontinued"
      description: "To stop or end, permanently or temporarily."
      last_updated: 2026-08-17

    ncit:C25489:
      d4cg_label: "Dryness"
      description: "The lack of natural or normal moisture."
      last_updated: 2026-08-17

    ncit:C25526:
      d4cg_label: "Histological"
      description: "Pertaining to the combined microscopic physical features of cells and their surrounding extracellular environment in tissues."
      last_updated: 2026-08-17

    ncit:C25539:
      d4cg_label: "Intensity"
      description: "The degree or magnitude of strength, energy, or feeling."
      last_updated: 2026-08-17

    ncit:C25548:
      d4cg_label: "Involvement of Iris"
      description: "To have a connection by participation or association or use; sharing in an activity or process."
      last_updated: 2026-08-17

    ncit:C25566:
      d4cg_label: "Present"
      description: "Pertaining to or characterized by metaplasia."
      last_updated: 2026-08-17

    ncit:C25567:
      d4cg_label: "Absent"
      description: "Refers to a tumor that has spread to anatomic sites away from the original site of growth or has reappeared in any anatomic site. The vast majority of such tumors are malignant."
      last_updated: 2026-08-17

    ncit:C25624:
      d4cg_label: "Premalignant"
      description: "A term used to describe a condition that may (or is likely to) become cancer."
      last_updated: 2026-08-17

    ncit:C25626:
      d4cg_label: "FUS Translocation Present"
      description: "Being or existing in a specified place or at the specified time."
      last_updated: 2026-08-17

    ncit:C25747:
      d4cg_label: "Creatinine Clearance"
      description: "A measurement of the volume of serum or plasma that would be cleared of creatinine by excretion of urine for a specified unit of time (e.g. one minute)."
      last_updated: 2026-08-17

    ncit:C25749:
      d4cg_label: "Pulse"
      description: "The rhythmic wave within the arteries occurring with each contraction of the left ventricle."
      last_updated: 2026-08-17

    ncit:C25751:
      d4cg_label: "Deterioration"
      description: "A symptom or state of reduced quality or strength."
      last_updated: 2026-08-17

    ncit:C25765:
      d4cg_label: "secondary_aml"
      description: "An acute myeloid leukemia arising from prior myelodysplastic syndrome, myeloproliferative neoplasm, or myelodysplastic/myeloproliferative neoplasm, or as a result of previous exposure to alkylating agents or topoisomerase II inhibitors."
      last_updated: 2026-08-17

    ncit:C26078:
      d4cg_label: "GCSF"
      description: "A colony-stimulating factor that stimulates the production of neutrophils (a type of white blood cell). It is a cytokine that is a type of hematopoietic (blood-forming) agent."
      last_updated: 2026-08-17

    ncit:C26470:
      d4cg_label: "Jaw, NOS"
      description: "The bone which normally forms the lateral upper jaw in osteichthyans, including tetrapods."
      last_updated: 2026-08-17

    ncit:C2653:
      d4cg_label: "Laromustine"
      description: "A drug used to treat acute myelogenous leukemia (AML). It is also being studied in the treatment of several other types of cancer. It blocks cell growth by damaging the cell's DNA and may kill cancer cells. It is a type of alkylating agent."
      last_updated: 2026-08-17

    ncit:C2654:
      d4cg_label: "Ipililumab"
      description: "A monoclonal antibody being studied in the treatment of certain types of cancer. Ipilimumab is made in the laboratory and binds to the molecule CTLA-4 on T cells (a type of white blood cell). Ipilimumab may block CTLA-4 and help the immune system kill cancer cells."
      last_updated: 2026-08-17

    ncit:C26638:
      d4cg_label: "Clofarabine"
      description: "A drug used to treat certain types of acute lymphoblastic leukemia in children. It is also being studied in the treatment of other types of cancer. Clolar is a type of nucleoside analog."
      last_updated: 2026-08-17

    ncit:C26653:
      d4cg_label: "Lapatinib"
      description: "A drug used with another anticancer drug to treat breast cancer that is HER2 positive and has advanced or metastasized (spread to other parts of the body) after treatment with other drugs. Lapatinib is also being studied in the treatment of other types of cancer. It is a type of ErbB-2 and EGFR dual tyrosine kinase inhibitor."
      last_updated: 2026-08-17

    ncit:C26659:
      d4cg_label: "Cannabis"
      description: "Any part of, or extract from, the female hemp plant Cannabis sativa.  Marijuana contains cannabinoids, substances with hallucinogenic, psychoactive, and addictive properties.  This agent has potential use for treating cancer pain and cachexia. (NCI04)"
      last_updated: 2026-08-17

    ncit:C2668:
      d4cg_label: "Lenalidomide"
      description: "A drug that is similar to thalidomide, and is used to treat multiple myeloma and certain types of anemia. It is also being studied in the treatment of other types of cancer. Lenalidomide belongs to the family of drugs called angiogenesis inhibitors."
      last_updated: 2026-08-17

    ncit:C26702:
      d4cg_label: "Ataxia"
      description: "A disorder characterized by lack of coordination of muscle movements resulting in the impairment or inability to perform voluntary activities."
      last_updated: 2026-08-17

    ncit:C26713:
      d4cg_label: "Cataract"
      description: "A condition in which the lens of the eye becomes cloudy. Symptoms include blurred, cloudy, or double vision; sensitivity to light; and difficulty seeing at night. Without treatment, cataracts can cause blindness. There are many different types and causes of cataracts. They may occur in people of all ages, but are most common in the elderly."
      last_updated: 2026-08-17

    ncit:C26714:
      d4cg_label: "Celiac Disease"
      description: "A digestive disease that is caused by an immune response to a protein called gluten, which is found in wheat, rye, barley, and oats. Celiac disease damages the lining of the small intestine and interferes with the absorption of nutrients from food. A person with celiac disease may become malnourished no matter how much food is consumed."
      last_updated: 2026-08-17

    ncit:C26726:
      d4cg_label: "Infectious Diseases, NOS"
      description: "A disorder resulting from the presence and activity of a microbial, viral, fungal, or parasitic agent. It can be transmitted by direct or indirect contact."
      last_updated: 2026-08-17

    ncit:C26746:
      d4cg_label: "Scleroderma"
      description: "A chronic and progressive autoimmune disorder characterized by thickening of the skin and the connective tissues."
      last_updated: 2026-08-17

    ncit:C26780:
      d4cg_label: "Gastritis"
      description: "A disorder characterized by inflammation of the stomach."
      last_updated: 2026-08-17

    ncit:C26782:
      d4cg_label: "Glaucoma"
      description: "A condition in which there is a build-up of fluid in the eye, which presses on the retina and the optic nerve. The retina is the layer of nerve tissue inside the eye that senses light and sends images along the optic nerve to the brain. Glaucoma can damage the optic nerve and cause loss of vision or blindness."
      last_updated: 2026-08-17

    ncit:C26786:
      d4cg_label: "Gonadal Dysfunction"
      description: "A non-neoplastic or neoplastic disorder that affects the testis or the ovary."
      last_updated: 2026-08-17

    ncit:C26791:
      d4cg_label: "Hemorrhage"
      description: "In medicine, loss of blood from damaged blood vessels. A hemorrhage may be internal or external, and usually involves a lot of bleeding in a short time."
      last_updated: 2026-08-17

    ncit:C26793:
      d4cg_label: "Sinusoidal Obstruction Syndrome"
      description: "A condition in which some of the veins in the liver are blocked. It is sometimes a complication of high-dose chemotherapy given before a bone marrow transplant and is marked by increases in weight, liver size, and blood levels of bilirubin."
      last_updated: 2026-08-17

    ncit:C26796:
      d4cg_label: "Hydronephrosis"
      description: "A condition of excess urine accumulation in kidney(s) that causes swelling of kidneys."
      last_updated: 2026-08-17

    ncit:C26800:
      d4cg_label: "Hypothyroid"
      description: "A disorder characterized by a decrease in production of thyroid hormone by the thyroid gland."
      last_updated: 2026-08-17

    ncit:C26808:
      d4cg_label: "AKI"
      description: "A disorder characterized by the acute loss of renal function and is traditionally classified as pre-renal (low blood flow into kidney), renal (kidney damage) and post-renal causes (ureteral or bladder outflow obstruction)."
      last_updated: 2026-08-17

    ncit:C26816:
      d4cg_label: "Leukopenia"
      description: "A condition in which there is a lower-than-normal number of leukocytes (white blood cells) in the blood."
      last_updated: 2026-08-17

    ncit:C26835:
      d4cg_label: "Neurological Disorder"
      description: "A non-neoplastic or neoplastic disorder that affects the brain, spinal cord, or peripheral nerves."
      last_updated: 2026-08-17

    ncit:C26869:
      d4cg_label: "Pulmonary Fibrosis"
      description: "A disorder characterized by the replacement of the lung tissue by connective tissue, leading to progressive dyspnea, respiratory failure or right heart failure."
      last_updated: 2026-08-17

    ncit:C2688:
      d4cg_label: "Nab-Paclitaxel"
      description: "A Cremophor EL-free, albumin-stabilized nanoparticle formulation of the natural taxane paclitaxel with antineoplastic activity. Paclitaxel binds to and stabilizes microtubules, preventing their depolymerization and so inhibiting cellular motility, mitosis, and replication. This formulation solubilizes paclitaxel without the use of the solvent Cremophor, thereby permitting the administration of larger doses of paclitaxel while avoiding the toxic effects associated with Cremophor."
      last_updated: 2026-08-17

    ncit:C26889:
      d4cg_label: "Sinus Tachycardia"
      description: "A condition characterized by an electrocardiographic finding of abnormally rapid heart rate with its origin in the sinus node. Thresholds for different age, sex, and patient populations exist."
      last_updated: 2026-08-17

    ncit:C26893:
      d4cg_label: "Thyroid Disorder"
      description: "A non-neoplastic or neoplastic disorder that affects the thyroid gland.  Representative examples include hyperthyroidism, hypothyroidism, thyroiditis, follicular adenoma, and carcinoma."
      last_updated: 2026-08-17

    ncit:C26900:
      d4cg_label: "45XO"
      description: "A chromosomal abnormality occurring in phenotypic females, characterized by the absence of a part or all of one of the sex chromosomes."
      last_updated: 2026-08-17

    ncit:C26909:
      d4cg_label: "Uveitis"
      description: "A disorder characterized by inflammation to the uvea of the eye."
      last_updated: 2026-08-17

    ncit:C26915:
      d4cg_label: "Vitiligo"
      description: "Generalized well circumscribed patches of leukoderma that are generally distributed over symmetric body locations and is due to autoimmune destruction of melanocytes."
      last_updated: 2026-08-17

    ncit:C26917:
      d4cg_label: "Xerostomia"
      description: "A disorder characterized by reduced salivary flow in the oral cavity."
      last_updated: 2026-08-17

    ncit:C26920:
      d4cg_label: "Encephalopathy"
      description: "A disorder characterized by a pathologic process involving the brain."
      last_updated: 2026-08-17

    ncit:C26922:
      d4cg_label: "Liver Failure"
      description: "A disorder characterized by the inability of the liver to metabolize chemicals in the body. Causes include cirrhosis and drug-induced hepatotoxicity. Signs and symptoms include jaundice and encephalopathy. Laboratory test results reveal abnormal plasma levels of ammonia, bilirubin, lactic dehydrogenase, and alkaline phosphatase."
      last_updated: 2026-08-17

    ncit:C26927:
      d4cg_label: "Hydroureter"
      description: "Abnormal enlargement of the ureter caused by any blockage that prevents urine from draining into the bladder."
      last_updated: 2026-08-17

    ncit:C26941:
      d4cg_label: "Cranial Nerve Palsy"
      description: "Injury to any of the cranial nerves or their nuclei in the brain resulting in muscle weakness."
      last_updated: 2026-08-17

    ncit:C27088:
      d4cg_label: "Hyperbilirubinemia"
      description: "A finding based on laboratory test results that indicate an abnormally high level of bilirubin in the blood. Excess bilirubin is associated with jaundice."
      last_updated: 2026-08-17

    ncit:C27191:
      d4cg_label: "Hashimoto's Thyroiditis"
      description: "An autoimmune condition of the thyroid gland (a gland located beneath the larynx). It is caused by the formation of antibodies that attack the thyroid gland and it usually causes hypothyroidism (too little thyroid hormone). Symptoms include fatigue, weight gain, constipation, dry skin, depression, and the inability to exercise. It is more common in females and can run in families."
      last_updated: 2026-08-17

    ncit:C27214:
      d4cg_label: "t(11;22)(q24;q12)"
      description: "A chromosomal translocation involving the FLI1 gene on chromosome 11q24 and the EWSR1 gene on chromosome 22q12."
      last_updated: 2026-08-17

    ncit:C2733:
      d4cg_label: "Nimotuzumab"
      description: "A humanized monoclonal antibody directed against the epidermal growth factor receptor (EGFR) with potential antineoplastic activity. Nimotuzumab binds to and inhibits EGFR, resulting in growth inhibition of tumor cells that overexpress EGFR. This agent may act synergistically with radiation therapy."
      last_updated: 2026-08-17

    ncit:C27349:
      d4cg_label: "Histiocytic Sarcoma"
      description: "A malignant neoplasm composed of cells resembling histiocytes."
      last_updated: 2026-08-17

    ncit:C2737:
      d4cg_label: "Vandetanib"
      description: "A substance being studied in the treatment of lung cancer and other types of cancer. It may block the growth and spread of tumor cells and prevent the growth of new blood vessels that tumors need to grow. Vandetanib is a type of tyrosine kinase inhibitor and a type of antiangiogenesis agent."
      last_updated: 2026-08-17

    ncit:C274:
      d4cg_label: "Antineoplastic Agent"
      description: "A drug used to treat cancer."
      last_updated: 2026-08-17

    ncit:C27481:
      d4cg_label: "Extraskeletal Mesenchymal Chondrosarcoma"
      description: "A rare malignant tumor of soft tissue characterized by a bimorphic pattern composed of undifferentiated small round cells and islands of well differentiated hyaline cartilage."
      last_updated: 2026-08-17

    ncit:C27496:
      d4cg_label: "Glomangiomatosis"
      description: "A benign multifocal proliferation of glomus cells forming clusters around dilated vascular spaces."
      last_updated: 2026-08-17

    ncit:C27502:
      d4cg_label: "Extraskeletal Myxoid Chondrosarcoma"
      description: "A rare malignant soft tissue neoplasm of uncertain differentiation, characterized by the presence of chondroblast-like cells in a myxoid stroma and a multinodular growth pattern.  The most common sites of involvement are the deep soft tissues of the extremities, particularly the thigh.  It usually presents as an enlarging soft tissue mass.  Patients may have long survivals, but local recurrences and metastases occur in approximately half of the cases.  The most common site of metastasis is the lungs."
      last_updated: 2026-08-17

    ncit:C27510:
      d4cg_label: "Kaposiform Hemangioendothelioma"
      description: "An intermediate, locally aggressive blood vessel neoplasm characterized by the presence of spindle endothelial cells, and formation of capillary-sized and slit-like vascular channels.  It is often associated with hemorrhage and hemosiderin deposition."
      last_updated: 2026-08-17

    ncit:C27511:
      d4cg_label: "Retiform Hemangioendothelioma"
      description: "A rare, intermediate, locally aggressive and rarely metastasizing blood vessel neoplasm of the skin and subcutaneous tissue that usually affects the distal extremities, most often the leg.  It manifests as a slow-growing red/bluish nodule or plaque and is characterized by the presence of hobnail endothelial cells and formation of arborizing vascular channels."
      last_updated: 2026-08-17

    ncit:C27547:
      d4cg_label: "Fibrosarcomatous Dermatofibrosarcoma Protuberans"
      description: "A morphologic variant of dermatofibrosarcoma protuberans characterized by the presence of a fibrosarcomatous component."
      last_updated: 2026-08-17

    ncit:C27753:
      d4cg_label: "AML, NOS"
      description: "Acute myeloid leukemias that do not fulfill the criteria for inclusion in the group of acute myeloid leukemias which have recurrent genetic abnormalities or myelodysplastic changes, or are therapy-related.  This category includes entities classified according to the French-American-British classification scheme."
      last_updated: 2026-08-17

    ncit:C27757:
      d4cg_label: "FAB >> Version NOS >> M3 Variant"
      description: "Acute promyelocytic leukemia in which the promyelocytes in the peripheral blood have paucity or absence of cytoplasmic granules and characteristic bilobed nuclei."
      last_updated: 2026-08-17

    ncit:C27758:
      d4cg_label: "t(15;17)(q24;q21)"
      description: "A chromosomal translocation associated with creation of a fusion between the PML and RARA genes. It is seen in variants of acute promyelocytic leukemia."
      last_updated: 2026-08-17

    ncit:C27759:
      d4cg_label: "t(16;16)(p13.1;q22)"
      description: "A chromosomal translocation that involves chromosome 16. It is often associated with the development of acute myeloid leukemia CBFB-MYH11, acute myelomonocytic leukemia with abnormal eosinophils, and granulocytic sarcoma."
      last_updated: 2026-08-17

    ncit:C27781:
      d4cg_label: "Myxoid Liposarcoma"
      description: "A liposarcoma characterized by the presence of round non-lipogenic primitive mesenchymal cells and small signet ring lipoblasts within a myxoid stoma with a branching vascular pattern.  This category includes hypercellular lesions with round cell morphology, formerly known as round cell liposarcoma."
      last_updated: 2026-08-17

    ncit:C278:
      d4cg_label: "Anti-thymocyte Globulin"
      description: "Purified gamma globulin, with immunosuppressive activity. Obtained from animals that have been immunized with human thymocytes, antithymocyte globulin (ATG) specifically recognizes and destroys T lymphocytes. Although not completely understood, the mechanism of action appears to involve T lymphocyte clearance from the circulation and modulation of T lymphocyte activity. Administering ATG with chemotherapy prior to stem cell transplantation may reduce the risk of graft-versus-host (GVH) disease."
      last_updated: 2026-08-17

    ncit:C27851:
      d4cg_label: "Human Papillomavirus Infection"
      description: "An infectious process caused by a human papillomavirus. This infection can cause abnormal tissue growth."
      last_updated: 2026-08-17

    ncit:C27912:
      d4cg_label: "WHO, Version 4 >> Therapy-Related Myeloid Neoplasms"
      description: "Acute myeloid leukemias, myelodysplastic syndromes, and myelodysplastic/myeloproliferative neoplasms arising as a result of the mutagenic effect of chemotherapy agents and/or radiation that are used for the treatment of neoplastic or non-neoplastic disorders."
      last_updated: 2026-08-17

    ncit:C27961:
      d4cg_label: "Neurotoxicity Syndrome"
      description: "A group of neurologic disorders caused by damage to the nervous system following exposure to pharmacologic, biologic, and chemical agents. Examples of neurotoxins include chemotherapy agents, radiation treatment, heavy metals, pesticides, and food additives."
      last_updated: 2026-08-17

    ncit:C27966:
      d4cg_label: "COG >> Stage 1"
      description: "Invasive cancer confined to the original anatomic site of growth without lymph node involvement."
      last_updated: 2026-08-17

    ncit:C27970:
      d4cg_label: "COG >> Stage 3"
      description: "Locally advanced cancer that has spread to nearby organs but not to distant anatomic sites."
      last_updated: 2026-08-17

    ncit:C27971:
      d4cg_label: "COG >> Stage 4"
      description: "Advanced cancer that has spread to adjacent and/or distant anatomic sites."
      last_updated: 2026-08-17

    ncit:C27990:
      d4cg_label: "Toxicity"
      description: "The extent to which something is poisonous or harmful."
      last_updated: 2026-08-17

    ncit:C27994:
      d4cg_label: "Cardiac Toxicity"
      description: "Toxicity that affects the heart."
      last_updated: 2026-08-17

    ncit:C28012:
      d4cg_label: "Unilateral"
      description: "Affecting one side of the body or one of a pair of organs."
      last_updated: 2026-08-17

    ncit:C28047:
      d4cg_label: "Ovarian"
      description: "Having to do with the ovaries, the female reproductive glands in which the ova (eggs) are formed. The ovaries are located in the pelvis, one on each side of the uterus."
      last_updated: 2026-08-17

    ncit:C28054:
      d4cg_label: "COG >> Stage 2"
      description: "Invasive cancer more extensive than stage I, usually involving local lymph nodes without spread to distant anatomic sites."
      last_updated: 2026-08-17

    ncit:C28077:
      d4cg_label: "Norris Immature Teratoma Grading System >> Grade 1"
      description: "A morphologic qualifier indicating that a cancerous lesion is well differentiated."
      last_updated: 2026-08-17

    ncit:C28078:
      d4cg_label: "Norris Immature Teratoma Grading System >> Grade 2"
      description: "A morphologic qualifier indicating that a cancerous lesion is moderately differentiated."
      last_updated: 2026-08-17

    ncit:C28079:
      d4cg_label: "Norris Immature Teratoma Grading System >> Grade 3"
      description: "A morphologic qualifier indicating that a cancerous lesion is poorly differentiated."
      last_updated: 2026-08-17

    ncit:C28177:
      d4cg_label: "Paresthesia"
      description: "A disorder characterized by functional disturbances of sensory neurons resulting in abnormal cutaneous sensations of tingling, numbness, pressure, cold, and warmth that are experienced in the absence of a stimulus."
      last_updated: 2026-08-17

    ncit:C28194:
      d4cg_label: "Telangiectasia"
      description: "A disorder characterized by local dilatation of small vessels resulting in red discoloration of the skin or mucous membranes."
      last_updated: 2026-08-17

    ncit:C28224:
      d4cg_label: "Focal"
      description: "In terms of cancer, limited to a specific area."
      last_updated: 2026-08-17

    ncit:C28244:
      d4cg_label: "Birt-Hogg-Dube Syndrome"
      description: "A rare genetic syndrome with an autosomal dominant pattern of inheritance. It is caused by a mutation in the FLCN gene which encodes the protein folliculin. Clinical signs include multiple benign growths of the skin and lungs that begin to manifest in the second or third decade of life. The clinical course is characterized by the progressive growth of new and existing neoplasms. In those with mutations in both copies of FLCN, the kidneys may also be affected by the growth of benign or malignant neoplasms."
      last_updated: 2026-08-17

    ncit:C28252:
      d4cg_label: "kg"
      description: "A basic SI unit of mass. It is defined as the mass of an international prototype in the form of a platinum-iridium cylinder kept at Sevres in France. A kilogram is equal to 1,000 grams and 2.2046226 pounds."
      last_updated: 2026-08-17

    ncit:C28253:
      d4cg_label: "mg"
      description: "A measure of weight.  A milligram is approximately 450,000 times smaller than a pound and 28,000 times smaller than an ounce."
      last_updated: 2026-08-17

    ncit:C28256:
      d4cg_label: "Abdominal Wall"
      description: "Having to do with the area outside or behind the peritoneum (the tissue that lines the abdominal wall and covers most of the organs in the abdomen)."
      last_updated: 2026-08-17

    ncit:C28257:
      d4cg_label: "Pathological"
      description: "A method used to determine the stage of cancer. Tissue samples are removed during surgery or a biopsy. The stage is determined based on how the cells in the samples look under a microscope."
      last_updated: 2026-08-17

    ncit:C28273:
      d4cg_label: "Aqueous"
      description: "Having to do with water."
      last_updated: 2026-08-17

    ncit:C28287:
      d4cg_label: "Viscera"
      description: "The soft internal organs of the body, including the lungs, the heart, and the organs of the digestive, excretory, and reproductive systems."
      last_updated: 2026-08-17

    ncit:C28358:
      d4cg_label: "Extrahepatic"
      description: "Located or occurring outside the liver."
      last_updated: 2026-08-17

    ncit:C28397:
      d4cg_label: "Asthma"
      description: "A chronic disease in which the bronchial airways in the lungs become narrowed and swollen, making it difficult to breathe. Symptoms include wheezing, coughing, tightness in the chest, shortness of breath, and rapid breathing. An attack may be brought on by pet hair, dust, smoke, pollen, mold, exercise, cold air, or stress."
      last_updated: 2026-08-17

    ncit:C28421:
      d4cg_label: "sex"
      description: "An arbitrary categorization of individuals based on the assemblage of physical properties related to reproduction, and commonly associated with the designation of such categories as female and male. This designation is based on a combination of observable information from organ inventories, morphological assessments, hormone assessments, genetic testing, observed primary and secondary sex characteristics, menstrual status, and/or obstetric history. Current sex designation may or may not be the same as an individual's sex assigned or reported at birth. IMPORTANT NOTICE: The NCI Thesaurus contains biomedical terminologies that NCI does not own or control. This concept contains gender-related content that does not comply with Executive Order 14168."
      last_updated: 2026-08-17

    ncit:C2851:
      d4cg_label: "Acquired Immunodeficiency"
      description: "A chronic, potentially life threatening condition that is caused by human immunodeficiency virus (HIV) infection, and is characterized by increased susceptibility to opportunistic infections, certain cancers and neurologic disorders."
      last_updated: 2026-08-17

    ncit:C2852:
      d4cg_label: "Adenocarcinoma"
      description: "A common cancer characterized by the presence of malignant glandular cells.  Morphologically, adenocarcinomas are classified according to the growth pattern (e.g., papillary, alveolar) or according to the secreting product (e.g., mucinous, serous).  Representative examples of adenocarcinoma are ductal and lobular breast carcinoma, lung adenocarcinoma, renal cell carcinoma, hepatocellular carcinoma (hepatoma), colon adenocarcinoma, and prostate adenocarcinoma."
      last_updated: 2026-08-17

    ncit:C28554:
      d4cg_label: "Death"
      description: "A cessation of life that cannot be attributed to a CTCAE term associated with Grade 5."
      last_updated: 2026-08-17

    ncit:C2869:
      d4cg_label: "Anemia"
      description: "A condition in which the number of red blood cells is below normal."
      last_updated: 2026-08-17

    ncit:C287:
      d4cg_label: "Aspirin"
      description: "A drug that reduces pain, fever, inflammation, and blood clotting. Aspirin belongs to the family of drugs called nonsteroidal anti-inflammatory agents. It is also being studied in cancer prevention."
      last_updated: 2026-08-17

    ncit:C2881:
      d4cg_label: "Arrhythmia"
      description: "Any variation from the normal rate or rhythm (which may include the origin of the impulse and/or its subsequent propagation) in the heart."
      last_updated: 2026-08-17

    ncit:C2883:
      d4cg_label: "Arthritis"
      description: "A disease that causes inflammation and pain in the joints."
      last_updated: 2026-08-17

    ncit:C2887:
      d4cg_label: "Ataxia Telangiectasia Syndrome"
      description: "A rare, inherited, progressive, degenerative disease of childhood that causes loss of muscle control, a weakened immune system, and an increased risk of cancer."
      last_updated: 2026-08-17

    ncit:C2890:
      d4cg_label: "Bacterial Infection"
      description: "An acute infectious disorder caused by gram positive or gram negative bacteria."
      last_updated: 2026-08-17

    ncit:C2891:
      d4cg_label: "Barrett's Esophagus"
      description: "A condition in which the cells lining the lower part of the esophagus have changed or been replaced with abnormal cells that could lead to cancer of the esophagus. The backing up of stomach contents (reflux) may irritate the esophagus and, over time, cause Barrett's esophagus."
      last_updated: 2026-08-17

    ncit:C2892:
      d4cg_label: "Gorlin Syndrome"
      description: "A genetic condition that causes unusual facial features and disorders of the skin, bones, nervous system, eyes, and endocrine glands. People with this syndrome have a higher risk of basal cell carcinoma."
      last_updated: 2026-08-17

    ncit:C2893:
      d4cg_label: "Psychiatric Disorder"
      description: "A disorder characterized by behavioral and/or psychological abnormalities, often accompanied by physical symptoms. The symptoms may cause clinically significant distress or impairment in social and occupational areas of functioning. Representative examples include anxiety disorders, cognitive disorders, mood disorders and schizophrenia."
      last_updated: 2026-08-17

    ncit:C28976:
      d4cg_label: "Dendritic Cell Therapy"
      description: "Adoptive immunotherapy that uses dendritic cells."
      last_updated: 2026-08-17

    ncit:C2900:
      d4cg_label: "Bladder Disorder"
      description: "A non-neoplastic or neoplastic disorder affecting the urinary bladder. A representative example of non-neoplastic bladder disorder is bacterial bladder infection. A representative example of neoplastic bladder disorder is bladder carcinoma."
      last_updated: 2026-08-17

    ncit:C29007:
      d4cg_label: "Doxycycline Hyclate"
      description: "A drug used to treat many types of bacterial infections. It stops the growth of bacteria by keeping them from making proteins. It is a type of antibiotic."
      last_updated: 2026-08-17

    ncit:C2903:
      d4cg_label: "Bloom Syndrome"
      description: "A rare, inherited disorder marked by height that is shorter than average, a narrow face with redness and a rash, a high-pitched voice, and fertility problems. Patients with this disorder have an increased risk of cancer, especially leukemia and osteosarcoma (bone cancer). Bloom syndrome is caused by changes in a protein that normally helps cells make copies of the DNA. Changes in this protein cause many breaks, rearrangements, and other mutations in the DNA. It is a type of autosomal recessive genetic disease."
      last_updated: 2026-08-17

    ncit:C29047:
      d4cg_label: "Fenofibrate"
      description: "A drug used to treat high levels of cholesterol and triglycerides in the blood. Fenofibrate is being studied in the treatment of advanced cancers in young patients and in the treatment of other conditions. It is a type of antilipidemic agent."
      last_updated: 2026-08-17

    ncit:C29090:
      d4cg_label: "HepA (Hepatitis A)"
      description: "A vaccine used to prevent infection with the hepatitis A virus, which causes a serious liver disease. The vaccine is made of a weakened form of the virus that cannot cause disease but causes the body's immune system to make antibodies that destroy the hepatitis A virus."
      last_updated: 2026-08-17

    ncit:C29091:
      d4cg_label: "HepB (Hepatitis B)"
      description: "A non-infectious mixture containing recombinant hepatitis B surface antigen (HBsAg) in a liquid vehicle. Immunization with the hepatitis B vaccine induces the formation of specific anti-hepatitis B antibodies and an active immunity against hepatitis B infection."
      last_updated: 2026-08-17

    ncit:C2916:
      d4cg_label: "Carcinoma"
      description: "A malignant epithelial neoplasm."
      last_updated: 2026-08-17

    ncit:C2929:
      d4cg_label: "Squamous Cell Carcinoma"
      description: "A carcinoma arising from squamous epithelial cells.  Morphologically, it is characterized by the proliferation of atypical, often pleomorphic squamous cells.  Squamous cell carcinomas are graded by the degree of cellular differentiation as well, moderately, or poorly differentiated.  Well differentiated carcinomas are usually associated with keratin production and the presence of intercellular bridges between adjacent cells.  Representative examples are lung squamous cell carcinoma, skin squamous cell carcinoma, and cervical squamous cell carcinoma."
      last_updated: 2026-08-17

    ncit:C2931:
      d4cg_label: "Cardiovascular Disorder"
      description: "A non-neoplastic or neoplastic disorder affecting the heart or the vessels (arteries, veins and lymph vessels). Representative examples of non-neoplastic cardiovascular disorders are endocarditis and hypertension. Representative examples of neoplastic cardiovascular disorders are endocardial myxoma and angiosarcoma."
      last_updated: 2026-08-17

    ncit:C2946:
      d4cg_label: "Chondrosarcoma"
      description: "A malignant cartilaginous matrix-producing mesenchymal neoplasm arising from the bone and soft tissue.  It usually affects middle-aged to elderly adults.  The pelvic bones, ribs, shoulder girdle, and long bones are the most common sites of involvement.  Most chondrosarcomas arise de novo, but some may develop in a preexisting benign cartilaginous lesion."
      last_updated: 2026-08-17

    ncit:C2947:
      d4cg_label: "Chordoma"
      description: "A low-grade malignant neoplasm that arises from the remnants of the fetal notochord. It affects almost exclusively the axial skeleton (skull and spine) and very rarely the appendicular skeleton and soft tissue. Although it can occur at all ages, it is more frequently seen in middle-aged adults. It tends to recur and may metastasize. The most common sites of metastasis are lung, bone, lymph nodes, and subcutaneous tissue."
      last_updated: 2026-08-17

    ncit:C2948:
      d4cg_label: "Choriocarcinoma"
      description: "A malignant neoplasm arising from placental trophoblast cells. They generally arise in the uterus."
      last_updated: 2026-08-17

    ncit:C29505:
      d4cg_label: "Topical Corticosteroid"
      description: "Any synthetic steroid derivative exhibiting the same function as the naturally occurring corticosteroid hormone, formulated for topical application. Topical corticosteroids are applied to the skin where it exerts its effect, however, corticosteroids can be absorbed systemically after being applied locally. Topical corticosteroids are mainly used for the localized treatment of inflammation of the skin and help relieve symptoms such as itching, swelling and redness."
      last_updated: 2026-08-17

    ncit:C29536:
      d4cg_label: "Valproic Acid"
      description: "A drug used to treat epileptic seizures and bipolar disorder and to prevent migraine headaches. It is also being studied in the treatment of several types of cancer. It blocks an enzyme that cells need to grow and may cause cancer cells to die. It also blocks the growth of new blood vessels that tumors need to grow. It is a type of anticonvulsant, histone deacetylase (HDAC) inhibitor, antimaniacal, migraine headache prophylactic, and antiangiogenesis agent."
      last_updated: 2026-08-17

    ncit:C2962:
      d4cg_label: "Seizure"
      description: "A disorder characterized by a sudden, involuntary skeletal muscular contractions of cerebral or brain stem origin."
      last_updated: 2026-08-17

    ncit:C2964:
      d4cg_label: "Craniopharyngioma"
      description: "A benign brain tumor that may be considered malignant because it can damage the hypothalamus, the area of the brain that controls body temperature, hunger, and thirst."
      last_updated: 2026-08-17

    ncit:C2969:
      d4cg_label: "Cushing Syndrome"
      description: "A clinical condition characterized by variable degrees of central obesity, rounding of the face (\"moon\" face), hypertension, striae, and a number of other physical findings, as a result of prolonged exposure to supranormal cortisol concentration of any etiology."
      last_updated: 2026-08-17

    ncit:C2983:
      d4cg_label: "Dermatitis"
      description: "An inflammatory process affecting the skin. Signs include red rash, itching, and blister formation. Representative examples are contact dermatitis, atopic dermatitis, and seborrheic dermatitis."
      last_updated: 2026-08-17

    ncit:C29851:
      d4cg_label: "Study"
      description: "No longer participating in a study; not being followed and will not be retreated."
      last_updated: 2026-08-17

    ncit:C2986:
      d4cg_label: "Diabetes Mellitus (Type I)"
      description: "A chronic condition characterized by minimal or absent production of insulin by the pancreas."
      last_updated: 2026-08-17

    ncit:C2990:
      d4cg_label: "GI Disorder"
      description: "A non-neoplastic or neoplastic disorder that affects the gastrointestinal tract, anus, liver, biliary system, and pancreas."
      last_updated: 2026-08-17

    ncit:C2992:
      d4cg_label: "Disseminated Intravascular Coagulation"
      description: "A disorder characterized by systemic pathological activation of blood clotting mechanisms which results in clot formation throughout the body. There is an increase in the risk of hemorrhage as the body is depleted of platelets and coagulation factors."
      last_updated: 2026-08-17

    ncit:C29924:
      d4cg_label: "S100"
      description: "A family of low molecular weight proteins that are characterized by the presence of two EF-hand calcium binding domains. These proteins form homodimers that localize either in the cytoplasm or nucleus of neural crest-derived cells and are involved in the regulation of many cellular processes such as cell cycle progression and differentiation."
      last_updated: 2026-08-17

    ncit:C2993:
      d4cg_label: "Down Syndrome"
      description: "A chromosomal dysgenesis syndrome resulting from a triplication or translocation of chromosome 21. Down syndrome occurs in approximately 1:700 live births. Abnormalities are variable from individual to individual and may include mental retardation, retarded growth, flat hypoplastic face with short nose, prominent epicanthic skin folds, small low-set ears with prominent antihelix, fissured and thickened tongue, laxness of joint ligaments, pelvic dysplasia, broad hands and feet, stubby fingers, transverse palmar crease, lenticular opacities and heart disease. Patients with Down syndrome have an estimated 10 to 30-fold increased risk for leukemia; most have symptoms of Alzheimer's disease by age 40. Also known as trisomy 21 syndrome."
      last_updated: 2026-08-17

    ncit:C3008:
      d4cg_label: "Ollier Disease"
      description: "A rare benign disorder characterized by lack of normal endochondral ossification, and the growth of multiple enchondromas.  It primarily affects the bones of the hand, in children and young adults.  Extent of the disease varies; in some cases, neoplastic involvement may be widespread causing considerable deformity."
      last_updated: 2026-08-17

    ncit:C30085:
      d4cg_label: "Contraction"
      description: "The process where thick (myosin) and thin (actin) filaments slide against each other to produce a shortening or tensing of the muscle cell or fiber."
      last_updated: 2026-08-17

    ncit:C3009:
      d4cg_label: "Endocrine Disorder"
      description: "A non-neoplastic or neoplastic disorder that affects the endocrine glands."
      last_updated: 2026-08-17

    ncit:C30103:
      d4cg_label: "Stable"
      description: "Subject to little fluctuation; showing little if any change."
      last_updated: 2026-08-17

    ncit:C3025:
      d4cg_label: "Erythroplakia"
      description: "A clinical term that refers to the presence of a red flat and well defined lesion on the oral mucosa that is not caused by trauma, vascular, or inflammatory processes.  It is a precancerous condition and is seen more commonly in middle aged or older males.  It is associated with tobacco and alcohol consumption.  Microscopic examination reveals severe epithelial dysplasia, carcinoma in situ, or invasive squamous cell carcinoma."
      last_updated: 2026-08-17

    ncit:C3036:
      d4cg_label: "Fatigue"
      description: "A condition marked by extreme tiredness and inability to function due lack of energy. Fatigue may be acute or chronic."
      last_updated: 2026-08-17

    ncit:C3038:
      d4cg_label: "Fever"
      description: "A disorder characterized by elevation of the body's temperature above the upper limit of normal."
      last_updated: 2026-08-17

    ncit:C3046:
      d4cg_label: "fracture"
      description: "A finding of traumatic injury to the bone in which the continuity of the bone is broken."
      last_updated: 2026-08-17

    ncit:C3058:
      d4cg_label: "Glioblastoma"
      description: "A fast-growing type of central nervous system tumor that forms from glial (supportive) tissue of the brain and spinal cord and has cells that look very different from normal cells. GBM usually occurs in adults and affects the brain more often than the spinal cord."
      last_updated: 2026-08-17

    ncit:C3063:
      d4cg_label: "Graft Versus Host Disease"
      description: "A disease caused when cells from a donated stem cell graft attack the normal tissue of the transplant patient. Symptoms include jaundice, skin rash or blisters, a dry mouth, or dry eyes."
      last_updated: 2026-08-17

    ncit:C3071:
      d4cg_label: "Graves' Disease"
      description: "An autoimmune condition characterized by excessive immunoglobulin stimulation of the thyroid gland resulting in hyperthyroidism."
      last_updated: 2026-08-17

    ncit:C3076:
      d4cg_label: "Cowden Syndrome"
      description: "An autosomal dominant hereditary syndrome characterized by a variety of hamartomas and neoplasms including verrucous skin lesions, fibromas of the oral cavity, facial trichilemmomas, hamartomatous colonic polyps, thyroid neoplasms, breast cancer, and dysplastic gangliocytomas of the cerebellum."
      last_updated: 2026-08-17

    ncit:C3079:
      d4cg_label: "Cardiac Disease"
      description: "A non-neoplastic or neoplastic disorder that affects the heart and/or the pericardium. Representative examples include endocarditis, pericarditis, atrial myxoma, cardiac myeloid sarcoma, and pericardial malignant mesothelioma."
      last_updated: 2026-08-17

    ncit:C3090:
      d4cg_label: "Hematuria"
      description: "A disorder characterized by laboratory test results that indicate blood in the urine."
      last_updated: 2026-08-17

    ncit:C3099:
      d4cg_label: "Hepatocelluar Carcinoma (HCC)"
      description: "A malignant neoplasm arising from hepatocytes."
      last_updated: 2026-08-17

    ncit:C3105:
      d4cg_label: "Von Hippel-Lindau Syndrome"
      description: "A rare inherited disorder in which blood vessels grow abnormally in the eyes, brain, spinal cord, adrenal glands, or other parts of the body. People with von Hippel-Lindau syndrome have a higher risk of developing some types of cancer."
      last_updated: 2026-08-17

    ncit:C3107:
      d4cg_label: "Langerhans Cell Histiocytosis"
      description: "A group of rare disorders in which too many Langerhans cells (a type of white blood cell) grow in certain tissues and organs including the bones, skin, and lungs, and damage them. Langerhans cell histiocytosis may also affect the pituitary gland (which makes hormones that control other glands and many body functions, especially growth). Langerhans cell histiocytosis is most common in children and young adults."
      last_updated: 2026-08-17

    ncit:C3111:
      d4cg_label: "hydrocephalus"
      description: "A disorder characterized by an abnormal increase of cerebrospinal fluid in the ventricles of the brain."
      last_updated: 2026-08-17

    ncit:C3117:
      d4cg_label: "Hypertension"
      description: "A blood pressure of 140/90 or higher. High blood pressure usually has no symptoms. It can harm the arteries and cause an increase in the risk of stroke, heart attack, kidney failure, and blindness."
      last_updated: 2026-08-17

    ncit:C3123:
      d4cg_label: "Hyperthyroid"
      description: "A disorder characterized by excessive levels of thyroid hormone in the body. Common causes include an overactive thyroid gland or thyroid hormone overdose."
      last_updated: 2026-08-17

    ncit:C313:
      d4cg_label: "Bleomycin"
      description: "A mixture of glycopeptide antineoplastic antibiotics isolated from the bacterium Streptomyces verticillus. Bleomycin forms complexes with iron that reduce molecular oxygen to superoxide and hydroxyl radicals which cause single- and double-stranded breaks in DNA; these reactive oxygen species also induce lipid peroxidation, carbohydrate oxidation, and alterations in prostaglandin synthesis and degradation."
      last_updated: 2026-08-17

    ncit:C3133:
      d4cg_label: "Erectile Dysfunction"
      description: "A disorder characterized by the persistent or recurrent inability to achieve or to maintain an erection during sexual activity."
      last_updated: 2026-08-17

    ncit:C3138:
      d4cg_label: "Inflammatory Bowel Disease"
      description: "A general term that refers to the inflammation of the colon and rectum. Inflammatory bowel disease includes ulcerative colitis and Crohn's disease."
      last_updated: 2026-08-17

    ncit:C3149:
      d4cg_label: "Renal Disorder"
      description: "A neoplastic or non-neoplastic condition affecting the kidney. Representative examples of non-neoplastic conditions include glomerulonephritis and nephrotic syndrome. Representative examples of neoplastic conditions include benign processes (e.g., renal lipoma and renal fibroma) and malignant processes (e.g., renal cell carcinoma and renal lymphoma)."
      last_updated: 2026-08-17

    ncit:C3158:
      d4cg_label: "Leiomyosarcoma"
      description: "A malignant (cancer) tumor of smooth muscle cells that can arise almost anywhere in the body, but is most common in the uterus, abdomen, or pelvis."
      last_updated: 2026-08-17

    ncit:C3161:
      d4cg_label: "Leukemia"
      description: "A cancer of the blood or bone marrow that is characterized by increased production of abnormal blood cells."
      last_updated: 2026-08-17

    ncit:C3164:
      d4cg_label: "WHO, Version 4 >> Acute Basophilic Leukemia"
      description: "A rare acute myeloid leukemia in which the immature cells differentiate towards basophils."
      last_updated: 2026-08-17

    ncit:C3167:
      d4cg_label: "ALL"
      description: "A progressive, proliferative disease of blood cells, originating from immature lymphoid cells."
      last_updated: 2026-08-17

    ncit:C3170:
      d4cg_label: "FAB >> Version NOS >> M7"
      description: "A progressive, proliferative disease of blood cells, originating from immature megakaryocytes."
      last_updated: 2026-08-17

    ncit:C3171:
      d4cg_label: "AML"
      description: "A clonal expansion of myeloid blasts in the bone marrow, blood or other tissues. The classification of acute myeloid leukemias (AMLs) encompasses four major categories: 1) AML with recurrent genetic abnormalities; 2) AML with multilineage dysplasia; 3) Therapy-related AML; 4) AML not otherwise specified. The required bone marrow or peripheral blood blast percentage for the diagnosis of AML is 20% (WHO classification)."
      last_updated: 2026-08-17

    ncit:C3182:
      d4cg_label: "FAB >> Version NOS >> M3"
      description: "An acute promyelocytic leukemia characterized by the reciprocal balanced translocation t(15;17)(q24.1;q21.2) that results in the fusion of the promyelocytic leukemia (PML) gene and retinoic acid receptor-alpha (RARA) gene. The t(15;17)(q24.1;q21.2) with the resulting PML-RARA fusion gene occurs in over 95% of cases of acute promyelocytic leukemia. The remainder of the cases show variant RARA gene translocations with other genes."
      last_updated: 2026-08-17

    ncit:C3183:
      d4cg_label: "T-ALL"
      description: "An acute lymphoblastic leukemia of T-lineage origin."
      last_updated: 2026-08-17

    ncit:C3186:
      d4cg_label: "Leukoplakia"
      description: "A white patch or plaque on a mucous membrane that cannot be characterized clinically or pathologically as any other disease. The diagnosis of leukoplakia is one of exclusion; other conditions such as candidiasis, lichen planus, leukoedema, etc., must be ruled out before a diagnosis of leukoplakia can be made. Leukoplakia may be a premalignant condition."
      last_updated: 2026-08-17

    ncit:C3194:
      d4cg_label: "Liposarcoma, NOS"
      description: "A malignant neoplasm composed of adipose tissue."
      last_updated: 2026-08-17

    ncit:C3198:
      d4cg_label: "Pulmonary Disease"
      description: "A non-neoplastic or neoplastic disorder affecting the lung. Representative examples of non-neoplastic disorders include chronic obstructive pulmonary disease and pneumonia. Representative examples of neoplastic disorders include benign processes (e.g., respiratory papilloma) and malignant processes (e.g., lung carcinoma and metastatic cancer to the lung)."
      last_updated: 2026-08-17

    ncit:C3199:
      d4cg_label: "Obstructive Lung Disease"
      description: "A chronic and progressive lung disorder characterized by the loss of elasticity of the bronchial tree and the air sacs, destruction of the air sacs wall, thickening of the bronchial wall, and mucous accumulation in the bronchial tree. The pathologic changes result in the disruption of the air flow in the bronchial airways. Signs and symptoms include shortness of breath, wheezing, productive cough, and chest tightness. The two main types of chronic obstructive pulmonary disease are chronic obstructive bronchitis and emphysema."
      last_updated: 2026-08-17

    ncit:C3201:
      d4cg_label: "Systemic Lupus Erythematosus"
      description: "A chronic, inflammatory, connective tissue disease that can affect many organs including the joints, skin, heart, lungs, kidneys, and nervous system. It is marked by many different symptoms; however, not everyone with SLE has all of the symptoms."
      last_updated: 2026-08-17

    ncit:C32042:
      d4cg_label: "Acetabulum"
      description: "The acetabulum is a concave surface of the pelvis. The head of the femur meets with the pelvis at the acetabulum, forming the hip joint. There are three bones of the os coxae (hip bone) that come together to form the acetabulum. Contributing a little more than two-fifths of the structure is the ischium, which provides lower and side boundaries to the acetabulum. The ilium forms the upper boundary, providing a little less than two-fifths of the structure of the acetabulum. The rest is formed by the pubis, near the midline. It is bounded by a prominent uneven rim, which is thick and strong above, and serves for the attachment of the acetabular labrum, which reduces its opening, and deepens the surface for formation of the hip joint. At the lower part of the acetabulum is the acetabular notch, which is continuous with a circular depression, the acetabular fossa, at the bottom of the cavity of the acetabulum. The rest of the acetabulum is formed by a curved, crescent-moon shaped surface, the lunate surface, where the joint is made with the head of the femur. Its counterpart in the pectoral girdle is the glenoid fossa."
      last_updated: 2026-08-17

    ncit:C32078:
      d4cg_label: "Ankle"
      description: "A gliding joint between the distal ends of the tibia and fibula and the proximal end of the talus."
      last_updated: 2026-08-17

    ncit:C3208:
      d4cg_label: "Lymphoma"
      description: "A malignant (clonal) proliferation of B- lymphocytes or T- lymphocytes which involves the lymph nodes, bone marrow and/or extranodal sites. This category includes Non-Hodgkin lymphomas and Hodgkin lymphomas."
      last_updated: 2026-08-17

    ncit:C321:
      d4cg_label: "Busulfan"
      description: "A synthetic derivative of dimethane-sulfonate with antineoplastic and cytotoxic properties.  Although its mechanism of action is not fully understood, busulfan appears to act through the alkylation of DNA.  Following systemic absorption of busulfan, carbonium ions are formed, resulting in DNA alkylation and DNA breaks and inhibition of DNA replication and RNA transcription. (NCI04)"
      last_updated: 2026-08-17

    ncit:C3213:
      d4cg_label: "Maffucci Syndrome"
      description: "A rare non-inherited disorder primarily affecting the skin and skeletal system. It is classified as a mesodermal dysplasia. Clinical signs appear within the first decade and are characterized by multiple soft tissue hemiangiomas and enchondromas leading to skeletal deformities. Clinical course is progressive with variable development of associated malignancies."
      last_updated: 2026-08-17

    ncit:C32141:
      d4cg_label: "Upper Arm"
      description: "The portion of the upper extremity between the shoulder and the elbow."
      last_updated: 2026-08-17

    ncit:C3222:
      d4cg_label: "Medulloblastoma, NOS or NEC"
      description: "A malignant brain tumor that begins in the lower part of the brain and that can spread to the spine or to other parts of the body. Medulloblastomas are a type of primitive neuroectodermal tumor (PNET)."
      last_updated: 2026-08-17

    ncit:C3224:
      d4cg_label: "Melanoma"
      description: "A form of cancer that begins in melanocytes (cells that make the pigment melanin). It may begin in a mole (skin melanoma), but can also begin in other pigmented tissues, such as in the eye or in the intestines."
      last_updated: 2026-08-17

    ncit:C3225:
      d4cg_label: "Multiple Endocrine Neoplasia Type 1"
      description: "A rare, inherited disorder that affects the endocrine glands and can cause tumors in the parathyroid and pituitary glands and the pancreas. These tumors are usually benign (not cancer). They cause the glands to secrete high levels of hormones, which can lead to other medical problems, such as kidney stones, fertility problems, and severe ulcers. In some cases, tumors inside the pancreas can become malignant (cancer)."
      last_updated: 2026-08-17

    ncit:C32250:
      d4cg_label: "Calcaneum"
      description: "The irregular and largest tarsal bone that forms the heel."
      last_updated: 2026-08-17

    ncit:C32256:
      d4cg_label: "Eye, Schlemm's Canal"
      description: "A circular vascular-like structure in the anterior chamber of the eye through which aqueous humor passes when returning to the blood."
      last_updated: 2026-08-17

    ncit:C32298:
      d4cg_label: "Cervical Nodes"
      description: "Any of the lymph nodes located in the neck."
      last_updated: 2026-08-17

    ncit:C3230:
      d4cg_label: "Meningioma"
      description: "A generally slow growing tumor attached to the dura mater. It is composed of neoplastic meningothelial (arachnoidal) cells. It typically occurs in adults, often women and it has a wide range of histopathological appearances. Of the various subtypes, meningothelial, fibrous and transitional meningiomas are the most common. Most meningiomas are WHO grade 1 tumors, and some are WHO grade 2 or 3 tumors. Most subtypes share a common clinical behavior, although some subtypes are more likely to recur and follow a more aggressive clinical course. (Adapted from WHO)"
      last_updated: 2026-08-17

    ncit:C3239:
      d4cg_label: "Monosomy"
      description: "A chromosomal abnormality consisting of the absence of one chromosome from the normal diploid number."
      last_updated: 2026-08-17

    ncit:C3243:
      d4cg_label: "Multiple Sclerosis"
      description: "A disorder of the central nervous system marked by weakness, numbness, a loss of muscle coordination, and problems with vision, speech, and bladder control. Multiple sclerosis is thought to be an autoimmune disease in which the body's immune system destroys myelin. Myelin is a substance that contains both protein and fat (lipid), serving as a nerve insulator and helping in the transmission of nerve signals."
      last_updated: 2026-08-17

    ncit:C3245:
      d4cg_label: "Fungal Infection"
      description: "An infection caused by a fungus."
      last_updated: 2026-08-17

    ncit:C32460:
      d4cg_label: "Epiphysis"
      description: "The shaft of a long bone, located between the two epiphyses; it is cylindrical in shape, with walls of compact bone enclosing a central marrow cavity."
      last_updated: 2026-08-17

    ncit:C32472:
      d4cg_label: "Dorsal Spine"
      description: "A spinal curve that originates at the middle of the second thoracic vertebra and terminates at the middle of the last thoracic vertebra."
      last_updated: 2026-08-17

    ncit:C3249:
      d4cg_label: "FAB >> Version NOS >> M1"
      description: "An acute myeloid leukemia (AML) characterized by blasts without evidence of maturation to more mature neutrophils. (WHO, 2001)"
      last_updated: 2026-08-17

    ncit:C32497:
      d4cg_label: "Elbow"
      description: "A joint involving the humerus, radius and ulna bones."
      last_updated: 2026-08-17

    ncit:C3250:
      d4cg_label: "FAB >> Version NOS >> M2"
      description: "An acute myeloid leukemia (AML) characterized by blasts with evidence of maturation to more mature neutrophils. (WHO, 2001)"
      last_updated: 2026-08-17

    ncit:C32529:
      d4cg_label: "Diaphysis"
      description: "The end of long bones that lies adjacent to the metaphysis."
      last_updated: 2026-08-17

    ncit:C32608:
      d4cg_label: "Finger"
      description: "A digit that is part of a manus (hand)."
      last_updated: 2026-08-17

    ncit:C3261:
      d4cg_label: "Metastatic Tumor"
      description: "A tumor that has spread from its original (primary) site of growth to another site, close to or distant from the primary site.  Metastasis is characteristic of advanced malignancies, but in rare instances can be seen in neoplasms lacking malignant morphology."
      last_updated: 2026-08-17

    ncit:C3262:
      d4cg_label: "Tumor, NOS"
      description: "A benign or malignant tissue growth resulting from uncontrolled cell proliferation. Benign neoplastic cells resemble normal cells without exhibiting significant cytologic atypia, while malignant cells exhibit overt signs such as dysplastic features, atypical mitotic figures, necrosis, nuclear pleomorphism, and anaplasia. Representative examples of benign neoplasms include papillomas, cystadenomas, and lipomas; malignant neoplasms include carcinomas, sarcomas, lymphomas, and leukemias."
      last_updated: 2026-08-17

    ncit:C32622:
      d4cg_label: "Cervix Lymph Node"
      description: "Distal portion of the hind limb, including tarsal region, metatarsal region and digits."
      last_updated: 2026-08-17

    ncit:C32623:
      d4cg_label: "Foot Joint"
      description: ""
      last_updated: 2026-08-17

    ncit:C32628:
      d4cg_label: "Forearm"
      description: "The structure on the upper limb, between the elbow and the wrist."
      last_updated: 2026-08-17

    ncit:C32635:
      d4cg_label: "Frontal Bone"
      description: "A bone of the skull forming the forehead, root of the nose and the roof of both orbits."
      last_updated: 2026-08-17

    ncit:C32677:
      d4cg_label: "Gingiva, Lower, Anterior"
      description: "The fibrous investing tissue, covered by keratinized epithelium, that immediately surrounds a tooth and is contiguous with its periodontal ligament and with the mucosal tissues of the mouth."
      last_updated: 2026-08-17

    ncit:C32679:
      d4cg_label: "Invovement of Eyelids"
      description: "A gland in the margins of the eyelids that opens into the follicles of the eyelashes and produces secretions that lubricate the eyeball."
      last_updated: 2026-08-17

    ncit:C3269:
      d4cg_label: "Schwannoma"
      description: "A benign neoplasm of the peripheral nervous system composed of well-differentiated Schwann cells."
      last_updated: 2026-08-17

    ncit:C32712:
      d4cg_label: "Hand"
      description: "Distal segment of the fore limb, including carpal region, metacarpal region and digits."
      last_updated: 2026-08-17

    ncit:C32719:
      d4cg_label: "Fibular Head"
      description: "The highest portion of the fibula that articulates with the patella."
      last_updated: 2026-08-17

    ncit:C3272:
      d4cg_label: "Neurofibroma"
      description: "A benign tumor that develops from the cells and tissues that cover nerves."
      last_updated: 2026-08-17

    ncit:C3273:
      d4cg_label: "NF1"
      description: "A rare genetic condition that causes brown spots and tumors on the skin, freckling in skin areas not exposed to the sun, tumors on the nerves, and developmental changes in the nervous system, muscles, bone, and skin."
      last_updated: 2026-08-17

    ncit:C3274:
      d4cg_label: "NF2"
      description: "A genetic condition in which tumors form on the nerves of the inner ear and cause loss of hearing and balance. Tumors may also occur in the brain and on nerves in the skull and spinal cord, and may cause loss of speech, eye movement, and the ability to swallow."
      last_updated: 2026-08-17

    ncit:C32742:
      d4cg_label: "Hip (proximal femur)"
      description: "A ball-and-socket joint between the head of the femur and the acetabulum."
      last_updated: 2026-08-17

    ncit:C32765:
      d4cg_label: "Iliac Crest"
      description: "Paired endochondral bone that is the dorsal-most of the pelvic bones, offering attachment areas for gluteal muscles on its main surface."
      last_updated: 2026-08-17

    ncit:C3279:
      d4cg_label: "Night Sweats"
      description: "Nocturnal perspiration that is unrelated to environmental temperature."
      last_updated: 2026-08-17

    ncit:C32801:
      d4cg_label: "Inguinal Nodes"
      description: "A superficial or deep lymph node located in the inguinal area."
      last_updated: 2026-08-17

    ncit:C32868:
      d4cg_label: "Hand Joint"
      description: "The hinge synovial joints between the phalanges of the fingers."
      last_updated: 2026-08-17

    ncit:C32884:
      d4cg_label: "Ischium"
      description: "Endochondral bone that is paired, forming the posterior part of the pelvis, articulating with the pubis and ilium."
      last_updated: 2026-08-17

    ncit:C32898:
      d4cg_label: "Knee"
      description: "A joint connecting the lower part of the femur with the upper part of the tibia. The lower part of the femur and the upper part of the tibia are attached to each other by ligaments. Other structures of the knee joint include the upper part of the fibula, located below and parallel to the tibia, and the patella which moves as the knee bends."
      last_updated: 2026-08-17

    ncit:C32899:
      d4cg_label: "Knee Joint"
      description: "The first lumbar vertebra counting from the top down."
      last_updated: 2026-08-17

    ncit:C32906:
      d4cg_label: "Lacrimal Bone"
      description: "A small rectangular thin plate forming part of the medial orbit wall. It is located posterior to the frontal process of the maxilla and articulates with the inferior nasal concha, ethmoid, frontal, and maxillary bones."
      last_updated: 2026-08-17

    ncit:C32974:
      d4cg_label: "Leg"
      description: "The portion of the hindlimb that contains both the stylopod and zeugopod."
      last_updated: 2026-08-17

    ncit:C32979:
      d4cg_label: "Brain/Leptomeninges"
      description: "Having to do with the two innermost meninges (thin layers of tissue that cover and protect the brain and spinal cord)."
      last_updated: 2026-08-17

    ncit:C3298:
      d4cg_label: "Osteoporosis"
      description: "A condition of reduced bone mass, with decreased cortical thickness and a decrease in the number and size of the trabeculae of cancellous bone (but normal chemical composition), resulting in increased fracture incidence. Osteoporosis is classified as primary (Type 1, postmenopausal osteoporosis; Type 2, age-associated osteoporosis; and idiopathic, which can affect juveniles, premenopausal women, and middle-aged men) and secondary osteoporosis (which results from an identifiable cause of bone mass loss)."
      last_updated: 2026-08-17

    ncit:C3306:
      d4cg_label: "Pancreatitis"
      description: "A disorder characterized by inflammation of the pancreas."
      last_updated: 2026-08-17

    ncit:C3307:
      d4cg_label: "Papilledema"
      description: "A disorder characterized by swelling around the optic disc."
      last_updated: 2026-08-17

    ncit:C3308:
      d4cg_label: "Paraganglioma"
      description: "A neoplasm arising from paraganglia located along the sympathetic or parasympathetic nerves.  Infrequently, it may arise outside the usual distribution of the sympathetic and parasympathetic paraganglia.  Tumors arising from the adrenal gland medulla are called pheochromocytomas.  Morphologically, paragangliomas usually display a nesting (Zellballen) growth pattern.  There are no reliable morphologic criteria to distinguish between benign and malignant paragangliomas.  The only definitive indicator of malignancy is the presence of regional or distant metastases."
      last_updated: 2026-08-17

    ncit:C33094:
      d4cg_label: "Involvement of Meningeal Spaces around Optic Nerve"
      description: "A branch of the maxillary nerve (CN V2) that innervates the meninges."
      last_updated: 2026-08-17

    ncit:C33157:
      d4cg_label: "Nasal Bone"
      description: "A bone of the skull forming the middle and upper part of the face."
      last_updated: 2026-08-17

    ncit:C33160:
      d4cg_label: "Nasal Septum"
      description: "The thin wall between the two nasal cavities."
      last_updated: 2026-08-17

    ncit:C3319:
      d4cg_label: "pericardial_effusion"
      description: "A disorder characterized by fluid collection within the pericardial sac, usually due to inflammation."
      last_updated: 2026-08-17

    ncit:C33199:
      d4cg_label: "Involvement of Extraocular Muscle"
      description: "A group of extrinsic muscles that are responsible for moving the eye and lifting the eyelid. These include: superior rectus, inferior rectus, medial rectus, inferior oblique, and levator palpebrae superioris, all innervated by CN III (oculomotor nerve), superior oblique, innervated by CN IV (trochlear nerve), lateral rectus, innervated by CN VI (abducens nerve)."
      last_updated: 2026-08-17

    ncit:C33209:
      d4cg_label: "Omentum/Peritoneum"
      description: "A double layer of peritoneum covering abdominal organs."
      last_updated: 2026-08-17

    ncit:C3324:
      d4cg_label: "Peutz-Jeghers Syndrome"
      description: "A genetic disorder in which polyps form in the intestine and dark spots appear on the mouth and fingers. Having Peutz-Jeghers syndrome increases the risk of developing gastrointestinal and many other types of cancer."
      last_updated: 2026-08-17

    ncit:C33282:
      d4cg_label: "Patella"
      description: "A large sesamoid bone found in the distal femur/proximal tibial region of the hindlimb of tetrapods. The patella is the attachment site for proximal hindlimb tendons."
      last_updated: 2026-08-17

    ncit:C3329:
      d4cg_label: "Pituitary Neuroendocrine Tumor"
      description: "A benign neoplasm of the anterior lobe of the pituitary gland."
      last_updated: 2026-08-17

    ncit:C33301:
      d4cg_label: "Perineum"
      description: "The area located between the anus and vulva in females, and anus and scrotum in males."
      last_updated: 2026-08-17

    ncit:C3331:
      d4cg_label: "pleural_effusion"
      description: "A disorder characterized by an increase in amounts of fluid within the pleural cavity. Symptoms include shortness of breath, cough and marked chest discomfort."
      last_updated: 2026-08-17

    ncit:C3335:
      d4cg_label: "Rothmund-Thomson Syndrome"
      description: "A rare inherited disorder that affects the skin and many other parts of the body, including the bones, eyes, nose, hair, nails, teeth, testes, and ovaries. People with Rothmund-Thomson syndrome have an increased risk of osteosarcoma (bone cancer)."
      last_updated: 2026-08-17

    ncit:C3339:
      d4cg_label: "Familial Adenomatous Polyposis"
      description: "An autosomal dominant disorder, characterized by the presence of multiple adenomas in the colon and rectum. It is caused by a germline mutation in the adenomatous polyposis coli (APC) gene which is located on the long arm of chromosome 5. The adenomas are most often tubular, and they have the tendency to progress to adenocarcinoma. They can occur throughout the colon, but they tend to concentrate in the rectum and sigmoid colon. The colorectal adenomas are detected during endoscopic examination between the age of 10 and 20 years. The adenomas increase in size and numbers with age, and there is usually progression of one or more adenomas to adenocarcinoma. The mean age of development of adenocarcinoma is about 40 years. Signs include rectal bleeding and mucousy diarrhea."
      last_updated: 2026-08-17

    ncit:C33439:
      d4cg_label: "Pyriform Sinus"
      description: "A pear-shaped fossa in the wall of the laryngeal pharynx lateral to the arytenoid cartilage and medial to the lamina of the thyroid cartilage."
      last_updated: 2026-08-17

    ncit:C3346:
      d4cg_label: "Psoriasis"
      description: "A chronic disease of the skin marked by red patches covered with white scales."
      last_updated: 2026-08-17

    ncit:C33506:
      d4cg_label: "Sacrococcygeal"
      description: "The amphiarthrodial joint between the sacrum and coccyx."
      last_updated: 2026-08-17

    ncit:C33508:
      d4cg_label: "Pelvis, Sacrum"
      description: "A collection of sacral vertebrae in the sacral region that are fused and part of the bony pelvis."
      last_updated: 2026-08-17

    ncit:C3353:
      d4cg_label: "Acute Respiratory Distress Syndrome"
      description: "A disorder characterized by progressive and life-threatening pulmonary distress in the absence of an underlying pulmonary condition, usually following major trauma or surgery."
      last_updated: 2026-08-17

    ncit:C33547:
      d4cg_label: "Bone Shoulder Girdle"
      description: "The bony arch formed by the collarbones and shoulder blades."
      last_updated: 2026-08-17

    ncit:C33548:
      d4cg_label: "Shoulder Joint"
      description: "A ball-and-socket joint at the upper end of the humerus, located at the junction of humerus and scapula."
      last_updated: 2026-08-17

    ncit:C33550:
      d4cg_label: "Sigmoid Flexure"
      description: "The curving part of the colon that is in continuity with the rectum."
      last_updated: 2026-08-17

    ncit:C33561:
      d4cg_label: "Skin of the Face"
      description: "A zone of skin that is part of the face."
      last_updated: 2026-08-17

    ncit:C3359:
      d4cg_label: "Rhabdomyosarcoma"
      description: "A malignant mesenchymal neoplasm arising from skeletal muscle."
      last_updated: 2026-08-17

    ncit:C33600:
      d4cg_label: "Splenic Hilar Nodes"
      description: "A lymph node located in the hilar region of the spleen."
      last_updated: 2026-08-17

    ncit:C33682:
      d4cg_label: "Superior Maxilla"
      description: "The facial bone that forms the medial floor of the orbit."
      last_updated: 2026-08-17

    ncit:C3371:
      d4cg_label: "Dermatologic Disorder"
      description: "Affecting the skin."
      last_updated: 2026-08-17

    ncit:C33757:
      d4cg_label: "Terminal Ileum"
      description: "The most distal section of the ileum that is continuous with the cecum."
      last_updated: 2026-08-17

    ncit:C33758:
      d4cg_label: "Testicular Tissue"
      description: "Parenchyma composed of seminiferous tubules embedded in loose connective interstitial tissue. The interstitial tissue contains clusters of testosterone-secreting Leydig cells, collagen and myoid cells."
      last_updated: 2026-08-17

    ncit:C33763:
      d4cg_label: "Thigh"
      description: "A part of the lower limb, located between hip and knee."
      last_updated: 2026-08-17

    ncit:C33788:
      d4cg_label: "Toe"
      description: "One of the terminal digits of the foot."
      last_updated: 2026-08-17

    ncit:C33816:
      d4cg_label: "Trunk"
      description: "Organism subdivision which is the part of the body posterior to the cervical region (or head, when cervical region not present) and anterior to the caudal region. Includes the sacrum when present."
      last_updated: 2026-08-17

    ncit:C33839:
      d4cg_label: "Upper Airway"
      description: "The sinuses and those parts of the respiratory system above the trachea. It includes the nares, nasopharynx, oropharynx, larynx, vocal cords, glottis and upper trachea."
      last_updated: 2026-08-17

    ncit:C33894:
      d4cg_label: "Wrist"
      description: "A joint between the distal end of the radius and the proximal row of carpal bones."
      last_updated: 2026-08-17

    ncit:C33895:
      d4cg_label: "Wrist Joint"
      description: "The cartilage just below the sternal body."
      last_updated: 2026-08-17

    ncit:C33897:
      d4cg_label: "Zygomatic Bone"
      description: "The union at the zygomaticotemporal suture of the temporal process of the zygomatic bone and zygomatic process of the temporal bone."
      last_updated: 2026-08-17

    ncit:C3390:
      d4cg_label: "Stroke"
      description: "A disorder characterized by a sudden loss of sensory function due to an intracranial vascular event."
      last_updated: 2026-08-17

    ncit:C3400:
      d4cg_label: "Synovial Sarcoma, NOS"
      description: "A malignant neoplasm characterized by the chromosomal translocation t(X;18)(p11;q11).  It can occur at any age, but mainly affects young adults, more commonly males.  Although any site can be affected, the vast majority of the cases arise in the deep soft tissues of extremities, especially around the knee.  Microscopically, synovial sarcoma is classified as monophasic (with a spindle or epithelial cell component) or biphasic (with both spindle and epithelial cell components).  Synovial sarcomas can recur or metastasize to the lungs, bones, and lymph nodes."
      last_updated: 2026-08-17

    ncit:C3401:
      d4cg_label: "Tenosynovial Giant Cell Tumor Diffuse Type"
      description: "A locally aggressive, diffusely infiltrating tumor, arising in the tendon sheath.  It is composed of synovial-like mononuclear cells, hemosiderin-laden macrophages, foam cells, and inflammatory cells.  Multinucleated osteoclast-like giant cells are usually present, although in a minority of cases they may be absent or rare.  It predominantly affects young adults.  Symptoms include joint swelling, pain, and joint effusion."
      last_updated: 2026-08-17

    ncit:C3408:
      d4cg_label: "Thrombocytopenia"
      description: "A condition in which there is a lower-than-normal number of platelets in the blood. It may result in easy bruising and excessive bleeding from wounds or bleeding in mucous membranes and other tissues."
      last_updated: 2026-08-17

    ncit:C34082:
      d4cg_label: "Gastrointestinal Tract"
      description: "A tube extending from the mouth to the anus."
      last_updated: 2026-08-17

    ncit:C3415:
      d4cg_label: "Thyroid Nodule"
      description: "A discrete tissue mass in the thyroid gland."
      last_updated: 2026-08-17

    ncit:C3421:
      d4cg_label: "Trisomy"
      description: "A chromosomal abnormality consisting of the presence of one chromosome in addition to the normal diploid number."
      last_updated: 2026-08-17

    ncit:C3424:
      d4cg_label: "Tuberous Sclerosis"
      description: "A genetic disorder in which benign (not cancer) tumors form in the kidneys, brain, eyes, heart, lungs, and skin. This disease can cause seizures, mental disabilities, and different types of skin lesions."
      last_updated: 2026-08-17

    ncit:C3429:
      d4cg_label: "Incontinence"
      description: "Inability to control the flow of urine from the bladder (urinary incontinence) or the escape of stool from the rectum (fecal incontinence)."
      last_updated: 2026-08-17

    ncit:C3439:
      d4cg_label: "Viral Infection"
      description: "Any disease caused by a virus."
      last_updated: 2026-08-17

    ncit:C34402:
      d4cg_label: "peritoneal_effusion"
      description: ""
      last_updated: 2026-08-17

    ncit:C34415:
      d4cg_label: "Beckwith-Wiedemann Syndrome"
      description: "A complex syndrome resulting from various genetic and epigenetic anomalies of the 11p15.5 chromosomal region, leading to dysregulated expression of imprinted genes. Specific genes involved include CDKN1C, H19, IGF2, and KCNQ1OT1. One of the key genetic anomalies is an imbalance between the paternally expressed IGF2 growth enhancer gene and the maternally expressed H19 growth suppressor gene, leading to fetal and postnatal overgrowth. The condition is typically characterized by macrosomia, macroglossia, umbilical hernia or more severe abdominal wall anomalies such as omphalocele, ear lobe indentations, and hypoglycemia associated with hyperinsulinemia due to pancreatic islet cell hyperplasia. Patients with this syndrome have an increased risk for development of embryonal tumors (particularly Wilms tumor and hepatoblastoma) and adrenal cortex carcinoma."
      last_updated: 2026-08-17

    ncit:C3442:
      d4cg_label: "Vomiting"
      description: "A disorder characterized by the reflexive act of ejecting the contents of the stomach through the mouth."
      last_updated: 2026-08-17

    ncit:C3447:
      d4cg_label: "Werner Syndrome"
      description: "A rare, autosomal recessive syndrome caused by mutations in the WRN gene. It is characterized by the appearance of accelerated aging following puberty. It is associated with the development of diabetes mellitus, atherosclerosis, cataracts, and cancer."
      last_updated: 2026-08-17

    ncit:C34483:
      d4cg_label: "Scarring"
      description: "A mark left (usually on the skin) by the healing of injured tissue."
      last_updated: 2026-08-17

    ncit:C34504:
      d4cg_label: "Conjunctivitis (Pink Eye)"
      description: "A condition in which the conjunctiva (membranes lining the eyelids and covering the white part of the eye) become inflamed or infected."
      last_updated: 2026-08-17

    ncit:C3452:
      d4cg_label: "Xeroderma Pigmentosum"
      description: "A genetic condition marked by an extreme sensitivity to ultraviolet radiation, including sunlight. People with xeroderma pigmentosum are not able to repair skin damage from the sun and other sources of ultraviolet radiation, and have a very high risk of skin cancer."
      last_updated: 2026-08-17

    ncit:C34586:
      d4cg_label: "Endophthalmitis"
      description: "A disorder characterized by an infectious process involving the internal structures of the eye."
      last_updated: 2026-08-17

    ncit:C34649:
      d4cg_label: "Goodpasture's Syndrome"
      description: "An autoimmune disorder characterized by pulmonary hemorrhage and glomerulonephritis. It is a hypersensitivity reaction resulting in the formation of antibodies against the pulmonary alveoli and the basement membrane of the glomeruli."
      last_updated: 2026-08-17

    ncit:C34661:
      d4cg_label: "Headache"
      description: "A disorder characterized by a sensation of marked discomfort in various parts of the head, not confined to the area of distribution of any nerve."
      last_updated: 2026-08-17

    ncit:C34700:
      d4cg_label: "Hirschprung Disease"
      description: "A congenital disorder characterized by the absence of ganglion cells usually in the rectosigmoid colon (short segment Hirschsprung disease) or, rarely, throughout the entire colon and small bowel (total intestinal aganglionosis)."
      last_updated: 2026-08-17

    ncit:C34724:
      d4cg_label: "Low Birth Weight"
      description: "A birth weight that is less than 2500 grams."
      last_updated: 2026-08-17

    ncit:C3473:
      d4cg_label: "Choroid Plexus Tumors"
      description: "A rare type of cancer that occurs in the ventricles of the brain. It usually occurs in children younger than 2 years."
      last_updated: 2026-08-17

    ncit:C34752:
      d4cg_label: "47XXY"
      description: "A condition caused by the presence of an extra X chromosome resulting in 47,XXY karyotype in an individual with male phenotype. The condition is characterized in childhood by relative tall stature with disproportionately long limbs, and speech/language developmental problems in some patients. Postpubertal findings include small testes, gynecomastia, and infertility."
      last_updated: 2026-08-17

    ncit:C3476:
      d4cg_label: "Li-Fraumeni Syndrome"
      description: "A rare, inherited predisposition to multiple cancers, caused by an alteration in the p53 tumor suppressor gene."
      last_updated: 2026-08-17

    ncit:C34815:
      d4cg_label: "Menstrual Cycle Dysfunction"
      description: "A category of conditions related to menses."
      last_updated: 2026-08-17

    ncit:C34830:
      d4cg_label: "Cardiomyopathy, NOS"
      description: "A disease of the heart muscle or myocardium proper. Cardiomyopathies may be classified as either primary or secondary, on the basis of etiology, or on the pathophysiology of the lesion: hypertrophic, dilated, or restrictive."
      last_updated: 2026-08-17

    ncit:C34854:
      d4cg_label: "Noonan Syndrome"
      description: "A genetic syndrome caused by mutations in the PTPN11 gene (greater than 50% of the cases) or less frequently mutations in the SOS1, RAF1, or KRAS genes. It is characterized by short stature, webbed neck, hypertelorism, low-set ears, deafness, and thrombocytopenia or abnormal platelet function."
      last_updated: 2026-08-17

    ncit:C34857:
      d4cg_label: "Myelopathy, Focal Numbness"
      description: "A loss of the sensation of feeling in an area of the body."
      last_updated: 2026-08-17

    ncit:C349:
      d4cg_label: "Carmustine"
      description: "An anticancer drug that belongs to the family of drugs called alkylating agents."
      last_updated: 2026-08-17

    ncit:C34915:
      d4cg_label: "Pericarditis"
      description: "A disorder characterized by irritation to the layers of the pericardium (the protective sac around the heart)."
      last_updated: 2026-08-17

    ncit:C3500:
      d4cg_label: "Motor Neuropathy"
      description: "A disorder characterized by inflammation or degeneration of the peripheral motor nerves."
      last_updated: 2026-08-17

    ncit:C3501:
      d4cg_label: "Sensory Neuropathy"
      description: "A disorder characterized by inflammation or degeneration of the peripheral sensory nerves."
      last_updated: 2026-08-17

    ncit:C35040:
      d4cg_label: "Strabismus"
      description: "Strabismus is the intermittent or constant misalignment of an eye so that its line of vision is not pointed at the same object as the other eye. Strabismus is caused by an imbalance in the extraocular muscles which control the positioning of the eyes. Strabismus is normal in newborns but should resolve by the time the baby is 6 months old. In older children with strabismus, the brain may learn to ignore the input from one eye, and this may lead to amblyopia, a potentially permanent decrease in vision in that eye if not corrected."
      last_updated: 2026-08-17

    ncit:C35061:
      d4cg_label: "Supraventricular Tachycardia"
      description: "A disorder characterized by a dysrhythmia with a heart rate greater than 100 beats per minute that originates above the ventricles."
      last_updated: 2026-08-17

    ncit:C3507:
      d4cg_label: "Immunologic Disorder"
      description: "A disorder resulting from an abnormality in the immune system."
      last_updated: 2026-08-17

    ncit:C35117:
      d4cg_label: "Vascular Disorder"
      description: "A non-neoplastic or neoplastic disorder affecting the arteries, veins, or lymphatic vessels. Examples include vasculitis, thrombophlebitis, arteriosclerosis, lymphedema, hemangioma, and angiosarcoma."
      last_updated: 2026-08-17

    ncit:C3516:
      d4cg_label: "Bone Marrow Hypocellular"
      description: "A locally aggressive and destructive benign cystic neoplasm of the bone. It is characterized by the formation of multiloculated hemorrhagic cystic spaces which are separated by fibrous septa. It can arise from any bone, but usually affects the metaphysis of long bones.  It manifests with pain and swelling and may recur following curettage."
      last_updated: 2026-08-17

    ncit:C3517:
      d4cg_label: "Hodgkin lymphoma, Mixed Cellularity, NOS"
      description: "A subtype of classic Hodgkin lymphoma with scattered Reed-Sternberg and Hodgkin cells in a diffuse or vaguely nodular mixed inflammatory background without nodular sclerosing fibrosis. (WHO, 2008)"
      last_updated: 2026-08-17

    ncit:C3520:
      d4cg_label: "WHO, Version 4 >> Myeloid Sarcoma"
      description: "A malignant neoplasm composed of myeloblasts or immature myeloid cells. It occurs in extramedullary sites or the bone."
      last_updated: 2026-08-17

    ncit:C35219:
      d4cg_label: "Irregular Menstruation"
      description: "A disorder characterized by irregular cycle or duration of menses."
      last_updated: 2026-08-17

    ncit:C35417:
      d4cg_label: "Intrahepatic Bile Duct"
      description: "A carcinoma that arises from the intrahepatic bile duct epithelium in any site of the intrahepatic biliary tree. Grossly, the malignant lesions are solid, nodular, and grayish. Morphologically, the vast majority of cases are adenocarcinomas. Signs and symptoms include malaise, weight loss, right upper quadrant abdominal pain, and night sweats. Early detection is difficult and the prognosis is generally poor."
      last_updated: 2026-08-17

    ncit:C35524:
      d4cg_label: "Leukocytosis"
      description: "A disorder characterized by laboratory test results that indicate an increased number of white blood cells in the blood."
      last_updated: 2026-08-17

    ncit:C35571:
      d4cg_label: "System NOS >> Progressive Disease"
      description: "A clinical, pathologic, and/or molecular finding indicating that the course of a disease is worsening in terms of extent or severity."
      last_updated: 2026-08-17

    ncit:C35596:
      d4cg_label: "Dental Developmental Abnormality"
      description: "A disorder characterized by a pathological process of the teeth occurring during tooth development."
      last_updated: 2026-08-17

    ncit:C35665:
      d4cg_label: "Febrile Neutropenia"
      description: "A condition marked by fever and a lower-than-normal number of neutrophils in the blood. A neutrophil is a type of white blood cell that helps fight infection. Having too few neutrophils increases the risk of infection."
      last_updated: 2026-08-17

    ncit:C35682:
      d4cg_label: "Positive"
      description: "A laboratory test result that indicates that a specific disease, condition, or attribute being assessed is present."
      last_updated: 2026-08-17

    ncit:C35823:
      d4cg_label: "Spleen Disorder"
      description: "A disorder of the spleen."
      last_updated: 2026-08-17

    ncit:C35867:
      d4cg_label: "Morphology"
      description: "A light microscopic finding that describes the cellular characteristics and architectural patterns of cell populations in a tissue sample."
      last_updated: 2026-08-17

    ncit:C35870:
      d4cg_label: "Conventional Osteosarcoma"
      description: "A high grade malignant bone-forming mesenchymal neoplasm producing osteoid. The tumor arises from the medullary portion of the bone. It affects the long bones and most commonly, the distal femur, proximal tibia, and proximal humerus. Pain with or without a palpable mass is the most common clinical presentation. It usually has an aggressive growth and may metastasize through the hematogenous route. The lung is the most frequent site of metastasis."
      last_updated: 2026-08-17

    ncit:C36012:
      d4cg_label: "Nodular"
      description: "A benign or malignant neoplasm characterized by the formation of nodules by the proliferating neoplastic cells."
      last_updated: 2026-08-17

    ncit:C36029:
      d4cg_label: "Necrotic Tumor"
      description: "A neoplasm characterized by focal or diffuse tumor cell necrosis."
      last_updated: 2026-08-17

    ncit:C36075:
      d4cg_label: "Rosai-Dorfman Disease"
      description: "A rare histiocytic disorder of unknown etiology, characterized by distention of the lymph node sinuses and sinusoidal histiocytic infiltration. The histiocytes characteristically contain ingested lymphocytes and are S100 and CD68 positive, and CD1a negative. Patients present with cervical lymphadenopathy, fever, leukocytosis, and hypergammaglobulinemia. It can affect extranodal sites, including skin, bones, and the respiratory tract. It occurs in isolation or may be associated with autoimmune disorders or malignancies. Mutations in NRAS, KRAS, MAP2K1, and ARAF genes have been identified in affected tissues, suggesting a clonal origin in some cases. It is a self-limited disorder, although some patients may have a poor prognosis."
      last_updated: 2026-08-17

    ncit:C36292:
      d4cg_label: "result_text"
      description: "The outcome of a laboratory test."
      last_updated: 2026-08-17

    ncit:C36317:
      d4cg_label: "t(12;16)(q13;p11)"
      description: "A chromosomal translocation that involves chromosome 12 and chromosome 16. It is often associated with the development of angiomatoid fibrous histiocytoma or myxoid liposarcoma."
      last_updated: 2026-08-17

    ncit:C36319:
      d4cg_label: "t(8;14)(q24;q32) or other variant of B-ALL"
      description: "A chromosomal translocation that fuses 8q24 with 14q32. This juxtaposes the MYC gene with the promoter regions of the immunoglobulin heavy chain gene locus, which results in overexpression of Myc proto-oncogene protein in B-cells bearing the translocation."
      last_updated: 2026-08-17

    ncit:C36365:
      d4cg_label: "t(4;11)(q21;q23) / MLL-MLLT2(AF4)"
      description: "A chromosomal abnormality consisting of the translocation of 4q21 with 11q23.3."
      last_updated: 2026-08-17

    ncit:C36367:
      d4cg_label: "t(21;22)(q22;q12)"
      description: "A chromosomal translocation associated with Ewing Sarcoma/Peripheral Primitive Neuroectodermal Tumor and Olfactory Neuroblastoma."
      last_updated: 2026-08-17

    ncit:C36368:
      d4cg_label: "t(7;22)(p22;q12)"
      description: "A cytogenetic abnormality that refers to the translocation of the short arm (p22) of chromosome 7 and the long arm (q12) of chromosome 22."
      last_updated: 2026-08-17

    ncit:C36369:
      d4cg_label: "t(17;22)(q21;q12)"
      description: "A chromosomal translocation involving the ETV4 gene on chromosome 17q21 and the EWSR1 gene on chromosome 22q12."
      last_updated: 2026-08-17

    ncit:C36370:
      d4cg_label: "t(9;11)(p22;q23) / MLL-MLLT3(AF9)"
      description: "A cytogenetic abnormality that refers to the translocation of the short arm (p21.3) of chromosome 9 and the long arm (q23.3) of chromosome 11. It is associated with the development of acute myeloid leukemia with the MLLT3-MLL fusion gene transcript."
      last_updated: 2026-08-17

    ncit:C36371:
      d4cg_label: "t(11;19)(q23;p13.1)(MLL-ELL)"
      description: "A cytogenetic abnormality that refers to the translocation of the long arm (q23.3) of chromosome 11 and the short arm (p13.1) of chromosome 19. It is associated with the development of acute myeloid leukemia with variant MLL translocations and topoisomerase II inhibitor-related acute myeloid leukemia."
      last_updated: 2026-08-17

    ncit:C36372:
      d4cg_label: "t(11;19)(q23;p13.3)(MLL-ENL)"
      description: "A cytogenetic abnormality that refers to the translocation of the long arm (q23.3) of chromosome 11 and the short arm (p13.3) of chromosome 19. It is associated with KMT2A (MLL)/MLLT1 (ENL) fusions and acute myeloid leukemia."
      last_updated: 2026-08-17

    ncit:C36373:
      d4cg_label: "inv(16)(p13q22)"
      description: "A chromosomal inversion that involves chromosome 16. It is associated with the development of acute myeloid leukemia CBFB-MYH11, acute myelomonocytic leukemia with abnormal eosinophils, and granulocytic sarcoma."
      last_updated: 2026-08-17

    ncit:C36374:
      d4cg_label: "t(12;22)(q13;q12)"
      description: "A cytogenetic abnormality that refers to the a translocation involving the long arm (q13) of chromosome 12 and the long arm (q12) of chromosome 22."
      last_updated: 2026-08-17

    ncit:C36375:
      d4cg_label: "t(11;22)(p13;q12)"
      description: "A chromosomal translocation involving the WT1 gene on chromosome 11p31 and the EWSR1 gene on chromosome 22q12."
      last_updated: 2026-08-17

    ncit:C36392:
      d4cg_label: "t(X;17)(p11.2;q25)"
      description: "A chromosomal translocation involving the TFE3 gene on chromosome Xp11.2 and the ASPSCR1 gene on chromosome 17q25."
      last_updated: 2026-08-17

    ncit:C36393:
      d4cg_label: "t(9;17)(q22;q11)"
      description: "A chromosomal translocation involving the NR4A3 gene on chromosome 9q31 and the TAF15 gene on chromosome 17q12."
      last_updated: 2026-08-17

    ncit:C36396:
      d4cg_label: "Trisomy 8"
      description: "A chromosomal abnormality consisting of the presence of a third copy of chromosome 8 in somatic cells."
      last_updated: 2026-08-17

    ncit:C36406:
      d4cg_label: "t(3;3)(q21;q26.2)"
      description: "A cytogenetic abnormality that refers to the translocation where both breakpoints are on the long arm (q23.1 and q26.2) of chromosome 3. It is associated with acute myeloid leukemia."
      last_updated: 2026-08-17

    ncit:C36407:
      d4cg_label: "inv(3)(q21.3;q26.2)"
      description: "A cytogenetic abnormality that refers to a paracentric inversion involving breakpoints on the long arm of chromosome 3 (q23.1 and q26.2). It is associated with acute myeloid leukemia."
      last_updated: 2026-08-17

    ncit:C36411:
      d4cg_label: "Monosomy 7"
      description: "A chromosomal abnormality consisting of the absence of one of the copies of chromosome 7 in somatic cells."
      last_updated: 2026-08-17

    ncit:C36415:
      d4cg_label: "t(3;5)(q25;q34) / NPM1/MLF1"
      description: "A cytogenetic abnormality that refers to the translocation of the long arm (q25) of chromosome 3 and the long arm (q34) of chromosome 5. It is associated with the development of acute myeloid leukemia arising from myelodysplastic syndrome, acute myeloid leukemia with multilineage dysplasia, and acute myeloid leukemia with myelodysplasia-related changes."
      last_updated: 2026-08-17

    ncit:C36417:
      d4cg_label: "t(1;22)(RBM15-MKL1)"
      description: "A cytogenetic abnormality that refers to the translocation of the short arm (p13.3) of chromosome 1 and the long arm (q13.1) of chromosome 22. It is associated with RBM15/MRTFA (MKL1) fusions and acute megakaryocytic leukemia."
      last_updated: 2026-08-17

    ncit:C36425:
      d4cg_label: "Trisomy 3"
      description: "A chromosomal abnormality consisting of the presence of a third copy of chromosome 3 in somatic cells."
      last_updated: 2026-08-17

    ncit:C36439:
      d4cg_label: "Chromosome 2p Gain"
      description: "A cytogenetic abnormality that refers to the duplication of all or part of the short arm of chromosome 2."
      last_updated: 2026-08-17

    ncit:C36441:
      d4cg_label: "12q Gain"
      description: "A chromosomal aberration where there are 3 copies of the long arm of chromosome 12. This aberration is associated with 12q duplication syndrome."
      last_updated: 2026-08-17

    ncit:C36476:
      d4cg_label: "Trisomy 7"
      description: "A chromosomal abnormality consisting of the presence of a third copy of chromosome 7 in somatic cells."
      last_updated: 2026-08-17

    ncit:C36477:
      d4cg_label: "Isochromosome 17q"
      description: "A cytogenetic abnormality involving chromosome 17 that results from loss of the short arm and duplication of the long arm. This aberration is associated with a variety of neoplastic diseases, and is indicative of a poor prognosis for individuals with hematologic malignancies."
      last_updated: 2026-08-17

    ncit:C36480:
      d4cg_label: "Gain of Chromosome 20q"
      description: "A cytogenetic abnormality that refers to allelic gain of all or part of the chromosomal arm 20q."
      last_updated: 2026-08-17

    ncit:C36481:
      d4cg_label: "Gain of Chromosome 15q"
      description: "A cytogenetic abnormality that refers to allelic gain of all or part of the chromosomal arm 15q."
      last_updated: 2026-08-17

    ncit:C36482:
      d4cg_label: "1q Gain"
      description: "A cytogenetic abnormality that refers to allelic gain within the chromosomal arm 1q."
      last_updated: 2026-08-17

    ncit:C36483:
      d4cg_label: "Gain of Chromosome 9q"
      description: "A cytogenetic abnormality that refers to allelic gain of all or part of the chromosomal arm 9q."
      last_updated: 2026-08-17

    ncit:C36484:
      d4cg_label: "17q Gain"
      description: "A cytogenetic abnormality that refers to the duplication of all or part of the long arm of chromosome 17."
      last_updated: 2026-08-17

    ncit:C36488:
      d4cg_label: "8q Gain"
      description: "A chromosomal abnormality that refers to the gain of genetic material in the long arm of chromosome 8."
      last_updated: 2026-08-17

    ncit:C36490:
      d4cg_label: "Loss of Chromosome 14"
      description: "A cytogenetic abnormality that refers to loss of all or part of chromosome 14."
      last_updated: 2026-08-17

    ncit:C36491:
      d4cg_label: "Loss of Chromosome 22"
      description: "A cytogenetic abnormality that refers to loss of all or part of chromosome 22."
      last_updated: 2026-08-17

    ncit:C36497:
      d4cg_label: "Chromosome 13q Loss"
      description: "A cytogenetic abnormality that refers to the loss of all or part of the long arm of chromosome 13 (13q)."
      last_updated: 2026-08-17

    ncit:C36499:
      d4cg_label: "del(17p)"
      description: "A cytogenetic abnormality that refers to the loss of all or part of the short arm of chromosome 17 (17p)."
      last_updated: 2026-08-17

    ncit:C36501:
      d4cg_label: "Loss of Chromosome 1p"
      description: "A cytogenetic abnormality that refers to the loss of all or part of the short arm of chromosome 1 (1p). It has been described in gliomas, meningiomas, neuroblastomas, hepatocellular carcinomas, breast carcinomas, acinar prostate adenocarcinomas, pancreatic carcinomas, and adrenal gland adenomas."
      last_updated: 2026-08-17

    ncit:C36502:
      d4cg_label: "Loss of Chromosome 3p"
      description: "A cytogenetic abnormality that refers to the loss of all or part of the short arm of chromosome 3."
      last_updated: 2026-08-17

    ncit:C36515:
      d4cg_label: "16q Loss"
      description: "A cytogenetic abnormality that refers to the loss of all or part of the long arm of chromosome 16 (16q)."
      last_updated: 2026-08-17

    ncit:C36517:
      d4cg_label: "MLL Other Partner"
      description: "A chromosomal abnormality consisting of the translocation of genetic material from any one of several chromosomes to the 11q23.3 region, resulting in an MLL gene rearrangement."
      last_updated: 2026-08-17

    ncit:C36520:
      d4cg_label: "t(17;22)(q22;q13)"
      description: "A cytogenetic abnormality that refers to a chromosomal translocation involving the long arm (q22) of chromosome 17 and the long arm (q13) of chromosome 22. It is associated with the expression of COL1A1/PDGFB fusions and most if not all cases of dermatofibrosarcoma protuberans (DFSP)."
      last_updated: 2026-08-17

    ncit:C36523:
      d4cg_label: "Monosomy 5"
      description: "A cytogenetic aneuploidy abnormality that refers to the presence of one chromosome 5 only. It is associated with the development of refractory anemia with excess blasts, refractory anemia with multilineage dysplasia, and refractory anemia with multilineage dysplasia and ringed sideroblasts."
      last_updated: 2026-08-17

    ncit:C36530:
      d4cg_label: "Trisomy 4"
      description: "A chromosomal abnormality consisting of the presence of a third copy of chromosome 4 in somatic cells."
      last_updated: 2026-08-17

    ncit:C36532:
      d4cg_label: "t(6;9)(p23;q34) DEK/NUP214"
      description: "A cytogenetic abnormality that refers to the translocation of the short arm (p22.3) of chromosome 6 and the long arm (q34.1) of chromosome 9. It is associated with DEK/NUP214 fusions, acute myeloid leukemia and myelodysplastic syndromes."
      last_updated: 2026-08-17

    ncit:C36549:
      d4cg_label: "Chromosome 11 Loss"
      description: "A cytogenetic abnormality that refers to loss of all or part of chromosome 11."
      last_updated: 2026-08-17

    ncit:C36599:
      d4cg_label: "Loss of Chromosome Y"
      description: "A cytogenetic abnormality that refers to the loss of all or part of the sex-determining chromosome Y. It is associated with the development of the accelerated and blast phases of chronic myelogenous leukemia, BCR-ABL1 positive, and various types of carcinomas."
      last_updated: 2026-08-17

    ncit:C36610:
      d4cg_label: "t(6;11)(q27;q23) / MLL-MLLT4(AF6)"
      description: "A cytogenetic abnormality that refers to the translocation of the long arm (q27) of chromosome 6 and the long arm (q23) of chromosome 11. It is associated with the development of de novo acute myeloid leukemia."
      last_updated: 2026-08-17

    ncit:C36616:
      d4cg_label: "t(16;21)(p11;q22)"
      description: "A chromosomal translocation involving the FUS gene on chromosome 16p11 and the ERG gene on chromosome 21q22."
      last_updated: 2026-08-17

    ncit:C36633:
      d4cg_label: "Chromosome 6p Gain"
      description: "A chromosomal abnormality that refers to the gain of genetic material in the short arm of chromosome 6."
      last_updated: 2026-08-17

    ncit:C36641:
      d4cg_label: "MYC Amplification"
      description: "A molecular genetic abnormality indicating the presence of multiple copies of the MYC gene."
      last_updated: 2026-08-17

    ncit:C36659:
      d4cg_label: "CTNNB1 Variant"
      description: "A change in the nucleotide sequence of the CTNNB1 gene."
      last_updated: 2026-08-17

    ncit:C36673:
      d4cg_label: "MYCN Amplification"
      description: "A molecular genetic abnormality indicating the presence of multiple copies of the MYCN gene."
      last_updated: 2026-08-17

    ncit:C36675:
      d4cg_label: "MYCL Amplification"
      description: "A molecular genetic abnormality indicating the presence of multiple copies of the MYCL gene."
      last_updated: 2026-08-17

    ncit:C36681:
      d4cg_label: "MDM2 Amplification"
      description: "A molecular genetic abnormality indicating the presence of multiple copies of the MDM2 gene."
      last_updated: 2026-08-17

    ncit:C3696:
      d4cg_label: "Giant Cell Astrocytoma"
      description: "A benign, slowly growing tumor (WHO grade I) typically arising in the wall of the lateral ventricles and composed of large ganglioid astrocytes. It is the most common CNS neoplasm in patients with tuberous sclerosis complex and typically occurs during the first two decades of life. (WHO)"
      last_updated: 2026-08-17

    ncit:C3697:
      d4cg_label: "Myxopapillary Ependymoma"
      description: "A benign neoplasm of ependymal origin."
      last_updated: 2026-08-17

    ncit:C3698:
      d4cg_label: "Choroid Plexus Papilloma"
      description: "A benign neoplasm of the choroid plexus of the central nervous system."
      last_updated: 2026-08-17

    ncit:C3704:
      d4cg_label: "Dedifferentiated Liposarcoma"
      description: "An atypical lipomatous tumor/well differentiated liposarcoma that shows progression to a usually non-lipomatous, high grade sarcoma.  The non-lipomatous sarcoma component may be present in the primary lesion or at the site of recurrence."
      last_updated: 2026-08-17

    ncit:C3718:
      d4cg_label: "WAGR Syndrome"
      description: "A rare, genetic disorder that is present at birth and has two or more of the following symptoms: Wilms tumor (a type of kidney cancer); little or no iris (the colored part of the eye); defects in the sexual organs and urinary tract (the organs that make urine and pass it from the body); and below average mental ability. This syndrome occurs when part of chromosome 11 is missing."
      last_updated: 2026-08-17

    ncit:C3720:
      d4cg_label: "Anaplastic Large Cell Lymphoma"
      description: "A peripheral (mature) T-cell lymphoma, consisting of usually large anaplastic, CD30 positive cells. The majority of cases are positive for the anaplastic large cell lymphoma (ALK) protein. The most frequently seen genetic alteration is a t(2;5) translocation. Majority of patients present with advanced disease. The most important prognostic indicator is ALK positivity, which has been associated with a favorable prognosis. (WHO, 2001)"
      last_updated: 2026-08-17

    ncit:C37249:
      d4cg_label: "t(2;22)(q33;q12)"
      description: "A chromosomal translocation involving the CREB1 gene on chromosome 2q33 and the EWSR1 gene on chromosome 22q12."
      last_updated: 2026-08-17

    ncit:C3728:
      d4cg_label: "Hepatoblastoma (HB)"
      description: "A malignant embryonal neoplasm that arises from the liver. It occurs almost exclusively in infants, although isolated cases in older children and adults have been reported. Microscopically,  it consists of either epithelial or epithelial and mesenchymal components."
      last_updated: 2026-08-17

    ncit:C3729:
      d4cg_label: "Mixed Tumor NOS, Malignant"
      description: "A malignant neoplasm composed of a carcinomatous epithelial component and a sarcomatous mesenchymal component. Representative examples include malignant mixed mesodermal (Mullerian) tumor of the female reproductive system and carcinosarcoma of the salivary gland and the lung."
      last_updated: 2026-08-17

    ncit:C37312:
      d4cg_label: "Loss of Chromosome 11q"
      description: "A cytogenetic abnormality that refers to the loss of all or part of the long arm of chromosome 11 (11q)."
      last_updated: 2026-08-17

    ncit:C3745:
      d4cg_label: "Clear Cell Sarcoma Of Soft Tissue"
      description: "A rare malignant neoplasm with melanocytic differentiation characterized by the presence of polygonal or spindle shaped clear cells. This sarcoma usually affects the tendons and aponeuroses and is associated with a poor prognosis due to recurrences and metastases."
      last_updated: 2026-08-17

    ncit:C3750:
      d4cg_label: "Alveolar Soft-Part Sarcoma"
      description: "A rare malignant neoplasm characterized by the presence of large epithelioid cells with abundant cytoplasm forming nests and pseudoalveolar structures. The groups of the epithelioid cells are separated by thin-walled sinusoidal spaces. It occurs most often in adolescents and young adults. In adults the most common sites of involvement are the extremities, and in infants and children, the head and neck. It usually presents as a slowly growing mass and it frequently metastasizes to other anatomic sites. The most common sites of metastasis are the lungs, bone, and brain."
      last_updated: 2026-08-17

    ncit:C3752:
      d4cg_label: "Embryonal Carcinoma"
      description: "A non-seminomatous malignant germ cell neoplasm of the testis or ovary."
      last_updated: 2026-08-17

    ncit:C3753:
      d4cg_label: "Germinoma"
      description: "A malignant germ cell tumor arising in the central nervous system. It is characterized by the presence of primitive, large malignant germ cells and lymphocytes."
      last_updated: 2026-08-17

    ncit:C3754:
      d4cg_label: "Gonadoblastoma"
      description: "A mixed germ cell/sex cord-stromal tumor characterized by the presence of large germ cells that resemble seminoma cells and small cells that resemble Sertoli or granulosa cells. It occurs in the testis and the ovary, and is identified in children and adults. It is often associated with gonadal dysgenesis and abnormal karyotype."
      last_updated: 2026-08-17

    ncit:C376:
      d4cg_label: "Cisplatin"
      description: "A drug used to treat many types of cancer. Cisplatin contains the metal platinum. It kills cancer cells by damaging their DNA and stopping them from dividing. Cisplatin is a type of alkylating agent."
      last_updated: 2026-08-17

    ncit:C37865:
      d4cg_label: "Trisomy 17"
      description: "A chromosomal abnormality consisting of the presence of a third copy of chromosome 17 in somatic cells."
      last_updated: 2026-08-17

    ncit:C3788:
      d4cg_label: "Ganglioglioma"
      description: "A well differentiated, slow growing neuroepithelial neoplasm composed of neoplastic, mature ganglion cells and neoplastic glial cells. Some gangliogliomas show anaplastic features in their glial component and are considered to be WHO grade III. Rare cases of newly diagnosed gangliogliomas with grade IV (glioblastoma) changes in the glial component have also been reported. (Adapted from WHO)"
      last_updated: 2026-08-17

    ncit:C3791:
      d4cg_label: "Central Neurocytoma"
      description: "An intraventricular neuronal neoplasm composed of uniform round cells with neuronal differentiation. It is typically located in the lateral ventricles in the region of the foramen of Monro. It generally affects young adults and has a favorable prognosis. (Adapted from WHO)"
      last_updated: 2026-08-17

    ncit:C37941:
      d4cg_label: "Double Vision"
      description: "Perception of a single object as two images."
      last_updated: 2026-08-17

    ncit:C37964:
      d4cg_label: "Hematemesis"
      description: "Vomiting blood."
      last_updated: 2026-08-17

    ncit:C37965:
      d4cg_label: "Hemolysis"
      description: "A disorder characterized by laboratory test results that indicate widespread erythrocyte cell membrane destruction."
      last_updated: 2026-08-17

    ncit:C3798:
      d4cg_label: "Malignant Peripheral Nerve Sheath Tumor"
      description: "A malignant neoplasm, originating from the sheaths of the peripheral nerve."
      last_updated: 2026-08-17

    ncit:C37987:
      d4cg_label: "Alive"
      description: "Living; showing characteristics of life."
      last_updated: 2026-08-17

    ncit:C3800:
      d4cg_label: "Epithelioid Haemangioendothelioma"
      description: "A low-grade malignant blood vessel neoplasm characterized by the presence of epithelioid endothelial cells. The neoplastic cells are arranged in cords and nests that are embedded in a myxoid to hyalinized stroma."
      last_updated: 2026-08-17

    ncit:C38012:
      d4cg_label: "Proteinuria"
      description: "A disorder characterized by laboratory test results that indicate the presence of excessive protein in the urine. It is predominantly albumin, but also globulin."
      last_updated: 2026-08-17

    ncit:C38014:
      d4cg_label: "Refractory"
      description: "In medicine, describes a disease or condition that does not respond to treatment."
      last_updated: 2026-08-17

    ncit:C38020:
      d4cg_label: "Shortening Fraction"
      description: "The fraction of the left ventricle diastolic dimension that is lost during systole; the measurement is calculated using the following formula: (end-diastolic dimension - end-systolic dimension) / end-diastolic dimension; the quotient is then multiplied by one hundred to be expressed as a percent."
      last_updated: 2026-08-17

    ncit:C38037:
      d4cg_label: "Total Bilirubin"
      description: "A measurement of the total bilirubin in a biological specimen."
      last_updated: 2026-08-17

    ncit:C38043:
      d4cg_label: "Typhlitis"
      description: "A disorder characterized by inflammation of the cecum."
      last_updated: 2026-08-17

    ncit:C38057:
      d4cg_label: "Vertigo"
      description: "A disorder characterized by a sensation as if the external world were revolving around the patient (objective vertigo) or as if he himself were revolving in space (subjective vertigo)."
      last_updated: 2026-08-17

    ncit:C38060:
      d4cg_label: "Exam"
      description: "A test performed by an ophthalmologist or optometrist assessing vision and ability to focus on and discern objects, as well as other tests and examinations pertaining to the eyes."
      last_updated: 2026-08-17

    ncit:C38081:
      d4cg_label: "Pulmonary Function Test"
      description: "A broad range of tests that are performed to assess how well lungs inhale and exhale air and how efficiently they transfer oxygen into the blood."
      last_updated: 2026-08-17

    ncit:C38083:
      d4cg_label: "DLCO"
      description: "A measurement of carbon monoxide (CO) transfer from inspired gas to pulmonary capillary blood. During the test, the subject inspires a gas containing CO and one or more tracer gases to allow determination of the gas exchanging capability of the lungs."
      last_updated: 2026-08-17

    ncit:C38084:
      d4cg_label: "FEV1"
      description: "A test of lung function, the FEV1 is the volume exhaled during the first second of a forced expiratory maneuver started from the level of total lung capacity. It is the most frequently used index for assessing bronchoconstriction or bronchodilatation."
      last_updated: 2026-08-17

    ncit:C38087:
      d4cg_label: "Gallium Scan"
      description: "A nuclear imaging procedure in which an isotope of gallium is used as the radiopharmaceutical. Gallium binds to transferrin, leukocyte lactoferrin, bacterial siderophores and inflammatory proteins and thereby can be used to localize foci of infection. It is also taken up by several tumors, thus gallium scintigraphy can be used for the staging of tumors."
      last_updated: 2026-08-17

    ncit:C38101:
      d4cg_label: "X-Ray"
      description: "A radiographic procedure using the emission of x-rays to form an image of the structure penetrated by the radiation."
      last_updated: 2026-08-17

    ncit:C38155:
      d4cg_label: "Relapse"
      description: "The return of a disease after a period of remission."
      last_updated: 2026-08-17

    ncit:C38222:
      d4cg_label: "Intraarterial"
      description: "Administration within an artery or arteries. (FDA)"
      last_updated: 2026-08-17

    ncit:C38276:
      d4cg_label: "Intravenously"
      description: "Administration of a drug within or into a vein or veins. Introduction of the drug directly into venous circulation results in 100% bioavailability due to an absence of the absorption phase, provides a precise and continuous mode of drug therapy, especially for drugs with a narrow therapeutic index."
      last_updated: 2026-08-17

    ncit:C38280:
      d4cg_label: "Intravitreal"
      description: "Administration of a medicinal product into the rear chamber of the eye."
      last_updated: 2026-08-17

    ncit:C38291:
      d4cg_label: "Parenteral"
      description: "Administration by injection, infusion, or implantation. (FDA)"
      last_updated: 2026-08-17

    ncit:C3836:
      d4cg_label: "Fertility Disorder"
      description: "Inability to conceive for at least one year after trying and having unprotected sex. Causes of female infertility include endometriosis, fallopian tubes obstruction, and polycystic ovary syndrome. Causes of male infertility include abnormal sperm production or function, blockage of the epididymis, blockage of the ejaculatory ducts and hypospadias."
      last_updated: 2026-08-17

    ncit:C38362:
      d4cg_label: "RUNX1 Mutation"
      description: "A change in the nucleotide sequence of the RUNX1 gene."
      last_updated: 2026-08-17

    ncit:C38372:
      d4cg_label: "CEBPA Variant"
      description: "Mutation of the CEBPA gene encoding CCAAT/enhancer binding protein alpha. It is seen in acute myeloid leukemias usually associated with a normal karyotype."
      last_updated: 2026-08-17

    ncit:C38655:
      d4cg_label: "bulky_disease"
      description: "The presence of a large mass or matted lymph nodes in an imaging study. This term almost always refers to lymphomas and its definition depends on the histological type of lymphoma. Generally, a tumor mass measuring more than 7 cm or more than 10 cm in diameter is considered bulky disease."
      last_updated: 2026-08-17

    ncit:C38692:
      d4cg_label: "Pertuzumab"
      description: "A humanized recombinant monoclonal antibody directed against the extracellular dimerization domain of the HER-2 tyrosine kinase receptor. Binding of the antibody to the dimerization domain of the HER-2 tyrosine kinase receptor protein directly inhibits the ability of the HER-2 tyrosine kinase receptor protein (the most common pairing partner) to dimerize with other HER tyrosine kinase receptor proteins; inhibiting receptor protein dimerization prevents the activation of HER signaling pathways, resulting in tumor cell apoptosis. (NCI04)"
      last_updated: 2026-08-17

    ncit:C38713:
      d4cg_label: "Dasatinib"
      description: "A drug used to treat certain types of chronic myeloid leukemia and acute lymphoblastic leukemia. BMS-354825 is also being studied in the treatment of certain other blood diseases and types of cancer. BMS-354825 binds to and blocks BCR-ABL and other proteins that help cancer cells grow. It is a type of tyrosine kinase inhibitor."
      last_updated: 2026-08-17

    ncit:C38717:
      d4cg_label: "Anakinra"
      description: "A recombinant human nonglycosylated interleukin-1 (IL-1) receptor antagonist with potential antineoplastic activity. Anakinra binds to the IL-1 receptor, thereby blocking the binding of the IL-1 to and activation of its receptor. Blockade of IL-1 activity may inhibit the cascade of downstream pro-angiogenic factors such as vascular endothelial cell growth factor, tumor necrosis factor-alpha, and IL-6, resulting in inhibition of tumor angiogenesis. (NCI04)"
      last_updated: 2026-08-17

    ncit:C3875:
      d4cg_label: "Spinal Ependymoma"
      description: "An ependymoma that arises from the spinal cord."
      last_updated: 2026-08-17

    ncit:C38757:
      d4cg_label: "Negative"
      description: "A finding of normality following an examination or investigation looking for the presence of a microorganism, disease, or condition."
      last_updated: 2026-08-17

    ncit:C38758:
      d4cg_label: "Positive"
      description: "A finding of abnormality following an examination or observation confirming something, such as the presence of a disease, condition, or microorganism."
      last_updated: 2026-08-17

    ncit:C38896:
      d4cg_label: "CD20"
      description: "B-lymphocyte antigen CD20 (297 aa, ~33 kDa) is encoded by the human MS4A1 gene. This protein plays a role in both the activation and proliferation of B-cells."
      last_updated: 2026-08-17

    ncit:C38906:
      d4cg_label: "CD30"
      description: "Tumor necrosis factor receptor superfamily member 8 (595 aa, ~ 64 kDa) is encoded by the human TNFRSF8 gene. This protein is involved in ligand-mediated signal transduction, the positive regulation of apoptosis and the inhibition of cell proliferation."
      last_updated: 2026-08-17

    ncit:C3897:
      d4cg_label: "Isochromosome"
      description: "An abnormal chromosome with identical arms, formed by transverse splitting of the centromere during chromosomal replication."
      last_updated: 2026-08-17

    ncit:C3910:
      d4cg_label: "alteration"
      description: "A molecular or cytogenetic abnormality which occurs in either human disease states or disease models."
      last_updated: 2026-08-17

    ncit:C39293:
      d4cg_label: "Helicobacter Pylori Infection"
      description: "A bacterial infection of the stomach, caused by Helicobacter pylori.  It is associated with the development of peptic ulcer and mucosa-associated lymphoid tissue lymphoma."
      last_updated: 2026-08-17

    ncit:C39315:
      d4cg_label: "AJCC"
      description: "A group formed for the purpose of developing a system of clinical staging for cancer that is acceptable to the American medical profession and is compatible with other accepted classifications."
      last_updated: 2026-08-17

    ncit:C39353:
      d4cg_label: "COG"
      description: "An NCI-supported clinical cooperative group formed by the merger of the four national pediatric cancer research organizations: the Children's Cancer Group, the Intergroup Rhabdomyosarcoma Study Group, the National Wilms Tumor Study Group, and the Pediatric Oncology Group. The primary objective of the organization is to conduct clinical trials of new therapies for childhood and adolescent cancer. COG develops and coordinates clinical trials conducted at the 238 member institutions that include cancer centers of all major universities and teaching hospitals throughout the U.S. and Canada, as well as sites in Europe and Australia. COG members include over 5000 cancer researchers."
      last_updated: 2026-08-17

    ncit:C39510:
      d4cg_label: "SJCRH"
      description: "The St. Jude Children's Research Hospital received its NCI designation in 1977 and was awarded status as a comprehensive cancer center by NCI in 2008. Research is focused specifically on childhood cancers, acquired and inherited immunodeficiencies and genetic disorders."
      last_updated: 2026-08-17

    ncit:C39536:
      d4cg_label: "Therapeutic Trial"
      description: "A clinical study that involves administering of exposure to the agent/agents to subjects with particular disease to elucidate the most appropriate treatment for a specific medical condition, or to prolong or improve the patient's life."
      last_updated: 2026-08-17

    ncit:C39594:
      d4cg_label: "Rashes"
      description: "An eruption in the skin which affects its appearance and/or texture."
      last_updated: 2026-08-17

    ncit:C39712:
      d4cg_label: "CKIT Mutation - Unspecified"
      description: "A molecular genetic abnormality that refers to mutation of the c-kit (CD117) proto-oncogene. It is associated with the development of gastrointestinal stromal tumor and gastrointestinal autonomic nerve tumor. It has also been described in acute myeloid leukemias, dysgerminomas, and seminomas."
      last_updated: 2026-08-17

    ncit:C39750:
      d4cg_label: "Glioblastoma, IDH-Wildtype"
      description: "A glioblastoma that arises de novo. It is more commonly seen in older patients. Mutations in IDH1 or IDH2 genes are not present."
      last_updated: 2026-08-17

    ncit:C39765:
      d4cg_label: "Gadolinium"
      description: "A metal element that is used in magnetic resonance imaging (MRI) and other imaging methods. It is a contrast agent, which helps show abnormal tissue in the body during imaging with a special machine."
      last_updated: 2026-08-17

    ncit:C39795:
      d4cg_label: "Chromosome 14q Loss"
      description: "A cytogenetic abnormality that refers to the loss of all or part of the long arm of chromosome 14 (14q)."
      last_updated: 2026-08-17

    ncit:C4020:
      d4cg_label: "Fibroblastic Osteosarcoma"
      description: "A conventional osteosarcoma characterized by the presence of spindle shaped cells."
      last_updated: 2026-08-17

    ncit:C40392:
      d4cg_label: "Myoepithelioma"
      description: "A benign or malignant tumor characterized by the presence of cells that show myoepithelial differentiation. Based on its morphologic features, it is classified as benign or malignant. A representative example of benign myoepithelioma is benign salivary gland myoepithelioma. Representative examples of malignant myoepithelioma or myoepithelial carcinoma are malignant breast myoepithelioma and salivary gland myoepithelial carcinoma."
      last_updated: 2026-08-17

    ncit:C40412:
      d4cg_label: "Ineligible"
      description: "The state or quality of being disqualified by law, rule, or provision."
      last_updated: 2026-08-17

    ncit:C40428:
      d4cg_label: "Electron"
      description: "A fundamental particle with a negative charge."
      last_updated: 2026-08-17

    ncit:C405:
      d4cg_label: "Cyclophosphamide"
      description: "A drug that is used to treat many types of cancer and is being studied in the treatment of other types of cancer. It is also used to treat some types of kidney disease in children. Cyclophosphamide attaches to DNA in cells and may kill cancer cells. It is a type of alkylating agent."
      last_updated: 2026-08-17

    ncit:C4050:
      d4cg_label: "Oligoastrocytoma"
      description: "A WHO grade 2 tumor composed of a conspicuous mixture of two distinct neoplastic cell types morphologically resembling the tumor cells in oligodendroglioma and diffuse astrocytoma. (WHO)"
      last_updated: 2026-08-17

    ncit:C408:
      d4cg_label: "Cytarabine"
      description: "A drug used to treat certain types of leukemia and prevent the spread of leukemia to the meninges (three thin layers of tissue that cover and protect the brain and spinal cord). It is also being studied in the treatment of other types of cancer. Cytarabine blocks tumor growth by stopping DNA synthesis. It is a type of antimetabolite."
      last_updated: 2026-08-17

    ncit:C4086:
      d4cg_label: "dysplasia"
      description: "A usually neoplastic transformation of the cell, associated with altered architectural tissue patterns. The cellular changes include nuclear and cytoplasmic abnormalities. Molecular genetic abnormalities are also often found and, in some instances, may lead to cancer."
      last_updated: 2026-08-17

    ncit:C40971:
      d4cg_label: "EUA"
      description: "A medical inspection, qualified according to the methods employed, as physical examination, radiologic examination, diagnostic imaging examination, etc., performed under conditions of patient's complete or partial local or general insensibility to pain with or without the loss of consciousness, induced by an anesthetic agent or by non-pharmacological anesthesia technique."
      last_updated: 2026-08-17

    ncit:C41067:
      d4cg_label: "Whole Blood"
      description: "Blood that has not been separated into its various components; blood that has not been modified except for the addition of an anticoagulant."
      last_updated: 2026-08-17

    ncit:C411:
      d4cg_label: "Dacarbazine"
      description: "A drug that is used to treat Hodgkin lymphoma and malignant melanoma and is being studied in the treatment of other types of cancer. It attaches to DNA in cells and may kill cancer cells. It is a type of alkylating agent."
      last_updated: 2026-08-17

    ncit:C41132:
      d4cg_label: "None"
      description: "No person or thing, nobody, not any."
      last_updated: 2026-08-17

    ncit:C41140:
      d4cg_label: "ms"
      description: "A unit of time equal to one thousandth of a second (10E-3 second)."
      last_updated: 2026-08-17

    ncit:C41189:
      d4cg_label: "Subject"
      description: "A matter or an individual that is observed, analyzed, examined, investigated, experimented upon, or/and treated in the course of a particular study."
      last_updated: 2026-08-17

    ncit:C41206:
      d4cg_label: "Institutional Study"
      description: "An established society, corporation, foundation or other organization founded and united for a specific purpose, e.g. for health-related research; also used to refer to a building or buildings occupied or used by such organization."
      last_updated: 2026-08-17

    ncit:C41219:
      d4cg_label: "Native Hawaiian or Other Pacific Islander"
      description: "Denotes a person having origins in any of the original peoples of Hawaii, Guam, Samoa, or other Pacific Islands. The term covers particularly people who identify themselves as part-Hawaiian, Native Hawaiian, Guamanian or Chamorro, Carolinian, Samoan, Chuu. (FDA)"
      last_updated: 2026-08-17

    ncit:C41222:
      d4cg_label: "Not Hispanic or Latino"
      description: "A person not of Cuban, Mexican, Puerto Rican, South or Central American, or other Spanish culture or origin, regardless of race."
      last_updated: 2026-08-17

    ncit:C41227:
      d4cg_label: "margins"
      description: "One of the criteria for assessment of the effectiveness of given surgical procedure in achieving the local control of a neoplasm and the adequacy of tumor removal. It is defined by the tissue plane through which the dissection has been done and the actual or potential neoplastic tissue which has been left outside the boundary of a resected specimen within the patient. There are four types of surgical margins: intracapsular or intralesional, marginal, wide, and radical."
      last_updated: 2026-08-17

    ncit:C41259:
      d4cg_label: "American Indian or Alaska Native"
      description: "A person having origins in any of the original peoples of North and South America (including Central America), and who maintains tribal affiliation or community attachment. (FDA)"
      last_updated: 2026-08-17

    ncit:C41260:
      d4cg_label: "Asian"
      description: "A person having origins in any of the original peoples of the Far East, Southeast Asia, or the Indian subcontinent including, for example, Cambodia, China, India, Japan, Korea, Malaysia, Pakistan, the Philippine Islands, Thailand, and Vietnam. (FDA)"
      last_updated: 2026-08-17

    ncit:C41261:
      d4cg_label: "White"
      description: "Denotes a person with European, Middle Eastern, or North African ancestral origin who identifies, or is identified, as White. (FDA)"
      last_updated: 2026-08-17

    ncit:C41331:
      d4cg_label: "adverse_event"
      description: "An unexpected medical problem that happens during treatment with a drug or other therapy. Adverse effects do not have to be caused by the drug or therapy, and they may be mild, moderate, or severe."
      last_updated: 2026-08-17

    ncit:C41333:
      d4cg_label: "Expected"
      description: "Any adverse event associated with a medical product or procedure, whose nature and severity have been previously observed, identified in nature, severity, or frequency, and documented in the investigator brochure, investigational plan, protocol, current consent form, scientific publication, or in other relevant and reliable document. The old term Side Effect is retired and should not be used."
      last_updated: 2026-08-17

    ncit:C41334:
      d4cg_label: "Unexpected"
      description: "An adverse reaction, whose nature, severity, specificity, or outcome is not consistent with the term or description used in the applicable product information. [ICH E2] See also adverse drug reaction."
      last_updated: 2026-08-17

    ncit:C41337:
      d4cg_label: "System NOS >> Grade 4"
      description: "An adverse event, and/or its immediate sequelae, which is associated with an imminent risk of death or which is associated with physical or mental disabilities that affect or limit the ability of a person to perform activities of daily living (eating, ambulation, toileting, etc.) See NCI Common Terminology Criteria for Adverse Events."
      last_updated: 2026-08-17

    ncit:C41338:
      d4cg_label: "System NOS >> Grade 1"
      description: "A type of adverse event that is usually transient and may require only minimal treatment or therapeutic intervention. The event does not generally interfere with usual activities of daily living."
      last_updated: 2026-08-17

    ncit:C41339:
      d4cg_label: "System NOS >> Grade 2"
      description: "A type of adverse event that is usually alleviated with additional specific therapeutic intervention. The event interferes with usual activities of daily living, causing discomfort but poses no significant or permanent risk of harm to the research participant."
      last_updated: 2026-08-17

    ncit:C41340:
      d4cg_label: "System NOS >> Grade 3"
      description: "A type of adverse event that interrupts usual activities of daily living, or significantly affects clinical status, or may require intensive therapeutic intervention."
      last_updated: 2026-08-17

    ncit:C41357:
      d4cg_label: "Probable"
      description: "Probable adverse event relationship to study product or procedure is defined when there is a clear-cut temporal association between product or procedure administration and adverse event, and a potential alternative etiology of the event is not apparent."
      last_updated: 2026-08-17

    ncit:C41358:
      d4cg_label: "attribution"
      description: "A specific identifiable level (defined qualitatively or quantitatively) of probability of adverse event being caused or associated with the product or procedure administration to a patient."
      last_updated: 2026-08-17

    ncit:C41361:
      d4cg_label: "K-RAS Mutation"
      description: "A change in the nucleotide sequence of the KRAS gene."
      last_updated: 2026-08-17

    ncit:C41381:
      d4cg_label: "N-RAS Mutation"
      description: "A change in the nucleotide sequence of the NRAS gene."
      last_updated: 2026-08-17

    ncit:C414:
      d4cg_label: "Danazol"
      description: "A synthetic androgen derived from ethinyl testosterone.  Danazol indirectly reduces estrogen production by decreasing pituitary secretion of follicle-stimulating hormone and luteinizing hormone, and binds to sex hormone receptors in target tissues, thereby exhibiting antiestrogenic, anabolic and weakly androgenic effects. (NCI04)"
      last_updated: 2026-08-17

    ncit:C41438:
      d4cg_label: "Undifferentiated"
      description: "Sex could not be determined; not uniquely defined; undifferentiated."
      last_updated: 2026-08-17

    ncit:C41527:
      d4cg_label: "Familial Platelet Disorder and AML Syndrome"
      description: "Androgen Activity Induction involves initiation of the biological function of biochemical substances (androgens) secreted by the testes that have a specific regulatory effect on the activity of cells involved in development and maintenance of male sex characteristics."
      last_updated: 2026-08-17

    ncit:C41834:
      d4cg_label: "Pineal Tumors"
      description: "The tissue of the pineal gland. The pineal gland is a small reddish-gray body, about 8 mm. in length which lies in the depression between the superior colliculi. It is attached to the roof of the third ventricle near its junction with the mid-brain. It develops as an outgrowth from the third ventricle of the brain. The pineal parenchyma consists of follicles lined by epithelium and enveloped by connective tissues. It produces and secretes melatonin."
      last_updated: 2026-08-17

    ncit:C42057:
      d4cg_label: "Ganglioneuroblastoma, Intermixed (Schwannian Stroma-Rich)"
      description: "A ganglioneuroblastoma characterized by the presence of neuroblastic cells in a Schwannian stroma, without the presence of hemorrhagic neuroblastic nodules."
      last_updated: 2026-08-17

    ncit:C42058:
      d4cg_label: "Ganglioneuroblastoma, Nodular (Composite)"
      description: "A ganglioneuroblastoma characterized by the presence of neuroblastic cells in a Schwannian stroma, and the formation of hemorrhagic neuroblastic nodules."
      last_updated: 2026-08-17

    ncit:C42064:
      d4cg_label: "Ganglioneuroma (Schwannian Stroma-Dominant), Maturing Subtype"
      description: "A ganglioneuroma characterized by the presence of differentiating neuroblasts, maturing and mature ganglion cells."
      last_updated: 2026-08-17

    ncit:C422:
      d4cg_label: "Dexamethasone"
      description: "A synthetic adrenal corticosteroid with potent anti-inflammatory properties. In addition to binding to specific nuclear steroid receptors, dexamethasone also interferes with NF-kB activation and apoptotic pathways. This agent lacks the salt-retaining properties of other related adrenal hormones. (NCI04)"
      last_updated: 2026-08-17

    ncit:C4221:
      d4cg_label: "Malignant Glomus Tumor"
      description: "A very rare morphologic variant of glomus tumor with a size greater than 2 cm.  The tumor arises in subfascial or visceral tissues. It is characterized by the presence of atypical mitotic figures, or marked nuclear atypia, or the combination of both.  It has an aggressive clinical course."
      last_updated: 2026-08-17

    ncit:C424:
      d4cg_label: "Heroin"
      description: "A substance made from morphine. Heroin is very addictive and it is illegal to use or sell it in the United States. It is a type of opiate."
      last_updated: 2026-08-17

    ncit:C4246:
      d4cg_label: "Atypical Fibroxanthoma"
      description: "An intermediate cutaneous mesenchymal neoplasm of uncertain differentiation, usually affecting the actinic-damaged skin of the elderly.  The tumor presents as a single cutaneous nodule which is often ulcerated.  Microscopically, it is characterized by the presence of highly atypical cytologic features, pleomorphism and abundant mitotic figures. The vast majority of patients have an excellent prognosis following conservative therapy. Recurrences are infrequent, and metastasis is rare."
      last_updated: 2026-08-17

    ncit:C4247:
      d4cg_label: "Undifferentiated Pleomorphic Sarcoma"
      description: "A malignant neoplasm composed of a fibroblastic and a histiocytic component."
      last_updated: 2026-08-17

    ncit:C42569:
      d4cg_label: "m2"
      description: "A SI unit of area measurement equal to a square whose sides are one meter long. Square meter is equal to 10,000 square centimeters; 0.01 are; 1.196 square yards; 10.76 square feet; 1550 square inches."
      last_updated: 2026-08-17

    ncit:C42602:
      d4cg_label: "Suprasellar/Neurohypophyseal"
      description: "The area above or over the sella turcica."
      last_updated: 2026-08-17

    ncit:C4286:
      d4cg_label: "Immature Teratoma"
      description: "A rare type of malignant (cancer) germ cell tumor (type of tumor that begins in the cells that give rise to sperm or eggs) that often contains several different types of tissue such as hair, muscle, and bone."
      last_updated: 2026-08-17

    ncit:C4287:
      d4cg_label: "Malignant Teratoma"
      description: "A malignant germ-cell neoplasm derived from pluripotent cells and consisting of components from one or more of the three germ-cell layers."
      last_updated: 2026-08-17

    ncit:C4290:
      d4cg_label: "Mixed Germ Cell Tumor"
      description: "A malignant germ cell tumor characterized by the presence of at least two different germ cell tumor components. The different germ cell tumor components include choriocarcinoma, embryonal carcinoma, yolk sac tumor, teratoma, and seminoma. It occurs in the ovary, testis, and extragonadal sites including central nervous system and mediastinum."
      last_updated: 2026-08-17

    ncit:C43223:
      d4cg_label: "mlds"
      description: "Acute myeloid leukemia occurring in children with Down syndrome. During the first 3 years of life, it is usually the megakaryoblastic subtype, and is associated with GATA1 gene mutation. After age 4 this is no longer the case."
      last_updated: 2026-08-17

    ncit:C432234:
      d4cg_label: "Not Reported"
      description: ""
      last_updated: 2026-08-17

    ncit:C43224:
      d4cg_label: "Trisomy 21"
      description: "A chromosomal abnormality consisting of the presence of a third copy of chromosome 21 in somatic cells."
      last_updated: 2026-08-17

    ncit:C43234:
      d4cg_label: "Not Reported"
      description: "Not provided or available."
      last_updated: 2026-08-17

    ncit:C4324:
      d4cg_label: "Astroblastoma, MN1-Altered"
      description: "A rare glial neoplasm characterized by structural rearrangements of the MN1 gene at chromosome band 22q12.1. It is usually found in the cerebral hemispheres of young adults and children and predominantly affects females. Morphologically, it consists of elongated glial cells with abundant eosinophilic cytoplasm and GFAP-positive processes, arranged perivascularly."
      last_updated: 2026-08-17

    ncit:C43248:
      d4cg_label: "Hyperreflexia"
      description: "Autonomic nervous system overreaction to stimuli, most commonly after spinal cord injury at a T-5 level and above."
      last_updated: 2026-08-17

    ncit:C4326:
      d4cg_label: "Anaplastic Oligodendroglioma"
      description: "A WHO grade 3 oligodendroglioma with focal or diffuse malignant morphologic features (prominent nuclear pleomorphism, mitoses, and increased cellularity)."
      last_updated: 2026-08-17

    ncit:C43292:
      d4cg_label: "RECQL2 mutation"
      description: "A change in the nucleotide sequence of the WRN gene."
      last_updated: 2026-08-17

    ncit:C43324:
      d4cg_label: "Peutz-Jeghers Syndrome"
      description: "A neoplasm involving the outer hair sheath and infundibulum."
      last_updated: 2026-08-17

    ncit:C4335:
      d4cg_label: "Malignant Triton Tumor"
      description: "A malignant peripheral nerve sheath tumor which shows rhabdomyosarcomatous differentiation. More than half of the patients have neurofibromatosis type 1. The prognosis is usually poor."
      last_updated: 2026-08-17

    ncit:C4336:
      d4cg_label: "Malignant Granular Cell Tumor"
      description: "A malignant neoplasm, comprised of large cells with cytoplasmatic granules, occurring in various organs/tissues."
      last_updated: 2026-08-17

    ncit:C43362:
      d4cg_label: "Anus"
      description: "Orifice at the opposite end of an animal's digestive tract from the mouth. Its function is to expel feces, unwanted semi-solid matter produced during digestion, which, depending on the type of animal, may be one or more of: matter which the animal cannot digest, such as bones; food material after all the nutrients have been extracted, for example cellulose or lignin; ingested matter which would be toxic if it remained in the digestive tract; and dead or excess gut bacteria and other endosymbionts."
      last_updated: 2026-08-17

    ncit:C4344:
      d4cg_label: "WHO, Version 4 >> Acute Panmyelosis with Myelofibrosis"
      description: "An acute myeloid leukemia characterized by bone marrow fibrosis without preexisting primary myelofibrosis."
      last_updated: 2026-08-17

    ncit:C4376:
      d4cg_label: "Kidney Failure"
      description: "A condition in which the kidneys stop working and are not able to remove waste and extra water from the blood or keep body chemicals in balance. Acute or severe renal failure happens suddenly (for example, after an injury) and may be treated and cured. Chronic renal failure develops over many years, may be caused by conditions like high blood pressure or diabetes, and cannot be cured. Chronic renal failure may lead to total and long-lasting renal failure, called end-stage renal disease (ESRD). A person in ESRD needs dialysis (the process of cleaning the blood by passing it through a membrane or filter) or a kidney transplant."
      last_updated: 2026-08-17

    ncit:C4436:
      d4cg_label: "Cholangiocarcinoma"
      description: "A carcinoma that arises from the intrahepatic bile ducts, the hepatic ducts, or the common bile duct distal to the insertion of the cystic duct. The vast majority of tumors are adenocarcinomas."
      last_updated: 2026-08-17

    ncit:C449:
      d4cg_label: "DNA"
      description: "A long linear double-stranded polymer formed from nucleotides attached to a deoxyribose backbone and found in the nucleus of a cell; associated with the transmission of genetic information."
      last_updated: 2026-08-17

    ncit:C45202:
      d4cg_label: "Low-Grade Fibromyxoid Sarcoma"
      description: "A low-grade, late-metastasizing variant of fibrosarcoma characterized by alternating fibrous and myxoid areas and a whorling growth pattern.  The neoplastic cells have a spindle morphology, and lack hyperchromasia or significant nuclear atypia.  Approximately 40% of cases show the focal presence of collagen rosettes.  A t(7;16)(q33;p11) translocation has been identified in the majority of cases, associated with the presence of FUS-CREB3L2 fusion protein.  Rare cases carry the t(11;16)(p11;p11) translocation which is associated with the presence of the FUS-CREB3L1 fusion protein."
      last_updated: 2026-08-17

    ncit:C4523:
      d4cg_label: "AJCC >> Stage 0"
      description: "Abnormal cells are found in the tiny tubules where the sperm cells begin to develop. These abnormal cells may become cancer and spread into nearby normal tissue. All tumor marker levels are normal."
      last_updated: 2026-08-17

    ncit:C45387:
      d4cg_label: "Intronic"
      description: "Single Nucleotide Polymorphism in Intronic Sequences (Intronic SNP) consists of a variation at an appreciable frequency between individuals of a single interbreeding population of a single nucleotide, due to base substitution, at an equivalent location within a transcribed non-coding intervening DNA sequence separating protein-coding sequences (exons) in an eukaryotic nuclear gene. Poorly conserved and of variable length and number, intron sequences are removed from nascent message RNA transcripts in the nucleus after the 5' cap and polyA tail have been added. Self-complementary sequences at exon-intron junctions form a hairpin structure recognized by enzymes that splice exons together into a mature mRNA that is ready for translation in the cytoplasm. When the intron is removed, the donor junction at the 5' end of the intron is spliced to the acceptor junction at the 3' end of the intron."
      last_updated: 2026-08-17

    ncit:C45389:
      d4cg_label: "Splice Acceptor"
      description: "A heritable single nucleotide polymorphism located at the acceptor splice site in certain allelic variants of eukaryotic genes. These sites are located in genes at intron to exon junctions at the 3' end of the intron."
      last_updated: 2026-08-17

    ncit:C45390:
      d4cg_label: "Splice Donor"
      description: "An inherited single base change at a donor splice site in a genomic DNA sequence that results in an allelic variant of the wild-type gene. Donor splice sites are located at exon to intron junctions at the 5' end of the intron."
      last_updated: 2026-08-17

    ncit:C45447:
      d4cg_label: "Genotyping, NOS"
      description: "The determination of the DNA sequence of an individual."
      last_updated: 2026-08-17

    ncit:C45475:
      d4cg_label: "Composite Hemangioendothelioma"
      description: "An intermediate, locally aggressive and rarely metastasizing blood vessel neoplasm that predominantly involves the skin and superficial soft tissues, with rare cases reported in the kidney, lymph nodes, and spleen. It is characterized by the presence of spindle, plump, and epithelioid endothelial cells and cellular atypia."
      last_updated: 2026-08-17

    ncit:C45525:
      d4cg_label: "Valvular Disease"
      description: "Any heart disorder characterized by a defect in valve structure or function."
      last_updated: 2026-08-17

    ncit:C45574:
      d4cg_label: "Splice Site"
      description: "An inherited single base substitution in a sequence of eukaryotic DNA located in either an acceptor (3' or downstream) or donor (5' or upstream) splice site of a gene. Functional single nucleotide polymorphisms in these intron-exon junctions can cause incorrect RNA splicing which, in turn, alters gene expression."
      last_updated: 2026-08-17

    ncit:C456:
      d4cg_label: "Doxorubicin"
      description: "A drug that is used to treat many types of cancer and is being studied in the treatment of other types of cancer. Doxorubicin comes from the bacterium Streptomyces peucetius. It damages DNA and may kill cancer cells. It is a type of anthracycline antitumor antibiotic."
      last_updated: 2026-08-17

    ncit:C4562:
      d4cg_label: "Involvement of Peripapillary Choroid"
      description: "A hemangioma that arises from the choroid."
      last_updated: 2026-08-17

    ncit:C45825:
      d4cg_label: "Heterozygous"
      description: "Having two different allelic forms of a gene, one inherited from each parent, on each of the two homologous chromosomes."
      last_updated: 2026-08-17

    ncit:C45826:
      d4cg_label: "Homozygous"
      description: "Having two identical allelic forms of a gene, one inherited from each parent, on each of the two homologous chromosomes."
      last_updated: 2026-08-17

    ncit:C45827:
      d4cg_label: "inheritance_pattern"
      description: "The manner in which a genetic trait or disorder is passed from one generation to the next. Autosomal dominant, autosomal recessive, X-linked dominant, X-linked recessive, multifactorial, and mitochondrial inheritance are examples. Each mode of inheritance results in a characteristic pattern of affected and unaffected family members."
      last_updated: 2026-08-17

    ncit:C45828:
      d4cg_label: "Approximate"
      description: "Not quite exact or correct; almost exact or correct."
      last_updated: 2026-08-17

    ncit:C45829:
      d4cg_label: "Absolute"
      description: "Complete and without restriction or qualification; something that does not depend on anything else; not relative."
      last_updated: 2026-08-17

    ncit:C45830:
      d4cg_label: "Relative"
      description: "Considered in comparison with something else; dependent on or interconnected with something else; not absolute."
      last_updated: 2026-08-17

    ncit:C45874:
      d4cg_label: "Lumbar Vertebra"
      description: "Pertaining to the back or upper surface of the body."
      last_updated: 2026-08-17

    ncit:C459:
      d4cg_label: "medication_category"
      description: "A drug given to a patient to mitigate or cure an illness, injury, or reduced health status. See also drug, treatment, intervention."
      last_updated: 2026-08-17

    ncit:C45908:
      d4cg_label: "Intersex, NOS"
      description: "A person (one of unisexual specimens) who is born with genitalia and/or secondary sexual characteristics of indeterminate sex, or which combine features of both sexes. (NCI)"
      last_updated: 2026-08-17

    ncit:C46089:
      d4cg_label: "Allogeneic"
      description: "A clinical treatment in which hematopoietic stem cells (HSCs) are transferred from one genetically dissimilar individual to another."
      last_updated: 2026-08-17

    ncit:C4661:
      d4cg_label: "Primary Meningeal Melanocytic Neoplasm"
      description: "A melanocytic neoplasm that arises from the leptomeninges. This category includes diffuse proliferative processes (melanocytosis and melanomatosis) and circumscribed processes (melanocytoma and melanoma)."
      last_updated: 2026-08-17

    ncit:C4680:
      d4cg_label: "Palmar/Plantar Fibromatosis"
      description: "A superficial fibromatosis arising from soft tissue of the plantar regions. It is characterized by the presence of spindle-shaped fibroblasts, hypercellularity, and an infiltrative growth pattern."
      last_updated: 2026-08-17

    ncit:C4683:
      d4cg_label: "Dermatofibrosarcoma Protuberans"
      description: "A low grade fibroblastic neoplasm presenting as a nodular cutaneous mass, most often on the trunk and the proximal extremities.  The tumor diffusely infiltrates the dermis and the subcutaneous tissues.  It is considered a locally aggressive neoplasm, which often recurs but rarely metastasizes."
      last_updated: 2026-08-17

    ncit:C4692:
      d4cg_label: "Nijmegen Breakage Syndrome"
      description: "A disorder, wherein unstable chromosomes have a tendency to break and become rearranged, characterized by microcephaly, stunted growth, subnormal mental development, cafe-au-lait spots, and immunodeficiency. The syndrome is named after the University of Nijmegen in the Netherlands. (JABL99)"
      last_updated: 2026-08-17

    ncit:C4700:
      d4cg_label: "Giant Cell Fibroblastoma"
      description: "A morphologic variant of dermatofibrosarcoma protuberans that is most often seen in childhood and is characterized by the presence of spindle-shaped fibroblastic cells, a storiform growth pattern, numerous multinucleated giant cells, wide vessel-like spaces, and extensive myxoid change."
      last_updated: 2026-08-17

    ncit:C4705:
      d4cg_label: "Carney Complex"
      description: "A rare, inherited disorder marked by dark spots on the skin and tumors in the heart, endocrine glands, skin, and nerves. There are two types of Carney complex, which are caused by mutations (changes) in different genes."
      last_updated: 2026-08-17

    ncit:C4715:
      d4cg_label: "Choroid Plexus Carcinoma"
      description: "A malignant neoplasm arising from the choroid plexus of the brain."
      last_updated: 2026-08-17

    ncit:C4716:
      d4cg_label: "Ectomesenchymoma"
      description: "A rare, fast-growing tumor of the nervous system or soft tissue that occurs in children and young adults. Ectomesenchymomas may form in the head and neck, abdomen, perineum, scrotum, or limbs."
      last_updated: 2026-08-17

    ncit:C4717:
      d4cg_label: "Anaplastic Ganglioglioma"
      description: "A WHO grade III neuroepithelial neoplasm composed of neoplastic, mature ganglion cells and anaplastic glial cells. The anaplastic changes in the glial component and high MIB-1 and TP53 labeling indices may indicate aggressive behavior. However, the correlation of histological anaplasia with clinical outcome is inconsistent. (Adapted from WHO)"
      last_updated: 2026-08-17

    ncit:C4726:
      d4cg_label: "Adamantinomatous Craniopharyngioma"
      description: "A craniopharyngioma consisting of broad strands, cords and bridges of a multistratified squamous epithelium with peripheral palisading of nuclei. Diagnostic features include nodules of compact 'wet' keratin and dystrophic calcification. (Adapted from WHO)"
      last_updated: 2026-08-17

    ncit:C4731:
      d4cg_label: "Neuropathy"
      description: "A disorder affecting the cranial nerves or the peripheral nervous system. It manifests with pain, tingling, numbness, and muscle weakness."
      last_updated: 2026-08-17

    ncit:C4747:
      d4cg_label: "Glioneuronal and Neuronal Tumors"
      description: "A group of central nervous system neoplasms with a variable amount of neuronal and, less consistently, glial differentiation. They occur at a low frequency and usually carry a favorable prognosis.  Representative examples include dysplastic cerebellar gangliocytoma, desmoplastic infantile ganglioglioma, desmoplastic infantile astrocytoma, and dysembryoplastic neuroepithelial tumor. (Adapted from WHO)"
      last_updated: 2026-08-17

    ncit:C4748:
      d4cg_label: "Malignant Melanotic Nerve Sheath Tumor"
      description: "A rare variant of malignant peripheral nerve sheath tumor.  It is characterized by the presence of malignant cells that contain melanin."
      last_updated: 2026-08-17

    ncit:C47595:
      d4cg_label: "Mebendazole"
      description: "A synthetic benzimidazole derivate and anthelmintic agent. Mebendazole interferes with the reproduction and survival of helminths by inhibiting the formation of their cytoplasmic microtubules, thereby selectively and irreversibly blocking glucose uptake. This results in a depletion of glycogen stores and leads to reduced formation of ATP required for survival and reproduction of the helminth. This eventually causes the helminths death."
      last_updated: 2026-08-17

    ncit:C47813:
      d4cg_label: "Hoarseness"
      description: "A disorder characterized by harsh and raspy voice arising from or spreading to the larynx."
      last_updated: 2026-08-17

    ncit:C47934:
      d4cg_label: "Phosphorus"
      description: "A nonmetallic element that is found in the blood, muscles, nerves, bones, and teeth and is a component of adenosine triphosphate (ATP; the primary energy source for the body's cells)."
      last_updated: 2026-08-17

    ncit:C48045:
      d4cg_label: "age_precision"
      description: "A quantitative representation of the degree of accuracy necessary for or associated with a particular action."
      last_updated: 2026-08-17

    ncit:C4808:
      d4cg_label: "le"
      description: "Any symptom or condition which is a result of a medical intervention but arises months or years after it."
      last_updated: 2026-08-17

    ncit:C4815:
      d4cg_label: "Thyroid Cancer"
      description: "A carcinoma arising from the thyroid gland. It includes the following main subtypes: follicular, papillary, medullary, poorly differentiated, and anaplastic carcinoma."
      last_updated: 2026-08-17

    ncit:C48152:
      d4cg_label: "mcg"
      description: "A metric unit of mass equal to one millionth of a gram or one thousandth of a milligram."
      last_updated: 2026-08-17

    ncit:C4822:
      d4cg_label: "High-Grade Glioma, NOS or NEC"
      description: "A grade 3 or grade 4 glioma arising from the central nervous system. This category includes glioblastoma, anaplastic astrocytoma, anaplastic ependymoma, anaplastic oligodendroglioma, and anaplastic oligoastrocytoma."
      last_updated: 2026-08-17

    ncit:C48250:
      d4cg_label: "Physician Decision"
      description: "A position, opinion or judgment reached after consideration by a physician with reference to subject."
      last_updated: 2026-08-17

    ncit:C48271:
      d4cg_label: "Withdrawal of Consent"
      description: "When the permission to do something is rescinded or withdrawn."
      last_updated: 2026-08-17

    ncit:C48275:
      d4cg_label: "System NOS >> Grade 5"
      description: "The termination of life as a result of an adverse event. (NCI)"
      last_updated: 2026-08-17

    ncit:C48281:
      d4cg_label: "study_phase"
      description: "A stage in the clinical research and development of a therapy from first-in-human to post-approval clinical trials."
      last_updated: 2026-08-17

    ncit:C48300:
      d4cg_label: "Familial Paraganglioma-Pheochromocytoma Syndrome"
      description: "An autosomal dominant hereditary neoplastic syndrome caused by mutations in the SDHA,SDHB, SDHC, SDHD, and SDHAF2 genes. It is characterized by the development of paragangliomas and pheochromocytomas, gastrointestinal stromal tumors, and SDH-deficient renal cell carcinomas."
      last_updated: 2026-08-17

    ncit:C48570:
      d4cg_label: "%"
      description: "A unit for expressing a number as a fraction of hundred (on the basis of a rate or proportion per hundred)."
      last_updated: 2026-08-17

    ncit:C48579:
      d4cg_label: "IU"
      description: "A unit used to measure the activity of many vitamins, hormones, enzymes, and drugs. An IU is the amount of a substance that has a certain biological effect. For each substance there is an international agreement on the biological effect that is expected for 1 IU."
      last_updated: 2026-08-17

    ncit:C4861:
      d4cg_label: "FAB >> Version NOS >> M5"
      description: "A progressive, proliferative disease of blood cells, originating from immature monocytes."
      last_updated: 2026-08-17

    ncit:C48627:
      d4cg_label: "McCune-Albright Syndrome"
      description: "A syndrome caused by activating somatic mutation(s) in the GNAS gene, encoding guanine nucleotide-binding protein G(s) subunit alpha isoforms short. This syndrome is characterized most commonly by irregular (coast of Maine) cafe-au-lait skin pigmentation, polyostotic fibrous dysplasia, and gonadotropin-independent precocious puberty due to primary gonadal hyperfunction. Other clinical features may include hyperthyroidism, goiter, thyroid nodules, hyperadrenocorticolism, growth hormone excess, and phosphate wasting."
      last_updated: 2026-08-17

    ncit:C48658:
      d4cg_label: "Indeterminate"
      description: "Cannot distinguish between two or more possible values in the current context."
      last_updated: 2026-08-17

    ncit:C48660:
      d4cg_label: "Not Applicable"
      description: "A report has been received but the description provided does not appear to relate to an adverse event. This code allows a report to be recorded for administration purposes, even if it doesn't meet the requirements for adverse event reporting."
      last_updated: 2026-08-17

    ncit:C48699:
      d4cg_label: "Modified Chang Staging >> M0"
      description: "A distant metastasis TNM finding indicating that there is no evidence of distant metastasis."
      last_updated: 2026-08-17

    ncit:C4870:
      d4cg_label: "RECIST >> Complete Response"
      description: "The disappearance of all signs of cancer in response to treatment."
      last_updated: 2026-08-17

    ncit:C48700:
      d4cg_label: "Modified Chang Staging >> M1"
      description: "A clinical and/or pathologic distant metastasis TNM finding indicating the spread of cancer to distant anatomic sites."
      last_updated: 2026-08-17

    ncit:C48701:
      d4cg_label: "M1a"
      description: "A TNM finding indicating the spread of cancer to distant anatomic sites.  The definition of M1a TNM finding depends on the specific type of cancer that it refers to; for example, for colorectal cancer it refers to metastasis confined to one organ or site (e.g., liver, lung, ovary, nonregional node); for prostate cancer it refers to metastasis to non-regional lymph node(s); for bone cancer it refers to metastasis to the lung."
      last_updated: 2026-08-17

    ncit:C48702:
      d4cg_label: "M1b"
      description: "A TNM finding indicating the spread of cancer to distant anatomic sites.  The definition of M1b TNM finding depends on the specific type of cancer that it refers to; for example, for colorectal cancer it refers to metastases in more than one organ/site or the peritoneum; for prostate cancer it refers to metastasis to bone(s); for bone cancer it refers to metastasis to distant sites other than lung."
      last_updated: 2026-08-17

    ncit:C48703:
      d4cg_label: "M1c"
      description: "A TNM finding indicating the spread of cancer to distant anatomic sites.  The definition of M1c TNM finding depends on the specific type of cancer that it refers to; for example, for prostate cancer it refers to metastasis to anatomic site(s) other than bone, with or without bone disease; for retinoblastoma it refers to central nervous system metastasis; for melanoma of the uvea it refers to distant metastasis, with the largest diameter of the largest metastasis measuring 8.0 cm or more."
      last_updated: 2026-08-17

    ncit:C48704:
      d4cg_label: "MX"
      description: "A distant metastasis TNM finding indicating that the status of distant metastasis cannot be assessed."
      last_updated: 2026-08-17

    ncit:C48705:
      d4cg_label: "N0"
      description: "A regional lymph node TNM finding indicating that there is no evidence of regional lymph node metastasis."
      last_updated: 2026-08-17

    ncit:C48706:
      d4cg_label: "N1"
      description: "A general term that refers to a TNM finding of cancer metastases usually in a limited number of regional lymph nodes. The definition of N1 TNM finding depends on the specific type of cancer that it refers to; for example, for breast cancer it refers to micrometastases or metastases in 1-3 axillary lymph nodes; for cutaneous melanoma it refers to metastasis in 1 regional lymph node; for colorectal cancer it refers to metastases in 1-3 regional lymph nodes; and for bladder cancer it refers to metastasis in 1 regional lymph node in the true pelvis."
      last_updated: 2026-08-17

    ncit:C48714:
      d4cg_label: "N3"
      description: "A general term that refers to a TNM finding of cancer metastases in multiple lymph nodes. The definition of N3 TNM finding depends on the specific type of cancer that it refers to; for example, for breast cancer it refers to metastases in 10 or more axillary lymph nodes; for cutaneous melanoma it refers to metastases in 4 or more regional lymph nodes; for gastric cancer it refers to metastases in 7 or more regional lymph nodes; and for bladder cancer it refers to metastases in common iliac lymph nodes."
      last_updated: 2026-08-17

    ncit:C48718:
      d4cg_label: "NX"
      description: "A regional lymph node TNM finding indicating that the status of regional lymph nodes cannot be assessed."
      last_updated: 2026-08-17

    ncit:C48719:
      d4cg_label: "T0"
      description: "A primary tumor TNM finding indicating that there is no evidence of primary tumor."
      last_updated: 2026-08-17

    ncit:C4872:
      d4cg_label: "Breast Cancer"
      description: "A carcinoma arising from the breast, most commonly the terminal ductal-lobular unit. It is the most common malignant tumor in females. Risk factors include country of birth, family history, menstrual and reproductive history, fibrocystic disease and epithelial hyperplasia, exogenous estrogens, contraceptive agents, and ionizing radiation. The vast majority of breast carcinomas are adenocarcinomas (ductal or lobular). Breast carcinoma spreads by direct invasion, by the lymphatic route, and by the blood vessel route. The most common site of lymph node involvement is the axilla."
      last_updated: 2026-08-17

    ncit:C48720:
      d4cg_label: "T1"
      description: "A clinical and/or pathologic primary tumor TNM finding indicating that the cancer is limited to the site of growth."
      last_updated: 2026-08-17

    ncit:C48721:
      d4cg_label: "T1a"
      description: "A general term that refers to a TNM finding of a primary tumor limited to the site of growth.  The definition of T1a TNM finding depends on the specific type of cancer that it refers to; for example, for breast cancer it refers to a primary tumor that is more than 0.1cm, but not more than 0.5 cm in greatest dimension; for kidney cancer it refers to a primary tumor that is 4 cm or less in greatest dimension; and for thyroid cancer it refers to a primary tumor that is 1 cm or less in greatest dimension."
      last_updated: 2026-08-17

    ncit:C48722:
      d4cg_label: "T1b"
      description: "A general term that refers to a TNM finding of a primary tumor limited to the site of growth.  The definition of T1b TNM finding depends on the specific type of cancer that it refers to; for example, for breast cancer it refers to a primary tumor that is more than 0.5 cm, but not more than 1.0 cm in greatest dimension; for kidney cancer it refers to a primary tumor that is more than 4 cm, but not more than 7 cm in greatest dimension; and for thyroid cancer it refers to a primary tumor that is more than 1 cm but not more than 2 cm in greatest dimension."
      last_updated: 2026-08-17

    ncit:C48723:
      d4cg_label: "T1c"
      description: "A general term that refers to a TNM finding of a primary tumor limited to the site of growth.  The definition of T1c TNM finding depends on the specific type of cancer that it refers to; for example, for breast cancer it refers to a primary tumor that is more than 1.0 cm, but not more than 2.0 cm in greatest dimension; for uterine corpus cancer it refers to a primary tumor that invades one-half or more of the myometrium; and for melanoma of the iris it refers to a primary tumor limited to the iris with secondary glaucoma."
      last_updated: 2026-08-17

    ncit:C48724:
      d4cg_label: "T2"
      description: "A general term that refers to a TNM finding of primary tumor growth beyond the level of in situ cancer, minimal subepithelial invasion, or minimal greatest diameter. The definition of T2 TNM finding depends on the specific type of cancer that it refers to; for example, for breast cancer it refers to primary tumor that is more than 2.0 cm, but not more than 5.0 cm in greatest dimension; for cutaneous melanoma it refers to primary tumor that is 1.01 to 2 mm in thickness, with or without ulceration; for colorectal cancer it refers to primary tumor with invasion into the muscularis propria; and for bladder cancer it refers to primary tumor with invasion into the muscle layer."
      last_updated: 2026-08-17

    ncit:C48725:
      d4cg_label: "T2a"
      description: "A general term that refers to a TNM finding of a primary tumor growth beyond the level of in situ cancer, minimal subepithelial invasion, or minimal greatest diameter. The definition of T2a TNM finding depends on the specific type of cancer that it refers to; for example, for kidney cancer it refers to a primary tumor that measures more than 7 cm but less than or equal to 10 cm in greatest dimension, and is limited to the kidney; for bladder cancer it refers to a primary tumor that invades the superficial muscularis propria (inner half); for cervical cancer it refers to a primary tumor that invades beyond the uterus but not to the pelvic wall or to the lower third of vagina and there is no parametrial invasion."
      last_updated: 2026-08-17

    ncit:C48726:
      d4cg_label: "T2b"
      description: "A general term that refers to a TNM finding of a primary tumor growth beyond the level of in situ cancer, minimal subepithelial invasion, or minimal greatest diameter. The definition of T2b TNM finding depends on the specific type of cancer that it refers to; for example, for kidney cancer it refers to a primary tumor that measures more than 10 cm in greatest dimension, and is limited to the kidney; for bladder cancer it refers to a primary tumor that invades the deep muscularis propria (outer half); for cervical cancer it refers to a primary tumor that invades beyond the uterus but not to the pelvic wall or to the lower third of vagina and there is parametrial invasion."
      last_updated: 2026-08-17

    ncit:C48729:
      d4cg_label: "T3a"
      description: "A general term that refers to a TNM finding of a primary tumor usually indicating that the cancer is locally invasive. The definition of T3a TNM finding depends on the specific type of cancer that it refers to; for example, for kidney cancer it refers to a primary tumor that grossly extends into the renal vein or its segmental (muscle containing) branches or the tumor invades perirenal and/or renal sinus fat but does not extends beyond Gerota's fascia; for cervical cancer it refers to a primary tumor that involves the lower third of vagina, without extension to pelvic wall; for liver cancer it refers to the presence of multiple tumors measuring more than 5 cm in greatest dimension."
      last_updated: 2026-08-17

    ncit:C48730:
      d4cg_label: "T3b"
      description: "A general term that refers to a TNM finding of a primary tumor usually indicating that the cancer is locally invasive. The definition of T3b TNM finding depends on the specific type of cancer that it refers to; for example, for kidney cancer it refers to a primary tumor that grossly extends into the vena cava below the diaphragm; for cervical cancer it refers to a primary tumor that extends to the pelvic wall and/or causes hydronephrosis or nonfunctioning kidney; for liver cancer it refers to a single tumor or multiple tumors of any size involving a major branch of the portal vein or hepatic vein."
      last_updated: 2026-08-17

    ncit:C48731:
      d4cg_label: "T3c"
      description: "A general term that refers to a TNM finding of a primary tumor usually indicating that the cancer is locally invasive. The definition of T3c TNM finding depends on the specific type of cancer that it refers to; for example, for kidney cancer it refers to a primary tumor that grossly extends into the vena cava above the diaphragm, or invades the wall of the vena cava; for fallopian tube cancer it refers to a primary tumor with peritoneal metastasis outside the pelvis measuring more than 2 cm in diameter; for melanoma of the conjunctiva it refers to a primary tumor invading the orbit."
      last_updated: 2026-08-17

    ncit:C48732:
      d4cg_label: "T4"
      description: "A clinical and/or pathologic primary tumor TNM finding indicating direct invasion of adjacent structures by cancer."
      last_updated: 2026-08-17

    ncit:C48733:
      d4cg_label: "T4a"
      description: "A general term that refers to a TNM finding of a primary tumor with direct invasion of adjacent structures. The definition of T4a TNM finding depends on the specific type of cancer that it refers to; for example, for bladder cancer it refers to a primary tumor that invades the prostatic stroma, uterus, and vagina; for gastric cancer it refers to a primary tumor that invades the serosa (visceral peritoneum); for colorectal cancer it refers to a primary tumor that penetrates to the surface of the visceral peritoneum."
      last_updated: 2026-08-17

    ncit:C48734:
      d4cg_label: "T4b"
      description: "A general term that refers to a TNM finding of a primary tumor with direct invasion of adjacent structures. The definition of T4b TNM finding depends on the specific type of cancer that it refers to; for example, for bladder cancer it refers to a primary tumor that invades the pelvic wall and abdominal wall; for gastric cancer it refers to a primary tumor that invades adjacent structures; for colorectal cancer it refers to a primary tumor with direct invasion or adherence to other organs or structures."
      last_updated: 2026-08-17

    ncit:C48735:
      d4cg_label: "T4c"
      description: "A general term that refers to a TNM finding of a primary tumor with direct invasion of adjacent structures. The definition of T4c TNM finding depends on the specific type of cancer that it refers to; for example, for breast cancer it refers to a primary tumor that extends to the chest wall, not including the pectoralis muscle, and with edema (including peau d'orange) or ulceration of the skin of the breast or satellite skin nodules confined to the same breast; for ocular adnexal lymphoma it refers to a primary tumor that Involves the maxillofacial, ethmoidal, and/or frontal sinuses; for carcinoma of the conjunctiva it refers to a primary tumor that invades adjacent paranasal sinuses."
      last_updated: 2026-08-17

    ncit:C48736:
      d4cg_label: "T4d"
      description: "A general term that refers to a TNM finding of a primary tumor with direct invasion of adjacent structures. The definition of T4d TNM finding depends on the specific type of cancer that it refers to; for example, for breast cancer it refers to a primary tumor that meets the clinical-pathologic criteria of inflammatory carcinoma; for ocular adnexal lymphoma it refers to a primary tumor with intracranial spread; for carcinoma of the conjunctiva it refers to a primary tumor that invades the brain."
      last_updated: 2026-08-17

    ncit:C48737:
      d4cg_label: "TX"
      description: "A primary tumor TNM finding indicating that the status of the primary tumor cannot be assessed."
      last_updated: 2026-08-17

    ncit:C48738:
      d4cg_label: "Tis"
      description: "A term that refers to a TNM finding of a primary tumor microscopically defined as carcinoma in situ."
      last_updated: 2026-08-17

    ncit:C4878:
      d4cg_label: "Lung Cancer"
      description: "A carcinoma originating in the lung. Lung carcinomas usually arise from the epithelium that lines the bronchial tree (bronchogenic carcinomas), and are classified as small cell or non-small cell carcinomas. Non-small cell lung carcinomas are usually adenocarcinomas, squamous cell carcinomas, or large cell carcinomas. Metastatic carcinomas to the lung are also common, and can be difficult to distinguish from primary tumors."
      last_updated: 2026-08-17

    ncit:C48786:
      d4cg_label: "N2"
      description: "A general term that refers to a TNM finding of cancer metastases in several regional lymph nodes. The definition of N2 TNM finding depends on the specific type of cancer that it refers to; for example, for breast cancer it refers to metastases in 4-9 axillary lymph nodes; for cutaneous melanoma it refers to metastases in 2-3 regional lymph nodes; for colorectal cancer it refers to metastases in 4 or more regional lymph nodes; and for bladder cancer it refers to metastases in multiple regional lymph nodes in the true pelvis."
      last_updated: 2026-08-17

    ncit:C48797:
      d4cg_label: "Vimentin"
      description: "Vimentin (466 aa, ~54 kDa) is encoded by the human VIM gene. This protein plays a role in the localization of organelles and other cellular components."
      last_updated: 2026-08-17

    ncit:C488:
      d4cg_label: "Amifostine"
      description: "The trihydrate form of a phosphorylated aminosulfhydryl compound. After dephosphorylation of amifostine by alkaline phosphatase to an active free sulfhydryl (thiol) metabolite, the thiol metabolite binds to and detoxifies cytotoxic platinum-containing metabolites of cisplatin and scavenges free radicals induced by cisplatin and ionizing radiation. The elevated activity of this agent in normal tissues results from both the relative abundance of alkaline phosphatase in normal tissues and the greater vascularity of normal tissues compared to tumor tissues."
      last_updated: 2026-08-17

    ncit:C48812:
      d4cg_label: "Belinostat"
      description: "A novel hydroxamic acid-type histone deacetylase (HDAC) inhibitor with antineoplastic activity. Belinostat targets HDAC enzymes, thereby inhibiting tumor cell proliferation, inducing apoptosis, promoting cellular differentiation, and inhibiting angiogenesis. This agent may sensitize drug-resistant tumor cells to other antineoplastic agents, possibly through a mechanism involving the down-regulation of thymidylate synthase."
      last_updated: 2026-08-17

    ncit:C49024:
      d4cg_label: "Low-Grade Myofibroblastic Sarcoma"
      description: "A low-grade malignant neoplasm arising from the soft tissue and rarely bone. It is characterized by the presence of spindle-shaped myofibroblasts and collagenous stroma formation in a storiform growth pattern. Metastasis is very rare."
      last_updated: 2026-08-17

    ncit:C49025:
      d4cg_label: "Myxoinflammatory Fibroblastic Sarcoma/Atypical Myxoinflammatory Fibroblastic Tumor"
      description: "A low grade, locally aggressive, fibroblastic neoplasm that occurs primarily in the distal extremities.  It is characterized by the presence of spindle-shaped fibroblasts, multivacuolated lipoblast-like cells, bizarre ganglion-like cells with inclusion-like nuclei, myxoid stroma formation, and a mixture of acute and chronic inflammatory cells.  Distant metastases are very rare."
      last_updated: 2026-08-17

    ncit:C49027:
      d4cg_label: "Sclerosing Epithelioid Fibrosarcoma"
      description: "A well-circumscribed malignant fibroblastic neoplasm that usually arises from the soft tissue. It is characterized by the presence of nests of malignant epithelioid fibroblasts and sclerotic collagen stroma formation."
      last_updated: 2026-08-17

    ncit:C49061:
      d4cg_label: "Ridaforolimus"
      description: "A small molecule and non-prodrug analogue of the lipophilic macrolide antibiotic rapamycin with potential antitumor activity. Ridaforolimus binds to and inhibits the mammalian target of rapamycin (mTOR), which may result in cell cycle arrest and, consequently, the inhibition of tumor cell growth and proliferation. Upregulated in some tumors, mTOR is a serine/threonine kinase involved in regulating cellular proliferation, motility, and survival that is located downstream of the PI3K/Akt signaling pathway."
      last_updated: 2026-08-17

    ncit:C49084:
      d4cg_label: "Imetelstat"
      description: "A synthetic lipid-conjugated, 13-mer oligonucleotide N3'-P5'-thio-phosphoramidate with potential antineoplastic activity. Complementary to the template region of telomerase (hTR) RNA, imetelstat acts as a competitive enzyme inhibitor that binds and blocks the active site of the enzyme (a telomerase template antagonist), a mechanism of action which differs from that for the antisense oligonucleotide-mediated inhibition of telomerase activity through telomerase mRNA binding. Inhibition of telomerase activity in tumor cells by imetelstat results in telomere shortening, which leads to cell cycle arrest or apoptosis."
      last_updated: 2026-08-17

    ncit:C49085:
      d4cg_label: "Tremelimumab"
      description: "A human IgG2 monoclonal antibody directed against the T-cell receptor protein cytotoxic T-lymphocyte-associated protein 4 (CTLA4). Tremelimumab binds to CTLA4 and blocks the binding of the antigen-presenting cell ligands B7-1 and B7-2 to CTLA4, resulting in inhibition of B7-CTLA4-mediated downregulation of T-cell activation; subsequently, B7-1 or B7-2 may interact with another T-cell surface receptor protein, CD28, resulting in a B7-CD28-mediated T-cell activation unopposed by B7-CTLA4-mediated inhibition."
      last_updated: 2026-08-17

    ncit:C49094:
      d4cg_label: "Neratinib"
      description: "An orally available, 6,7-disubstituted-4-anilinoquinoline-3-carbonitrile irreversible inhibitor of the HER-2 receptor tyrosine kinase with potential antineoplastic activity. Neratinib binds to the HER-2 receptor irreversibly, thereby reducing autophosphorylation in cells, apparently by targeting a cysteine residue in the ATP-binding pocket of the receptor. Treatment of cells with this agent results in inhibition of downstream signal transduction events and cell cycle regulatory pathways; arrest at the G1-S (Gap 1/DNA synthesis)-phase transition of the cell division cycle; and ultimately decreased cellular proliferation. Neratinib also inhibits the epidermal growth factor receptor (EGFR) kinase and the proliferation of EGFR-dependent cells."
      last_updated: 2026-08-17

    ncit:C491:
      d4cg_label: "Etoposide"
      description: "A drug used to treat testicular and small cell lung cancers. It is also being studied in the treatment of several other types of cancer. Vepesid blocks certain enzymes needed for cell division and DNA repair, and it may kill cancer cells. It is a type of podophyllotoxin derivative and a type of topoisomerase inhibitor."
      last_updated: 2026-08-17

    ncit:C49107:
      d4cg_label: "Giant Cell Tumor of Soft Tissue"
      description: "A painless, well circumscribed tumor arising in soft tissue, usually of the upper and lower extremities. Morphologically, it is characterized by a multinodular growth pattern. The cellular infiltrate is composed of mononuclear round or oval cells and multinucleated osteoclast-like giant cells, in a rich vascular stroma.  It rarely metastasizes."
      last_updated: 2026-08-17

    ncit:C4912:
      d4cg_label: "Bladder Cancer"
      description: "A carcinoma arising from the bladder epithelium.  Approximately 90% of the bladder carcinomas are transitional cell carcinomas.  The remainder are squamous cell carcinomas, adenocarcinomas and small cell neuroendocrine carcinomas."
      last_updated: 2026-08-17

    ncit:C49135:
      d4cg_label: "Investigational Agent"
      description: "A new drug or biological drug that is used in a clinical investigation. The term also includes a biological product that is used in vitro for diagnostic purposes."
      last_updated: 2026-08-17

    ncit:C49142:
      d4cg_label: "quantification_type"
      description: "The number of molecules of a particular type on or in a cell or part of a cell. Usually applied to specific genes or to plasmids within a bacterium."
      last_updated: 2026-08-17

    ncit:C4915:
      d4cg_label: "Embryonal Tumor with Multilayered Rosettes, C19MC Not Amplified"
      description: "An aggressive embryonal tumor with multilayered rosettes characterized by the presence of amplification of the C19MC region on chromosome 19 (19q13.42)."
      last_updated: 2026-08-17

    ncit:C49164:
      d4cg_label: "RECIST"
      description: "Standard parameters to be used when documenting response of solid tumors to treatment; a set of published rules that define when cancer patients improve (\"respond\"), stay the same (\"stable\"), or worsen (\"progression\") during treatments. (from www.recist.com)"
      last_updated: 2026-08-17

    ncit:C49176:
      d4cg_label: "Palbociclib"
      description: "An orally available cyclin-dependent kinase (CDK) inhibitor with potential antineoplastic activity. Palbociclib selectively inhibits cyclin-dependent kinase 4 (CDK4) and 6 (CDK6), thereby inhibiting retinoblastoma (Rb) protein phosphorylation early in the G1 phase leading to cell cycle arrest. This suppresses DNA replication and decreases tumor cell proliferation. CDK4 and 6 are serine/threonine kinases that are upregulated in many tumor cell types and play a key role in the regulation of cell cycle progression."
      last_updated: 2026-08-17

    ncit:C49481:
      d4cg_label: "Ear Skin"
      description: "The integument that covers the ear."
      last_updated: 2026-08-17

    ncit:C49484:
      d4cg_label: "Not Done"
      description: "Indicates a task, process or examination that has either not been initiated or completed. (NCI)"
      last_updated: 2026-08-17

    ncit:C49487:
      d4cg_label: "No"
      description: "The non-affirmative response to a question."
      last_updated: 2026-08-17

    ncit:C49488:
      d4cg_label: "Yes"
      description: "The affirmative response to a question."
      last_updated: 2026-08-17

    ncit:C49489:
      d4cg_label: "outcome"
      description: "A condition or event that is attributed to the adverse event and is the result or conclusion of the adverse event."
      last_updated: 2026-08-17

    ncit:C49494:
      d4cg_label: "Not Recovered"
      description: "One of the possible results of an adverse event outcome that indicates that the event has not improved or recuperated."
      last_updated: 2026-08-17

    ncit:C49495:
      d4cg_label: "Recovered with Sequelae"
      description: "One of the possible results of an adverse event outcome where the subject recuperated but retained pathological conditions resulting from the prior disease or injury."
      last_updated: 2026-08-17

    ncit:C49498:
      d4cg_label: "Recovered"
      description: "One of the possible results of an adverse event outcome that indicates that the event has improved or recuperated."
      last_updated: 2026-08-17

    ncit:C49505:
      d4cg_label: "Dose Reduction"
      description: "An indication that a medication schedule was modified by subtraction, either by changing the frequency, strength or amount."
      last_updated: 2026-08-17

    ncit:C4956:
      d4cg_label: "Medulloblastoma, Nodular Desmoplastic"
      description: "A medulloblastoma characterized by the presence of nodular, collagenous areas which do not contain reticulin, surrounded by hypercellular areas which contain an intercellular reticulin fiber network."
      last_updated: 2026-08-17

    ncit:C49668:
      d4cg_label: "cm"
      description: "A basic unit of length equal to one hundredth of a meter or approximately 0.393700787 inch."
      last_updated: 2026-08-17

    ncit:C49670:
      d4cg_label: "mmHg"
      description: "A non-SI unit of pressure equal to 133,332 Pa or 1.316E10-3 standard atmosphere. Use of this unit is generally deprecated by ISO and IUPAC."
      last_updated: 2026-08-17

    ncit:C49671:
      d4cg_label: "kg/m2"
      description: "A unit expressed as kilogram of mass per square meter of area.(NCI)"
      last_updated: 2026-08-17

    ncit:C49672:
      d4cg_label: "vital_measurement_type"
      description: "The act of assessing an individual's current temperature, heart rate, respiratory rate, pulse oxygenation, and blood pressure."
      last_updated: 2026-08-17

    ncit:C49678:
      d4cg_label: "Respiratory Rate"
      description: "A measurement that describes the rate of breathing (inhalation and exhalation) measured within a unit time (typically 1 min)."
      last_updated: 2026-08-17

    ncit:C4968:
      d4cg_label: "Development of SMN"
      description: "A malignant neoplasm that arises from a pre-existing lower grade lesion, or as a result of a primary lesion that has spread to secondary sites, or due to a complication of a cancer treatment."
      last_updated: 2026-08-17

    ncit:C49704:
      d4cg_label: "CTCAE"
      description: "A standard terminology developed and maintained by the National Cancer Institute to report adverse events occurring in cancer clinical trials. The CTCAE contains a grading scale for each adverse event term representing the severity of the event. (NCI)"
      last_updated: 2026-08-17

    ncit:C4973:
      d4cg_label: "Perineurioma"
      description: "A rare, usually benign tumor composed entirely of neoplastic perineurial cells. It may occur in the soft tissues, intraneurally, or in mucosal sites."
      last_updated: 2026-08-17

    ncit:C4980:
      d4cg_label: "Acute"
      description: "A complication of allogeneic bone marrow or blood cell transplantation, occurring within the first three months of transplantation, in which donor lymphoid cells damage the host tissue."
      last_updated: 2026-08-17

    ncit:C4981:
      d4cg_label: "Chronic"
      description: "A complication of allogeneic bone marrow or blood cell transplantation, usually occurring more than three months after transplantation, in which donor lymphoid cells damage the host tissue."
      last_updated: 2026-08-17

    ncit:C50174:
      d4cg_label: "Shunt, NOS"
      description: "An implantable device designed to drain fluid from a body cavity."
      last_updated: 2026-08-17

    ncit:C5041:
      d4cg_label: "Abnormal Speech"
      description: "A term referring to disorders characterized by the disruption of normal speech. It includes stuttering, lisps, dysarthria and voice disorders."
      last_updated: 2026-08-17

    ncit:C50469:
      d4cg_label: "Vitreous Hemorrhage"
      description: "A disorder characterized by blood extravasation into the vitreous humor."
      last_updated: 2026-08-17

    ncit:C50501:
      d4cg_label: "Heart Block"
      description: "A disorder characterized by a dysrhythmia with complete failure of atrial electrical impulse conduction through the AV node to the ventricles."
      last_updated: 2026-08-17

    ncit:C50577:
      d4cg_label: "Cardiac Failure"
      description: "A clinical condition in which the function of the heart is inadequate to meet the metabolic needs of the body."
      last_updated: 2026-08-17

    ncit:C50592:
      d4cg_label: "Hyphema"
      description: "Blood in the anterior eye chamber."
      last_updated: 2026-08-17

    ncit:C50593:
      d4cg_label: "Hypopyon"
      description: "An accumulation of pus in the anterior chamber of the eye."
      last_updated: 2026-08-17

    ncit:C50602:
      d4cg_label: "Blurry Vision/Loss of Vision"
      description: "Decreased ability to see to a degree that requires corrective measures"
      last_updated: 2026-08-17

    ncit:C50634:
      d4cg_label: "Hepatic Dysfunction"
      description: "A finding that indicates abnormal liver function."
      last_updated: 2026-08-17

    ncit:C50910:
      d4cg_label: "Osteopenia"
      description: "A condition in which there is a lower-than-normal bone mass or bone mineral density (the amount of bone mineral contained in a certain amount of bone). Osteopenia is a less severe form of bone loss than osteoporosis."
      last_updated: 2026-08-17

    ncit:C50995:
      d4cg_label: "response"
      description: "Status of the disease treated with radiation therapy at the time of the record."
      last_updated: 2026-08-17

    ncit:C51302:
      d4cg_label: "Hereditary Leiomyomatosis and Renal Cell Carcinoma Syndrome"
      description: "A rare inherited disorder that increases the risk of developing benign (not cancer) tumors of the skin and the uterus (leiomyomas) and malignant (cancer) tumors of the uterus (leiomyosarcoma) and the kidney."
      last_updated: 2026-08-17

    ncit:C51510:
      d4cg_label: "Small Bowel Resection"
      description: "Surgical removal of part or all of the small intestine."
      last_updated: 2026-08-17

    ncit:C51588:
      d4cg_label: "Lower Endoscopy, Flexible Sigmoidoscopy"
      description: "Examination of the luminal surface of the sigmoid colon, using a flexible fiberoptic endoscope."
      last_updated: 2026-08-17

    ncit:C51605:
      d4cg_label: "Salpingectomy"
      description: "Surgery to remove part or all of the fallopian tube(s)."
      last_updated: 2026-08-17

    ncit:C51646:
      d4cg_label: "Nephroureterectomy/Ureterectomy"
      description: "Surgery to remove a kidney and its ureter."
      last_updated: 2026-08-17

    ncit:C51687:
      d4cg_label: "Appendectomy"
      description: "Surgery to remove the appendix (small finger-shaped pouch at the end of the first part of the large intestine)."
      last_updated: 2026-08-17

    ncit:C51695:
      d4cg_label: "Total Abdominal Hysterectomy"
      description: "Surgical removal of all of the uterus, via an abdominal approach."
      last_updated: 2026-08-17

    ncit:C51758:
      d4cg_label: "Roux-En-Y"
      description: "Surgical procedure in which the stomach is connected to the jejunum, bypassing the duodenum."
      last_updated: 2026-08-17

    ncit:C51761:
      d4cg_label: "Total Abdominal Hysterectomy With A Bilateral Salpingo-Oophorectomy"
      description: "Surgical removal of all of the uterus, and the right and left fallopian tubes, and the right and left ovaries."
      last_updated: 2026-08-17

    ncit:C51765:
      d4cg_label: "Bilateral Salpingo-Oophorectomy"
      description: "Surgery to remove both fallopian tubes, as well as both ovaries."
      last_updated: 2026-08-17

    ncit:C51773:
      d4cg_label: "Married"
      description: "A current marriage contract is active. (HL7)"
      last_updated: 2026-08-17

    ncit:C51774:
      d4cg_label: "Never Married"
      description: "Indicates a person who has never been married or whose marriages have been annulled."
      last_updated: 2026-08-17

    ncit:C51775:
      d4cg_label: "Widowed"
      description: "Indicates a person who is no longer married because of the death of his/her spouse and has not remarried."
      last_updated: 2026-08-17

    ncit:C51776:
      d4cg_label: "Divorced"
      description: "Indicates a person whose marriage has been legally dissolved and has not remarried."
      last_updated: 2026-08-17

    ncit:C51824:
      d4cg_label: "evaluator"
      description: "A person who determines the significance, worth, or condition of something by careful appraisal and study."
      last_updated: 2026-08-17

    ncit:C51903:
      d4cg_label: "Osteotomy"
      description: "Surgical cutting or removal of bone."
      last_updated: 2026-08-17

    ncit:C51933:
      d4cg_label: "Total Pancreatectomy"
      description: "Surgical excision of all or part of the pancreas and duodenum."
      last_updated: 2026-08-17

    ncit:C51944:
      d4cg_label: "markers"
      description: "A diagnostic test in which an antibody is used to link a cellular antigen specifically to a stain that can be seen with a microscope."
      last_updated: 2026-08-17

    ncit:C51946:
      d4cg_label: "RBC"
      description: "A measurement of the total erythrocytes in a biological specimen."
      last_updated: 2026-08-17

    ncit:C51947:
      d4cg_label: "Reticulocyte Count"
      description: "A measurement of the reticulocytes in a biological specimen."
      last_updated: 2026-08-17

    ncit:C51948:
      d4cg_label: "Leukocyte Count"
      description: "A measurement of the leukocytes in a biological specimen."
      last_updated: 2026-08-17

    ncit:C51950:
      d4cg_label: "Neutrophil Count"
      description: "A test to determine the number of neutrophils in a sample of blood."
      last_updated: 2026-08-17

    ncit:C51951:
      d4cg_label: "Platelets"
      description: "A measurement of the platelets (non-nucleated thrombocytes) in a biological specimen."
      last_updated: 2026-08-17

    ncit:C51962:
      d4cg_label: "qPCR"
      description: "A modified polymerase chain reaction (PCR) technique in which DNA amplification is detected and quantified as the PCR reaction progresses, through the use of fluorescent DNA probes in the reaction mixture."
      last_updated: 2026-08-17

    ncit:C52102:
      d4cg_label: "RB1 Allele"
      description: "Human RB1 wild-type allele is located in the vicinity of 13q14.2 and is approximately 178 kb in length. This allele, which encodes retinoblastoma-associated protein, is involved in the modulation of cellular proliferation. Mutation or deletion of the wild-type allele is a factor in the childhood onset of hereditary retinal cancer."
      last_updated: 2026-08-17

    ncit:C52183:
      d4cg_label: "Romiplostim"
      description: "A drug used to treat patients with immune thrombocytopenic purpura (ITP) who do not get better with other forms of treatment. In ITP, platelets (cells that cause blood clots to form) are destroyed by the immune system. Romiplostim is being studied as a way to treat low platelet counts caused by chemotherapy. It binds to the thrombopoietin receptor and causes the bone marrow to make more platelets. Romiplostim is also being studied in the treatment of myelodysplastic syndromes (a group of diseases in which the bone marrow does not make enough healthy blood cells). It is a type of thrombopoietin agonist."
      last_updated: 2026-08-17

    ncit:C52200:
      d4cg_label: "Cabozantinib"
      description: "An orally bioavailable, small molecule receptor tyrosine kinase (RTK) inhibitor with potential antineoplastic activity. Cabozantinib strongly binds to and inhibits several RTKs, which are often overexpressed in a variety of cancer cell types, including hepatocyte growth factor receptor (MET), RET (rearranged during transfection), vascular endothelial growth factor receptor types 1 (VEGFR-1), 2 (VEGFR-2), and 3 (VEGFR-3), mast/stem cell growth factor (KIT), FMS-like tyrosine kinase 3 (FLT-3), TIE-2 (TEK tyrosine kinase, endothelial), tropomyosin-related kinase B (TRKB) and AXL. This may result in an inhibition of both tumor growth and angiogenesis, and eventually lead to tumor regression."
      last_updated: 2026-08-17

    ncit:C52714:
      d4cg_label: "Cortical"
      description: "The dense or compact outer layer of tissue that covers the bone."
      last_updated: 2026-08-17

    ncit:C52723:
      d4cg_label: "Metaphysis"
      description: "An area of a long bone located at the junction of the diaphysis and epiphysis, which harbors the epiphyseal plate in immature bones."
      last_updated: 2026-08-17

    ncit:C52749:
      d4cg_label: "Leg Skin"
      description: "The integument that covers the leg."
      last_updated: 2026-08-17

    ncit:C52753:
      d4cg_label: "Hand Skin"
      description: "The integument that covers the hand."
      last_updated: 2026-08-17

    ncit:C52754:
      d4cg_label: "Arm Skin"
      description: "The integument that covers the arm."
      last_updated: 2026-08-17

    ncit:C52756:
      d4cg_label: "Neck Skin"
      description: "A zone of skin that is part of a neck [Automatically generated definition]."
      last_updated: 2026-08-17

    ncit:C52758:
      d4cg_label: "Abdominal Skin"
      description: "The integument that covers the abdomen."
      last_updated: 2026-08-17

    ncit:C52771:
      d4cg_label: "Hand Bone"
      description: "A bone of the finger."
      last_updated: 2026-08-17

    ncit:C52772:
      d4cg_label: "Foot Phalanges"
      description: "A bone of the foot. (NCI)"
      last_updated: 2026-08-17

    ncit:C52799:
      d4cg_label: "Talus"
      description: "The bone of the foot that connects with the tibia and fibula to form the ankle joint."
      last_updated: 2026-08-17

    ncit:C528:
      d4cg_label: "Human Chorionic Gonadotropin (hCG)"
      description: "A recombinant therapeutic agent which is chemically identical to or similar to the endogenous glycoprotein hormone human chorionic gonadotropin (HCG).  HCG binds to cells of the corpus luteum, thereby stimulating progesterone production and helping to maintain a secretory endometrium. (NCI04)"
      last_updated: 2026-08-17

    ncit:C53146:
      d4cg_label: "Popliteal Nodes"
      description: "Lymph node located within the fat layer of the knee joint."
      last_updated: 2026-08-17

    ncit:C53256:
      d4cg_label: "Unrelated"
      description: "A characteristic used to qualify the adverse event as clearly not related to the medical intervention."
      last_updated: 2026-08-17

    ncit:C53257:
      d4cg_label: "Unlikely"
      description: "A characteristic used to qualify the adverse event as unlikely related to the medical intervention. According to WHO causality assessment criteria of suspected adverse reactions it is applicable to a clinical event, including laboratory test abnormality, with a temporal relationship to the medical intervention which makes a causal relationship improbable, and in which other interventions or underlying disease provide plausible explanations."
      last_updated: 2026-08-17

    ncit:C53258:
      d4cg_label: "Possible"
      description: "A characteristic indicating that an adverse event may be related to the medical intervention. According to WHO causality assessment criteria of suspected adverse reactions it is applicable to a clinical event, including laboratory test abnormality, with a reasonable time sequence to administration of the drug, but which could also be explained by concurrent disease or other drugs or chemicals. Information on drug withdrawal may be lacking or unclear."
      last_updated: 2026-08-17

    ncit:C53260:
      d4cg_label: "Definite"
      description: "A characteristic used to qualify the adverse event as certainly related to the medical intervention. According to WHO causality assessment criteria of suspected adverse reactions it is applicable to a clinical event, including laboratory test abnormality, occurring in a plausible time relationship to medical intervention, and which cannot be explained by concurrent disease or other interventions. The response to withdrawal of the medical product (dechallenge) should be clinically plausible. The event must be definitive pharmacologically or phenomenologically, using a satisfactory rechallenge procedure if necessary."
      last_updated: 2026-08-17

    ncit:C53262:
      d4cg_label: "Domestic Partnership"
      description: "Indicates a person who is a member of an unmarried couple, including same sex couples, living together in longstanding relationships, that are registered or unregistered."
      last_updated: 2026-08-17

    ncit:C53263:
      d4cg_label: "condition_other"
      description: "Relevant elements of medical history, including preexisting medical conditions, events and facts (e.g., allergies, race, pregnancy, smoking and alcohol use, hepatic/renal dysfunction, etc.) not listed in MedWatch form."
      last_updated: 2026-08-17

    ncit:C53312:
      d4cg_label: "Retrospective Research"
      description: "A study in which participants with known outcomes are assessed based on data collected before the study."
      last_updated: 2026-08-17

    ncit:C53457:
      d4cg_label: "Multiple Osteochondromas"
      description: "An autosomal dominant neoplastic chondrogenic process affecting multiple sites. It is caused by mutations in the EXT1 or EXT2 genes.  Grossly and microscopically, the lesions resemble an osteochondroma."
      last_updated: 2026-08-17

    ncit:C53606:
      d4cg_label: "ae_tx_mod"
      description: "An indication that a change in treatment or a change to a device will be required following an adverse event."
      last_updated: 2026-08-17

    ncit:C53686:
      d4cg_label: "Atypical Choroid Plexus Papilloma"
      description: "A choroid plexus papilloma characterized by increased mitotic activity."
      last_updated: 2026-08-17

    ncit:C53953:
      d4cg_label: "Osteoblastic Osteosarcoma"
      description: "A conventional osteosarcoma characterized by the predominance of osteoid matrix."
      last_updated: 2026-08-17

    ncit:C53977:
      d4cg_label: "RECQL4 mutation"
      description: "A change in the nucleotide sequence of the RECQL4 gene."
      last_updated: 2026-08-17

    ncit:C53999:
      d4cg_label: "Gastrointestinal Stromal Tumor, Malignant"
      description: "A gastrointestinal stromal tumor that is characterized by large size (diameter greater than 10 cm for gastric localization and greater than 5 cm for intestinal localization) or more than 5 mitotic figures per 50 high power fields."
      last_updated: 2026-08-17

    ncit:C54000:
      d4cg_label: "Gastrointestinal Stromal Tumor, Uncertain Malignant Potential"
      description: "A gastrointestinal stromal tumor that is characterized by a maximum diameter greater than 5 cm and equal or less than 10 cm (gastric localization), or greater than 2 cm and equal or less than 5 cm (intestinal localization) and no more than 5 mitotic figures per 50 high power fields."
      last_updated: 2026-08-17

    ncit:C54039:
      d4cg_label: "Medulloblastoma, Classic"
      description: "A medulloblastoma composed of malignant cells with hyperchromatic nucleus and scanty cytoplasm.  Homer Wright rosettes may be present."
      last_updated: 2026-08-17

    ncit:C54071:
      d4cg_label: "Substitution"
      description: "The act of putting one thing or person in the place of another."
      last_updated: 2026-08-17

    ncit:C54179:
      d4cg_label: "Ann Arbor"
      description: "The Ann Arbor system classifies lymphoma into four stages based on anatomic lymph nodal group involvement. Disease confined to one nodal group or location defines stage I. Disease limited to one side of the diaphragm, (the muscle separating the chest from the abdomen), defines stage II. Stage III patients have disease on both sides of the diaphragm and stage IV patients once again have disseminated disease. Consideration of involvement of the liver, spleen, and bone marrow are also considered in this system. Finally, the stage is subdivided into categories of A and B depending on the presence of symptoms of itching, weight loss, fever, and night sweats. Those having symptoms receive the designation \"B\" and have a worse prognosis."
      last_updated: 2026-08-17

    ncit:C5461:
      d4cg_label: "CNS Germ Cell Tumors"
      description: "A unique group of rare tumors of the central nervous system that affect mainly children and adolescents. Their morphologic and biologic profile corresponds to that of homologous germ cell tumors that arise in the gonads and in other extragonadal sites. Representative examples include: germinoma, embryonal carcinoma, yolk sac tumor, choriocarcinoma, and teratoma."
      last_updated: 2026-08-17

    ncit:C54767:
      d4cg_label: "Atrial Fibrillation"
      description: "A disorder characterized by a dysrhythmia without discernible P waves and an irregular ventricular response due to multiple reentry circuits. The rhythm disturbance originates above the ventricles."
      last_updated: 2026-08-17

    ncit:C54768:
      d4cg_label: "Atrial Flutter"
      description: "A disorder characterized by a dysrhythmia with organized rhythmic atrial contractions with a rate of 200-300 beats per minute. The rhythm disturbance originates in the atria."
      last_updated: 2026-08-17

    ncit:C54771:
      d4cg_label: "Mobitz Type I"
      description: "A disorder characterized by a dysrhythmia with a progressively lengthening PR interval prior to the blocking of an atrial impulse. This is the result of intermittent failure of atrial electrical impulse conduction through the atrioventricular (AV) node to the ventricles."
      last_updated: 2026-08-17

    ncit:C54772:
      d4cg_label: "Mobitz (Type) Ii Atrioventricular Block"
      description: "A disorder characterized by a dysrhythmia with relatively constant PR interval prior to the block of an atrial impulse. This is the result of intermittent failure of atrial electrical impulse conduction through the atrioventricular (AV) node to the ventricles."
      last_updated: 2026-08-17

    ncit:C54935:
      d4cg_label: "Palpitations"
      description: "A disorder characterized by an unpleasant sensation of irregular and/or forceful beating of the heart."
      last_updated: 2026-08-17

    ncit:C54938:
      d4cg_label: "Sick Sinus Syndrome"
      description: "A disorder characterized by a dysrhythmia with alternating periods of bradycardia and atrial tachycardia accompanied by syncope, fatigue and dizziness."
      last_updated: 2026-08-17

    ncit:C54940:
      d4cg_label: "Sinus Bradycardia"
      description: "A disorder characterized by a dysrhythmia with a heart rate less than 60 beats per minute that originates in the sinus node."
      last_updated: 2026-08-17

    ncit:C54945:
      d4cg_label: "Supraventricular Tachycardia"
      description: "A disorder characterized by a dysrhythmia with a heart rate greater than 100 beats per minute that originates above the ventricles."
      last_updated: 2026-08-17

    ncit:C55067:
      d4cg_label: "Pericarditis"
      description: "A disorder characterized by irritation to the layers of the pericardium (the protective sac around the heart)."
      last_updated: 2026-08-17

    ncit:C55069:
      d4cg_label: "Restrictive Cardiomyopathy"
      description: "A disorder characterized by an inability of the ventricles to fill with blood because the myocardium (heart muscle) stiffens and loses its flexibility."
      last_updated: 2026-08-17

    ncit:C55070:
      d4cg_label: "Right Ventricular Dysfunction"
      description: "A disorder characterized by impairment of right ventricular function associated with low ejection fraction and a decrease in motility of the right ventricular wall."
      last_updated: 2026-08-17

    ncit:C55339:
      d4cg_label: "Weight Loss"
      description: "A finding characterized by a decrease in overall body weight; for pediatrics, less than the baseline growth curve."
      last_updated: 2026-08-17

    ncit:C55367:
      d4cg_label: "CNS Necrosis"
      description: ""
      last_updated: 2026-08-17

    ncit:C55368:
      d4cg_label: "Neck Fibrosis"
      description: "Asymptomatic, detected on exam/testing only"
      last_updated: 2026-08-17

    ncit:C55369:
      d4cg_label: "Spinal Cord Toxicity"
      description: "Symptomatic, not interfering with ADL"
      last_updated: 2026-08-17

    ncit:C55606:
      d4cg_label: "modification_required"
      description: "Asymmetry of nipple areolar complex with slight deviation in nipple projection"
      last_updated: 2026-08-17

    ncit:C55742:
      d4cg_label: "Delayed Puberty"
      description: "A disorder characterized by unusually late sexual maturity."
      last_updated: 2026-08-17

    ncit:C55748:
      d4cg_label: "Adrenal Insufficiency"
      description: "A disorder characterized by the adrenal cortex not producing enough of the hormone cortisol and in some cases, the hormone aldosterone. It may be due to a disorder of the adrenal cortex as in Addison's disease or primary adrenal insufficiency."
      last_updated: 2026-08-17

    ncit:C55842:
      d4cg_label: "Glaucoma"
      description: "A disorder characterized by an increase in pressure in the eyeball due to obstruction of the aqueous humor outflow."
      last_updated: 2026-08-17

    ncit:C55847:
      d4cg_label: "Keratitis"
      description: "A disorder characterized by inflammation to the cornea of the eye."
      last_updated: 2026-08-17

    ncit:C55891:
      d4cg_label: "Retinopathy"
      description: "A disorder involving the retina."
      last_updated: 2026-08-17

    ncit:C55901:
      d4cg_label: "Uveitis"
      description: "A disorder characterized by inflammation to the uvea of the eye."
      last_updated: 2026-08-17

    ncit:C55906:
      d4cg_label: "Blurred Vision"
      description: "A disorder characterized by visual perception of unclear or fuzzy images."
      last_updated: 2026-08-17

    ncit:C564:
      d4cg_label: "Ifosfamide"
      description: "A drug that is used with other drugs to treat germ cell testicular cancer that did not respond to previous treatment with other drugs. It is also being studied in the treatment of other types of cancer. Ifex attaches to DNA in cells and may kill cancer cells. It is a type of alkylating agent and a type of antimetabolite."
      last_updated: 2026-08-17

    ncit:C56542:
      d4cg_label: "Ileal Hemorrhage"
      description: "A disorder characterized by bleeding from the ileal wall."
      last_updated: 2026-08-17

    ncit:C56543:
      d4cg_label: "Jejunal Hemorrhage"
      description: "A disorder characterized by bleeding from the jejunal wall."
      last_updated: 2026-08-17

    ncit:C56551:
      d4cg_label: "Oral Hemorrhage"
      description: "A disorder characterized by bleeding from the mouth."
      last_updated: 2026-08-17

    ncit:C56554:
      d4cg_label: "Pancreatic Hemorrhage"
      description: "A disorder characterized by bleeding from the pancreas."
      last_updated: 2026-08-17

    ncit:C56560:
      d4cg_label: "Rectal Hemorrhage"
      description: "A disorder characterized by bleeding from the rectal wall and discharged from the anus."
      last_updated: 2026-08-17

    ncit:C57134:
      d4cg_label: "Colitis"
      description: "A disorder characterized by inflammation of the colon."
      last_updated: 2026-08-17

    ncit:C57141:
      d4cg_label: "Constipation"
      description: "A disorder characterized by irregular and infrequent or difficult evacuation of the bowels."
      last_updated: 2026-08-17

    ncit:C57788:
      d4cg_label: "Diarrhea"
      description: "A disorder characterized by an increase in frequency and/or loose or watery bowel movements."
      last_updated: 2026-08-17

    ncit:C57789:
      d4cg_label: "Duodenal Fistula"
      description: "A disorder characterized by an abnormal communication between the duodenum and another organ or anatomic site."
      last_updated: 2026-08-17

    ncit:C57795:
      d4cg_label: "Dysphagia"
      description: "A disorder characterized by difficulty in swallowing."
      last_updated: 2026-08-17

    ncit:C57797:
      d4cg_label: "Esophagitis"
      description: "A disorder characterized by inflammation of the esophageal wall."
      last_updated: 2026-08-17

    ncit:C57798:
      d4cg_label: "Esophageal Fistula"
      description: "A disorder characterized by an abnormal communication between the esophagus and another organ or anatomic site."
      last_updated: 2026-08-17

    ncit:C57807:
      d4cg_label: "Flatulence"
      description: "A disorder characterized by a discharge of excessive gas from the lower GI tract."
      last_updated: 2026-08-17

    ncit:C57812:
      d4cg_label: "Gastritis"
      description: "A disorder characterized by inflammation of the stomach."
      last_updated: 2026-08-17

    ncit:C57814:
      d4cg_label: "Ileus"
      description: "A disorder characterized by failure of the ileum to transport intestinal contents."
      last_updated: 2026-08-17

    ncit:C57821:
      d4cg_label: "Ileal Fistula"
      description: "A disorder characterized by an abnormal communication between the ileum and another organ or anatomic site."
      last_updated: 2026-08-17

    ncit:C57823:
      d4cg_label: "Ileal Obstruction"
      description: "A disorder characterized by blockage of the normal flow of the intestinal contents in the ileum."
      last_updated: 2026-08-17

    ncit:C57826:
      d4cg_label: "Ileal Ulcer"
      description: "A disorder characterized by a circumscribed, erosive lesion on the mucosal surface of the ileum."
      last_updated: 2026-08-17

    ncit:C57827:
      d4cg_label: "Jejunal Fistula"
      description: "A disorder characterized by an abnormal communication between the jejunum and another organ or anatomic site."
      last_updated: 2026-08-17

    ncit:C57829:
      d4cg_label: "Jejunal Obstruction"
      description: "A disorder characterized by blockage of the normal flow of the intestinal contents in the jejunum."
      last_updated: 2026-08-17

    ncit:C57832:
      d4cg_label: "Jejunal Ulcer"
      description: "A disorder characterized by a circumscribed, erosive lesion on the mucosal surface of the jejunum."
      last_updated: 2026-08-17

    ncit:C57838:
      d4cg_label: "Malabsorption"
      description: "A disorder characterized by inadequate absorption of nutrients in the small intestine. Symptoms include abdominal marked discomfort, bloating and diarrhea."
      last_updated: 2026-08-17

    ncit:C57845:
      d4cg_label: "Pancreatic Fistula"
      description: "A disorder characterized by an abnormal communication between the pancreas and another organ or anatomic site."
      last_updated: 2026-08-17

    ncit:C57849:
      d4cg_label: "Periodontal Disease"
      description: "A disorder in the gingival tissue around the teeth."
      last_updated: 2026-08-17

    ncit:C57850:
      d4cg_label: "Peritoneal Necrosis"
      description: "A disorder characterized by a necrotic process occurring in the peritoneum."
      last_updated: 2026-08-17

    ncit:C57857:
      d4cg_label: "Proctitis"
      description: "A disorder characterized by inflammation of the rectum."
      last_updated: 2026-08-17

    ncit:C57859:
      d4cg_label: "Rectal Fistula"
      description: "A disorder characterized by an abnormal communication between the rectum and another organ or anatomic site."
      last_updated: 2026-08-17

    ncit:C57863:
      d4cg_label: "Rectal Necrosis"
      description: "A disorder characterized by a necrotic process occurring in the rectal wall."
      last_updated: 2026-08-17

    ncit:C57864:
      d4cg_label: "Rectal Obstruction"
      description: "A disorder characterized by blockage of the normal flow of the intestinal contents in the rectum."
      last_updated: 2026-08-17

    ncit:C57867:
      d4cg_label: "Rectal Ulcer"
      description: "A disorder characterized by a circumscribed, erosive lesion on the mucosal surface of the rectum."
      last_updated: 2026-08-17

    ncit:C57868:
      d4cg_label: "Salivary Gland Fistula"
      description: "A disorder characterized by an abnormal communication between a salivary gland and another organ or anatomic site."
      last_updated: 2026-08-17

    ncit:C57901:
      d4cg_label: "Cheilitis"
      description: "A disorder characterized by inflammation of the lip."
      last_updated: 2026-08-17

    ncit:C58404:
      d4cg_label: "Trismus"
      description: "A disorder characterized by lack of ability to open the mouth fully due to a decrease in the range of motion of the muscles of mastication."
      last_updated: 2026-08-17

    ncit:C603:
      d4cg_label: "Isotretinoin"
      description: "A drug that is used in the treatment of acne and psoriasis and is being studied in cancer prevention. It is a type of retinoid."
      last_updated: 2026-08-17

    ncit:C60702:
      d4cg_label: "Random"
      description: "Governed by or depending on chance; lacking any definite plan or order or purpose."
      last_updated: 2026-08-17

    ncit:C60781:
      d4cg_label: "Astrocytoma Tumors"
      description: "A malignant neoplasm of the central nervous system that arises from astrocytes."
      last_updated: 2026-08-17

    ncit:C61019:
      d4cg_label: "Blood Urea Nitrogen"
      description: "A quantitative measurement of the amount of urea nitrogen present in a serum sample."
      last_updated: 2026-08-17

    ncit:C61032:
      d4cg_label: "Total Cholesterol"
      description: "A quantitative measurement of the total amount of cholesterol present in a sample of serum."
      last_updated: 2026-08-17

    ncit:C61235:
      d4cg_label: "Shwachman-Diamond Syndrome"
      description: "A rare, autosomal recessive disorder characterized by exocrine pancreas insufficiency, skeletal abnormalities, bone marrow dysfunction, and an increased incidence of leukemia."
      last_updated: 2026-08-17

    ncit:C61236:
      d4cg_label: "Diamond-Blackfan Anemia"
      description: "A very rare disorder in which the bone marrow doesn't make enough red blood cells. It is usually seen in the first year of life. Patients may have deformed thumbs and other physical problems. They also have an increased risk of leukemia and sarcoma, especially osteosarcoma (bone cancer). Patients with congenital pure red cell aplasia may have a mutation (change) in one of the genes that make proteins found in the cell's ribosomes."
      last_updated: 2026-08-17

    ncit:C61246:
      d4cg_label: "X-linked Lymphoproliferative Syndrome"
      description: "An X-linked immunodeficiency syndrome that exclusively affects males, although females can be carriers. It is caused by mutation(s) in SH2D1A and/or XIAP genes and is characterized by life-threatening episodes of infectious mononucleosis, hypogammaglobulinemia, and subsequent development of lymphomas (usually B-cell lymphomas) and other lymphoproliferative disorders."
      last_updated: 2026-08-17

    ncit:C61313:
      d4cg_label: "Denosumab"
      description: "A fully human monoclonal antibody directed against the receptor activator of nuclear factor kappa beta ligand (RANKL) with antiosteoclast activity. Denosumab specifically binds to RANKL and blocks the interaction of RANKL with RANK, a receptor located on osteoclast cell surfaces, resulting in inhibition of osteoclast activity, a decrease in bone resorption, and a potential increase in bone mineral density. RANKL, a protein expressed by osteoblastic cells, plays an important role in osteoclastic differentiation and activation."
      last_updated: 2026-08-17

    ncit:C61443:
      d4cg_label: "Amenorrhea"
      description: "The absence of menses in a female individual who has achieved reproductive age."
      last_updated: 2026-08-17

    ncit:C61527:
      d4cg_label: "Atorvastatin"
      description: "A synthetic lipid-lowering agent. Atorvastatin competitively inhibits hepatic hydroxymethyl-glutaryl coenzyme A (HMG-CoA) reductase, the enzyme which catalyzes the conversion of HMG-CoA to mevalonate, a key step in cholesterol synthesis. Atorvastatin also increases the number of LDL receptors on hepatic cell surfaces to enhance uptake and catabolism of LDL and reduces LDL production and the number of LDL particles. This agent lowers plasma cholesterol and lipoprotein levels and modulates immune responses by suppressing MHC II (major histocompatibility complex II) on interferon gamma-stimulated, antigen-presenting cells such as human vascular endothelial cells. (NCI04)"
      last_updated: 2026-08-17

    ncit:C61538:
      d4cg_label: "consortium"
      description: "A group formed to undertake a venture that is beyond the capabilities of the individual members. Each member of the consortium brings a high level of expertise in a specific area to ensure the successful completion of the project."
      last_updated: 2026-08-17

    ncit:C61612:
      d4cg_label: "Metformin"
      description: "A specific agent belonging to the biguanide class of antihyperglycemic agents"
      last_updated: 2026-08-17

    ncit:C61614:
      d4cg_label: "Pemetrexed"
      description: "A synthetic pyrimidine-based antifolate. Pemetrexed binds to and inhibits the enzyme thymidylate synthase (TS), which catalyses the methylation of 2'-deoxyuridine-5'-monophosphate (dUMP) to 2'-deoxythymidine-5'-monophosphate (dTMP), an essential precursor in DNA synthesis."
      last_updated: 2026-08-17

    ncit:C61840:
      d4cg_label: "Methamphetamines"
      description: "An amphetamine with central nervous system (CNS) stimulating activity. Methamphetamine acts by both facilitating the release of catecholamines, particularly noradrenaline, dopamine and serotonin, from nerve terminals in the brain and by inhibiting their uptake. This leads to an increase in synaptic concentration of these neurotransmitters and results in increased stimulation of postsynaptic receptors."
      last_updated: 2026-08-17

    ncit:C61948:
      d4cg_label: "Sorafenib"
      description: "A drug used to treat advanced kidney cancer and a type of liver cancer that cannot be removed by surgery. It is also being studied in the treatment of other types of cancer. Sorafenib stops cells from dividing and may prevent the growth of new blood vessels that tumors need to grow. It is a type of kinase inhibitor and a type of antiangiogenesis agent."
      last_updated: 2026-08-17

    ncit:C62040:
      d4cg_label: "Irinotecan"
      description: "A semisynthetic derivative of camptothecin, a cytotoxic, quinoline-based alkaloid extracted from the Asian tree Camptotheca acuminata.  Irinotecan, a prodrug, is converted to a biologically active metabolite 7-ethyl-10-hydroxy-camptothecin (SN-38) by a carboxylesterase-converting enzyme.  One thousand-fold more potent than its parent compound irinotecan, SN-38 inhibits topoisomerase I activity by stabilizing the cleavable complex between topoisomerase I and DNA, resulting in DNA breaks that inhibit DNA replication and trigger apoptotic cell death.  Because ongoing DNA synthesis is necessary for irinotecan to exert its cytotoxic effects, it is classified as an S-phase-specific agent."
      last_updated: 2026-08-17

    ncit:C62051:
      d4cg_label: "Morphine"
      description: "An opiate alkaloid isolated from the plant Papaver somniferum and produced synthetically. Morphine binds to and activates specific opiate receptors (delta, mu and kappa), each of which are involved in controlling different brain functions. In the central nervous and gastrointestinal systems, this agent exhibits widespread effects including analgesia, anxiolysis, euphoria, sedation, respiratory depression, and gastrointestinal system smooth muscle contraction. (NCI04)"
      last_updated: 2026-08-17

    ncit:C62056:
      d4cg_label: "Nitrogen Mustard"
      description: "A synthetic agent related to sulphur mustard with antineoplastic and immunosuppressive properties. Nitrogen mustard (a member of a family of chemotherapy agents including cyclophosphamide and chlorambucil) is an irritant and carcinogenic agent metabolized to a highly reactive ethylene immonium derivative; the ethylene immonium derivative alkylates DNA and inhibits DNA replication. This agent also exhibits lympholytic properties. (NCI04)"
      last_updated: 2026-08-17

    ncit:C62072:
      d4cg_label: "Procarbazine"
      description: "A methylhydrazine derivative with antineoplastic and mutagenic activities. Although the exact mode of cytotoxicity has not been elucidated, procarbazine, after metabolic activation, appears to inhibit the trans-methylation of methionine into transfer RNA (t-RNA), thereby preventing protein synthesis and consequently DNA and RNA synthesis. This agent may also undergo auto-oxidation, resulting in the formation of cytotoxic free radicals which damage DNA through an alkylation reaction."
      last_updated: 2026-08-17

    ncit:C62195:
      d4cg_label: "Wild Type"
      description: "The naturally-occurring, normal, non-mutated version of a gene or genome."
      last_updated: 2026-08-17

    ncit:C62198:
      d4cg_label: "Nonsense"
      description: "A mutation that alters the genetic code in a way that causes the premature termination of a protein. The altered protein may be partially or completely inactivated, resulting in a change or loss of protein function."
      last_updated: 2026-08-17

    ncit:C62199:
      d4cg_label: "Inframe"
      description: "A mutation occurring within the protein-coding region of a gene which results in a retention of the reading frame of the encoded protein."
      last_updated: 2026-08-17

    ncit:C62216:
      d4cg_label: "NSE"
      description: "Gamma-enolase (434 aa, ~47 kDa) is encoded by the human ENO2 gene. This protein is involved in glycolysis, neurotrophy and neuroprotection."
      last_updated: 2026-08-17

    ncit:C62222:
      d4cg_label: "Not Evaluable"
      description: "Unable to be evaluated."
      last_updated: 2026-08-17

    ncit:C62359:
      d4cg_label: "Health Profile"
      description: "Measures a person's perceptions of the social impact of oral disorders on their well-being; measures self-reported dysfunction, discomfort and disability attributed to oral conditions."
      last_updated: 2026-08-17

    ncit:C62394:
      d4cg_label: "WHO CNS >> Grade 1"
      description: "Describes central nervous system tumors that are generally low malignancy, non-infiltrative, and slow growing. Often they can be cured by surgery alone and there is a good chance of long term survival."
      last_updated: 2026-08-17

    ncit:C62395:
      d4cg_label: "WHO CNS >> Grade 2"
      description: "Describes central nervous system tumors that are generally relatively slow growing and somewhat infiltrative. They may recur after treatment."
      last_updated: 2026-08-17

    ncit:C62396:
      d4cg_label: "WHO CNS >> Grade 3"
      description: "Describes central nervous system tumors that are generally malignant and infiltrative. They tend to recur after treatment."
      last_updated: 2026-08-17

    ncit:C62397:
      d4cg_label: "WHO CNS >> Grade 4"
      description: "Describes central nervous system tumors that are generally highly malignant, show rapid and aggressive growth, widely infiltrative, and prone to necrosis. They often recur rapidly after treatment."
      last_updated: 2026-08-17

    ncit:C62484:
      d4cg_label: "Chest Wall"
      description: "Subdivision of thorax which includes all structures from the skin to the costal pleura. Examples: There is only one chest wall."
      last_updated: 2026-08-17

    ncit:C62505:
      d4cg_label: "Fanconi Anemia"
      description: "A chromosomal instability syndrome that is the most common form of inherited aplastic anemia. It is inherited as an autosomal recessive or X-linked disorder. In addition to bone marrow failure, it is associated with skeletal abnormalities and increased incidence of the development of malignancy. Multiple genes are responsible for Fanconi anemia."
      last_updated: 2026-08-17

    ncit:C62604:
      d4cg_label: "Stem Cell Mobilization"
      description: "Therapy to cause release of stem cells from the bone marrow into the peripheral blood circulation for the purpose of collection."
      last_updated: 2026-08-17

    ncit:C62652:
      d4cg_label: "Uric Acid"
      description: "A waste product left over from normal chemical processes in the body and found in the urine and blood. Abnormal buildup of uric acid in the body may cause a condition called gout. Increased levels of uric acid in the blood and urine can be a side effect of chemotherapy or radiation therapy."
      last_updated: 2026-08-17

    ncit:C62659:
      d4cg_label: "bowel_preparation"
      description: "Purging and cleansing of fecal and other matter from the bowel to assure subsequent clear evaluation of the bowel or to limit complications due to accidental surgical bowel perforation."
      last_updated: 2026-08-17

    ncit:C62714:
      d4cg_label: "Non-Myeloablative"
      description: "A modification of the standard method of allogeneic hematopoietic stem cell transplantation developed to allow for the therapy to be extended to a patient population that is unable to tolerate treatment with the conventional procedure due to its toxicity."
      last_updated: 2026-08-17

    ncit:C62731:
      d4cg_label: "EBRT, Tomotherapy"
      description: "A type of external beam radiation therapy in which the radiation is delivered slice-by-slice, providing sequential delivery of radiation to different parts of the tumor. This method differs from other forms of radiation therapy in which the entire tumor volume is irradiated at one time."
      last_updated: 2026-08-17

    ncit:C62798:
      d4cg_label: "Restrictive Cardiomyopathy"
      description: "A disorder characterized by an inability of the ventricles to fill with blood because the myocardium (heart muscle) stiffens and loses its flexibility."
      last_updated: 2026-08-17

    ncit:C633:
      d4cg_label: "Melphalan"
      description: "A drug that is used to treat multiple myeloma and ovarian epithelial cancer and is being studied in the treatment of other types of cancer. It belongs to the family of drugs called alkylating agents."
      last_updated: 2026-08-17

    ncit:C63321:
      d4cg_label: "ANC"
      description: "A measurement of the neutrophils in a biological specimen."
      last_updated: 2026-08-17

    ncit:C63402:
      d4cg_label: "Carboplatin/Paclitaxel"
      description: "A chemotherapy combination used to treat endometrial, ovarian, head and neck cancers, and non-small cell lung cancer that has spread. It includes the drugs carboplatin and paclitaxel (Taxol)."
      last_updated: 2026-08-17

    ncit:C63593:
      d4cg_label: "FOLFIRI"
      description: "A regimen consisting of leucovorin calcium (calcium folinate), 5-fluorouracil, and irinotecan that can be used in the treatment of ampullary, appendiceal, small bowel, pancreatic and occult primary adenocarcinoma; colorectal, esophageal and esophagogastric junction, gastric, and hepatobiliary cancers; well-differentiated grade 3 neuroendocrine tumors (NETs), and extrapulmonary poorly differentiated neuroendocrine carcinoma, large or small cell carcinoma and mixed neuroendocrine-non-neuroendocrine neoplasm."
      last_updated: 2026-08-17

    ncit:C63594:
      d4cg_label: "FOLFOX"
      description: "A regimen consisting of irinotecan, fluorouracil and leucovorin, all administered as bolus doses, and used for the treatment of advanced stage colorectal cancer."
      last_updated: 2026-08-17

    ncit:C63597:
      d4cg_label: "CapeOx"
      description: "A regimen consisting of capecitabine and oxaliplatin used for the treatment of advanced stage colorectal cancer. This regimen differs from a similar regimen, CAPOX, with regards to the dosing schedule for oxaliplatin."
      last_updated: 2026-08-17

    ncit:C6361:
      d4cg_label: "AJCC >> Stage 1A"
      description: "Stage IA includes: pT1, N0, M0, S0.  pT1: Tumor limited to the testis and epididymis without vascular/lymphatic invasion; tumor may invade into the tunica albuginea but not the tunica vaginalis.  N0: No regional lymph node metastasis.  M0: No distant metastasis.  S0: Marker study levels within normal limits. (AJCC 6th and 7th eds.)"
      last_updated: 2026-08-17

    ncit:C6362:
      d4cg_label: "AJCC >> Stage 1B"
      description: "Stage IB includes: (pT2, N0, M0, S0); (pT3, N0, M0, S0); (pT4, N0, M0, S0).  pT2: Tumor limited to the testis and epididymis with vascular/lymphatic invasion, or tumor extending through the tunica albuginea with involvement of the tunica vaginalis.  pT3: Tumor invades the spermatic cord with or without vascular/lymphatic invasion.  pT4: Tumor invades the scrotum with or without vascular/lymphatic invasion.  N0: No regional lymph node metastasis.  M0: No distant metastasis.  S0: Marker study levels within normal limits. (AJCC 6th and 7th eds.)"
      last_updated: 2026-08-17

    ncit:C6363:
      d4cg_label: "AJCC >> Stage 1s"
      description: "Stage IS includes: Any pT/TX, N0, M0, S1-3.  pTX: Primary tumor cannot be assessed.  N0: No regional lymph node metastasis.  M0: No distant metastasis.  S1: LDH less than 1.5 x N (N indicates the upper limit of normal for the LDH assay) and hCG less than 5,000 and AFP less than 1,000.  S2: LDH 1.5-10 x N or hCG 5,000-50,000 or AFP 1,000-10,000.  S3: LDH more than 10 x N or hCG more than 50,000 or AFP more than 10,000. (AJCC 6th and 7th eds.)"
      last_updated: 2026-08-17

    ncit:C6364:
      d4cg_label: "AJCC >> Stage 2A"
      description: "Stage IIA includes: (Any pT/TX, N1, M0, S0); (Any pT/TX, N1, M0, S1).  pTX: Primary tumor cannot be assessed.  N1: Metastasis with a lymph node mass 2 cm or less in greatest dimension; or multiple lymph nodes, none more than 2cm in greatest dimension.  M0: No distant metastasis. S0: Marker study levels within normal limits. S1: LDH less than 1.5 x N (N indicates the upper limit of normal for the LDH assay) and hCG less than 5,000 and AFP less than 1,000. (AJCC 6th and 7th eds.)"
      last_updated: 2026-08-17

    ncit:C6365:
      d4cg_label: "AJCC >> Stage 2B"
      description: "Stage IIB includes: (Any pT/TX, N2, M0, S0); (Any pT/TX, N2, M0, S1).  pTX: Primary tumor cannot be assessed.  N2: Metastasis with a lymph node mass more than 2 cm but not more than 5 cm in greatest dimension; or multiple lymph nodes, any one mass greater than 2 cm but not more than 5 cm in greatest dimension.  M0: No distant metastasis. S0: Marker study levels within normal limits. S1: LDH less than 1.5 x N (N indicates the upper limit of normal for the LDH assay) and hCG less than 5,000 and AFP less than 1,000.  (AJCC 6th and 7th eds.)"
      last_updated: 2026-08-17

    ncit:C6366:
      d4cg_label: "AJCC >> Stage 2C"
      description: "Stage IIC includes: (Any pT/TX, N3, M0, S0); (Any pT/TX, N3, M0, S1).  pTX: Primary tumor cannot be assessed.  N3: Metastasis with a lymph node mass more than 5 cm in greatest dimension. M0: No distant metastasis. S0: Marker study levels within normal limits. S1: LDH less than 1.5 x N (N indicates the upper limit of normal for the LDH assay) and hCG less than 5,000 and AFP less than 1,000.  (AJCC 6th and 7th eds.)"
      last_updated: 2026-08-17

    ncit:C6367:
      d4cg_label: "AJCC >> Stage 3C"
      description: "Stage IIIC includes: (Any pT/TX, N1-3, M0, S3); (Any pT/TX, Any N, M1a, S3); (Any pT/TX, Any N, M1b, Any S).  N1: Metastasis with a lymph node mass 2 cm or less in greatest dimension; or multiple lymph nodes, none more than 2cm in greatest dimension.  N2: Metastasis with a lymph node mass more than 2 cm but not more than 5 cm in greatest dimension; or multiple lymph nodes, any one mass greater than 2 cm but not more than 5 cm in greatest dimension.  N3: Metastasis with a lymph node mass more than 5 cm in greatest dimension. M0: No distant metastasis. M1a: Non-regional nodal or pulmonary metastasis.  M1b: Distant metastasis other than to non-regional lymph nodes and lung.  S3: LDH more than 10 x N (N indicates the upper limit of normal for the LDH assay) or hCG more than 50,000 or AFP more than 10,000. (AJCC 6th and 7th eds.)"
      last_updated: 2026-08-17

    ncit:C6368:
      d4cg_label: "AJCC >> Stage 3B"
      description: "Stage IIIB includes: (Any pT/TX, N1-3, M0, S2); (Any pT/TX, Any N, M1a, S2).  N1: Metastasis with a lymph node mass 2 cm or less in greatest dimension; or multiple lymph nodes, none more than 2cm in greatest dimension.  N2: Metastasis with a lymph node mass more than 2 cm but not more than 5 cm in greatest dimension; or multiple lymph nodes, any one mass greater than 2 cm but not more than 5 cm in greatest dimension.  N3: Metastasis with a lymph node mass more than 5 cm in greatest dimension. M0: No distant metastasis. M1a: Non-regional nodal or pulmonary metastasis. S2: LDH 1.5-10 x N (N indicates the upper limit of normal for the LDH assay) or hCG 5,000-50,000 or AFP 1,000-10,000.  (AJCC 6th and 7th eds.)"
      last_updated: 2026-08-17

    ncit:C63686:
      d4cg_label: "DOX-IFOS"
      description: "A regimen consisting of doxorubicin and ifosfamide used for the treatment of general soft tissue sarcoma, rhabdomyosarcoma, and uterine sarcoma."
      last_updated: 2026-08-17

    ncit:C6369:
      d4cg_label: "AJCC >> Stage 3A"
      description: "Stage IIIA includes: (Any pT/TX, Any N, M1a, S0); (Any pT/TX, Any N, M1a, S1).  M1a: Non-regional nodal or pulmonary metastasis. S0: Marker study levels within normal limits. S1: LDH less than 1.5 x N (N indicates the upper limit of normal for the LDH assay) and hCG less than 5,000 and AFP less than 1,000.  (AJCC 6th and 7th eds.)"
      last_updated: 2026-08-17

    ncit:C63704:
      d4cg_label: "Video-Assisted Thoroscopic Surgery"
      description: "Thoracic surgery that is aided by the use of a video camera."
      last_updated: 2026-08-17

    ncit:C63705:
      d4cg_label: "Infraclavicular Lymph Node"
      description: "A lymph node located in the area below the clavicle."
      last_updated: 2026-08-17

    ncit:C63706:
      d4cg_label: "Bone Face"
      description: "Any bone that contributes to the facial structures, except those bones that are part of the braincase."
      last_updated: 2026-08-17

    ncit:C63814:
      d4cg_label: "toxicity_immune"
      description: "Toxicity that impairs or damages the immune system."
      last_updated: 2026-08-17

    ncit:C64193:
      d4cg_label: "Hip"
      description: "The hip region is located lateral to the gluteal region (i.e. the buttock), inferior to the iliac crest, and overlying the greater trochanter of the thigh bone. In adults, three of the bones of the pelvis have fused into the hip bone which forms part of the hip region. The hip joint, scientifically referred to as the acetabulofemoral joint (art. coxae), is the joint between the femur and acetabulum of the pelvis and its primary function is to support the weight of the body in both static (e.g. standing) and dynamic (e.g. walking or running) postures."
      last_updated: 2026-08-17

    ncit:C642:
      d4cg_label: "Methotrexate"
      description: "A drug used to treat some types of cancer, rheumatoid arthritis, and severe skin conditions, such as psoriasis. Amethopterin stops cells from making DNA and may kill cancer cells. It is a type of antimetabolite."
      last_updated: 2026-08-17

    ncit:C64251:
      d4cg_label: "Left Ventricular Systolic Dysfunction"
      description: "A disorder characterized by failure of the left ventricle to produce adequate output despite an increase in distending pressure and in end-diastolic volume. Clinical manifestations may include dyspnea, orthopnea, and other signs and symptoms of pulmonary congestion and edema."
      last_updated: 2026-08-17

    ncit:C64346:
      d4cg_label: "Hemizygous"
      description: "Having only one copy of a particular gene or genetic region."
      last_updated: 2026-08-17

    ncit:C64384:
      d4cg_label: "Ultrasound"
      description: "High frequency sound, generally with a frequency greater than 20,000 Hz."
      last_updated: 2026-08-17

    ncit:C64387:
      d4cg_label: "mmol/L"
      description: "A unit of concentration (molarity unit) equal to one millimole of solute per liter of solution."
      last_updated: 2026-08-17

    ncit:C64431:
      d4cg_label: "Albumin"
      description: "A measurement of the albumin protein in a biological specimen."
      last_updated: 2026-08-17

    ncit:C64432:
      d4cg_label: "ALP"
      description: "A measurement of the alkaline phosphatase in a biological specimen."
      last_updated: 2026-08-17

    ncit:C64433:
      d4cg_label: "ALT"
      description: "A measurement of the alanine aminotransferase in a biological specimen."
      last_updated: 2026-08-17

    ncit:C64467:
      d4cg_label: "AST"
      description: "A measurement of the aspartate aminotransferase in a biological specimen."
      last_updated: 2026-08-17

    ncit:C64470:
      d4cg_label: "Absolute Basophil Count"
      description: "A measurement of the basophils in a biological specimen."
      last_updated: 2026-08-17

    ncit:C64481:
      d4cg_label: "Direct Bilirubin"
      description: "A measurement of the glucuronidated bilirubin and albumin-bound bilirubin in a biological specimen."
      last_updated: 2026-08-17

    ncit:C64488:
      d4cg_label: "Calcium"
      description: "A measurement of the calcium in a biological specimen."
      last_updated: 2026-08-17

    ncit:C64495:
      d4cg_label: "Chloride"
      description: "A measurement of the chloride in a biological specimen."
      last_updated: 2026-08-17

    ncit:C64547:
      d4cg_label: "Creatinine"
      description: "A measurement of the creatinine in a biological specimen."
      last_updated: 2026-08-17

    ncit:C64548:
      d4cg_label: "CRP"
      description: "A measurement of the C reactive protein in a biological specimen."
      last_updated: 2026-08-17

    ncit:C64550:
      d4cg_label: "Eosinophils"
      description: "A measurement of the eosinophils in a biological specimen."
      last_updated: 2026-08-17

    ncit:C64572:
      d4cg_label: "mg/L"
      description: "A metric unit of mass concentration defined as the concentration of one gram of a substance per unit volume of the mixture equal to one cubic meter. The concept also refers to the metric unit of mass density (volumic mass) defined as the density of a substance which mass equal to one gram occupies the volume of one cubic meter."
      last_updated: 2026-08-17

    ncit:C64639:
      d4cg_label: "Crenolanib"
      description: "An orally bioavailable benzimidazole targeting the platelet-derived growth factor receptor (PDGFR) subtypes alpha and beta and FMS-related tyrosine kinase 3 (Flt3), with potential antineoplastic activity. Upon oral administration, crenolanib binds to and inhibits both wild-type and mutated forms of PDGFR and Flt3, which may result in the inhibition of PDGFR- and Flt3-related signal transduction pathways. This results in inhibition of tumor angiogenesis and tumor cell proliferation in PDGFR and/or Flt3 overexpressing tumor cells. PDGFR and Flt3, class III receptor tyrosine kinases, are upregulated or mutated in many tumor cell types."
      last_updated: 2026-08-17

    ncit:C64693:
      d4cg_label: "cGy"
      description: "The metric unit of absorbed radiation dose equal to the absorption of one hundredth of joule of radiation energy per kilogram of matter."
      last_updated: 2026-08-17

    ncit:C64774:
      d4cg_label: "AUC"
      description: "The area between the x-axis and the curve given by the integrand. It is equal to the definite integral of a function. In the field of pharmacokinetics, the area under the curve (AUC) is the area under the curve in a plot of concentration of a drug in plasma against time. AUC is usually given for the time interval zero to infinity, and other time intervals are indicated."
      last_updated: 2026-08-17

    ncit:C64783:
      d4cg_label: "g/dL"
      description: "A unit of mass concentration defined as the concentration of one gram of a substance per unit volume of the mixture equal to one deciliter (100 milliliters). The concept also refers to the metric unit of mass density (volumic mass) defined as the density of substance which mass equal to one gram occupies the volume one deciliter."
      last_updated: 2026-08-17

    ncit:C64796:
      d4cg_label: "HCT"
      description: "A measure of the volume of red blood cells expressed as a percentage of the total blood volume. Normal in males is 43-49%, in females 37-43%."
      last_updated: 2026-08-17

    ncit:C64797:
      d4cg_label: "MCH"
      description: "A measurement of the mean amount of hemoglobin per erythrocyte in a biological specimen, calculated as the product of hemoglobin times ten, divided by the number of erythrocytes."
      last_updated: 2026-08-17

    ncit:C64798:
      d4cg_label: "MCHC"
      description: "An indirect measurement of the average concentration of hemoglobin per erythrocyte in a biological specimen, calculated as the ratio of hemoglobin to hematocrit."
      last_updated: 2026-08-17

    ncit:C64799:
      d4cg_label: "MCV"
      description: "A measurement of the mean cellular volume per erythrocyte in a biological specimen."
      last_updated: 2026-08-17

    ncit:C64809:
      d4cg_label: "Sodium"
      description: "A measurement of the sodium in a biological specimen."
      last_updated: 2026-08-17

    ncit:C6481:
      d4cg_label: "Inflammatory Myofibroblastic Tumor"
      description: "A multinodular intermediate fibroblastic neoplasm that arises from soft tissue or viscera, in children and young adults.  It is characterized by the presence of spindle-shaped fibroblasts and myofibroblasts, and a chronic inflammatory infiltrate composed of eosinophils, lymphocytes, and plasma cells."
      last_updated: 2026-08-17

    ncit:C64812:
      d4cg_label: "Triglyceride Measurement"
      description: "A measurement of the triglycerides in a biological specimen."
      last_updated: 2026-08-17

    ncit:C64813:
      d4cg_label: "TSH"
      description: "A measurement of the thyrotropin in a biological specimen."
      last_updated: 2026-08-17

    ncit:C64823:
      d4cg_label: "Monocyte Count"
      description: "A measurement of the monocytes in a biological specimen."
      last_updated: 2026-08-17

    ncit:C64830:
      d4cg_label: "Neutrophil Band Form Count"
      description: "A measurement of the banded neutrophils in a biological specimen."
      last_updated: 2026-08-17

    ncit:C64847:
      d4cg_label: "GGT"
      description: "A measurement of the gamma glutamyl transferase in a biological specimen."
      last_updated: 2026-08-17

    ncit:C64848:
      d4cg_label: "Hemoglobin"
      description: "A measurement of the total erythrocyte associated hemoglobin in a biological specimen."
      last_updated: 2026-08-17

    ncit:C64849:
      d4cg_label: "Hemoglobin A1c Measurement"
      description: "A measurement of the glycated hemoglobin A1C in a biological specimen."
      last_updated: 2026-08-17

    ncit:C64851:
      d4cg_label: "beta-hCG"
      description: "A determination of the presence of Choriogonadotropin Beta protein."
      last_updated: 2026-08-17

    ncit:C64853:
      d4cg_label: "Potassium"
      description: "A measurement of the potassium in a biological specimen."
      last_updated: 2026-08-17

    ncit:C64855:
      d4cg_label: "LDH"
      description: "A measurement of the lactate dehydrogenase in a biological specimen."
      last_updated: 2026-08-17

    ncit:C64858:
      d4cg_label: "Protein Total"
      description: "A measurement of the total protein in a biological specimen."
      last_updated: 2026-08-17

    ncit:C6493:
      d4cg_label: "Plexiform Fibrohistiocytic Tumor"
      description: "An intermediate fibrohistiocytic neoplasm of the skin that usually affects children and young adults. It is a multinodular, poorly circumscribed tumor characterized by the presence of multinucleated giant cells, mononuclear histiocyte-like cells, and spindle fibroblast-like cells arranged in a plexiform pattern."
      last_updated: 2026-08-17

    ncit:C6494:
      d4cg_label: "Angiomatoid Fibrous Histiocytoma"
      description: "A low malignant potential soft tissue neoplasm of uncertain differentiation.  It typically affects young patients, presenting as a slowly growing nodular or cystic tumor mass, most often in the subcutaneous tissues of the extremities.  Occasionally, patients have systemic symptoms (anemia, fever, and weight loss).  This tumor has a relatively good prognosis.  A minority of patients develop local recurrences.  Metastases are rare."
      last_updated: 2026-08-17

    ncit:C6496:
      d4cg_label: "Myxofibrosarcoma"
      description: "A malignant fibroblastic neoplasm arising from the soft tissue. It is characterized by the presence of spindle-shaped cells, cellular pleomorphism, thin-walled blood vessels, fibrous septa, and myxoid stroma."
      last_updated: 2026-08-17

    ncit:C64975:
      d4cg_label: "Good"
      description: "Valuable or useful or agreeable or pleasing."
      last_updated: 2026-08-17

    ncit:C64984:
      d4cg_label: "Intracameral"
      description: "Administration by injection directly into the anterior chamber of the eye."
      last_updated: 2026-08-17

    ncit:C6505:
      d4cg_label: "Atypical Lipomatous Tumor"
      description: "A locally aggressive mesenchymal neoplasm composed either entirely or partly of an adipocytic proliferation showing at least focal nuclear atypia in both adipocytes and stromal cells. \"Atypical lipomatous tumor\" and \"well-differentiated liposarcoma\" are synonyms describing lesions that are morphologically and genetically identical. Amplification of MDM2 and/or CDK4 is almost always present. (WHO 2020)"
      last_updated: 2026-08-17

    ncit:C65149:
      d4cg_label: "Lactated Ringers"
      description: ""
      last_updated: 2026-08-17

    ncit:C65166:
      d4cg_label: "Celiac Nodes"
      description: "A lymph node at the base of the celiac artery."
      last_updated: 2026-08-17

    ncit:C65216:
      d4cg_label: "Adalimumab"
      description: "A recombinant, human IgG1 monoclonal antibody directed against tumor necrosis factor-alpha (TNF-alpha), with immunomodulating activity. Upon administration, adalimumab binds to TNF-alpha, thereby preventing its binding to the p55 and p75 TNF cell surface receptors and inhibiting TNF-mediated immune responses. TNF-alpha, a pro-inflammatory cytokine, is upregulated in various autoimmune diseases."
      last_updated: 2026-08-17

    ncit:C6532:
      d4cg_label: "Tenosynovial Giant Cell Tumor Localized Type"
      description: "A well-circumscribed, lobulated tumor, completely or partially covered by a fibrous capsule. It usually arises in the fingers.  It is characterized by the presence of mononuclear cells, multinucleated osteoclast-like giant cells, hemosiderin-laden macrophages, foam cells, and an inflammatory infiltrate. The tumor is slow-growing, usually developing over several years. Clinical presentation includes painless edema of the affected site."
      last_updated: 2026-08-17

    ncit:C6535:
      d4cg_label: "Tenosynovial Giant Cell Tumor Malignant"
      description: "An uncommon malignant tumor arising from the tendon sheath. Morphologically, it is characterized by the presence of a cellular infiltrate reminiscent of a giant cell tumor with prominent malignant characteristics. Recurrent giant cell tumors with a sarcomatous dedifferentiation are included in this category as well."
      last_updated: 2026-08-17

    ncit:C65530:
      d4cg_label: "Erlotinib"
      description: "A quinazoline derivative with antineoplastic properties.  Competing with adenosine triphosphate, erlotinib reversibly binds to the intracellular catalytic domain of epidermal growth factor receptor (EGFR) tyrosine kinase, thereby reversibly inhibiting EGFR phosphorylation and blocking the signal transduction events and tumorigenic effects associated with EGFR activation."
      last_updated: 2026-08-17

    ncit:C6557:
      d4cg_label: "Schwannomatosis"
      description: "Rare genetic disorder caused by mutations in the SMARCB1 and LZTR1 genes. It is characterized by the presence of multiple Schwannomas."
      last_updated: 2026-08-17

    ncit:C6561:
      d4cg_label: "Epithelioid Malignant Peripheral Nerve Sheath Tumor"
      description: "A rare variant of malignant peripheral nerve sheath tumor composed predominantly or exclusively of epithelioid cells."
      last_updated: 2026-08-17

    ncit:C6582:
      d4cg_label: "Ossifying Fibromyxoid Tumor"
      description: "A rare soft tissue tumor of uncertain lineage characterized by the presence of neoplastic spindle to round cells forming cords in a fibromyxoid stroma.  The lesions are associated with the formation of metaplastic bone.  Most patients present with painless subcutaneous masses.  Recurrences have been reported in a minority of patients."
      last_updated: 2026-08-17

    ncit:C6586:
      d4cg_label: "Extra-Renal Rhabdoid Tumor"
      description: "A rhabdoid tumor that arises outside of the central nervous system or kidney."
      last_updated: 2026-08-17

    ncit:C66172:
      d4cg_label: "Mizoribine"
      description: ""
      last_updated: 2026-08-17

    ncit:C6634:
      d4cg_label: "Mediastinum"
      description: "A Hodgkin lymphoma that arises from the mediastinum.  It usually involves mediastinal lymph nodes and/or the thymus.  Signs and symptoms include fever, weight loss, fatigue, and night sweats."
      last_updated: 2026-08-17

    ncit:C66798:
      d4cg_label: "Gallium"
      description: "An element with atomic symbol Ga, atomic number 31, and atomic weight 69.7. A rare silvery (usually trivalent) metallic element; brittle at low temperatures but liquid above room temperature; occurs in trace amounts in bauxite and zinc ores."
      last_updated: 2026-08-17

    ncit:C66812:
      d4cg_label: "Retinoma"
      description: "A rare, unilateral or bilateral benign neoplasm that arises from the retina. There is an increased risk of malignant transformation to retinoblastoma; therefore, patients with a diagnosis of retinocytoma should be closely observed."
      last_updated: 2026-08-17

    ncit:C66876:
      d4cg_label: "Gemcitabine"
      description: "A broad-spectrum antimetabolite and deoxycytidine analogue with antineoplastic activity. Upon administration, gemcitabine is converted into the active metabolites difluorodeoxycytidine diphosphate (dFdCDP) and difluorodeoxycytidine triphosphate (dFdCTP) by deoxycytidine kinase. dFdCTP competes with deoxycytidine triphosphate (dCTP) and is incorporated into DNA.  This locks DNA polymerase thereby resulting in \"masked termination\" during DNA replication. On the other hand, dFdCDP inhibits ribonucleotide reductase, thereby decreasing the deoxynucleotide pool available for DNA synthesis. The reduction in the intracellular concentration of dCTP potentiates the incorporation of dFdCTP into DNA."
      last_updated: 2026-08-17

    ncit:C66897:
      d4cg_label: "Proton"
      description: "A type of external beam radiation therapy using a beam of protons. It has the advantage of precisely localizing the radiation dose on the targeted tissue and avoiding damage to the healthy surrounding tissues."
      last_updated: 2026-08-17

    ncit:C66929:
      d4cg_label: "Ototoxicity"
      description: "Damage to the inner ear as a result of exposure to drugs or chemicals."
      last_updated: 2026-08-17

    ncit:C66937:
      d4cg_label: "Cabazitaxel"
      description: "A drug used with prednisone to treat hormone-resistant prostate cancer that has spread and that had been treated with docetaxel. It is also being studied in the treatment of other types of cancer. Cabazitaxel blocks cell growth by stopping cell division and may kill cancer cells. It is a type of antimitotic agent."
      last_updated: 2026-08-17

    ncit:C66944:
      d4cg_label: "Brentuximab Vedotin"
      description: "An antibody-drug conjugate (ADC) directed against the tumor necrosis factor (TNF) receptor CD30 with potential antineoplastic activity. Brentuximab vedotin is generated by conjugating the chimeric anti-CD30 monoclonal antibody SGN-30 to the cytotoxic agent monomethyl auristatin E (MMAE) via a valine-citrulline peptide linker. Upon administration and internalization by CD30-positive tumor cells, brentuximab vedotin undergoes enzymatic cleavage, releasing MMAE into the cytosol; MMAE binds to tubulin and inhibits tubulin polymerization, which may result in G2/M phase arrest and tumor cell apoptosis. Transiently activated during lymphocyte activation, CD30 (tumor necrosis factor receptor superfamily, member 8;TNFRSF8) may be constitutively expressed in hematologic malignancies including Hodgkin lymphoma and some T-cell non-Hodgkin lymphomas. The linkage system in brentuximab vedotin is highly stable in plasma, resulting in cytotoxic specificity for CD30-positive cells."
      last_updated: 2026-08-17

    ncit:C66948:
      d4cg_label: "Panobinostat"
      description: "A cinnamic hydroxamic acid analogue with potential antineoplastic activity. Panobinostat selectively inhibits histone deacetylase (HDAC), inducing hyperacetylation of core histone proteins, which may result in modulation of cell cycle protein expression, cell cycle arrest in the G2/M phase and apoptosis. In addition, this agent appears to modulate the expression of angiogenesis-related genes, such as hypoxia-inducible factor-1alpha (HIF-1a) and vascular endothelial growth factor (VEGF), thus impairing endothelial cell chemotaxis and invasion. HDAC is an enzyme that deacetylates chromatin histone proteins."
      last_updated: 2026-08-17

    ncit:C66968:
      d4cg_label: "Per Day"
      description: "A frequency rate of occurrences of something within a period of time equal to twenty-four hours."
      last_updated: 2026-08-17

    ncit:C67015:
      d4cg_label: "mg/dL"
      description: "A unit of mass concentration defined as the concentration of one milligram of a substance in unit volume of the mixture equal to one cubic deciliter or 100 cubic centimeters. It is also a unit of mass density (volumic mass) defined as the density of substance which mass equal to one milligram occupies the volume one cubic deciliter or 100 cubic centimeters."
      last_updated: 2026-08-17

    ncit:C67109:
      d4cg_label: "Multiracial"
      description: "Having ancestors of several or various races."
      last_updated: 2026-08-17

    ncit:C6728:
      d4cg_label: "Gardner Syndrome"
      description: "A variant of familial adenomatous polyposis. It is an autosomal dominant syndrome characterized by multiple colonic polyps predisposing to carcinoma of the colon, osteomas of the skull, epidermoid cysts, and fibromas. It is associated with mutation of the APC gene."
      last_updated: 2026-08-17

    ncit:C6729:
      d4cg_label: "Attenuated Familial Adenomatous Polyposis"
      description: "A rare genetic syndrome with an autosomal dominant pattern of inheritance. It was formerly called hereditary flat adenoma syndrome (HFAS) but is now recognized as an attenuated variant of familial adenomatous polyposis (FAP). It is most commonly associated with mutations in the APC gene specifically: exons 1-5, exon 9 and in the distal 3' terminus. Clinical presentation occurs in the middle decades and is characterized by the proximal development of multiple (but less than 100), non-polypoid colonic adenomas. Clinical progression to colorectal cancer may occur later in life but the risk is less than with classic FAP."
      last_updated: 2026-08-17

    ncit:C67306:
      d4cg_label: "ng/mL"
      description: "A unit of concentration or mass density equal to one nanogram of substance per milliliter of solution or one microgram of substance per liter of solution."
      last_updated: 2026-08-17

    ncit:C67326:
      d4cg_label: "ng/dL"
      description: "A unit of mass concentration defined as the concentration of one nanogram of a substance in unit volume of the mixture equal to one deciliter. The concept also refers to the unit of mass density (volumic mass) defined as the density of substance which mass equal to one nanogram occupies the volume one deciliter.(NCI)"
      last_updated: 2026-08-17

    ncit:C67327:
      d4cg_label: "pg/mL"
      description: "A unit of concentration or mass density equal to one picogram of substance per milliliter of solution or one nanogram of substance per liter of solution."
      last_updated: 2026-08-17

    ncit:C67339:
      d4cg_label: "MAP"
      description: "A regimen consisting of cisplatin, doxorubicin, and methotrexate that can be used in the treatment of osteosarcoma."
      last_updated: 2026-08-17

    ncit:C67378:
      d4cg_label: "IU/m2"
      description: "A dose calculation unit expressed as a number of arbitrary units of biological activity (International Units) of substance per square meter of body surface area."
      last_updated: 2026-08-17

    ncit:C67402:
      d4cg_label: "mg/m2"
      description: "A metric unit of areal density equal to approximately 2.94935E-5 ounce per square yard. Also used as a dose calculation unit."
      last_updated: 2026-08-17

    ncit:C67405:
      d4cg_label: "uIU/mL"
      description: "A unit of concentration (biologic activity) equal to one micro-international unit of substance per milliliter of solution or one milli-international unit of substance per liter of solution."
      last_updated: 2026-08-17

    ncit:C67419:
      d4cg_label: "mm/h"
      description: "A unit of both speed (scalar) and velocity (vector), defined as the distance of one millimeter travelled per unit time equal to one hour."
      last_updated: 2026-08-17

    ncit:C67434:
      d4cg_label: "pmol/L"
      description: "A unit of concentration (molarity unit) equal to one picomole of solute per liter of solution."
      last_updated: 2026-08-17

    ncit:C67456:
      d4cg_label: "U/L"
      description: "A unit of substance concentration equal to the concentration at which one liter of mixture contains one unit of a substance."
      last_updated: 2026-08-17

    ncit:C67494:
      d4cg_label: "FLT3 Internal Tandem Duplication (ITD)"
      description: "A genetic abnormality that arises from duplications of the juxtamembrane portion of the gene and results in constitutive activation of the FLT3 receptor tyrosine kinase protein in early hematopoietic progenitor cells. It is associated with acute myelogenous leukemia where it appears to correlate with a poor prognosis."
      last_updated: 2026-08-17

    ncit:C67495:
      d4cg_label: "FLT3 Tyrosine Kinase Domain (TKD)"
      description: "Single nucleotide mutations in the tyrosine kinase domain encoded by the human FLT3 gene that are associated with acute myeloid leukemia and poor prognosis."
      last_updated: 2026-08-17

    ncit:C67504:
      d4cg_label: "Daunorubicin and Cytarabine (Liposomal)"
      description: "A liposomal formulation containing a fixed combination of the antineoplastic agents cytarabine and daunorubicin in a 5:1 molar ratio. Liposome-encapsulated daunorubicin-cytarabine has been designed to provide optimal delivery of a specific ratio of cytarabine to daunorubicin, one that has been shown to be synergistic in vitro. The antimetabolite cytarabine competes with cytidine for incorporation into DNA, inhibiting DNA synthesis. This agent also inhibits DNA polymerase, resulting in a decrease in DNA replication and repair. Daunorubicin, an intercalator and a topoisomerase II inhibitor, prevents DNA replication and inhibits protein synthesis. This agent also generates oxygen free radicals, resulting in the cytotoxic lipid peroxidation of cell membrane lipids."
      last_updated: 2026-08-17

    ncit:C6769:
      d4cg_label: "Involvement of Optic Nerve Cut End"
      description: "An astrocytoma that arises from the optic nerve."
      last_updated: 2026-08-17

    ncit:C680:
      d4cg_label: "Naproxen"
      description: "A drug used to treat mild pain and the symptoms of arthritis and several other conditions. It is also being studied in the treatment of bone pain in patients with cancer. Naprosyn stops the body from making substances that cause pain and inflammation. It is a type of nonsteroidal anti-inflammatory drug (NSAID) and a type of cyclooxygenase inhibitor."
      last_updated: 2026-08-17

    ncit:C68814:
      d4cg_label: "Nivolumab"
      description: "A fully human immunoglobulin (Ig) G4 monoclonal antibody directed against the negative immunoregulatory human cell surface receptor programmed death-1 (PD-1, PCD-1) with immune checkpoint inhibitory and antineoplastic activities. Upon administration, nivolumab binds to and blocks the activation of PD-1, an immunoglobulin superfamily (IgSF) transmembrane protein, by its ligands programmed cell death ligand 1 (PD-L1), which is overexpressed on certain cancer cells, and programmed cell death ligand 2 (PD-L2), which is primarily expressed on antigen-presenting cells (APCs). This results in the activation of T-cells and cell-mediated immune responses against tumor cells. Activated PD-1 negatively regulates T-cell activation and plays a key role in tumor evasion from host immunity."
      last_updated: 2026-08-17

    ncit:C6905:
      d4cg_label: "Cerebellar Liponeurocytoma"
      description: "A rare, WHO grade II cerebellar neoplasm which shows consistent neuronal, variable astrocytic and focal lipomatous differentiation. It occurs in adults, has a low proliferative potential and usually has a favorable prognosis. (Adapted from WHO)"
      last_updated: 2026-08-17

    ncit:C6906:
      d4cg_label: "Atypical Teratoid/Rhabdoid Tumor, NOS or NEC"
      description: "An aggressive malignant embryonal neoplasm arising from the central nervous system. It is composed of cells with a large eccentric nucleus, prominent nucleolus, and abundant cytoplasm. Mutations of the SMARCB1 gene or very rarely SMARCA4 (BRG1) gene are present. The vast majority of cases occur in childhood. Symptoms include lethargy, vomiting, cranial nerve palsy, headache, and hemiplegia."
      last_updated: 2026-08-17

    ncit:C69313:
      d4cg_label: "Cervical Spine"
      description: "That portion of the spine comprising the cervical vertebrae. The neck area of the spine."
      last_updated: 2026-08-17

    ncit:C69314:
      d4cg_label: "Lower Spine"
      description: "Subdivision of vertebral column that corresponds to the lumbar subdivision of the body, containing the lumbar vertebrae."
      last_updated: 2026-08-17

    ncit:C69421:
      d4cg_label: "Lansky >> 50"
      description: "Gets dressed, but lies around much of the day; no active play, able to participate in all quiet play and activities."
      last_updated: 2026-08-17

    ncit:C69422:
      d4cg_label: "Lansky >> 60"
      description: "Up and around, but minimal active play; keeps busy with quieter activities."
      last_updated: 2026-08-17

    ncit:C69423:
      d4cg_label: "Lansky >> 70"
      description: "Both greater restriction of and less time spent in play activity."
      last_updated: 2026-08-17

    ncit:C69424:
      d4cg_label: "Lansky >> 80"
      description: "Active, but tires more quickly."
      last_updated: 2026-08-17

    ncit:C69425:
      d4cg_label: "Lansky >> 90"
      description: "Minor restrictions in physically strenuous activity."
      last_updated: 2026-08-17

    ncit:C69426:
      d4cg_label: "Lansky >> 100"
      description: "Full active, normal."
      last_updated: 2026-08-17

    ncit:C6959:
      d4cg_label: "Anaplastic Oligoastrocytoma"
      description: "An oligoastrocytoma characterized by the presence of increased cellularity, nuclear atypia, pleomorphism, and high mitotic activity."
      last_updated: 2026-08-17

    ncit:C6965:
      d4cg_label: "Pineal Gland Tumor"
      description: "A neoplasm that arises from pinealocytes in the pineal gland. This category includes pineocytomas, pineal parenchymal tumors of intermediate differentiation, and pineoblastomas."
      last_updated: 2026-08-17

    ncit:C6967:
      d4cg_label: "Pineal Parenchymal Tumor of Intermediate Differentiation"
      description: "A WHO grade 2 or 3 pineal parenchymal neoplasm of intermediate-grade malignancy, affecting all ages.  It is composed of diffuse sheets or large lobules of uniform cells with mild to moderate nuclear atypia and low to moderate level mitotic activity.  (Adapted from WHO)"
      last_updated: 2026-08-17

    ncit:C6990:
      d4cg_label: "Other CNS Embryonal Tumors"
      description: "A malignant neoplasm of embryonal origin, arising from the central nervous system.  It usually affects children.  Representative examples include ependymoblastoma, medulloblastoma, and atypical teratoid/rhabdoid tumor."
      last_updated: 2026-08-17

    ncit:C7009:
      d4cg_label: "CNS Germinoma"
      description: "A germinomatous germ cell tumor arising in the central nervous system; it is histologically identical to the dysgerminoma and seminoma."
      last_updated: 2026-08-17

    ncit:C7019:
      d4cg_label: "trilateral_retinoblastoma"
      description: "Trilateral retinoblastoma refers to bilateral (or less often unilateral) retinoblastoma associated with an intracranial primitive neuroectodermal tumor in the pineal or suprasellar region. This syndrome is often associated with a increased familial incidence of retinoblastoma. (From Cancer 86(1): 135-141, 1999)."
      last_updated: 2026-08-17

    ncit:C70538:
      d4cg_label: "Lansky >> 0"
      description: "Unresponsive."
      last_updated: 2026-08-17

    ncit:C70539:
      d4cg_label: "Lansky >> 10"
      description: "No play; does not get out of bed."
      last_updated: 2026-08-17

    ncit:C70540:
      d4cg_label: "Lansky >> 20"
      description: "Often sleeping; play entirely limited to very passive activities."
      last_updated: 2026-08-17

    ncit:C70541:
      d4cg_label: "Lansky >> 30"
      description: "In bed; needs assistance even for quiet play."
      last_updated: 2026-08-17

    ncit:C70542:
      d4cg_label: "Lansky >> 40"
      description: "Mostly in bed; participates in quiet activities."
      last_updated: 2026-08-17

    ncit:C70543:
      d4cg_label: "Never"
      description: "Not ever; at no time (in the past or future)."
      last_updated: 2026-08-17

    ncit:C70651:
      d4cg_label: "Firtecan Pegol"
      description: "A polyethylene glycol (PEG) conjugate of 7-ethyl-10-hydroxycamptothecin with potential antineoplastic activity. After hydrolysis in vivo, 7-ethyl-10-hydroxycamptothecin (SN38), an active metabolite of irinotecan, is released from firtecan pegol; 7-ethyl-10-hydroxycamptothecin selectively stabilizes topoisomerase I-DNA covalent complexes, resulting in single-stranded and double-stranded DNA breaks, the inhibition of DNA replication, and the induction of apoptosis. This agent is designed to deliver the active metabolite to tumor cells without the need for conversion as is the case with irinotecan. Compared to unPEGylated 7-ethyl-10-hydroxycamptothecin, PEGylation improves solubility and allows for parental delivery, and may result in a longer half-life and higher exposure for tumor cells."
      last_updated: 2026-08-17

    ncit:C70713:
      d4cg_label: "genetic_analysis_specimen"
      description: "The type of a material sample taken from a biological entity for testing, diagnostic, propagation, treatment or research purposes. This includes particular types of cellular molecules, cells, tissues, organs, body fluids, embryos, and body excretory substances."
      last_updated: 2026-08-17

    ncit:C7073:
      d4cg_label: "Paget Disease"
      description: "A malignant neoplasm composed of large cells with large nuclei, prominent nucleoli, and abundant pale cytoplasm (Paget cells).  Paget cell neoplasms include Paget disease of the nipple and extramammary Paget disease which may affect the vulva, penis, anus, skin and scrotum."
      last_updated: 2026-08-17

    ncit:C70740:
      d4cg_label: "Lost to Follow-Up"
      description: "The subject was not available for follow-up procedures."
      last_updated: 2026-08-17

    ncit:C70792:
      d4cg_label: "Ramucirumab"
      description: "A recombinant, fully human monoclonal antibody directed against human vascular endothelial growth factor receptor 2 (VEGFR-2) with antiangiogenesis activity. Ramucirumab specifically binds to and inhibits VEGFR-2, which may result in an inhibition of tumor angiogenesis and a decrease in tumor nutrient supply. VEGFR-2 is a pro-angiogenic growth factor receptor tyrosine kinase expressed by endothelial cells."
      last_updated: 2026-08-17

    ncit:C70902:
      d4cg_label: "Concomitant Agent"
      description: "A pharmaceutical agent other than agent(s) tested in a given protocol that is administered to or used by a subject either prior to or during the study. Supportive care and essential ancillary medications required by a treatment regimen should be clearly identified. A protocol's complete instructions including appropriate indication, dosage, administration route, schedule, restrictions to use, and any other relevant data should be explicitly stated. Concept also refers to substance(s) used prior or during the study that are not specified by the protocol."
      last_updated: 2026-08-17

    ncit:C71034:
      d4cg_label: "Prolonged QT"
      description: "An electrocardiographic finding in which the QT interval corrected for heart rate is prolonged."
      last_updated: 2026-08-17

    ncit:C71079:
      d4cg_label: "ZOS (Zoster/Shingles)"
      description: "A common dermal and neurologic disorder caused by reactivation of the varicella-zoster virus that has remained dormant within dorsal root ganglia, often for decades, after the patient's initial exposure to the virus in the form of varicella (chickenpox). It is characterized by severe neuralgic pain along the distribution of the affected nerve and crops of clustered vesicles over the area."
      last_updated: 2026-08-17

    ncit:C71326:
      d4cg_label: "Fertility Preservation Therapy"
      description: "Methods that focus on the retention of a woman's reproductive capability."
      last_updated: 2026-08-17

    ncit:C7134:
      d4cg_label: "Surface Osteosarcoma"
      description: "A usually aggressive malignant bone-forming mesenchymal neoplasm arising from the surface of the bone."
      last_updated: 2026-08-17

    ncit:C71384:
      d4cg_label: "Biological Relative"
      description: "A person related by descent rather than by marriage or law."
      last_updated: 2026-08-17

    ncit:C71458:
      d4cg_label: "Suspected"
      description: "Believed likely."
      last_updated: 2026-08-17

    ncit:C71535:
      d4cg_label: "Indoximod"
      description: "A methylated tryptophan with immune checkpoint inhibitory activity. Indoximod inhibits the enzyme indoleamine 2,3-dioxygenase (IDO), which degrades the essential amino acid tryptophan, and may increase or maintain tryptophan levels important to T cell function. Tryptophan depletion is associated with immunosuppression involving T cell arrest and anergy."
      last_updated: 2026-08-17

    ncit:C71542:
      d4cg_label: "Inotuzumab Ozogamicin"
      description: "A CD22-targeted cytotoxic immunoconjugate composed of a humanized IgG4 anti-CD22 antibody covalently linked to N-acetyl-gamma-calicheamicin dimethyl hydrazide (CalichDMH) with potential antineoplastic activity. Inotuzumab ozogamicin is rapidly internalized upon binding of the antibody moiety to B cell-specific CD22 receptors, delivering the conjugated CalichDMH intracellularly; the CalichDMH moiety binds to the minor groove of DNA in a sequence-specific manner, resulting in double-strand DNA breaks and apoptosis. CalichDMH is a derivative of gamma calicheamicin, a cytotoxic antibiotic produced by the bacterium Micromonospora echinospora."
      last_updated: 2026-08-17

    ncit:C7157:
      d4cg_label: "Posterior Pituitary Gland Neoplasm"
      description: "A low-grade neoplasm that arises from the neurohypophysis. It includes pituicytoma, granular cell tumor of the sellar region, spindle cell oncocytoma, and ependymal pituicytoma."
      last_updated: 2026-08-17

    ncit:C71634:
      d4cg_label: "Eltrombopag"
      description: "An orally active thrombopoietin receptor agonist with megakaryopoiesis stimulating activity. Eltrombopag binds to and stimulates the platelet thrombopoietin receptor (TPO-R or CD110), a member of the hematopoietin receptor superfamily. Activation of TPO-R leads to the proliferation and differentiation of megakaryocytes, thereby increasing the production of blood platelets."
      last_updated: 2026-08-17

    ncit:C71720:
      d4cg_label: "Primary Diffuse Large B-Cell Lymphoma of the Central Nervous System"
      description: "A diffuse large B-cell lymphoma arising from the central nervous system."
      last_updated: 2026-08-17

    ncit:C7202:
      d4cg_label: "Malignant Histiocytosis"
      description: "An antiquated term referring to cases of systemic non-Hodgkin lymphomas which are composed of large, atypical neoplastic lymphoid cells and cases of hemophagocytic syndromes. In the past, cases of anaplastic large cells lymphoma were called malignant histiocytosis."
      last_updated: 2026-08-17

    ncit:C72560:
      d4cg_label: "Pomalidomide"
      description: "A substance being studied in the treatment of prostate cancer, multiple myeloma, and other types of cancer. Pomalidomide is a form of the drug thalidomide. It stops the growth of blood vessels, stimulates the immune system, and may kill cancer cells. Pomalidomide is a type of angiogenesis inhibitor and a type of immunomodulatory agent."
      last_updated: 2026-08-17

    ncit:C7258:
      d4cg_label: "Hodgkin Lymphoma, Nodular Lymphocyte Predominance"
      description: "A B-cell lymphoma characterized by the presence of scattered clonal cells known as lymphocyte predominant cells (LP cells) in a background of reactive lymphocytes and histiocytes, and formation of a nodular or nodular and diffuse growth pattern."
      last_updated: 2026-08-17

    ncit:C7295:
      d4cg_label: "Spleen"
      description: "A rare Hodgkin lymphoma that arises from the spleen."
      last_updated: 2026-08-17

    ncit:C7318:
      d4cg_label: "WHO, Version 4 >> Acute Monoblastic/Monocytic Leukemia"
      description: "Acute myeloid leukemia in which 80% or more of the leukemic cells are of monocytic lineage, including monoblasts, promonocytes, and monocytes."
      last_updated: 2026-08-17

    ncit:C73261:
      d4cg_label: "Bendamustine"
      description: "A bifunctional mechlorethamine derivative with alkylating and antimetabolite activities. Although the exact mechanism of action of bendamustine is unknown, this agent appears to alkylate and crosslink macromolecules, resulting in DNA, RNA and protein synthesis inhibition, and eventually the induction of apoptosis."
      last_updated: 2026-08-17

    ncit:C73468:
      d4cg_label: "Waldeyer's Ring"
      description: "The ring of lymphoid tissue located in the pharynx, consisting of the pharyngeal, tubal, palatine, and lingual tonsils."
      last_updated: 2026-08-17

    ncit:C74038:
      d4cg_label: "Vorinostat"
      description: "A substance being studied in the treatment of cancer. It blocks a type of protein involved in tissue growth and repair and may block the growth of cancer cells. It is a type of Hedgehog signaling pathway antagonist."
      last_updated: 2026-08-17

    ncit:C74061:
      d4cg_label: "Crizotinib"
      description: "A substance being studied in the treatment of some types of cancer. It blocks enzymes that cancer cells need to grow and spread. It may also prevent the growth of new blood vessels that tumors need to grow. It is a type of tyrosine kinase inhibitor and a type of antiangiogenesis agent."
      last_updated: 2026-08-17

    ncit:C74603:
      d4cg_label: "Vasculo-Nervous"
      description: "A body structure consisting of nerves traveling together with arteries, veins, and/or lymphatics."
      last_updated: 2026-08-17

    ncit:C74605:
      d4cg_label: "Blast Count"
      description: "A measurement of the blast cells in a biological specimen."
      last_updated: 2026-08-17

    ncit:C74611:
      d4cg_label: "ESR"
      description: "A quantitative measurement of the distance that red blood cells settle in one hour in a sample of unclotted blood. Used in the evaluation of systemic inflammation."
      last_updated: 2026-08-17

    ncit:C74622:
      d4cg_label: "Promyelocyte Count"
      description: "A measurement of the promyelocytes (immature myelocytes) in a biological specimen."
      last_updated: 2026-08-17

    ncit:C7463:
      d4cg_label: "FAB >> Version NOS >> M4"
      description: "An acute leukemia characterized by the proliferation of both neutrophil and monocyte precursors.  (WHO, 2001)"
      last_updated: 2026-08-17

    ncit:C74632:
      d4cg_label: "Myeloblast Count"
      description: "A measurement of the myeloblast cells in a biological specimen."
      last_updated: 2026-08-17

    ncit:C7464:
      d4cg_label: "Acute Leukemia, ambiguous lineage (mixed or biphenotypic)"
      description: "A rare subtype of acute leukemia in which the blasts lack sufficient evidence to classify as myeloid or lymphoid, or they have morphologic and/or immunophenotypic characteristics of both myeloid and lymphoid cells. These subtypes account for less than 4% of cases of acute leukemia."
      last_updated: 2026-08-17

    ncit:C74657:
      d4cg_label: "Auer Rods"
      description: "A measurement of the Auer rods (elongated needle structures that are found in the cytoplasm of leukemic blasts and are formed by clumps of azurophilic granular material) in a biological specimen."
      last_updated: 2026-08-17

    ncit:C74660:
      d4cg_label: "Cytology Malignant Cells"
      description: "A measurement of the malignant cells of all types in a biological specimen."
      last_updated: 2026-08-17

    ncit:C74662:
      d4cg_label: "Myelocyte Count"
      description: "A measurement of the myelocytes in a biological specimen."
      last_updated: 2026-08-17

    ncit:C7467:
      d4cg_label: "WHO, Version 4 >> Pure Erythroid Leukemia"
      description: "Acute erythroid leukemia characterized by the presence of immature erythroid cells in the bone marrow (at least 80% of the cellular component), without evidence of a significant myeloblastic cell population present."
      last_updated: 2026-08-17

    ncit:C74782:
      d4cg_label: "Estradiol"
      description: "A measurement of the estradiol in a biological specimen."
      last_updated: 2026-08-17

    ncit:C74785:
      d4cg_label: "Free Testosterone"
      description: "A measurement of the free testosterone in a biological specimen."
      last_updated: 2026-08-17

    ncit:C74786:
      d4cg_label: "Free T4"
      description: "A measurement of the free thyroxine in a biological specimen."
      last_updated: 2026-08-17

    ncit:C74787:
      d4cg_label: "Free T3"
      description: "A measurement of the free triiodothyronine in a biological specimen."
      last_updated: 2026-08-17

    ncit:C74790:
      d4cg_label: "Luteinizing Hormone Test"
      description: "A measurement of the luteinizing hormone in a biological specimen."
      last_updated: 2026-08-17

    ncit:C74791:
      d4cg_label: "Progesterone Receptor Test"
      description: "A measurement of the progesterone hormone in a biological specimen."
      last_updated: 2026-08-17

    ncit:C74793:
      d4cg_label: "Total Testosterone"
      description: "A measurement of the total (free and bound) testosterone in a biological specimen."
      last_updated: 2026-08-17

    ncit:C74794:
      d4cg_label: "Total T4"
      description: "A measurement of the total (free and bound) thyroxine in a biological specimen."
      last_updated: 2026-08-17

    ncit:C74870:
      d4cg_label: "Prolactin"
      description: "A measurement of the prolactin hormone in a biological specimen."
      last_updated: 2026-08-17

    ncit:C75019:
      d4cg_label: "Sotos Syndrome"
      description: "An autosomal dominant overgrowth syndrome caused by mutation(s) of the NSD1 or the NFIX gene, encoding H3 lysine-36 and H4 lysine-20 specific histone-lysine N-methyltransferase, and nuclear factor 1 X-type, respectively. The condition is characterized by a disproportionately large and long head with a slightly prominent forehead and pointed chin, hypertelorism, down-slanting eyes, large hands and feet, overgrowth in childhood, and developmental delay."
      last_updated: 2026-08-17

    ncit:C7526:
      d4cg_label: "Papillary Intralymphatic Angioendothelioma"
      description: "A rare, intermediate and rarely metastasizing blood vessel neoplasm that most often affects the skin and soft tissue of the extremities and manifests as a slow-growing induration, nodule, or plaque. Rare cases have been described in the spleen, tongue, and testis as well. It is characterized by the presence of lymphatic-like vascular channels and papillary endothelial proliferation."
      last_updated: 2026-08-17

    ncit:C75387:
      d4cg_label: "hCG"
      description: "A laboratory test to detect the amount of human chorionic gonadotropin in a biospecimen."
      last_updated: 2026-08-17

    ncit:C7541:
      d4cg_label: "Retinoblastoma"
      description: "A malignant neoplasm originating in the nuclear layer of the retina."
      last_updated: 2026-08-17

    ncit:C75419:
      d4cg_label: "WHO"
      description: "A United Nations agency established to coordinate international health activities and to help governments improve health services."
      last_updated: 2026-08-17

    ncit:C75466:
      d4cg_label: "Rubinstein-Taybi Syndrome"
      description: "A rare genetic syndrome mapped to chromosome 16p13.3 and associated with mutations in the CREBBP gene. It is characterized by mental and growth retardation, distinctive facial features (prominent nose, low-set ears, microcephaly, and small mouth), and broad thumbs and great toes. Patients are at an increased risk of developing benign and malignant neoplasms, including nervous system neoplasms and malignant lymphoproliferative disorders."
      last_updated: 2026-08-17

    ncit:C75545:
      d4cg_label: "Hemolytic Uremic Syndrome"
      description: "A disorder characterized by a form of thrombotic microangiopathy with renal failure, hemolytic anemia, and severe thrombocytopenia."
      last_updated: 2026-08-17

    ncit:C75568:
      d4cg_label: "Multi-Organ Failure"
      description: "Complete impairment of two or more organs or organ systems."
      last_updated: 2026-08-17

    ncit:C7596:
      d4cg_label: "Myoepithelioma Carcinoma"
      description: "A malignant neoplasm composed of myoepithelial cells."
      last_updated: 2026-08-17

    ncit:C7600:
      d4cg_label: "WHO, Version 4 >> AML with Myelodysplasia-related Changes"
      description: "An acute myeloid leukemia with at least 20% blasts in the bone marrow or blood and one of the following: a previous history of myelodysplastic syndrome; multilineage dysplasia; or myelodysplastic syndrome-related cytogenetic abnormalities."
      last_updated: 2026-08-17

    ncit:C76112:
      d4cg_label: "Corticorelin Acetate"
      description: "A substance being studied in the treatment of brain cancer. It is made naturally by the hypothalamus (a part of the brain) and can also be made in the laboratory. Human corticotropin-releasing factor may help reduce symptoms caused by edema (swelling) of the brain. It is a type of neurohormone."
      last_updated: 2026-08-17

    ncit:C76132:
      d4cg_label: "Full Thickness Sclera, into the outer third"
      description: "A burn that involves the full thickness of the epidermis and dermis characterized by exposure of subcutaneous tissues."
      last_updated: 2026-08-17

    ncit:C7634:
      d4cg_label: "Solitary Fibrous Tumor"
      description: "A localized neoplasm of probable fibroblastic derivation. It is characterized by the presence of round to spindle-shaped cells, hylanized stroma formation, thin-walled branching blood vessels, and thin bands of collagen."
      last_updated: 2026-08-17

    ncit:C770:
      d4cg_label: "Prednisone"
      description: "A drug used to lessen inflammation and lower the body's immune response. It is used with other drugs to treat leukemia and lymphoma and other types of cancer. It is also used alone or with other drugs to prevent or treat many other conditions. These include conditions related to cancer, such as anemia (a low level of red blood cells), allergic reactions, and loss of appetite. Prednisone is a type of therapeutic glucocorticoid."
      last_updated: 2026-08-17

    ncit:C773:
      d4cg_label: "Procarbazine Hydrochloride"
      description: "A drug that is used to treat advanced Hodgkin lymphoma and is being studied in the treatment of other types of cancer. Matulane blocks cells from making proteins and damages DNA. It may kill cancer cells. It is a type of antineoplastic agent and a type of alkylating agent."
      last_updated: 2026-08-17

    ncit:C7754:
      d4cg_label: "Juvenile Polyposis Syndrome"
      description: "An autosomal dominant hereditary neoplastic syndrome. Mutations in the SMAD4 or BMPR1A genes have been identified in some patients. It is characterized by the presence of multiple juvenile polyps in the gastrointestinal tract."
      last_updated: 2026-08-17

    ncit:C77607:
      d4cg_label: "U/mL"
      description: "A unit of substance content expressed in unit(s) per milliliter."
      last_updated: 2026-08-17

    ncit:C77608:
      d4cg_label: "Abdominal Wall"
      description: "The tissue that surrounds the organs present in the abdominal cavity."
      last_updated: 2026-08-17

    ncit:C77613:
      d4cg_label: "Pleural Fluid"
      description: "The fluid that is ordinarily present in the pleural space. It allows for normal movement of the lungs during respiration."
      last_updated: 2026-08-17

    ncit:C77641:
      d4cg_label: "Mesenteric Nodes"
      description: "A lymph node located in the mesentery."
      last_updated: 2026-08-17

    ncit:C77643:
      d4cg_label: "Paraaortic Lymph Node"
      description: "A lymph node located adjacent to the lumbar region of the spine."
      last_updated: 2026-08-17

    ncit:C77799:
      d4cg_label: "VAR (Varicella)"
      description: "A sterile, lyophilized preparation of the Oka/Merck strain of the live, attenuated varicella-zoster virus (VZV), that can be used to prevent varicella, commonly known as chickenpox, or herpes zoster (HZ), commonly known as shingles. Upon reconstitution and subcutaneous vaccination with the VZV strain Oka/Merck live antigen, this vaccine induces antigen-specific T-cell and B-cell immune responses against the VZV, thereby protecting against VZV infection."
      last_updated: 2026-08-17

    ncit:C77896:
      d4cg_label: "Tucatinib"
      description: "An orally bioavailable inhibitor of the human epidermal growth factor receptor tyrosine kinase ErbB-2 (also called HER2) with potential antineoplastic activity. Tucatinib selectively binds to and inhibits the phosphorylation of ErbB-2, which may prevent the activation of ErbB-2 signal transduction pathways, resulting in growth inhibition and death of ErbB-2-expressing tumor cells. ErbB-2 is overexpressed in a variety of cancers and plays an important role in cellular proliferation and differentiation."
      last_updated: 2026-08-17

    ncit:C77959:
      d4cg_label: "Poor"
      description: "Of low value or worth."
      last_updated: 2026-08-17

    ncit:C7809:
      d4cg_label: "Adult Fibrosarcoma"
      description: "A malignant mesenchymal neoplasm composed of fibroblasts.  It is characterized by collagen production and a herringbone architectural pattern.  It is more commonly seen in middle-aged and older adults.  It usually affects the deep soft tissues of extremities, trunk, head and neck.  Adult fibrosarcomas may recur and metastasize to the lungs and bones."
      last_updated: 2026-08-17

    ncit:C78204:
      d4cg_label: "Regorafenib"
      description: "The anhydrous form of regorafenib, an orally bioavailable small molecule with potential antiangiogenic and antineoplastic activities. Regorafenib binds to and inhibits vascular endothelial growth factor receptors (VEGFRs) 2 and 3, and Ret, Kit, PDGFR and Raf kinases, which may result in the inhibition of tumor angiogenesis and tumor cell proliferation. VEGFRs are receptor tyrosine kinases that play important roles in tumor angiogenesis; the receptor tyrosine kinases RET, KIT, and PDGFR, and the serine/threonine-specific Raf kinase are involved in tumor cell signaling."
      last_updated: 2026-08-17

    ncit:C78222:
      d4cg_label: "Breast Hypoplasia"
      description: "A disorder characterized by underdevelopment of the breast."
      last_updated: 2026-08-17

    ncit:C78245:
      d4cg_label: "Conduction Abnormality"
      description: "A disorder affecting the conduction system that sends electrical signals in the myocardium."
      last_updated: 2026-08-17

    ncit:C78326:
      d4cg_label: "Decreased GFR"
      description: "A laboratory test result which indicates a decreased glomerular filtration rate."
      last_updated: 2026-08-17

    ncit:C78440:
      d4cg_label: "Lymph Node Pain"
      description: "A disorder characterized by a sensation of marked discomfort in a lymph node."
      last_updated: 2026-08-17

    ncit:C78530:
      d4cg_label: "Periorbital Edema (Swelling Around The Eye)"
      description: "A disorder characterized by swelling due to an excessive accumulation of fluid around the orbits of the face."
      last_updated: 2026-08-17

    ncit:C78532:
      d4cg_label: "Pseudomonas Exotoxin Immunoconjugate"
      description: "An immunotoxin containing epitope of Pseudomonas exotoxin (PE) with immunotherapeutic property. PE, a peptide toxin of 613 amino acids, consists of 3 functional domains: an amino-terminal receptor-binding domain, a middle translocation domain, and a carboxyl-terminal ADP-ribosylation domain. The last 5 carboxyl-terminal amino acids, Arg-Glu-Asp-Leu-Lys, are critical for its cytotoxic action."
      last_updated: 2026-08-17

    ncit:C78603:
      d4cg_label: "Scoliosis"
      description: "A congenital or acquired spinal deformity characterized by lateral curvature of the spine."
      last_updated: 2026-08-17

    ncit:C78797:
      d4cg_label: "Thrombotic Thrombocytopenic Purpura"
      description: "A coagulation disorder characterized by extensive formation of thrombi in small blood vessels throughout the body due to low levels of ADAMTS13 protein, and resulting in consumption of circulating platelets, which is characterized by thrombocytopenia, anemia, neurologic changes, and sometimes fever and renal dysfunction."
      last_updated: 2026-08-17

    ncit:C7901:
      d4cg_label: "AJCC >> Stage 1"
      description: "Stage I includes: pT1-4, N0, M0, SX.  pT1: Tumor limited to the testis and epididymis without vascular/lymphatic invasion; tumor may invade into the tunica albuginea but not the tunica vaginalis.  pT2: Tumor limited to the testis and epididymis with vascular/lymphatic invasion, or tumor extending through the tunica albuginea with involvement of the tunica vaginalis.  pT3: Tumor invades the spermatic cord with or without vascular/lymphatic invasion.  pT4: Tumor invades the scrotum with or without vascular/lymphatic invasion.  N0: No regional lymph node metastasis.  M0: No distant metastasis.  SX: Marker studies not available or not performed. (AJCC 6th and 7th eds.)"
      last_updated: 2026-08-17

    ncit:C792:
      d4cg_label: "Quercetin"
      description: "A kaempferol with a hydroxyl group at C-3'."
      last_updated: 2026-08-17

    ncit:C7930:
      d4cg_label: "Lymphomatoid Granulomatosis"
      description: "An angiocentric and angiodestructive lymphoproliferative disease involving extranodal sites, comprised of Epstein-Barr virus (EBV)-positive B-cells admixed with reactive T-cells.  Incidence is higher among adult males; patients with a history of immunodeficiency are at increased risk.  The most common site of involvement is the lung; other common sites include brain, kidney, liver, and skin.  Morphologically, three grades are recognized: grade I, II, and III.  Grade III lymphomatoid granulomatosis should be approached clinically as a subtype of diffuse large B-cell lymphoma."
      last_updated: 2026-08-17

    ncit:C7968:
      d4cg_label: "WHO, Version 4 >> APL with PML-RARA"
      description: "An acute promyelocytic leukemia with t(15;17)(q24.1;q21.2); PML-RARA that occurs in children."
      last_updated: 2026-08-17

    ncit:C79694:
      d4cg_label: "Meningismus"
      description: "A condition marked by headache, fever, and a stiff neck, which is caused when the meninges (three thin layers of tissue that cover and protect the brain and spinal cord) become irritated. Meningeal syndrome may be caused by blood, cancer cells, or substances from the breakdown of cancer cells that get into the cerebrospinal fluid (CSF). It may also be caused by infection with a bacterium, virus, or fungus."
      last_updated: 2026-08-17

    ncit:C79696:
      d4cg_label: "Neurogenic Bladder/Bowel"
      description: "A dysfunctional bladder caused by neurologic disease."
      last_updated: 2026-08-17

    ncit:C79748:
      d4cg_label: "Atrophy"
      description: "A decrease in size of organ, tissue or cell. (INHAND)"
      last_updated: 2026-08-17

    ncit:C7976:
      d4cg_label: "Extrahepatic Bile Duct, Distal"
      description: "A carcinoma that arises from the common bile duct distal to the insertion of the cystic duct."
      last_updated: 2026-08-17

    ncit:C80043:
      d4cg_label: "Codrituzumab"
      description: "A humanized monoclonal antibody directed against the cell surface oncofetal protein glypican-3 (GPC3) with potential antineoplastic activity. Anti-GPC3 monoclonal antibody GC33 binds to GPC3 and triggers a host immune response against GPC3-expressing tumor cells, which may result in tumor cell death. GPC3, a heparin sulfate proteoglycan, is frequently upregulated in hepatocellular carcinoma and mesoderm-derived organs such as the liver, lungs, and kidney."
      last_updated: 2026-08-17

    ncit:C80099:
      d4cg_label: "premature_ovarian_insufficiency"
      description: "A condition in which the ovaries stop working and menstrual periods stop before age 40. Natural menopause usually occurs around age 50. A woman is said to be in menopause when she hasn't had a period for 12 months in a row. Symptoms of menopause include hot flashes, mood swings, night sweats, vaginal dryness, trouble concentrating, and infertility. Premature menopause can be caused by some cancer treatments, surgery to remove the ovaries, and certain diseases or genetic conditions."
      last_updated: 2026-08-17

    ncit:C80153:
      d4cg_label: "Cocaine"
      description: "A tropane alkaloid with central nervous systems (CNS) stimulating and local anesthetic activity. Cocaine binds to the dopamine, serotonin, and norepinephrine transport proteins and inhibits the re-uptake of dopamine, serotonin, and norepinephrine into pre-synaptic neurons. This leads to an accumulation of the respective neurotransmitters in the synaptic cleft and may result in increased postsynaptic receptor activation. The mechanism of action through which cocaine exerts its local anesthetic effects is by binding to and blocking the voltage-gated sodium channels in the neuronal cell membrane. By stabilizing neuronal membranes, cocaine inhibits the initiation and conduction of nerve impulses and produces a reversible loss of sensation."
      last_updated: 2026-08-17

    ncit:C80169:
      d4cg_label: "Angiotension Converting Enzyme"
      description: "A measurement of the angiotensin converting enzyme in a biological specimen."
      last_updated: 2026-08-17

    ncit:C80520:
      d4cg_label: "Neutropenia"
      description: "A condition in which there is a lower-than-normal number of neutrophils (a type of white blood cell)."
      last_updated: 2026-08-17

    ncit:C8071:
      d4cg_label: "Ann Arbor >> Stage 1"
      description: "Ann Arbor Classification: Stage I: Involvement of a single lymph node region (I); or localized involvement of a single extralymphatic organ or site in the absence of any lymph node involvement (IE)."
      last_updated: 2026-08-17

    ncit:C80867:
      d4cg_label: "Cediranib"
      description: "An orally bioavailable indole ether quinazoline derivative and vascular endothelial growth factor receptor (VEGFR) inhibitor, with potential antineoplastic activity. Upon oral administration, cediranib binds to and inhibits the three VEGFR subtypes 1 (VEGFR-1), 2 (VEGFR-2) and 3 (VEGFR-3), thereby blocking VEGF-signaling, angiogenesis, and tumor cell growth. Expression of VEGFRs may be upregulated in a variety of tumor cell types."
      last_updated: 2026-08-17

    ncit:C8116:
      d4cg_label: "Ann Arbor >> Stage 2"
      description: "Ann Arbor Classification: Stage II: Involvement of two or more lymph node regions on the same side of the diaphragm (II); or localized involvement of a single extralymphatic organ or site in association with regional lymph node involvement with or without involvement of other lymph node regions on the same side of the diaphragm (IIE)."
      last_updated: 2026-08-17

    ncit:C81170:
      d4cg_label: "Midline"
      description: "A medial line, especially the medial line or medial plane of the body (or some part of the body)."
      last_updated: 2026-08-17

    ncit:C812:
      d4cg_label: "RNA"
      description: "One of two types of nucleic acid made by cells. Ribonucleic acid contains information that has been copied from DNA (the other type of nucleic acid). Cells make several different forms of ribonucleic acid, and each form has a specific job in the cell. Many forms of ribonucleic acid have functions related to making proteins. Ribonucleic acid is also the genetic material of some viruses instead of DNA. Ribonucleic acid can be made in the laboratory and used in research studies."
      last_updated: 2026-08-17

    ncit:C81239:
      d4cg_label: "cause_of_death"
      description: "Cause of death for patient"
      last_updated: 2026-08-17

    ncit:C81255:
      d4cg_label: "Head Circumference"
      description: "A circumferential measurement of the head at the widest point, which is traditionally above the eyebrows."
      last_updated: 2026-08-17

    ncit:C8129:
      d4cg_label: "Ann Arbor >> Stage 3"
      description: "Ann Arbor Classification: Stage III: Involvement of lymph node regions on both sides of the diaphragm (III), which also may be accompanied by extralymphatic extension in association with adjacent lymph node involvement (IIIE) or by involvement of the spleen (IIIS) or both (IIIE,S)."
      last_updated: 2026-08-17

    ncit:C81328:
      d4cg_label: "Weight"
      description: "A measurement that describes the vertical force exerted by a mass of the patient as a result of gravity."
      last_updated: 2026-08-17

    ncit:C8142:
      d4cg_label: "Ann Arbor >> Stage 4"
      description: "Ann Arbor Classification: Stage IV: Diffuse or disseminated involvement of one or more extralymphatic organs, with or without associated lymph node involvement; or isolated extralymphatic organ involvement in the absence of adjacent regional lymph node involvement, but in conjunction with disease in distant site(s); or any involvement of the liver or bone marrow, lungs (other than by direct extension from another site), or cerebrospinal fluid."
      last_updated: 2026-08-17

    ncit:C81729:
      d4cg_label: "Trisomy 10"
      description: "A chromosomal abnormality consisting of the presence of a third copy of chromosome 10 in somatic cells."
      last_updated: 2026-08-17

    ncit:C81945:
      d4cg_label: "ALK Variant"
      description: "A molecular genetic abnormality that refers to the presence of a mutation in the ALK gene."
      last_updated: 2026-08-17

    ncit:C81997:
      d4cg_label: "Segmented Neutrophils"
      description: "A measurement of the segmented neutrophils in a biological specimen."
      last_updated: 2026-08-17

    ncit:C82179:
      d4cg_label: "mpal"
      description: "An acute leukemia of ambiguous lineage.  It is characterized by the presence of either separate populations of blasts of more than one lineage, or one population of blasts co-expressing markers of more than one lineage."
      last_updated: 2026-08-17

    ncit:C82190:
      d4cg_label: "miR-372-3p"
      description: "The human MIR372 wild-type allele is located in the vicinity of 19q13.41 and is approximately 66 bases in length. This allele, which encodes MIR372 pre-miRNA, plays a role in the regulation of gene expression. Alteration in the expression of this gene is associated with development of testicular germ cell tumor and non-small cell lung cancer."
      last_updated: 2026-08-17

    ncit:C82191:
      d4cg_label: "miR-373-3p"
      description: "The human MIR373 wild-type allele is located in the vicinity of 19q13.41 and is approximately 68 bases in length. This allele, which encodes MIR373 pre-miRNA, plays a role in the regulation of gene expression. Alteration in the expression of this gene is associated with development of testicular germ cell tumor and breast cancer."
      last_updated: 2026-08-17

    ncit:C82338:
      d4cg_label: "WHO, Version 4 >> Myeloid Proliferations Related to Down Syndrome"
      description: "Hematologic neoplasms occurring in individuals with Down syndrome.  There is an increased risk of acute leukemias in both children and adults with Down syndrome.  In particular, the incidence of acute myeloid leukemia in Down syndrome children of less than five years of age is particularly high, it is usually an acute megakaryoblastic leukemia, and is associated with GATA1 gene mutation.  This group of disorders also includes the entity transient abnormal myelopoiesis which occurs in neonates and is associated with GATA1 gene mutation."
      last_updated: 2026-08-17

    ncit:C82339:
      d4cg_label: "tam"
      description: "A myeloid proliferation occurring in newborns with Down syndrome.  It is clinically and morphologically indistinguishable from acute myeloid leukemia and is associated with GATA1 mutations.  The blasts display morphologic and immunophenotypic features of megakaryocytic lineage.  In the majority of patients the myeloid proliferation undergoes spontaneous remission."
      last_updated: 2026-08-17

    ncit:C82340:
      d4cg_label: "GATA1 Mutation"
      description: "A change in the nucleotide sequence of the GATA1 gene."
      last_updated: 2026-08-17

    ncit:C82392:
      d4cg_label: "FLAIR"
      description: "A type of magnetic resonance imaging that uses an inversion recovery sequence with a long inversion time to null fluids present in the imaging area, improving clarity of the object of interest."
      last_updated: 2026-08-17

    ncit:C82403:
      d4cg_label: "WHO, Version 4 >> AML with t(9;11)(p21.3;q23.3); KMT2A-MLLT3"
      description: "An acute myeloid leukemia associated with t(9;11)(p21.3;q23.3) and MLLT3-KMT2A fusion protein expression. Morphologically it usually has monocytic features. It may present at any age but it is more commonly seen in children. Patients may present with disseminated intravascular coagulation."
      last_updated: 2026-08-17

    ncit:C82423:
      d4cg_label: "WHO, Version 4 >> AML with t(6;9)(p23;q34.1);DEK-NUP214"
      description: "An acute myeloid leukemia associated with t(6;9)(p22.3;q34), resulting in DEK-NUP214(CAN) fusion protein expression. It is often associated with multilineage dysplasia and basophilia. It is rare in children."
      last_updated: 2026-08-17

    ncit:C82426:
      d4cg_label: "WHO, Version 4 >> AML with inv(3)(q21.3q26.2) or t(3;3)(q21.3;q26.2); GATA2, MECOM"
      description: "An acute myeloid leukemia associated with inv(3)(q21.3q26.2) or t(3;3)(q21.3;q26.2) resulting in the reposition of a distal GATA2 enhancer to activate MECOM expression. It may present de novo or follow a myelodysplastic syndrome. The clinical course is aggressive."
      last_updated: 2026-08-17

    ncit:C82427:
      d4cg_label: "WHO, Version 4 >> AML (megakaryoblastic) with t(1;22)(p13.3;q13.3); RBM15-MKL1"
      description: "An acute myeloid leukemia associated with t(1;22)(p13.3;q13.1) resulting in the expression of RBM15-MKL1 fusion protein. It affects infants and children and usually shows megakaryocytic maturation."
      last_updated: 2026-08-17

    ncit:C82429:
      d4cg_label: "NPM1 Mutation"
      description: "Mutation of the nucleophosmin gene. It is seen in acute myeloid leukemias usually associated with a normal karyotype."
      last_updated: 2026-08-17

    ncit:C82431:
      d4cg_label: "WHO, Version 4 >> AML with Mutated NPM1"
      description: "An acute myeloid leukemia (AML) with mutation of the nucleophosmin gene. It is usually associated with normal karyotype. It is seen in 8% of children with AML."
      last_updated: 2026-08-17

    ncit:C82488:
      d4cg_label: "Excellent"
      description: "Conforming to the highest quality or standard."
      last_updated: 2026-08-17

    ncit:C82489:
      d4cg_label: "Fair"
      description: "Having no exceptional quality or ability."
      last_updated: 2026-08-17

    ncit:C82492:
      d4cg_label: "Trastuzumab Emtansine"
      description: "An antibody-drug conjugate (ADC) consisting of the recombinant anti-epidermal growth factor receptor 2 (HER2) monoclonal antibody trastuzumab conjugated to the maytansinoid DM1 via a nonreducible thioether linkage (MCC) with potential antineoplastic activity. The trastuzumab moiety of this ADC binds to HER2 on tumor cell surfaces; upon internalization, the DM1 moiety is released and binds to tubulin, thereby disrupting microtubule assembly/disassembly dynamics and inhibiting cell division and the proliferation of cancer cells that overexpress HER2. Linkage of antibody and drug through a nonreducible linker has been reported to contribute to the improved efficacy and reduced toxicity of this ADC compared to similar ADCs constructed with reducible linkers."
      last_updated: 2026-08-17

    ncit:C82576:
      d4cg_label: "time_point"
      description: "The point in time that acts as a fixed reference point to an event."
      last_updated: 2026-08-17

    ncit:C82612:
      d4cg_label: "PTPN11 Mutation"
      description: "Mutation of the protein tyrosine phosphatase, non-receptor type 11 gene. It is seen in cases of juvenile myelomonocytic leukemia."
      last_updated: 2026-08-17

    ncit:C8288:
      d4cg_label: "Involvement of Bone"
      description: "Infiltration of the bone marrow by a malignant neoplasm."
      last_updated: 2026-08-17

    ncit:C83052:
      d4cg_label: "ae_hospitalization"
      description: "An indication or description that an adverse event is associated with or prolongs hospitalization."
      last_updated: 2026-08-17

    ncit:C83082:
      d4cg_label: "study_id"
      description: "A sequence of characters used to identify, name, or characterize the study."
      last_updated: 2026-08-17

    ncit:C83190:
      d4cg_label: "Pediatrician"
      description: "A medical doctor with specialized training in the care of children."
      last_updated: 2026-08-17

    ncit:C83312:
      d4cg_label: "laboratory_test_method"
      description: "A systematic course of action that is performed in order to complete a laboratory test."
      last_updated: 2026-08-17

    ncit:C8362:
      d4cg_label: "Mild"
      description: "A morphologic finding indicating the presence of mild cellular atypia associated with mild architectural changes in a tissue sample."
      last_updated: 2026-08-17

    ncit:C8363:
      d4cg_label: "Moderate"
      description: "A morphologic finding indicating the presence of moderate cellular atypia associated with moderate architectural changes in a tissue sample."
      last_updated: 2026-08-17

    ncit:C8364:
      d4cg_label: "Severe"
      description: "A morphologic finding indicating the presence of severe cellular atypia associated with severe architectural changes in a tissue sample."
      last_updated: 2026-08-17

    ncit:C8419:
      d4cg_label: "Dysplastic Cerebellar Gangliocytoma"
      description: "A benign, WHO grade I cerebellar mass, which occurs in young adults and is composed of dysplastic ganglion cells.  It is the major CNS manifestation of Cowden disease, an autosomal dominant condition that causes a variety of hamartomas and neoplasms."
      last_updated: 2026-08-17

    ncit:C84217:
      d4cg_label: "Tocilizumab"
      description: "A recombinant, humanized IgG1 monoclonal antibody directed against the interleukin-6 receptor (IL-6R) with immunosuppressant activity. Tocilizumab targets and binds to both the soluble form of IL-6R (sIL-6R) and the membrane-bound form (mIL-6R), thereby blocking the binding of IL-6 to its receptor. This prevents IL-6-mediated signaling. IL-6, a pro-inflammatory cytokine that plays an important role in the regulation of the immune response, is overproduced in autoimmune disorders, certain types of cancers and possibly various other inflammatory conditions."
      last_updated: 2026-08-17

    ncit:C84266:
      d4cg_label: "CTCAE >> Grade 4"
      description: "An adverse event that has life-threatening consequences; for which urgent intervention is indicated; that puts the patient at risk of death at the time of the event if immediate intervention is not undertaken."
      last_updated: 2026-08-17

    ncit:C84352:
      d4cg_label: "Craniospinal"
      description: "Relating to the cranium and the spinal column."
      last_updated: 2026-08-17

    ncit:C84467:
      d4cg_label: "Vesicoureteral Reflux"
      description: "Abnormal flow of urine from the urinary bladder back into the ureters."
      last_updated: 2026-08-17

    ncit:C84473:
      d4cg_label: "Atrial Septal Defect"
      description: "The presence of a defect (opening) in the septum that separates the two atria of the heart. It can be congenital or acquired."
      last_updated: 2026-08-17

    ncit:C84492:
      d4cg_label: "Patent Ductus Arteriosus"
      description: "A congenital defect characterized by the failure of the ductus arteriosus to close soon after birth. As a consequence, blood from the aorta mixes with blood from the pulmonary artery. If untreated, it may lead to congestive heart failure."
      last_updated: 2026-08-17

    ncit:C84505:
      d4cg_label: "Tetralogy of Fallot"
      description: "A congenital heart disorder characterized by the presence of the following four abnormalities: ventricular septal defect, pulmonary stenosis, overriding aorta, and right ventricular hypertrophy."
      last_updated: 2026-08-17

    ncit:C84506:
      d4cg_label: "Ventricular Septal Defect"
      description: "The presence of a defect (opening) in the septum that separates the two ventricles of the heart. It can be congenital or acquired."
      last_updated: 2026-08-17

    ncit:C84507:
      d4cg_label: "Buffy Coat"
      description: "The middle fraction of an anticoagulated blood specimen following separation by centrifugation. It contains most of the white blood cells and platelets."
      last_updated: 2026-08-17

    ncit:C84520:
      d4cg_label: "Glembatumumab"
      description: "A human monoclonal antibody against transmembrane glycoprotein non-metastatic melanoma protein B (GPNMB). Glembatumumab binds to GPNMB on cancer cells, but alone does not appear to inhibit cancer cell growth. However, this antibody could be utilized to deliver a conjugated cytotoxic agent to GPNMB-expressing tumor cells. GPNMB, overexpressed on the surface of various cancer cells, plays a key role in cancer cell proliferation."
      last_updated: 2026-08-17

    ncit:C84567:
      d4cg_label: "Coarctation of Aorta"
      description: "Congenital narrowing of a segment of the aorta. Signs and symptoms include hypertension, muscle weakness, shortness of breath, headaches and leg cramps."
      last_updated: 2026-08-17

    ncit:C8460:
      d4cg_label: "FAB >> Version NOS >> M0"
      description: "An acute myeloid leukemia (AML) in which the blasts do not show evidence of myeloid differentiation by morphology and conventional cytochemistry. (WHO, 2001)"
      last_updated: 2026-08-17

    ncit:C84630:
      d4cg_label: "Cherubism"
      description: "A rare autosomal dominant inherited disorder usually caused by mutations in the SH3BP2 gene. It is characterized by a prominent lower part of the face due to bilateral replacement of the mandibular or maxillary bones by lesions. The lesions contain osteoclast-like cells admixed with spindle-shaped mononuclear stromal cells.  With time, the lesions become more fibrotic and less osteoclast-rich."
      last_updated: 2026-08-17

    ncit:C84641:
      d4cg_label: "Clubfoot"
      description: "A congenital malformation involving one or both feet, in which the affected foot is rotated inward and downward."
      last_updated: 2026-08-17

    ncit:C84652:
      d4cg_label: "Costello Syndrome"
      description: "A genetic syndrome caused by mutations in the HRAS gene. It is characterized by developmental delay, mental retardation, loose skin folds, cardiomyopathy, tachycardia, and structural heart defects. Patients are at an increased risk of developing benign or malignant neoplasms."
      last_updated: 2026-08-17

    ncit:C84655:
      d4cg_label: "Craniosynostosis"
      description: "A congenital disorder characterized by earlier than normal closure of some or all sutures of the infant skull."
      last_updated: 2026-08-17

    ncit:C84668:
      d4cg_label: "Denys-Drash Syndrome"
      description: "A Wilms tumor 1 gene syndrome caused by various point mutation(s) affecting the zinc finger(s) of the Wilms tumor protein. This syndrome is characterized by congenital nephropathy (diffuse mesangial sclerosis), gonadal dysgenesis resulting in atypical genital and reproductive tract development in male infants, and high risk for development of Wilms tumor, an embryonal neoplasm defined by the presence of epithelial, mesenchymal, and blastema components."
      last_updated: 2026-08-17

    ncit:C84673:
      d4cg_label: "Dilated Cardiomyopathy"
      description: "Cardiomyopathy which is characterized by dilation and contractile dysfunction of the left and right ventricles. It may be idiopathic, or it may result from a myocardial infarction, myocardial infection, or alcohol abuse. It is a cause of congestive heart failure."
      last_updated: 2026-08-17

    ncit:C84725:
      d4cg_label: "Gastroschisis"
      description: "A congenital birth defect characterized by the exposure of the fetal intestines outside the abdominal wall through an abdominal wall opening."
      last_updated: 2026-08-17

    ncit:C84756:
      d4cg_label: "Hepatolenticular Degeneration"
      description: "A rare autosomal recessive inherited disorder caused by mutations in the ATP7B gene. It is characterized by copper accumulation in the tissues, particularly brain and liver. It results in liver failure, neurologic, and psychotic manifestations."
      last_updated: 2026-08-17

    ncit:C84820:
      d4cg_label: "LEOPARD Syndrome"
      description: "A genetic syndrome caused by mutation(s) in the PTPN11, RAF1, or the BRAF genes, encoding tyrosine-protein phosphatase non-receptor type 11 and RAF proto-oncogene serine/threonine-protein kinase, and serine/threonine-protein kinase B-raf, respectively. Affected male individuals may exhibit unilateral or bilateral cryptorchidism, small penis, and/or hypospadias (urinary meatus on the dorsal side of the penis). Affected female individuals may have ovarian hypoplasia or agenesis. Primary hypogonadism in both female and male individuals may result in delayed puberty."
      last_updated: 2026-08-17

    ncit:C84892:
      d4cg_label: "Mixed Connective Tissue Disease"
      description: "An autoimmune disorder which is associated with high titer anti-RNP antibody, and usually features Raynaud's Phenomenon and swollen fingers."
      last_updated: 2026-08-17

    ncit:C84906:
      d4cg_label: "Mulibrey Nanism"
      description: "An autosomal recessive disorder caused by mutation(s) in the TRIM37 gene, encoding E3 ubiquitin-protein ligase TRIM37. Mulibrey is a contraction of muscle, liver, brain, and eyes. \"Nanism\" is a synonym for \"dwarfism\". This condition is associated with characteristic facial features, including hypertelorism, pubertal delay, occasional progressive cardiomyopathy, insulin resistance with type 2 diabetes, and an increased risk for Wilms tumor."
      last_updated: 2026-08-17

    ncit:C8493:
      d4cg_label: "Breast and Ovarian Cancer"
      description: "An autosomal dominant inherited syndrome caused by deleterious mutations in the BRCA1 or BRCA2 genes. Affected individuals are at high risk of developing breast cancer, particularly before the age of fifty, high risk of developing a second primary breast cancer, and high risk of developing both breast and ovarian cancer."
      last_updated: 2026-08-17

    ncit:C8494:
      d4cg_label: "Lynch Syndrome"
      description: "An autosomal dominant hereditary neoplastic syndrome characterized by the development of colorectal carcinoma and a high risk of developing endometrial carcinoma, gastric carcinoma, ovarian carcinoma, renal pelvis carcinoma, and small intestinal carcinoma. Patients often develop colorectal carcinomas at an early age (mean, 45 years). In the majority of the cases the lesions arise from the proximal colon. At the molecular level, high-frequency microsatellite instability is present."
      last_updated: 2026-08-17

    ncit:C84941:
      d4cg_label: "Oculocutaneous Albinism"
      description: "An autosomal recessive inherited disorder caused by mutations of the OCA2, SLC45A2, TYR and TYRP1 genes. It is characterized by hypopigmentation of the skin, hair, and eyes, resulting in very fair skin, white colored hair, and reduced pigmentation in the iris and retina. Individuals may have vision disturbances and photophobia."
      last_updated: 2026-08-17

    ncit:C8495:
      d4cg_label: "Hereditary Retinoblastoma"
      description: "An inherited malignant tumor that originates in the nuclear layer of the retina. A predisposition to retinoblastoma has been associated with 13q14 cytogenetic abnormalities affecting the RB1 gene. Patients with the inherited form appear to be at increased risk for secondary non-ocular malignancies such as osteosarcoma, malignant fibrous histiocytoma, and fibrosarcoma."
      last_updated: 2026-08-17

    ncit:C8509:
      d4cg_label: "Primary Tumor"
      description: "A tumor at the original site of origin."
      last_updated: 2026-08-17

    ncit:C85237:
      d4cg_label: "47XYY"
      description: "A condition caused by the presence of an extra Y chromosome resulting in 47,XYY karyotype in an individual with male phenotype. The condition is characterized by tall stature, increased risk of learning disabilities, and delayed development of speech and language. Testicular function and size are normal."
      last_updated: 2026-08-17

    ncit:C85407:
      d4cg_label: "EVANS"
      description: "A staging system for neuroblastoma proposed by Evans, based on both the site of origin and the clinical behavior of the tumor."
      last_updated: 2026-08-17

    ncit:C85416:
      d4cg_label: "INSS"
      description: "A surgicopathological staging system for neuroblastoma, based on the Evans staging system."
      last_updated: 2026-08-17

    ncit:C85423:
      d4cg_label: "Pediatric Oncology Group Neuroblastoma Staging System"
      description: "A clinicopathological staging system for neuroblastoma, which places emphasis on the presence or absence of regional lymph node involvement by tumor."
      last_updated: 2026-08-17

    ncit:C86021:
      d4cg_label: "Exact"
      description: "Marked by strict and particular and complete accordance with fact."
      last_updated: 2026-08-17

    ncit:C86074:
      d4cg_label: "Hemicolectomy"
      description: "Surgical removal of approximately half of the colon."
      last_updated: 2026-08-17

    ncit:C8644:
      d4cg_label: "B-ALL"
      description: "An acute lymphoblastic leukemia of B-lineage origin."
      last_updated: 2026-08-17

    ncit:C86571:
      d4cg_label: "Melena/Black Stool"
      description: "Abnormally dark tarry feces containing blood, usually due to gastrointestinal bleeding."
      last_updated: 2026-08-17

    ncit:C86972:
      d4cg_label: "dna_index_numeric"
      description: "The ratio of the DNA content or chromosome number in a tumor sample compared to that in a normal sample."
      last_updated: 2026-08-17

    ncit:C87069:
      d4cg_label: "Cleft Palate"
      description: "A congenital abnormality consisting of a fissure in the midline of the hard and/or soft palate; it is the result of the failure of the two sides of the palate to fuse during embryonic development."
      last_updated: 2026-08-17

    ncit:C87088:
      d4cg_label: "Intrauterine Growth Restriction"
      description: "A fetus whose estimated weight is below the 10th percentile for its gestational age; however, many fetuses who meet this definition are simply small-for-gestational-age and are constitutionally small. The diagnosis of intrauterine growth restriction carries an increased risk of perinatal morbidity and mortality."
      last_updated: 2026-08-17

    ncit:C87114:
      d4cg_label: "Proptosis"
      description: "Abnormal protrusion of one or both eyes from the socket; causes include hyperthyroidism (particularly Graves disease); bleeding behind the eye; infection, inflammation, or tumors of the orbit; and vascular disorders."
      last_updated: 2026-08-17

    ncit:C87121:
      d4cg_label: "Situs Inversus"
      description: "A congenital condition in which there is complete right-to-left reversal of the position of the major thoracic and abdominal organs (that is, they are arranged in a mirror image of the normal positioning)."
      last_updated: 2026-08-17

    ncit:C87136:
      d4cg_label: "Prepubertal"
      description: "The period of development immediately prior to the onset of puberty when changes occur that lead to sexual maturity."
      last_updated: 2026-08-17

    ncit:C87149:
      d4cg_label: "Visual Acuity"
      description: "Sharpness of vision, the ability to discern fine detail."
      last_updated: 2026-08-17

    ncit:C87175:
      d4cg_label: "Cleft Lip"
      description: "A congenital abnormality consisting of one or more clefts (splits) in the upper lip, which may be accompanied by a cleft palate; it is the result of the failure of the embryonic parts of the lip to fuse."
      last_updated: 2026-08-17

    ncit:C875:
      d4cg_label: "Thiotepa"
      description: "A polyfunctional, organophosphorus alkylating agent and a stable derivative of N,N',N''-triethylenephosphoramide (TEPA), with antineoplastic activity. Upon administration, thiotepa is converted into highly reactive ethylenimine groups, which covalently bind to nucleophilic groups in DNA and demonstrate a preference for the N7 position of guanine bases. This induces crosslinking of alkylated guanine bases in double-stranded DNA, interferes with both DNA replication and cell division, and results in both the induction of apoptosis and the inhibition of cell growth."
      last_updated: 2026-08-17

    ncit:C876:
      d4cg_label: "Thioguanine"
      description: "A synthetic guanosine analogue antimetabolite. Phosphorylated by hypoxanthine-guanine phosphoribosyltransferase, thioguanine incorporates into DNA and RNA, resulting in inhibition of DNA and RNA syntheses and cell death. This agent also inhibits glutamine-5-phosphoribosylpyrophosphate amidotransferase, thereby inhibiting purine synthesis. (NCI04)"
      last_updated: 2026-08-17

    ncit:C88082:
      d4cg_label: "Treatment for Adverse Event"
      description: "Treatment administered to patients experiencing adverse events."
      last_updated: 2026-08-17

    ncit:C8810:
      d4cg_label: "Extraskeletal Osteosarcoma"
      description: "A malignant bone-forming neoplasm, arising in tissue other than bone."
      last_updated: 2026-08-17

    ncit:C88112:
      d4cg_label: "Photon"
      description: "A single unit of electromagnetic radiation, generally considered to be a discrete particle having no mass or charge."
      last_updated: 2026-08-17

    ncit:C88144:
      d4cg_label: "Mosaic"
      description: "An individual containing two or more populations of genetically different cells that arose from a single zygote."
      last_updated: 2026-08-17

    ncit:C88175:
      d4cg_label: "GPC3"
      description: "Glypican-3 (580 aa, ~66 kDa) is encoded by the human GPC3 gene. This protein is involved in the mediation of proteoglycan binding to the cell surface."
      last_updated: 2026-08-17

    ncit:C88412:
      d4cg_label: "Autism Spectrum Disorder"
      description: "A spectrum of developmental disorders that includes autism, Asperger syndrome, and Rett syndrome. Signs and symptoms include poor communication skills, defective social interactions, and repetitive behaviors."
      last_updated: 2026-08-17

    ncit:C88541:
      d4cg_label: "Hemihypertrophy"
      description: "A condition in which one side of the body or a part of one side is larger than the other. Children with hemihypertrophy have an increased risk of developing certain types of cancer, including Wilms tumor (a childhood kidney cancer) and liver cancer."
      last_updated: 2026-08-17

    ncit:C888:
      d4cg_label: "Thyroid Hormone Replacement"
      description: "The sodium salt of levothyroxine, a synthetic levoisomer of thyroxine (T4) that is similar to the endogenous hormone produced by the thyroid gland. In peripheral tissues, levothyroxine is deiodinated by 5'-deiodinase to form triiodothyronine (T3). T3 enters the cell and binds to nuclear thyroid hormone receptors; the activated hormone-receptor complex in turn triggers gene expression and produces proteins required in the regulation of cellular respiration; thermogenesis; cellular growth and differentiation; and the metabolism of proteins, carbohydrates and lipids. T3 also exhibits cardiostimulatory effects."
      last_updated: 2026-08-17

    ncit:C8923:
      d4cg_label: "FAB >> Version NOS >> M6"
      description: "A progressive, proliferative disease of blood cells, originating from immature erythroid cells."
      last_updated: 2026-08-17

    ncit:C894:
      d4cg_label: "Toxin"
      description: "A chemical, physical, or biological agent that causes disease or some alteration of the normal structure and function of an organism. Usually refers to poisonous substance produced during the metabolism and growth of certain microorganisms and some higher plant and animal species, or any poisonous isomer, homolog, or derivative of such a substance. It causes either permanent or reversible injury to the health of a living thing on contact or absorption, typically by interacting with biological macromolecules such as enzymes and receptors. Onset of effects may be immediate or delayed, and impairments may be slight or severe. (NCI)"
      last_updated: 2026-08-17

    ncit:C89799:
      d4cg_label: "48XXXY"
      description: "A rare sex chromosome abnormality in which a male child has 2 extra X chromosomes."
      last_updated: 2026-08-17

    ncit:C89806:
      d4cg_label: "Buttock"
      description: "A zone of soft tissue located on the posterior of the lateral side of the pelvic region corresponding to the gluteal muscles."
      last_updated: 2026-08-17

    ncit:C89807:
      d4cg_label: "Scalp"
      description: "The outer covering of the calvaria. It is composed of several layers: SKIN; subcutaneous connective tissue; the occipitofrontal muscle which includes the tendonous galea aponeurotica; Loose connective tissue; and the pericranium (the PERIOSTEUM of the SKULL)."
      last_updated: 2026-08-17

    ncit:C900:
      d4cg_label: "Tretinoin"
      description: "A naturally-occurring acid of retinol. Tretinoin binds to and activates retinoic acid receptors (RARs), thereby inducing changes in gene expression that lead to cell differentiation, decreased cell proliferation, and inhibition of tumorigenesis.  This agent also inhibits telomerase, resulting in telomere shortening and eventual apoptosis of some tumor cell types.  The oral form of tretinoin has teratogenic and embryotoxic properties."
      last_updated: 2026-08-17

    ncit:C9015:
      d4cg_label: "Mature Teratoma"
      description: "A teratoma which may be cystic; it is composed entirely of well differentiated, adult-type mature tissues, without evidence of fetal-type immature tissues (grade 0 teratoma)."
      last_updated: 2026-08-17

    ncit:C9020:
      d4cg_label: "FAB >> Version NOS >> M4eo"
      description: "Acute myelomonocytic leukemia characterized by the presence of abnormal bone marrow eosinophils. It is associated with inv(16)(p13.1;q22) or t(16;16)(p13.1;q22). It has a favorable prognosis."
      last_updated: 2026-08-17

    ncit:C90529:
      d4cg_label: "AJCC, v6 >> Stage 0"
      description: "A cancer stage defined according to the AJCC 6th edition criteria."
      last_updated: 2026-08-17

    ncit:C90530:
      d4cg_label: "AJCC, v7 >> Stage 0"
      description: "A cancer stage defined according to the AJCC 7th edition criteria."
      last_updated: 2026-08-17

    ncit:C90581:
      d4cg_label: "Akt Inhibitor MK2206"
      description: "An orally bioavailable allosteric inhibitor of the serine/threonine protein kinase Akt (protein kinase B) with potential antineoplastic activity. Akt inhibitor MK2206 binds to and inhibits the activity of Akt in a non-ATP competitive manner, which may result in the inhibition of the PI3K/Akt signaling pathway and tumor cell proliferation and the induction of tumor cell apoptosis. Activation of the PI3K/Akt signaling pathway is frequently associated with tumorigenesis and dysregulated PI3K/Akt signaling may contribute to tumor resistance to a variety of antineoplastic agents"
      last_updated: 2026-08-17

    ncit:C90609:
      d4cg_label: "Optic Chiasm"
      description: "An anatomic structure formed by the crossing of the two optic nerves under the hypothalamus."
      last_updated: 2026-08-17

    ncit:C9073:
      d4cg_label: "AJCC >> Stage 2"
      description: "Stage II includes: Any pT/TX, N1-3, M0, SX.  pTX: Primary tumor cannot be assessed.  N1: Metastasis with a lymph node mass 2 cm or less in greatest dimension; or multiple lymph nodes, none more than 2cm in greatest dimension.  N2: Metastasis with a lymph node mass more than 2 cm but not more than 5 cm in greatest dimension; or multiple lymph nodes, any one mass greater than 2 cm but not more than 5 cm in greatest dimension.  N3: Metastasis with a lymph node mass more than 5 cm in greatest dimension. M0: No distant metastasis. SX: Marker studies not available or not performed.  (AJCC 6th and 7th eds.)"
      last_updated: 2026-08-17

    ncit:C9074:
      d4cg_label: "AJCC >> Stage 3"
      description: "Stage III includes: Any pT/TX, Any N, M1, SX.  M1: Distant metastasis. SX: Marker studies not available or not performed.  (AJCC 6th and 7th eds.)"
      last_updated: 2026-08-17

    ncit:C9118:
      d4cg_label: "Sarcoma, NOS"
      description: "A cancer of the bone, cartilage, fat, muscle, blood vessels, or other connective or supportive tissue."
      last_updated: 2026-08-17

    ncit:C91392:
      d4cg_label: "Prexasertib"
      description: "An inhibitor of checkpoint kinase 1 (chk1) with potential antineoplastic activity. Upon administration, prexasertib selectively binds to chk1, thereby preventing activity of chk1 and abrogating the repair of damaged DNA. This may lead to an accumulation of damaged DNA and may promote genomic instability and apoptosis. Prexasertib may potentiate the cytotoxicity of DNA-damaging agents and reverse tumor cell resistance to chemotherapeutic agents. Chk1, a serine/threonine kinase, mediates cell cycle checkpoint control and is essential for DNA repair and plays a key role in resistance to chemotherapeutic agents."
      last_updated: 2026-08-17

    ncit:C9145:
      d4cg_label: "Osteosarcoma"
      description: "A cancer of the bone that usually affects the large bones of the arm or leg. It occurs most commonly in young people and affects more males than females."
      last_updated: 2026-08-17

    ncit:C91715:
      d4cg_label: "IPV (Poliovirus)"
      description: "A vaccine consisting of inactivated poliovirus (IPV) types 1,2 and 3, with active immunizing activity against poliomyelitis. Upon intramuscular vaccination, inactivated poliovirus vaccine (IPV) activates the immune system to develop antibodies against polioviruses."
      last_updated: 2026-08-17

    ncit:C91717:
      d4cg_label: "Combination Estrogen/Progestin Hormonal Contraception"
      description: "A vaccine containing detoxified tetanus toxoid, detoxified diphtheria toxoid and acellular pertussis antigens, adsorbed on aluminum phosphate, with active immunizing activity against diphtheria, tetanus and pertussis. The acellular pertussis vaccine components, produced by Bordetella pertussis, are detoxified pertussis toxin (PT), filamentous hemagglutinin (FHA), pertactin (PRN) and fimbriae types 2 and 3 (FIM). Intramuscular injection with this vaccine activates the immune system to develop antibodies against tetanus toxin, diphtheria toxin and B. pertussis antigens."
      last_updated: 2026-08-17

    ncit:C91718:
      d4cg_label: "DTaP (Diphtheria and tetanus)"
      description: "A vaccine containing detoxified tetanus toxoid and detoxified diphtheria toxoid adsorbed on aluminum phosphate with active immunizing activity against diphtheria and tetanus. Intramuscular injection with this vaccine activates the immune system to develop antibodies against tetanus toxin and diphtheria toxin."
      last_updated: 2026-08-17

    ncit:C91752:
      d4cg_label: "Subject Non-Compliance"
      description: "Failure of a patient to follow medical advice, take medication as directed, or adhere to a prescribed course of treatment."
      last_updated: 2026-08-17

    ncit:C91762:
      d4cg_label: "Restrictive Lung Disease"
      description: "Decreased lung volume and inadequate ventilation due to parenchymal lung disorders (e.g., interstitial pulmonary fibrosis) or extrapulmonary disorders (e.g., scoliosis).  Patients present with shortness of breath and cough."
      last_updated: 2026-08-17

    ncit:C9182:
      d4cg_label: "Desmoid-Type Fibromatosis"
      description: "A tumor of the tissue that surrounds muscles, usually in the abdomen. A desmoid tumor rarely metastasizes (spreads to other parts of the body)."
      last_updated: 2026-08-17

    ncit:C91826:
      d4cg_label: "Abdominoperineal Resection"
      description: "A therapeutic surgical procedure in which the anus, rectum, part of the sigmoid colon, and the regional lymph nodes are removed through abdominal and perineal incisions."
      last_updated: 2026-08-17

    ncit:C91832:
      d4cg_label: "Wire Localization"
      description: "A procedure involving the use of a wire for the localization of a usually non-palpable breast lesion that needs to be surgically removed."
      last_updated: 2026-08-17

    ncit:C91838:
      d4cg_label: "Sigmoid Colectomy"
      description: "A surgical procedure involving the partial or complete resection of the sigmoid colon."
      last_updated: 2026-08-17

    ncit:C9224:
      d4cg_label: "Esophagitis"
      description: "A disorder characterized by inflammation of the esophageal wall."
      last_updated: 2026-08-17

    ncit:C92242:
      d4cg_label: "Myeloid to Erythroid Ratio Measurement"
      description: "A relative measurement of myeloid progenitor cells to erythrocyte precursor cells in a biological specimen."
      last_updated: 2026-08-17

    ncit:C92441:
      d4cg_label: "Hypodermis"
      description: "A specimen that contains the epidermis, dermis, and subcutaneous adipose tissue."
      last_updated: 2026-08-17

    ncit:C92448:
      d4cg_label: "Audiogram, NOS"
      description: "A graphic record of the softest sounds that a person can hear at various frequencies, used to measure hearing loss."
      last_updated: 2026-08-17

    ncit:C92555:
      d4cg_label: "Extraventricular Neurocytoma"
      description: "A WHO grade 2 neoplasm that arises from the brain parenchyma. Morphologically it is characterized by the presence of neoplastic uniform, round cells with neuronal differentiation. Unlike central neurocytoma, it does not involve the lateral ventricles. It usually affects young adults and has a favorable prognosis."
      last_updated: 2026-08-17

    ncit:C92624:
      d4cg_label: "Papillary Tumor of the Pineal Region"
      description: "A rare tumor that arises from the pineal region and affects adults.  It is characterized by the presence of neuroepithelial cells and a papillary architecture.  Electron microscopic studies suggest ependymal differentiation.  The clinical course is variable."
      last_updated: 2026-08-17

    ncit:C92755:
      d4cg_label: "Chorionic Villus Sampling"
      description: "The biopsy of placental tissue containing the chorionic villi from the maternal uterus in early pregnancy to diagnose fetal genetic defects."
      last_updated: 2026-08-17

    ncit:C9283:
      d4cg_label: "Hodgkin Lymphoma, Lymphocyte Depletion, NOS"
      description: "A diffuse subtype of classic Hodgkin lymphoma which is rich in Hodgkin and Reed-Sternberg cells and/or depleted in non-neoplastic lymphocytes. (WHO, 2008)"
      last_updated: 2026-08-17

    ncit:C9287:
      d4cg_label: "WHO, Version 4 >> AML with inv(16)(p13.1q22) or t(16;16)(p13.1;q22); CBFB-MYH11"
      description: "Acute myeloid leukemia characterized by the presence of abnormal bone marrow eosinophils and the characteristic cytogenetic abnormality inv(16)(p13.1q22) or  t(16;16)(p13.1;q22), which results in the expression of the fusion protein CBFB-MYH11. This is seen in 7-9% of children with AML."
      last_updated: 2026-08-17

    ncit:C9288:
      d4cg_label: "WHO, Version 4 >> AML with t(8;21)(q22;q22.1); RUNX1-RUNX1T1"
      description: "An acute myeloid leukemia (AML) associated with t(8;21)(q22;q22) resulting in RUNX1-RUNX1T1 fusion protein expression. This is seen in 12% of children with AML."
      last_updated: 2026-08-17

    ncit:C9292:
      d4cg_label: "Solid Tumor, NOS"
      description: "A benign or malignant neoplasm arising from tissues that do not include fluid areas.  Representative examples include epithelial neoplasms (e.g. lung carcinoma, prostate carcinoma, breast carcinoma, colon carcinoma), and neoplasms arising from the soft tissues and bones (e.g. leiomyosarcoma, liposarcoma, chondrosarcoma, osteosarcoma).  Neoplasms originating from the blood or bone marrow (leukemias and myeloproliferative disorders) are not considered solid tumors."
      last_updated: 2026-08-17

    ncit:C92955:
      d4cg_label: "Base"
      description: "The underlying or supportive part of an anatomic structure."
      last_updated: 2026-08-17

    ncit:C92976:
      d4cg_label: "mosaicism"
      description: "The occurrence of 2 or more cell lines with different genetic or chromosomal make-up, within a single individual or tissue."
      last_updated: 2026-08-17

    ncit:C930:
      d4cg_label: "Vinblastine"
      description: "A natural alkaloid isolated from the plant Vinca rosea Linn. Vinblastine binds to tubulin and inhibits microtubule formation, resulting in disruption of mitotic spindle assembly and arrest of tumor cells in the M phase of the cell cycle. This agent may also interfere with amino acid, cyclic AMP, and glutathione metabolism; calmodulin-dependent Ca++ -transport ATPase activity; cellular respiration; and nucleic acid and lipid biosynthesis. (NCI04)"
      last_updated: 2026-08-17

    ncit:C93043:
      d4cg_label: "Non-Randomized"
      description: "A clinical trial in which participants may choose or be assigned into groups by researchers. Their assignment is not random."
      last_updated: 2026-08-17

    ncit:C9306:
      d4cg_label: "Soft Tissue Sarcoma"
      description: "A malignant neoplasm arising from muscle tissue, adipose tissue, blood vessels, fibrous tissue, or other supportive tissues excluding the bones."
      last_updated: 2026-08-17

    ncit:C9309:
      d4cg_label: "Seminoma"
      description: "A germinomatous germ cell tumor originating in the testis."
      last_updated: 2026-08-17

    ncit:C93106:
      d4cg_label: "De Novo"
      description: "A gene mutation in an individual that was not present in or transmitted from their ancestors. This type of mutation generally occurs spontaneously during the process of cell division-associated DNA replication during embryonic or fetal development."
      last_updated: 2026-08-17

    ncit:C93128:
      d4cg_label: "Estrogen Receptor Test"
      description: "A lab test to find out if cancer cells have estrogen receptors (proteins to which estrogen will bind). If the cells have estrogen receptors, they may need estrogen to grow, and this may affect how the cancer is treated."
      last_updated: 2026-08-17

    ncit:C93230:
      d4cg_label: "Ampulla"
      description: "A sac-like enlargement of a canal or duct."
      last_updated: 2026-08-17

    ncit:C933:
      d4cg_label: "Vismodegib"
      description: "A natural alkaloid isolated from the plant Vinca rosea Linn. Vincristine binds irreversibly to microtubules and spindle proteins in S phase of the cell cycle and interferes with the formation of the mitotic spindle, thereby arresting tumor cells in metaphase. This agent also depolymerizes microtubules and may also interfere with amino acid, cyclic AMP, and glutathione metabolism; calmodulin-dependent Ca++ -transport ATPase activity; cellular respiration; and nucleic acid and lipid biosynthesis. (NCI04)"
      last_updated: 2026-08-17

    ncit:C9341:
      d4cg_label: "Neuro-differentiated Ewing Tumor"
      description: "A small round cell tumor with neural differentiation arising from the soft tissues or bone."
      last_updated: 2026-08-17

    ncit:C9344:
      d4cg_label: "Pineoblastoma, NOS or NEC"
      description: "A fast growing type of brain tumor that occurs in or around the pineal gland, a tiny organ near the center of the brain."
      last_updated: 2026-08-17

    ncit:C93529:
      d4cg_label: "modification_basis"
      description: "The rationale for why an entity or event is changed."
      last_updated: 2026-08-17

    ncit:C9357:
      d4cg_label: "Hodgkin Lymphoma, Classical, NOS"
      description: "A cancer of the immune system that is marked by the presence of a type of cell called the Reed-Sternberg cell. The two major types of Hodgkin lymphoma are classical Hodgkin lymphoma and nodular lymphocyte-predominant Hodgkin lymphoma. Symptoms include the painless enlargement of lymph nodes, spleen, or other immune tissue. Other symptoms include fever, weight loss, fatigue, or night sweats."
      last_updated: 2026-08-17

    ncit:C93710:
      d4cg_label: "ae_expected"
      description: "Specifies whether the nature, frequency, or severity of an adverse event is consistent with the applicable study documentation (e.g., investigator's brochure, protocol document, or consent document) or product labeling (package insert)."
      last_updated: 2026-08-17

    ncit:C94186:
      d4cg_label: "Ultrasound Biomicroscopy (UBM)"
      description: "A type of ultrasound eye exam that makes a more detailed image than regular ultrasound. High-energy sound waves are bounced off the inside of the eye and the echo patterns are shown on the screen of an ultrasound machine."
      last_updated: 2026-08-17

    ncit:C94187:
      d4cg_label: "Uncertain Significance"
      description: "A variation in a genetic sequence whose association with disease risk is unknown."
      last_updated: 2026-08-17

    ncit:C94193:
      d4cg_label: "Post-Mortem"
      description: "After death. Often used to describe an autopsy."
      last_updated: 2026-08-17

    ncit:C94214:
      d4cg_label: "Alpelisib"
      description: "An orally bioavailable phosphatidylinositol 3-kinase (PI3K) inhibitor with potential antineoplastic activity. Alpelisib specifically inhibits PI3K in the PI3K/AKT kinase (or protein kinase B) signaling pathway, thereby inhibiting the activation of the PI3K signaling pathway. This may result in inhibition of tumor cell growth and survival in susceptible tumor cell populations. Activation of the PI3K signaling pathway is frequently associated with tumorigenesis. Dysregulated PI3K signaling may contribute to tumor resistance to a variety of antineoplastic agents."
      last_updated: 2026-08-17

    ncit:C94245:
      d4cg_label: "Autosomal Dominant"
      description: "Autosomal dominant inheritance refers to genetic conditions that occur when a mutation is present in one copy of a given gene (i.e., the person is heterozygous)."
      last_updated: 2026-08-17

    ncit:C94246:
      d4cg_label: "Autosomal Recessive"
      description: "Autosomal recessive inheritance refers to genetic conditions that occur only when mutations are present in both copies of a given gene (i.e., the person is homozygous for a mutation, or carries two different mutations of the same gene, a state referred to as compound heterozygosity)."
      last_updated: 2026-08-17

    ncit:C94247:
      d4cg_label: "X-linked Recessive"
      description: "X-linked recessive inheritance refers to genetic conditions associated with mutations in genes on the X chromosome. A male carrying such a mutation will be affected, because he carries only one X chromosome. A female carrying a mutation in one gene, with a normal gene on the other X chromosome, will be unaffected."
      last_updated: 2026-08-17

    ncit:C94251:
      d4cg_label: "Chemoimmunotherapy"
      description: "Chemotherapy combined with immunotherapy. Chemotherapy uses different drugs to kill or slow the growth of cancer cells; immunotherapy uses treatments to stimulate or restore the ability of the immune system to fight cancer."
      last_updated: 2026-08-17

    ncit:C94321:
      d4cg_label: "Neurocognitive Functions"
      description: "Having to do with the ability to think and reason. This includes the ability to concentrate, remember things, process information, learn, speak, and understand."
      last_updated: 2026-08-17

    ncit:C94394:
      d4cg_label: "medication_dose_administered"
      description: "In medicine, the total amount of a drug or radiation given to a patient over time; for example, the total dose of radiation given in a series of radiation treatments."
      last_updated: 2026-08-17

    ncit:C94464:
      d4cg_label: "Cystoprostatectomy"
      description: "Surgery to remove the bladder (the organ that holds urine) and the prostate. In a radical prostatocystectomy, the seminal vesicles are also removed. The prostate and seminal vesicles are glands in the male reproductive system that help make semen."
      last_updated: 2026-08-17

    ncit:C94473:
      d4cg_label: "Urine Cytology"
      description: "An examination of cells obtained from a sample of urine."
      last_updated: 2026-08-17

    ncit:C94515:
      d4cg_label: "tumor_volume"
      description: "The size of a cancer measured by the amount of space taken up by the tumor. For example, the tumor volume of prostate cancer is the percentage of the prostate taken up by the tumor."
      last_updated: 2026-08-17

    ncit:C94534:
      d4cg_label: "Target Lesions"
      description: "A qualitative or quantitative measurement of the response of a target lesion(s) to the therapy."
      last_updated: 2026-08-17

    ncit:C94535:
      d4cg_label: "Non-Target Lesions"
      description: "A qualitative or quantitative measurement of the response of a non-target lesion(s) to the therapy."
      last_updated: 2026-08-17

    ncit:C94547:
      d4cg_label: "Lymphatic Basin"
      description: "A group of lymph nodes that receives and filters lymph that flows from a certain area of the body. Special dyes may be used to stain and identify the lymphatic basin in the tissues around a tumor, so that lymph nodes that may contain cancer can be removed and checked by a pathologist."
      last_updated: 2026-08-17

    ncit:C94626:
      d4cg_label: "Chemoradiotherapy"
      description: "Treatment that combines chemotherapy with radiation therapy. Chemoradiation can be concurrent or sequential."
      last_updated: 2026-08-17

    ncit:C9482:
      d4cg_label: "Soft Tissue Chondroma"
      description: "A benign neoplasm arising from the extraskeletal soft tissues near tendons and joints.  It is a well circumscribed tumor characterized by the presence of chondrocytes, a lobulated hyaline cartilage growth pattern, and in some cases calcification."
      last_updated: 2026-08-17

    ncit:C95445:
      d4cg_label: "Suprasellar Pituitary"
      description: "Located above the sella turcica."
      last_updated: 2026-08-17

    ncit:C95991:
      d4cg_label: "Dural Extranodal Marginal Zone Lymphoma of Mucosa-Associated Lymphoid Tissue"
      description: "A rare primary marginal zone lymphoma of mucosa-associated lymphoid tissue that arises from the meningeal dura. The majority of cases have been described in middle aged women. Radiologically, the lymphomatous dural infiltration mimics meningioma."
      last_updated: 2026-08-17

    ncit:C96244:
      d4cg_label: "FIGO >> Stage 1"
      description: "A FIGO stage term that applies to gynecologic cancers.  For cervical cancer, it refers to invasive cancer that is confined to the cervix; for endometrial cancer, it refers to cancer confined to the corpus uteri with no or less than one-half myometrial invasion (IA) or invasion of one-half or more of the myometrium (IB)."
      last_updated: 2026-08-17

    ncit:C96252:
      d4cg_label: "FIGO >> Stage 2"
      description: "A FIGO stage term that applies to gynecologic cancers.  For cervical cancer, it refers to cancer that invades beyond the cervix, but not to the pelvic wall or lower third of the vagina; for endometrial cancer, it refers to cancer that invades the stromal connective tissue of the cervix, but it does not extend beyond the uterus."
      last_updated: 2026-08-17

    ncit:C96255:
      d4cg_label: "FIGO >> Stage 3"
      description: "A FIGO stage term that applies to gynecologic cancers.  For cervical cancer, it refers to cancer that extends to the pelvic wall, and/or involves the lower third of vagina, and/or causes hydronephrosis or non-functioning kidney; for endometrial cancer, FIGO stage III is subdivided into stages IIIA and IIIB; in FIGO stage IIIA, there is involvement of the serosa and/or the adnexa; for FIGO stage IIIB, there is vaginal or parametrial involvement."
      last_updated: 2026-08-17

    ncit:C96261:
      d4cg_label: "FIGO >> Stage 4"
      description: "A FIGO stage term that applies to gynecologic cancers.  For cervical cancer, it refers to cancer that invades the mucosa of bladder or rectum, and/or extends beyond the true pelvis (FIGO stage IVA), or to cancer with distant metastases (FIGO stage IVB); for endometrial cancer, it refers to cancer that invades the bladder mucosa and/or the bowel mucosa (FIGO stage IVA), or to cancer with distant metastases (FIGO stage IVB)."
      last_updated: 2026-08-17

    ncit:C96266:
      d4cg_label: "Intra-Medullary"
      description: "Occurring in, or located within the spinal cord or the marrow space of a bone."
      last_updated: 2026-08-17

    ncit:C96394:
      d4cg_label: "RV (Rotavirus)"
      description: "A viral vaccine that prevents against rotavirus infection, the leading cause of severe acute gastroenteritis."
      last_updated: 2026-08-17

    ncit:C96397:
      d4cg_label: "MCV4 (Meningococcal)"
      description: "Any vaccine derived from Neisseria meningitidis whether in whole-cell or acellular form used for prophylaxis against meningitis."
      last_updated: 2026-08-17

    ncit:C96403:
      d4cg_label: "MMR (Measles, Mumps, & Rubella)"
      description: "A trivalent vaccine containing live attenuated viruses that can cause measles, mumps and rubella. It is an injection administered subcutaneously in two separate doses."
      last_updated: 2026-08-17

    ncit:C96450:
      d4cg_label: "Desmin"
      description: "Desmin (470 aa, ~54 kDa) is encoded by the human DES gene. This protein is involved in the regulation of cytoskeletal dynamics in muscle cells."
      last_updated: 2026-08-17

    ncit:C96520:
      d4cg_label: "MUTYH-Associated Polyposis"
      description: "An autosomal recessive hereditary neoplastic syndrome caused by mutations in the MUTYH gene on chromosome 1p34.1. It is characterized by the presence of multiple colorectal polyps that may progress to carcinoma. Development of gastric and small intestinal polyps may also occur."
      last_updated: 2026-08-17

    ncit:C96570:
      d4cg_label: "Brother"
      description: "A male who shares with his sibling the genetic makeup inherited from one or both of their shared biological parents."
      last_updated: 2026-08-17

    ncit:C96572:
      d4cg_label: "Father"
      description: "A male who contributes to the genetic makeup of his offspring through the fertilization of an ovum by his sperm."
      last_updated: 2026-08-17

    ncit:C96580:
      d4cg_label: "Mother"
      description: "A female who contributes to the genetic makeup of her offspring from the fertilization of her ovum."
      last_updated: 2026-08-17

    ncit:C96586:
      d4cg_label: "Sibling"
      description: "A female who shares with her sibling the genetic makeup inherited from one or both of their shared biological parents."
      last_updated: 2026-08-17

    ncit:C96602:
      d4cg_label: "EBER"
      description: "A measurement of the Epstein-Barr early antigen in a biological specimen."
      last_updated: 2026-08-17

    ncit:C96613:
      d4cg_label: "Overall Response"
      description: "An assessment of the overall response of the disease to the therapy."
      last_updated: 2026-08-17

    ncit:C96684:
      d4cg_label: "measurement1"
      description: "The longest possible length of a straight line passing through the center of a circular or spheroid object that connects two points on the circumference."
      last_updated: 2026-08-17

    ncit:C96688:
      d4cg_label: "Megakaryocytes Count"
      description: "A measurement of the megakaryocytes per unit of a biological specimen."
      last_updated: 2026-08-17

    ncit:C96908:
      d4cg_label: "Intraspinal"
      description: "Within the spine (backbone)."
      last_updated: 2026-08-17

    ncit:C97123:
      d4cg_label: "PCV (Pneumococcal)"
      description: "An active immunizing vaccine used to prevent infection by the bacterium Streptococcus pneumoniae. It consists of a solution of saccharides of the capsular antigens of Streptococcus serotypes individually conjugated to proteins."
      last_updated: 2026-08-17

    ncit:C97138:
      d4cg_label: "Complex Karyotype"
      description: "Karyotype with at least three chromosomal aberrations."
      last_updated: 2026-08-17

    ncit:C97213:
      d4cg_label: "Antral Follicle Count"
      description: "The number of small ovarian follicles (approximately 2-8 mm in diameter) that can be detected and counted with transvaginal ultrasonography, to determine the remaining fertility potential in a woman."
      last_updated: 2026-08-17

    ncit:C97660:
      d4cg_label: "Abemaciclib"
      description: "An orally available cyclin-dependent kinase (CDK) inhibitor that targets the CDK4 (cyclin D1) and CDK6 (cyclin D3) cell cycle pathway, with potential antineoplastic activity. Abemaciclib specifically inhibits CDK4 and 6, thereby inhibiting retinoblastoma (Rb) protein phosphorylation in early G1. Inhibition of Rb phosphorylation prevents CDK-mediated G1-S phase transition, thereby arresting the cell cycle in the G1 phase, suppressing DNA synthesis and inhibiting cancer cell growth. Overexpression of the serine/threonine kinases CDK4/6, as seen in certain types of cancer, causes cell cycle deregulation."
      last_updated: 2026-08-17

    ncit:C97928:
      d4cg_label: "hgvs_protein"
      description: "A variation in the sequence of a specific gene product."
      last_updated: 2026-08-17

    ncit:C98182:
      d4cg_label: "Epitrochlear Nodes"
      description: "A lymph node located above and adjacent to the elbow."
      last_updated: 2026-08-17

    ncit:C98303:
      d4cg_label: "AKT Variant"
      description: "A variation in the amino acid sequence for the RAC-alpha serine/threonine-protein kinase protein."
      last_updated: 2026-08-17

    ncit:C98307:
      d4cg_label: "BRAF Variant"
      description: "A variation in the amino acid sequence for the serine/threonine-protein kinase B-raf protein."
      last_updated: 2026-08-17

    ncit:C98362:
      d4cg_label: "KRAS Variant"
      description: "A variation in the amino acid sequence for the GTPase KRas protein."
      last_updated: 2026-08-17

    ncit:C98439:
      d4cg_label: "NRAS Variant"
      description: "A variation in the amino acid sequence for the GTPase NRas protein."
      last_updated: 2026-08-17

    ncit:C98460:
      d4cg_label: "PIK3CA Variant"
      description: "A variation in the amino acid sequence for the phosphatidylinositol-4,5-bisphosphate 3-kinase catalytic subunit alpha isoform protein."
      last_updated: 2026-08-17

    ncit:C98641:
      d4cg_label: "Tyrosinemia Type I"
      description: "Tyrosinemia caused by mutations in the FAH gene. It is characterized by deficiency of the enzyme fumarylacetoacetate hydrolase. It is the most severe form of tyrosinemia. Signs and symptoms appear early in life and include failure to thrive, vomiting, diarrhea, jaundice, and bleeding tendency. It may result in liver and kidney failure. Patients with this type of tyrosinemia may also have a predisposition for hepatocellular carcinoma."
      last_updated: 2026-08-17

    ncit:C98880:
      d4cg_label: "Truncus Arteriosus"
      description: "A rare congenital cardiovascular disorder characterized by the failure of the embryologic structure truncus arteriosus to divide into the aorta and pulmonary trunk. It results in the presence of a single vessel instead of two vessels leading out of the heart. Clinical signs and symptoms include cyanosis that is present at birth, poor growth, dyspnea, tachypnea, arrhythmia, cardiomegaly, and heart failure. If it is not surgically repaired, it leads to death."
      last_updated: 2026-08-17

    ncit:C98889:
      d4cg_label: "Central Hypoventilation Syndrome"
      description: "A disorder characterized by hypoventilation and hypoxemia. It appears early in life and is not associated with cardiopulmonary or neuromuscular abnormalities."
      last_updated: 2026-08-17

    ncit:C98917:
      d4cg_label: "Ureteral Duplication"
      description: "A condition in which there are two partial or complete ipsilateral ureters from a single kidney."
      last_updated: 2026-08-17

    ncit:C98947:
      d4cg_label: "Horseshoe Kidney"
      description: "A congenital abnormality in which the two kidneys fuse together during fetal development to create a horseshoe-shaped structure."
      last_updated: 2026-08-17

    ncit:C98993:
      d4cg_label: "13q Syndrome"
      description: "A rare syndrome that is characterized by the partial deletion of the long arm of chromosome 13. Signs and symptoms include low birth weight, craniofacial malformations, hands and feet malformations, and mental and psychomotor retardation."
      last_updated: 2026-08-17

    ncit:C99000:
      d4cg_label: "Orbital Cellulitis"
      description: "An infection of the orbital tissue, posterior to the orbital septum."
      last_updated: 2026-08-17

    ncit:C99038:
      d4cg_label: "Radial Aplasia-Thrombocytopenia Syndrome"
      description: "A rare syndrome characterized by the presence of thrombocytopenia associated with bilateral absence of the radii."
      last_updated: 2026-08-17

    ncit:C99105:
      d4cg_label: "Esophageal or Duodenal Atresia"
      description: "An association of congenital birth defects that includes vertebral abnormalities, anal atresia, cardiac abnormalities, tracheo-esophageal fistula, renal abnormalities, and limb abnormalities."
      last_updated: 2026-08-17

    ncit:C99148:
      d4cg_label: "Anal/Perianal"
      description: "The skin area around the anus."
      last_updated: 2026-08-17

    ncit:C99180:
      d4cg_label: "Lipofibromatosis"
      description: "A rare, slow-growing, painless tumor of infancy and early childhood that usually affects the distal extremities. It is characterized by the presence of alternating bands of mature adipose tissue and spindle-cell fibrous tissue, without destruction of the adipose tissue architecture. It does not metastasize, however the rate of local recurrences is high."
      last_updated: 2026-08-17

    ncit:C99200:
      d4cg_label: "EWSR1-DDIT3"
      description: "A fusion gene that results from a chromosomal translocation t(12;22)(q13;p11) which fuses either the first 7 or the first 10 exons of the EWSR1 gene with exon 2 of the DDIT3 gene. This rearrangement is associated with myxoid liposarcoma."
      last_updated: 2026-08-17

    ncit:C99202:
      d4cg_label: "EWSR1-FLI1"
      description: "A fusion gene that results from a chromosomal translocation t(11;22)(q24;q12) which fuses the first seven or ten exons of the EWSR1 gene with exon 5, 6 or 8 of the FLI1 gene. This rearrangement is associated with Ewing tumor/peripheral primitive neuroectodermal tumor."
      last_updated: 2026-08-17

    ncit:C99211:
      d4cg_label: "EWSR1-ERG"
      description: "A fusion gene that results from a chromosomal translocation t(21;22)(q21;q12) which fuses the EWSR1 gene with the ERG gene. This rearrangement is associated with both Ewing tumor/peripheral primitive neuroectodermal tumor and desmoplastic small round cell sarcoma."
      last_updated: 2026-08-17

    ncit:C99213:
      d4cg_label: "EWSR1-WT1"
      description: "A fusion gene that results from a chromosomal translocation t(11;22)(p13;q12) which fuses the intron between exons 7 and 8 of the EWSR1 gene with the intron between exons 7 and 8 of the WT1 gene. This rearrangement is associated with desmoplastic small round cell sarcoma."
      last_updated: 2026-08-17

    ncit:C99216:
      d4cg_label: "EWSR1-ATF1"
      description: "A fusion gene that results from a chromosomal translocation t(12;22)(q13;q12) which fuses the first 7 or 8 exons of the EWSR1 gene on the 5' side of exon 4 or 5 of the ATF1 gene. This rearrangement is associated with both malignant clear cell sarcoma of the soft tissue and angiomatoid fibrous histiocytoma."
      last_updated: 2026-08-17

    ncit:C99226:
      d4cg_label: "EWSR1-FEV"
      description: "A fusion gene that results from a chromosomal translocation t(2;22)(q36;q12) which fuses either the first seven or ten exons of the EWSR1 gene with exon 1 or 2 of the FEV gene. This rearrangement is associated with Ewing tumor/peripheral primitive neuroectodermal tumor."
      last_updated: 2026-08-17

    ncit:C99249:
      d4cg_label: "EWSR1-CREB1"
      description: "A fusion gene that results from a chromosomal translocation t(2;22)(q34;q12) which fuses the first 7 exons of the EWSR1 gene to the 5' side of exon 7 of the CREB1 gene. This rearrangement is associated with angiomatoid fibrous histiocytoma and rare cases of malignant clear cell sarcoma of the soft tissue."
      last_updated: 2026-08-17

    ncit:C99252:
      d4cg_label: "EWSR1-NR4A3"
      description: "A fusion gene that results from a chromosomal translocation t(9;22)(q22-31;q11-12) which fuses the first half of the EWSR1 gene to the entire coding sequence of the NR4A3 gene. This rearrangement is associated with extraskeletal myxoid chondrosarcomas."
      last_updated: 2026-08-17

    ncit:C99256:
      d4cg_label: "EWSR1-POU5F1"
      description: "A fusion gene that results from a chromosomal translocation t(6;22)(p21;q12) which fuses the first six exons of the EWSR1 gene to exon 2 of the POU5F1 gene. This rearrangement is associated with hidradenoma and one case of mucoepidermoid carcinoma of the salivary glands."
      last_updated: 2026-08-17

    ncit:C99259:
      d4cg_label: "EWSR1-ETV1"
      description: "A fusion gene that results from a chromosomal translocation t(7;22)(p22;q12) which fuses exon 7 of the EWSR1 gene to either exon 10 or 11 of the ETV1 gene. This rearrangement is associated with Ewing sarcoma."
      last_updated: 2026-08-17

    ncit:C99262:
      d4cg_label: "EWSR1-ETV4"
      description: "A fusion gene (~2.1 kb) that results from a chromosomal translocation t(17;22)(q21;q12) which fuses the first seven exons of the EWSR1 gene to the last 6 exons of the ETV4 gene. This rearrangement is associated with Ewing sarcoma."
      last_updated: 2026-08-17

    ncit:C99279:
      d4cg_label: "FUS-DDIT3"
      description: "A fusion gene that results from a chromosomal translocation t(12;16)(q13;p11) which fuses either the first 5, 7 or 8 exons of the FUS gene with exon 2 of the DDIT3 gene. This rearrangement is associated with myxoid liposarcoma."
      last_updated: 2026-08-17

    ncit:C99281:
      d4cg_label: "FUS-ERG"
      description: "A fusion gene that results from a chromosomal translocation t(16;21)(p11;q22) which fuses the FUS gene with the ERG gene. This rearrangement is associated with acute myeloid leukemia."
      last_updated: 2026-08-17

    ncit:C99283:
      d4cg_label: "FUS-CREB3L2"
      description: "A fusion gene that results from a chromosomal translocation t(7;16)(q33-34;p11) which fuses the first six or seven exons of the FUS gene on the 5' side of exon 5 of the CREB3L2 gene. This rearrangement is associated with low-grade fibromyxoid sarcoma."
      last_updated: 2026-08-17

    ncit:C99291:
      d4cg_label: "TCF3-PBX1 Fusion"
      description: "A fusion gene that results from a chromosomal translocation t(1;19)(q23;p13) which fuses intron 13 of the TCF3 gene with exon 2 of the PBX1 gene. This rearrangement is associated with pre-B cell acute lymphoblastic leukemia."
      last_updated: 2026-08-17

    ncit:C99294:
      d4cg_label: "RUNX1-RUNX1T1 Fusion"
      description: "A fusion gene (~4.3 kb) that results from a chromosomal translocation t(8;21)(q22;q22) which fuses the first 5 exons of the RUNX1 gene to exon 2 of the RUNX1T1 gene. This rearrangement is associated with acute myeloid leukemia."
      last_updated: 2026-08-17

    ncit:C99363:
      d4cg_label: "PAX7-FOXO1 Gene Fusion"
      description: "A fusion gene (~2.5 kb) that results from a chromosomal translocation t(1;13)(p36;q14) which fuses intron 7 of the PAX7 gene with intron 1 of the FOXO1 gene. This rearrangement is associated with alveolar rhabdomyosarcoma and rare cases of embryonal rhabdomyosarcoma."
      last_updated: 2026-08-17

    ncit:C99501:
      d4cg_label: "TAF15-NR4A3"
      description: "A fusion gene that results from a chromosomal translocation t(9;17)(q22;q11) which fuses exon 6 of the TAF15 gene to the entire coding sequence of the NR4A3 gene. This rearrangement is associated with extraskeletal myxoid chondrosarcoma."
      last_updated: 2026-08-17

    ncit:C99524:
      d4cg_label: "Ejection Fraction"
      description: "The fraction of blood expelled from the left ventricle with each cardiac systole (stroke volume/end diastolic volume)"
      last_updated: 2026-08-17

    ncit:C99531:
      d4cg_label: "Primary"
      description: "The first significant event which ultimately led to death."
      last_updated: 2026-08-17

    ncit:C99678:
      d4cg_label: "ETV6-MN1 Fusion"
      description: "A fusion gene that results from a chromosomal translocation t(12;22)(p13;q11-12) that fuses the 5' portion of the ETV6 gene to the 3' portion of the MN1 gene. This rearrangement is associated with both acute myeloid leukemia and refractory anemia with excess blasts."
      last_updated: 2026-08-17

    ncit:C99705:
      d4cg_label: "ASPSCR1-TFE3"
      description: "A fusion gene that results from chromosomal translocation t(X;17)(p11.2;q25) or der(X)t(X;17)(p11;q25) which fuses the 5' half of the ASPSCR1 gene to either exon 3 or 4 of the TFE gene. This fusion is associated with both alveolar soft part sarcoma and primary renal tumor."
      last_updated: 2026-08-17

    ncit:C99712:
      d4cg_label: "PAX3-FOXO1 Gene Fusion"
      description: "A fusion gene (~3.2 kb) that results from a chromosomal translocation t(2;13)(q35;q14) which fuses intron 7 of the PAX3 gene with intron 1 of the FOXO1 gene. This rearrangement is associated with alveolar rhabdomyosarcoma."
      last_updated: 2026-08-17

    ncit:C99723:
      d4cg_label: "deauville_score"
      description: "A 5 point scale originally devised by Barrington et al. (2014) to assess the response to treatment of lymphoma by FDG-PET scanning, and has since been validated to assess treatment responses in a number of additional solid and non-solid tumors."
      last_updated: 2026-08-17

    ncit:C99728:
      d4cg_label: "Score 1"
      description: "No uptake. (Barrington SF, Mikhaeel NG, Kostakoglu L, Meignan M, et al. Role of imaging in the staging and response assessment of lymphoma: consensus of the International Conference on Malignant Lymphomas Imaging Working Group. J Clin Oncol. 2014 Sep 20;32(27):3048-58.)"
      last_updated: 2026-08-17

    ncit:C99747:
      d4cg_label: "Score 2"
      description: "The results of the positron emission tomography are negative; the tracer uptake is less than or equal to the mediastinum."
      last_updated: 2026-08-17

    ncit:C99748:
      d4cg_label: "Score 3"
      description: "The results of the positron emission tomography are negative; the tracer uptake is greater than the mediastinum but less than or equal to the liver."
      last_updated: 2026-08-17

    ncit:C99749:
      d4cg_label: "Score 4"
      description: "The results of the positron emission tomography are positive; the tracer uptake is moderately more than the liver uptake, at any disease site."
      last_updated: 2026-08-17

    ncit:C99750:
      d4cg_label: "Score 5"
      description: "The results of the positron emission tomography are positive; the tracer uptake is markedly increased at any disease site."
      last_updated: 2026-08-17

      description: "A disease, condition, or injury that is increasing in extent or severity."
      last_updated: 2026-08-17

    ncit:C177585:
      d4cg_label: "Ann Arbor B Symptoms Indicator"
      description: "An indication of whether a record includes B-symptom data based on the Ann Arbor lymphoma classification system guidelines."
      last_updated: 2026-08-17

    ncit:C177586:
      d4cg_label: "ann_arbor_mod_e"
      description: "An indication of whether a record includes data regarding extranodal involvement based on the Ann Arbor lymphoma classification system guidelines."
      last_updated: 2026-08-17

    ncit:C177630:
      d4cg_label: "Children's Oncology Group Liver Tumor Staging System >> Stage 1"
      description: "A staging system developed by Children's Oncology Group (COG) that categorizes liver tumors based on the size and extent of the tumor."
      last_updated: 2026-08-17

    ncit:C177631:
      d4cg_label: "Children's Oncology Group Neuroblastoma Risk Group Staging System >> Stage L1"
      description: "A staging system that categorizes treatment intensity for patients with neuroblastoma on the basis of risk (prognostic) factors defined by Children's Oncology Group (COG)."
      last_updated: 2026-08-17

    ncit:C177632:
      d4cg_label: "Children's Oncology Group Neuroblastoma Risk Group Staging System >> Stage L2"
      description: "A staging system developed by Children's Oncology Group (COG) that categorizes renal tumors, often Wilms tumor, based on the size and extent of the tumor."
      last_updated: 2026-08-17

    ncit:C177633:
      d4cg_label: "Children's Oncology Group Retinoblastoma Risk Group Staging System"
      description: "A staging system that categorizes treatment intensity for patients with retinoblastoma on the basis of risk (prognostic) factors defined by Children's Oncology Group (COG)."
      last_updated: 2026-08-17

    ncit:C1777:
      d4cg_label: "Plerixafor"
      description: "A bicyclam with hematopoietic stem cell-mobilizing activity. Plerixafor blocks the binding of stromal cell-derived factor (SDF-1alpha) to the cellular receptor CXCR4, resulting in hematopoietic stem cell (HSC) release from bone marrow and HSC movement into the peripheral circulation."
      last_updated: 2026-08-17

    ncit:C177766:
      d4cg_label: "Omentum Lymph Node"
      description: "Anterior portion of the neocortex, lying anterior to the central sulcus in humans. It is bounded by the parietal cortex posteriorly and the temporal cortex laterally."
      last_updated: 2026-08-17

    ncit:C178069:
      d4cg_label: "Interim Maintenance"
      description: "A less intense phase of chemotherapy in between each course of delayed intensification."
      last_updated: 2026-08-17

    ncit:C178071:
      d4cg_label: "Completion of Follow-Up"
      description: "The follow-up protocols were completed."
      last_updated: 2026-08-17

    ncit:C178072:

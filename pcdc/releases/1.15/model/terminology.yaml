    ncit:C17557:
      d4cg_label: "Apoptosis"
      description: "A form of programmed cell death that begins when a cell receives internal or external signals, then proceeds through a series of characteristic stages typically including rounding-up of the cell, retraction of pseudopods, reduction of cellular volume (pyknosis), chromatin condensation, nuclear fragmentation (karyorrhexis), and plasma membrane blebbing, and ends with the death of the cell."
      last_updated: 2026-08-17

    ncit:C17563:
      d4cg_label: "Cytogenetics, FISH"
      description: "A laboratory technique used to look at genes or chromosomes in cells and tissues. Pieces of DNA that contain a fluorescent dye are made in the laboratory and added to cells or tissues on a glass slide. When these pieces of DNA bind to specific genes or areas of chromosomes on the slide, they light up when viewed under a microscope with a special light."
      last_updated: 2026-08-17

    ncit:C175960:
      d4cg_label: "FOXO1 Rearranged"
      description: "A molecular abnormality indicating rearrangement of the FOXO1 gene."
      last_updated: 2026-08-17

    ncit:C175987:
      d4cg_label: "TGFBR3-MGEA5"
      description: "A fusion gene that results from a chromosomal translocation t(1;10)(p22;q24) which fuses the TGFBR3 gene with the OGA gene. This gene fusion is associated with some cases of pleomorphic hyalinizing angiectatic tumor (PHAT) of soft parts, hemosiderotic fibrolipomatous tumor (HFLT), myxoinflammatory fibroblastic sarcoma (MIFS) and hybrid HFLT/MIFS."
      last_updated: 2026-08-17

    ncit:C176033:
      d4cg_label: "Christian"
      description: "A religion based on the teachings of Jesus Christ, as embodied in the New Testament of the Bible, emphasizing the role of Jesus as savior."
      last_updated: 2026-08-17

    ncit:C176036:
      d4cg_label: "Sikh"
      description: "A religion founded in northern India in the 16th century by Guru Nanak that combines elements of Hinduism and Islam."
      last_updated: 2026-08-17

    ncit:C17610:
      d4cg_label: "Blood"
      description: "A small volume of blood removed for testing or storage."
      last_updated: 2026-08-17

    ncit:C176313:
      d4cg_label: "ANA"
      description: "A measurement of the total anti-neutrophil antibody in a biological specimen."
      last_updated: 2026-08-17

    ncit:C176334:
      d4cg_label: "Granulomas"
      description: "An evaluation of granuloma(s) in a biological specimen."
      last_updated: 2026-08-17

    ncit:C17646:
      d4cg_label: "Bone Scan"
      description: "A nuclear imaging method used to evaluate pathological bone metabolism."
      last_updated: 2026-08-17

    ncit:C17649:
      d4cg_label: "Other"
      description: "A proper value is applicable but not known."
      last_updated: 2026-08-17

    ncit:C176588:
      d4cg_label: "CHEK2-Associated Cancer Predisposition"
      description: "An autosomal dominant cancer predisposition syndrome caused by germline mutations of the CHEK2 gene. It is associated with breast carcinoma, gastric carcinoma, colorectal carcinoma, thyroid gland carcinoma, kidney carcinoma, prostate carcinoma, and non-Hodgkin lymphoma."
      last_updated: 2026-08-17

    ncit:C176628:
      d4cg_label: "CDH1-Associated Breast Carcinoma Syndrome"
      description: "A cancer susceptibility syndrome caused by inactivating germline mutations of the CDH1 gene. It is associated with the development of lobular carcinoma of the breast. Females with mutation of the CDH1 gene have a 40% risk of developing lobular breast carcinoma."
      last_updated: 2026-08-17

    ncit:C17666:
      d4cg_label: "Germline"
      description: "A gene change in the body's reproductive cells (egg or sperm) that becomes incorporated into the DNA of every cell in the body of offspring; germline mutations are passed on from parents to offspring."
      last_updated: 2026-08-17

    ncit:C176708:
      d4cg_label: "imaging_result"
      description: "The result of an evaluation technique using a visual display of structural or functional patterns of organs or tissues that is performed to determine the presence, absence, or degree of a condition."
      last_updated: 2026-08-17

    ncit:C176730:
      d4cg_label: "AIN"
      description: "A condition characterized by the autoantibody-induced destruction of neutrophils."
      last_updated: 2026-08-17

    ncit:C176781:
      d4cg_label: "45XO w/ Y chromosomal material"
      description: "An abnormal sex chromosome karyotype where the individual is missing a second X chromosome and has some chromosomal material from the Y chromosome. The normal autosomal karyotype is present."
      last_updated: 2026-08-17

    ncit:C176787:
      d4cg_label: "48XXXX"
      description: "An abnormal sex chromosome karyotype where the individual has four copies of the X chromosome. The normal autosomal karyotype is present."
      last_updated: 2026-08-17

    ncit:C17687:
      d4cg_label: "Adenomatous Polyposis Coli"
      description: "Adenomatous polyposis coli protein (2843 aa, ~312 kDa) is encoded by the human APC gene. This protein is involved in both tumor suppression and the inhibition of the Wnt signaling pathway."
      last_updated: 2026-08-17

    ncit:C176906:
      d4cg_label: "Familial Gastrointestinal Stromal Tumor"
      description: "An inherited condition caused by autosomal dominant mutation(s) in the KIT or PDGFRA genes, encoding mast/stem cell growth factor receptor Kit and platelet derived growth factor receptor alpha respectively. The condition is characterized by the occurrence of multiple gastrointestinal stromal tumors (GIST)."
      last_updated: 2026-08-17

    ncit:C176907:
      d4cg_label: "Acute Lymphoblastic Leukemia Susceptibility - PAX5"
      description: "An inherited condition caused by mutation(s) in the PAX5 gene, encoding paired box protein Pax-5. The condition is characterized by an increased risk of developing B-cell acute lymphoblastic leukemia."
      last_updated: 2026-08-17

    ncit:C176909:
      d4cg_label: "Ataxia-Pancytopenia Syndrome"
      description: ""
      last_updated: 2026-08-17

    ncit:C176913:
      d4cg_label: "Diamond-Blackfan Anemia"
      description: "Congenital pure red cell aplasia caused by autosomal dominant mutation(s) in the RPS17 gene, encoding 40S ribosomal protein S17."
      last_updated: 2026-08-17

    ncit:C176941:
      d4cg_label: "Legius Syndrome"
      description: "An inherited condition caused by autosomal dominant mutation(s) in the SPRED1 gene, encoding sprouty-related, EVH1 domain-containing protein 1. The condition resembles neurofibromatosis type I but is less severe. Affected individuals may present with multiple cafe-au-lait spots, variable dysmorphic features, including hypertelorism or macrocephaly, lipomas, and mild learning disabilities or attention problems."
      last_updated: 2026-08-17

    ncit:C176942:
      d4cg_label: "CBL Syndrome"
      description: "An inherited condition caused by autosomal dominant mutation(s) in the CBL gene, encoding E3 ubiquitin-protein ligase CBL. The condition resembles Noonan syndrome 1 and is characterized by facial dysmorphism, a wide spectrum of cardiac disease, reduced growth, variable cognitive deficits, and ectodermal and musculoskeletal anomalies. Affected individuals may have an increased risk for certain malignancies, particularly juvenile myelomonocytic leukemia."
      last_updated: 2026-08-17

    ncit:C177302:
      d4cg_label: "miR-367-3p"

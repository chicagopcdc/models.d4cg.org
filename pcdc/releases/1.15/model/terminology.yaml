      description: "The subject was enrolled in another therapeutic study after going off the previous study."
      last_updated: 2026-08-17

    ncit:C178074:
      d4cg_label: "lkss_with_disease"
      description: "The last know survival status of the individual with the disease."
      last_updated: 2026-08-17

    ncit:C178075:
      d4cg_label: "bulk_med_mass"
      description: "When the maximum width of a mass is equal or greater than one-third of the internal transverse diameter of the thorax at the level of T5/6 on a PA CXR. Bulk at an alternate site is defined as any mass measuring 10 cm or more by any imaging study."
      last_updated: 2026-08-17

    ncit:C178079:
      d4cg_label: "bm_morphology"
      description: "The morphology characteristics of the bone marrow blasts."
      last_updated: 2026-08-17

    ncit:C178081:
      d4cg_label: "Balis Neuropathy Scale"
      description: "An instrument used to grade neurotoxicity occurring in children on a 0-4 scale, where the higher number indicates worse neuropathy."
      last_updated: 2026-08-17

    ncit:C178082:
      d4cg_label: "avn_joint"
      description: "Death of bone tissue in a joint due to temporary or permanent interruption of blood flow."
      last_updated: 2026-08-17

    ncit:C178083:
      d4cg_label: "avn_joint_laterality"
      description: "A finding descriptive of the laterality of the avascular necrosis in the joints."
      last_updated: 2026-08-17

    ncit:C178086:
      d4cg_label: "Arthroplasty, Hemi/Resurfacing"
      description: "The trimming and capping of the joint head with ceramic, metal or plastic components and the removal of damaged bone and cartilage within the socket and replacement with a metal shell."
      last_updated: 2026-08-17

    ncit:C178087:
      d4cg_label: "Arthroplasty, Total"
      description: "The removal of the joint head and neck, and replacement with ceramic, metal or plastic components and the removal of damaged bone and cartilage within the socket and replacement with a metal shell."
      last_updated: 2026-08-17

    ncit:C178088:
      d4cg_label: "Bone Graft, Free Vascularized"
      description: "Bone grafts that have their own blood supply."
      last_updated: 2026-08-17

    ncit:C178089:
      d4cg_label: "Bone Graft, Nonvascularized"
      description: "Bone grafts without a blood supply."
      last_updated: 2026-08-17

    ncit:C178090:
      d4cg_label: "Chondroplasty"
      description: "An outpatient procedure to repair damaged cartilage in the knee."
      last_updated: 2026-08-17

    ncit:C178091:
      d4cg_label: "infection_classification"
      description: "The type of evidence regarding the infection type."
      last_updated: 2026-08-17

    ncit:C178092:
      d4cg_label: "Clinically Documented"
      description: "Documentation supporting direct medical treatment or testing."
      last_updated: 2026-08-17

    ncit:C178093:
      d4cg_label: "Microbiologically Documented Non-Sterile Site"
      description: "Documentation that supports the site was microbiologically non-sterile."
      last_updated: 2026-08-17

    ncit:C178094:
      d4cg_label: "Microbiologically Documented Sterile Site"
      description: "Documentation that supports the site was microbiologically sterile."
      last_updated: 2026-08-17

    ncit:C178129:
      d4cg_label: "Noonan Syndrome-Like Disorder with Loose Anagen Hair"
      description: "An inherited condition caused by autosomal dominant mutation(s) in the SHOC2 or PPP1CB genes, encoding leucine-rich repeat protein SHOC-2 and serine/threonine-protein phosphatase PP1-beta catalytic subunit, respectively. The condition is characterized by facial features similar to those seen in Noonan syndrome but may also include short stature, cognitive deficits, relative macrocephaly, small posterior fossa resulting in Chiari I malformation, hypernasal voice, cardiac defects, and ectodermal abnormalities, which typically presents as slow-growing, sparse, and/or unruly hair."
      last_updated: 2026-08-17

    ncit:C178141:
      d4cg_label: "number_of_live_births"
      description: "A measurement of the total number of live-born offspring a female has delivered."
      last_updated: 2026-08-17

    ncit:C178148:
      d4cg_label: "response_method"
      description: "The method used to assess the response to therapy."
      last_updated: 2026-08-17

    ncit:C17822:
      d4cg_label: "Ophthalmologist"
      description: "A doctor who specializes in diagnosing and treating eye problems, including injury and disease."
      last_updated: 2026-08-17

    ncit:C178252:
      d4cg_label: "MYOD1 Variant"
      description: "A variation in the amino acid sequence for myoblast determination protein 1."
      last_updated: 2026-08-17

    ncit:C178270:
      d4cg_label: "Delayed Intensification"
      description: "A repeat of the first two months of induction and consolidation chemotherapy in high-risk and very-high-risk ALL protocols with the goal of eliminating residual drug-resistant cells."
      last_updated: 2026-08-17

    ncit:C178285:
      d4cg_label: "PIK3CA-Related Overgrowth Spectrum"
      description: "A group of rare disorders that are caused by mutation in the PIK3CA gene. Representative examples include CLOVES (congenital lipomatous overgrowth, vascular malformations, epidermal nevi, and skeletal/spinal abnormalities) syndrome and MCAP (megalencephaly-capillary malformation) syndrome."
      last_updated: 2026-08-17

    ncit:C178379:
      d4cg_label: "CEBPA-Related Leukemia Predisposition"
      description: "An autosomal dominant inherited tumor predisposition syndrome caused by germline mutations in the CEBPA gene. It is associated with an increased risk of developing acute myeloid leukemia."
      last_updated: 2026-08-17

    ncit:C178380:
      d4cg_label: "DDX41-Related Leukemia Predisposition"
      description: ""
      last_updated: 2026-08-17

    ncit:C178382:
      d4cg_label: "CDC73-Related Neoplastic Syndrome"
      description: ""
      last_updated: 2026-08-17

    ncit:C178386:
      d4cg_label: "ETV6-Related Thrombocytopenia and Leukemia Predisposition"
      description: "An autosomal dominant condition caused by mutation(s) in the ETV6 gene, encoding transcription factor ETV6. It is characterized by an increased risk of developing thrombocytopenia and diverse hematologic malignancies, including myelodysplastic syndrome, acute myeloid leukemia, chronic myelomonocytic leukemia, B lymphoblastic leukemia, and plasma cell myeloma."
      last_updated: 2026-08-17

    ncit:C178387:
      d4cg_label: "ANKRD26-Related Thrombocytopenia and Leukemia Predisposition"
      description: "An autosomal dominant condition caused by mutation(s) in the ANKRD26 gene, encoding ankyrin repeat domain-containing protein 26. It is characterized by moderate thrombocytopenia and an increased risk of developing myelodysplastic syndrome/acute myeloid leukemia."
      last_updated: 2026-08-17

    ncit:C178390:
      d4cg_label: "SAMD9L-Related Myelodysplastic Syndrome Predisposition"
      description: "An autosomal dominant condition caused by mutation(s) in the SAMD9L gene, encoding sterile alpha motif domain-containing protein 9-like. It is characterized by an increased risk of developing myelodysplastic syndrome."
      last_updated: 2026-08-17

    ncit:C178392:
      d4cg_label: "Genetic Predisposition to Non-Syndromic Wilms Tumor"
      description: "A genetic predisposition to Wilms tumor due to germline mutation(s) in the REST, TRIM28, or CTR9 genes, encoding RE1-silencing transcription factor, transcription intermediary factor 1-beta, and RNA polymerase-associated protein CTR9 homolog, respectively."
      last_updated: 2026-08-17

    ncit:C178393:
      d4cg_label: "Rhabdoid Tumor Predisposition Syndrome 1"
      description: "Rhabdoid tumor predisposition syndrome caused by mutation(s) in the SMARCB1 gene, encoding SWI/SNF-related matrix-associated actin-dependent regulator of chromatin subfamily B member 1."
      last_updated: 2026-08-17

    ncit:C178394:
      d4cg_label: "Rhabdoid Tumor Predisposition Syndrome 2"
      description: "Rhabdoid tumor predisposition syndrome caused by mutation(s) in the SMARCA4 gene, encoding transcription activator BRG1."
      last_updated: 2026-08-17

    ncit:C178427:
      d4cg_label: "Influenza"
      description: "A vaccine intended to prevent infections caused by influenza viruses."
      last_updated: 2026-08-17

    ncit:C178507:
      d4cg_label: "Desmoplastic Myxoid Tumor of the Pineal Region  SMARCB1-Mutant"
      description: "A SMARCB1-deficient tumor of the brain arising in the pineal region. It is characterized by the presence of spindled and epithelioid cells with low-grade morphology that are embedded in a desmoplastic stroma alternating with various extents of loose myxoid matrix."
      last_updated: 2026-08-17

    ncit:C178529:
      d4cg_label: "PMS2 Variant"
      description: "A variation in the amino acid sequence for mismatch repair endonuclease PMS2."
      last_updated: 2026-08-17

    ncit:C178530:
      d4cg_label: "MLH1 Variant"
      description: "A variation in the amino acid sequence for DNA mismatch repair protein Mlh1."
      last_updated: 2026-08-17

    ncit:C178531:
      d4cg_label: "MSH6 Variant"
      description: "A variation in the amino acid sequence for DNA mismatch repair protein Msh6."
      last_updated: 2026-08-17

    ncit:C178532:
      d4cg_label: "ATM Variant"
      description: "A variation in the amino acid sequence for serine-protein kinase ATM."
      last_updated: 2026-08-17

    ncit:C178533:
      d4cg_label: "STK11 Variant"
      description: "A variation in the amino acid sequence for serine/threonine-protein kinase STK11."
      last_updated: 2026-08-17

    ncit:C178537:
      d4cg_label: "EPCAM Variant"
      description: "A variation in the amino acid sequence for epithelial cell adhesion molecule protein."
      last_updated: 2026-08-17

    ncit:C178538:
      d4cg_label: "PALB2 Variant"
      description: "A variation in the amino acid sequence for partner and localizer of BRCA2 protein."
      last_updated: 2026-08-17

    ncit:C178921:
      d4cg_label: "Equivocal"
      description: "A laboratory test result that indicates that a specific disease, condition, or attribute being assessed is not clearly present or absent."
      last_updated: 2026-08-17

    ncit:C178987:
      d4cg_label: "Serum"
      description: "A sample of serum collected for analysis."
      last_updated: 2026-08-17

    ncit:C179229:
      d4cg_label: "Myxoid Glioneuronal Tumor"
      description: "A rare, low-grade glioneuronal neoplasm characterized by a dinucleotide mutation at codon 385 of the PDGFR gene. It usually occurs in the septum pellucidum. It has also been described in the corpus callosum and periventricular white matter of the lateral ventricle. It has histologic features reminiscent of either dysembryoplastic neuroepithelial tumor or rosette-forming glioneuronal tumor. It is composed of oligodendrocyte-like cells in a prominent myxoid stroma."
      last_updated: 2026-08-17

    ncit:C17941:
      d4cg_label: "exposure"
      description: "Contact between an agent and a target. A state of contact or close proximity to a medicinal product, chemical, pathogen, radioisotope or other substance. NOTE: Types of exposure may be described by many qualifiers (e.g., local, systemic, acute, chronic, cumulative, environmental, population, individual, gestational, or occupational.) See also exposure (individual), intervention, extent of exposure. [After International Programme on Chemical Safety (IPCS) 2004 WHO]"
      last_updated: 2026-08-17

    ncit:C179410:
      d4cg_label: "Giant Cell Rich Osteosarcoma"
      description: "An exceedingly rare, high-grade variant of conventional osteosarcoma characterized by the presence of numerous osteoclast-like giant cells and variable amount of tumor osteoid."
      last_updated: 2026-08-17

    ncit:C17943:
      d4cg_label: "Morphology/Histology"
      description: "A statement about the form and/or structure of a target entity."
      last_updated: 2026-08-17

    ncit:C179469:
      d4cg_label: "Genetic Predisposition to Neuroblastoma"
      description: "An inherited condition caused by mutation(s) in the ALK or PHOX2B genes, encoding ALK tyrosine kinase receptor and paired mesoderm homeobox protein 2B, respectively. The condition is characterized by an increased risk of developing neuroblastoma."
      last_updated: 2026-08-17

    ncit:C179470:
      d4cg_label: "Genetic Predisposition to Myofibromatosis"
      description: "An inherited condition caused by mutation(s) in the NOTCH3 or PDGFRB genes, encoding neurogenic locus notch homolog protein 3 and platelet-derived growth factor receptor beta, respectively. The condition is characterized by an increased risk of developing myofibroma."
      last_updated: 2026-08-17

    ncit:C179471:
      d4cg_label: "Genetic Predisposition to Meningioma"
      description: "An inherited condition caused by mutation(s) in the SMARCE1 gene, encoding SWI/SNF-related matrix-associated actin-dependent regulator of chromatin subfamily E member 1. The condition is characterized by an increased risk of developing meningioma."
      last_updated: 2026-08-17

    ncit:C179472:
      d4cg_label: "Genetic Predisposition to Melanoma"
      description: "An inherited condition caused by mutation(s) in the CDKN2A or CDK4 genes, encoding cyclin-dependent kinase inhibitor 2A and cyclin-dependent kinase 4, respectively. The condition is characterized by an increased risk of developing melanoma."
      last_updated: 2026-08-17

    ncit:C179473:
      d4cg_label: "Genetic Predisposition to Papillary Renal Cell Carcinoma"
      description: "An inherited condition caused by mutation(s) in the MET gene, encoding hepatocyte growth factor receptor. The condition is characterized by an increased risk of developing papillary renal cell carcinoma."
      last_updated: 2026-08-17

    ncit:C17998:
      d4cg_label: "Unknown"
      description: "A proper value is applicable but not known."
      last_updated: 2026-08-17

    ncit:C18000:
      d4cg_label: "histology_grade"
      description: "A description of a tumor based on how abnormal the cancer cells look under a microscope and how quickly the tumor is likely to grow and spread. Grading systems are different for each type of cancer."
      last_updated: 2026-08-17

    ncit:C18004:
      d4cg_label: "stage_system"
      description: "A systematic method for clinicopathologic evaluation of tumors."
      last_updated: 2026-08-17

    ncit:C18009:
      d4cg_label: "Tumor"
      description: "A tumor sample, or entire tumor that is removed for examination."
      last_updated: 2026-08-17

    ncit:C18016:
      d4cg_label: "Copy Neutral Loss of Heterozygosity"
      description: "A genetic variation where gain, loss, or exchange of DNA results in monoallelic loss of function mutations in a diploid cell. In the context of tumor suppressor genes, where a single copy is sufficient for functionality, loss of function for the second allele is associated with tumorigenesis."
      last_updated: 2026-08-17

    ncit:C180341:
      d4cg_label: "GEIS"
      description: "A scientific society formed by professionals from more than sixty medical centers across Spain. This group includes surgeons, pediatricians, oncologic radiation therapy specialists, pathologists and molecular researchers."
      last_updated: 2026-08-17

    ncit:C180347:
      d4cg_label: "Adjacent Organ"
      description: "An organ that is next to an organ of interest."
      last_updated: 2026-08-17

    ncit:C180348:
      d4cg_label: "> 90% Necrosis"
      description: "Greater than 90% necrosis."
      last_updated: 2026-08-17

    ncit:C180353:
      d4cg_label: "<= 90% Necrosis"
      description: "Less than or equal to 90% necrosis."
      last_updated: 2026-08-17

    ncit:C180354:
      d4cg_label: "Multiple"
      description: "More than one metastatic area."
      last_updated: 2026-08-17

    ncit:C180356:
      d4cg_label: "Single"
      description: "One metastatic area."
      last_updated: 2026-08-17


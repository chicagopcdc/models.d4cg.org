      description: ""
      last_updated: 2026-08-17

    ncit:C100093:
      d4cg_label: "CNS Non-Germinomatous Germ Cell Tumor"
      description: "Germ cell tumors of the central nervous system other than germinoma.  This category includes teratoma, choriocarcinoma, embryonal carcinoma, and yolk sac tumor."
      last_updated: 2026-08-17

    ncit:C100104:
      d4cg_label: "Clinical Signs or Symptoms"
      description: "Objective evidence of disease perceptible to the examiner (sign) and subjective evidence of disease perceived by the subject (symptom)."
      last_updated: 2026-08-17

    ncit:C100391:
      d4cg_label: "QTc"
      description: "A QT interval that is corrected for heart rate by unspecified correction method, or by non-standard correction methods."
      last_updated: 2026-08-17

    ncit:C1004:
      d4cg_label: "Antineoplaston A10"
      description: "A piperidinedione antineoplaston with potential antineoplastic activity.  Antineoplaston A10 was originally isolated from human urine but is now synthetically derived.  This agent intercalates into DNA, resulting in cell cycle arrest in G1 phase, reduction of mitosis, and decreased protein synthesis.  Antineoplaston A10 may also inhibit ras-oncogene expression and activate tumor suppressor gene p53, leading to cell differentiation and apoptosis. (NCI04)"
      last_updated: 2026-08-17

    ncit:C100419:
      d4cg_label: "Ringed Sideroblasts"
      description: "A measurement of the ringed sideroblasts (abnormal nucleated erythroblasts with a large number of iron deposits in the perinuclear mitochondria, forming a ring around the nucleus) in a biological specimen."
      last_updated: 2026-08-17

    ncit:C100445:
      d4cg_label: "Immature Granulocytes"
      description: "A relative measurement (ratio or percentage) of the immature granulocytes to leukocytes in a biological specimen (for example a bone marrow specimen)."
      last_updated: 2026-08-17

    ncit:C1005:
      d4cg_label: "Arsenic Trioxide"
      description: "A drug used to treat acute promyelocytic leukemia (APL) that has not gotten better or that has come back after treatment with other anticancer drugs. It is also being studied in the treatment of other types of cancer."
      last_updated: 2026-08-17

    ncit:C100809:
      d4cg_label: "Biological Sibling"
      description: "A person's brother or sister with whom they share a genetic makeup inherited from one or both of their shared biological parents."
      last_updated: 2026-08-17

    ncit:C101091:
      d4cg_label: "BCOR Deletion"
      description: "This gene plays a role in the repression of gene transcription."
      last_updated: 2026-08-17

    ncit:C101220:
      d4cg_label: "Renal Agenesis"
      description: "A congenital abnormality characterized by the presence of only one kidney."
      last_updated: 2026-08-17

    ncit:C101293:
      d4cg_label: "Sequencing, NGS, NOS"
      description: "A type of sequencing technology that makes use of high-throughput parallel sequencing of multiple fragments of DNA or RNA."
      last_updated: 2026-08-17

    ncit:C101294:
      d4cg_label: "Sequencing, NGS, Whole Genome"
      description: "A DNA sequencing technique in which the entirety of the individual's genome is sequenced."
      last_updated: 2026-08-17

    ncit:C101295:
      d4cg_label: "Sequencing, NGS, Whole Exome"
      description: "A DNA sequencing technique in which all of the exons of an individual's genome are sequenced."
      last_updated: 2026-08-17

    ncit:C101513:
      d4cg_label: "Chemoembolization (TACE)"
      description: "A hepatic artery embolization technique involving the injection of a blocking agent and a chemotherapy agent to treat liver cancers."
      last_updated: 2026-08-17

    ncit:C101665:
      d4cg_label: "miR-375-3p"
      description: "Human MIR375 wild-type allele is located in the vicinity of 2q35 and is approximately 70 bases in length. This allele, which encodes MIR375 pre-miRNA, is involved in the modulation of gene expression."
      last_updated: 2026-08-17

    ncit:C102260:
      d4cg_label: "CD34"
      description: "A measurement of the CD34 sialomucin in a biological specimen."
      last_updated: 2026-08-17

    ncit:C102330:
      d4cg_label: "Hilar Nodes"
      description: "A lymph node located in the area around the hilum of an organ."
      last_updated: 2026-08-17

    ncit:C102401:
      d4cg_label: "Children's Oncology Group Retinoblastoma Risk Group Staging System >> High Risk"
      description: "The potential future harm that may arise from some present action or attribute or condition is almost certain."
      last_updated: 2026-08-17

    ncit:C102402:
      d4cg_label: "Children's Oncology Group Retinoblastoma Risk Group Staging System >> Intermediate Risk"
      description: "The potential future harm that may arise from some present action or attribute or condition is moderate."
      last_updated: 2026-08-17

    ncit:C102403:
      d4cg_label: "Children's Oncology Group Retinoblastoma Risk Group Staging System >> Low Risk"
      description: "The potential future harm that may arise from some present action or attribute or condition is small."
      last_updated: 2026-08-17

    ncit:C102560:
      d4cg_label: "Favorable"
      description: "Expressing something as positive, advantageous or desired."
      last_updated: 2026-08-17

    ncit:C102561:
      d4cg_label: "Unfavorable"
      description: "Expressing something as negative, undesired or adverse."
      last_updated: 2026-08-17

    ncit:C102564:
      d4cg_label: "Capivasertib"
      description: "A novel pyrrolopyrimidine derivative, and an orally available inhibitor of the serine/threonine protein kinase AKT (protein kinase B) with potential antineoplastic activity. Capivasertib binds to and inhibits all AKT isoforms. Inhibition of AKT prevents the phosphorylation of AKT substrates that mediate cellular processes, such as cell division, apoptosis, and glucose and fatty acid metabolism. A wide range of solid and hematological malignancies show dysregulated PI3K/AKT/mTOR signaling due to mutations in multiple signaling components. By targeting AKT, the key node in the PIK3/AKT signaling network, this agent may be used as monotherapy or combination therapy for a variety of human cancers."
      last_updated: 2026-08-17

    ncit:C102941:
      d4cg_label: "CD99/Cell Surface Antigen O13/Cell Surface Antigen HBA-71"
      description: "CD99 antigen (185 aa, ~19 kDa) is encoded by the human CD99 gene. This protein plays a role in cell adhesion."
      last_updated: 2026-08-17

    ncit:C102955:
      d4cg_label: "Large Vessels"
      description: "Any of the major arteries or veins attached to the cardiac atria or ventricles."
      last_updated: 2026-08-17

    ncit:C103050:
      d4cg_label: "Oligodendroglial Tumors"
      description: "Oligodendroglial Tumors is an NCI Cancer Therapeutic Evaluation Program (CTEP) Simplified Disease Classification (SDC) category used to organize cancer-related disease coding that harmonizes with and supports reporting based on the global standard Medical Dictionary for Drug Regulatory Reporting (MedDRA) terminology."
      last_updated: 2026-08-17

    ncit:C103144:
      d4cg_label: "Perlman Syndrome"
      description: "A rare, autosomal recessive syndrome characterized by the presence of polyhydramnios, neonatal macrosomia, craniofacial abnormalities, nephroblastomatosis, and predisposition to Wilms tumor.  The prognosis is poor."
      last_updated: 2026-08-17

    ncit:C103194:
      d4cg_label: "Durvalumab"
      description: "A monoclonal antibody directed against B7H1 (B7 homolog 1; programmed cell death ligand 1) with potential immunostimulating activity. Upon intravenous administration, durvalumab binds to the cell surface antigen B7H1, thereby blocking B7H1 signaling. This may activate the immune system to exert a cytotoxic T-lymphocyte (CTL) response against B7H1-expressing tumor cells. B7H1, a member of the B7 protein superfamily and a negative regulator of cytokine synthesis, is overexpressed on certain tumor cell types."
      last_updated: 2026-08-17

    ncit:C103242:
      d4cg_label: "Endoscopic Mucosal Resection"
      description: "An endoscopic procedure that visualizes a part of the gastrointestinal tract to first identify and demarcate superficial mucosal lesions, then to guide a submucosal injection to the site to lift the lesion and finally to aid in the removal of the lesion."
      last_updated: 2026-08-17

    ncit:C103253:
      d4cg_label: "PROMIS Global"
      description: "A 10 question instrument designed to provide an efficient way of gathering general perceptions of health."
      last_updated: 2026-08-17

    ncit:C103284:
      d4cg_label: "Buddhist"
      description: "A religious group that follows the teachings of Siddhartha Gautama, who taught that the end of suffering can be achieved by eliminating the desire for material comforts."
      last_updated: 2026-08-17

    ncit:C103285:
      d4cg_label: "Muslim"
      description: "A religious group that follows the words and belief system founded by the prophet Muhammad and are written in the Koran."
      last_updated: 2026-08-17

    ncit:C103291:
      d4cg_label: "Hindu"
      description: "A religious group that encompasses a diverse set of beliefs and traditions that originated in the Indian subcontinent."
      last_updated: 2026-08-17

    ncit:C103424:
      d4cg_label: "Not Evaluated"
      description: "Not all target lesions were assessed. Or not all non-target lesions were assessed."
      last_updated: 2026-08-17

    ncit:C103429:
      d4cg_label: "Preauricular Lymph Node"
      description: "A lymph node located anterior to the auricle of the ear."
      last_updated: 2026-08-17

    ncit:C103512:
      d4cg_label: "PET-CT"
      description: "An imaging technique that utilizes positron emission tomography and computed tomography in a single machine."
      last_updated: 2026-08-17

    ncit:C103514:
      d4cg_label: "PET-MRI"
      description: "An imaging technique that utilizes positron emission tomography and magnetic resonance imaging in a single machine."
      last_updated: 2026-08-17

    ncit:C1038:
      d4cg_label: "Carbogen"
      description: "An inhalant consisting of hyperoxic gas (95%-98% oxygen and 2%-5% carbon dioxide) with radiosensitizing properties.  Inhaled carbogen reduces diffusion-limited tumor hypoxia, increasing tumor radiosensitivity due to the increased availability of molecular oxygen for cytotoxic radiation-induced oxygen free radical production. (NCI04)"
      last_updated: 2026-08-17

    ncit:C103843:
      d4cg_label: "PRO-CTCAE"
      description: "A library of items for patient self-reporting of symptoms and side effects associated with cancer treatment trials."
      last_updated: 2026-08-17

    ncit:C104732:
      d4cg_label: "Savolitinib"
      description: "An orally bioavailable inhibitor of the c-Met receptor tyrosine kinase with potential antineoplastic activity. Savolitinib selectively binds to and inhibits the activation of c-Met in an ATP-competitive manner, and disrupts c-Met signal transduction pathways. This may result in cell growth inhibition in tumors that overexpress the c-Met protein. C-Met encodes the hepatocyte growth factor receptor tyrosine kinase and plays an important role in tumor cell proliferation, survival, invasion, and metastasis, and tumor angiogenesis; this protein is overexpressed or mutated in a variety of cancers."
      last_updated: 2026-08-17

    ncit:C104933:
      d4cg_label: "EBRT, Volume Modulated Arc Therapy"
      description: "Radiation therapy delivered to the whole volume of target tissue by a single rotation of the linear accelerator gantry."
      last_updated: 2026-08-17

    ncit:C105468:
      d4cg_label: "mg/kg"
      description: "A dose calculation unit expressed in hours times milligrams per milliliter, divided by milligram per kilogram."
      last_updated: 2026-08-17

    ncit:C105579:
      d4cg_label: "Intrathoracic"
      description: "Within the thoracic cavity."
      last_updated: 2026-08-17

    ncit:C105585:
      d4cg_label: "Glucose"
      description: "A measurement of the glucose in a biological specimen."
      last_updated: 2026-08-17

    ncit:C105707:
      d4cg_label: "Karnofsky >> 100"
      description: "Normal; no complaints; no evidence of disease."
      last_updated: 2026-08-17

    ncit:C105709:
      d4cg_label: "Karnofsky >> 90"
      description: "Able to carry on normal activity; minor signs or symptoms of disease."
      last_updated: 2026-08-17

    ncit:C105710:
      d4cg_label: "Karnofsky >> 80"
      description: "Normal activity with effort; some sign or symptoms of disease."
      last_updated: 2026-08-17

    ncit:C105711:
      d4cg_label: "Karnofsky >> 70"
      description: "Cares for self; unable to carry on normal activity or do active work."
      last_updated: 2026-08-17

    ncit:C105712:
      d4cg_label: "Karnofsky >> 60"
      description: "Requires occasional assistance, but is able to care for most personal needs."
      last_updated: 2026-08-17

    ncit:C105713:
      d4cg_label: "Karnofsky >> 50"
      description: "Requires considerable assistance and frequent medical care."
      last_updated: 2026-08-17

    ncit:C105714:
      d4cg_label: "Karnofsky >> 40"
      description: "Disabled; requires special care and assistance."
      last_updated: 2026-08-17

    ncit:C105715:
      d4cg_label: "Karnofsky >> 30"
      description: "Severely disabled; hospitalization is indicated, although death not imminent."
      last_updated: 2026-08-17

    ncit:C105716:
      d4cg_label: "Karnofsky >> 20"
      description: "Very sick; hospitalization necessary; active support treatment is necessary."
      last_updated: 2026-08-17

    ncit:C105718:
      d4cg_label: "Karnofsky >> 10"
      description: "Moribund; fatal processes progressing rapidly."
      last_updated: 2026-08-17

    ncit:C105720:
      d4cg_label: "Karnofsky >> 0"
      description: "Dead."
      last_updated: 2026-08-17

    ncit:C106250:
      d4cg_label: "Atezolizumab"
      description: "A humanized, Fc optimized, monoclonal antibody directed against the protein ligand PD-L1 (programmed cell death-1 ligand 1; CD274), with potential immune checkpoint inhibitory and antineoplastic activities. Atezolizumab binds to PD-L1, blocking its binding to and activation of its receptor programmed death 1 (PD-1; PDCD1) expressed on activated T-cells, which may enhance the T-cell-mediated immune response to neoplasms and reverse T-cell inactivation. In addition, by binding to PD-L1, atezolizumab also prevents binding of this ligand to B7.1 (CD80) expressed on activated T cells, which further enhances the T-cell-mediated immune response. PD-L1 is overexpressed on many human cancer cell types and on various tumor-infiltrating immune cells. PD-L1 binding to PD-1 on T-cells suppresses the immune system and results in increased immune evasion. PD-1, a transmembrane protein, is a negative regulator of the immune system that limits the expansion and survival of CD8+ T cells. The Fc region of atezolizumab is modified in such a way that it does not induce either antibody-dependent cytotoxicity (ADCC) or complement-dependent cytotoxicity (CDC)."
      last_updated: 2026-08-17

    ncit:C106432:
      d4cg_label: "Pembrolizumab"
      description: "A humanized monoclonal immunoglobulin (Ig) G4 antibody directed against human cell surface receptor PD-1 (programmed death-1 or programmed cell death-1) with potential immune checkpoint inhibitory and antineoplastic activities. Upon administration, pembrolizumab binds to PD-1, an inhibitory signaling receptor expressed on the surface of activated T cells, and blocks the binding to and activation of PD-1 by its ligands, which results in the activation of T-cell-mediated immune responses against tumor cells. The ligands for PD-1 include programmed cell death ligand 1 (PD-L1), overexpressed on certain cancer cells, and programmed cell death ligand 2 (PD-L2), which is primarily expressed on APCs. Activated PD-1 negatively regulates T-cell activation and plays a key role in in tumor evasion from host immunity."
      last_updated: 2026-08-17

    ncit:C106487:
      d4cg_label: "Not Given"
      description: "There was no excuse provided."
      last_updated: 2026-08-17

    ncit:C106550:
      d4cg_label: "number_of_abortions"
      description: "A measurement of the total number of instances in which there has been a spontaneous termination of pregnancy (miscarriage) or elective termination of pregnancy."
      last_updated: 2026-08-17

    ncit:C106551:
      d4cg_label: "number_of_pregnancies"
      description: "A measurement of the total number of pregnancy events experienced by a female."
      last_updated: 2026-08-17

    ncit:C107377:
      d4cg_label: "Musculoskeletal Disorder"
      description: "A non-neoplastic or neoplastic disorder that affects muscles and bones."
      last_updated: 2026-08-17

    ncit:C107506:
      d4cg_label: "Tazemetostat"
      description: "An orally available, small molecule selective and S-adenosyl methionine (SAM) competitive inhibitor of histone methyl transferase EZH2, with potential antineoplastic activity. Upon oral administration, tazemetostat selectively inhibits the activity of both wild-type and mutated forms of EZH2. Inhibition of EZH2 specifically prevents the methylation of histone H3 lysine 27 (H3K27). This decrease in histone methylation alters gene expression patterns associated with cancer pathways and results in decreased tumor cell proliferation in EZH2 mutated cancer cells. EZH2, which belongs to the class of histone methyltransferases (HMTs), is overexpressed or mutated in a variety of cancer cells and plays a key role in tumor cell proliferation."
      last_updated: 2026-08-17

    ncit:C107569:
      d4cg_label: "PDGFRA Variant"
      description: "A variation in the amino acid sequence for the platelet-derived growth factor receptor alpha protein."
      last_updated: 2026-08-17

    ncit:C1093:
      d4cg_label: "Etopophos"
      description: "A drug used to treat testicular and small cell lung cancers. It is also being studied in the treatment of several other types of cancer. Etopophos blocks certain enzymes needed for cell division and DNA repair, and it may kill cancer cells. It is a type of podophyllotoxin derivative and a type of topoisomerase inhibitor."
      last_updated: 2026-08-17

    ncit:C1094:
      d4cg_label: "Fludarabine"
      description: "A fluorinated nucleotide antimetabolite analog of the antiviral agent vidarabine (ara-A) with antineoplastic activity. Administered parenterally as a phosphate salt, fludarabine phosphate is rapidly dephosphorylated to 2-fluoro-ara-A and then phosphorylated intracellularly by deoxycytidine kinase to the active triphosphate, 2-fluoro-ara-ATP. This metabolite may inhibit DNA polymerase alpha, ribonucleotide reductase and DNA primase, thereby interrupting DNA synthesis and inhibiting tumor cell growth.  (NCI04)"
      last_updated: 2026-08-17

    ncit:C1097:
      d4cg_label: "Exemestane"
      description: "A drug used to treat advanced breast cancer and to prevent recurrent breast cancer in postmenopausal women who have already been treated with tamoxifen. It is also being studied in the treatment of other types of cancer. Aromasin causes a decrease in the amount of estrogen made by the body. It is a type of aromatase inhibitor."
      last_updated: 2026-08-17

    ncit:C1108:
      d4cg_label: "Gabapentin"
      description: "A substance that is being studied as a treatment for relieving hot flashes in women with breast cancer.  It belongs to the family of drugs called anticonvulsants."
      last_updated: 2026-08-17

    ncit:C111116:
      d4cg_label: "Diffusion Weighted Imaging"
      description: "A diffusion MRI technique in which diffusion-sensitizing gradients are applied to the imaging sequence."
      last_updated: 2026-08-17

    ncit:C111153:
      d4cg_label: "Cellularity"
      description: "A measurement of the degree, quality or condition of cells in a biological specimen."
      last_updated: 2026-08-17

    ncit:C111246:
      d4cg_label: "Mast Cell Count"
      description: "A measurement of the mast cells in a biological specimen."
      last_updated: 2026-08-17

    ncit:C111325:
      d4cg_label: "Total Lung Capacity"
      description: "The total volume of air in the lungs after maximum inhalation."
      last_updated: 2026-08-17

    ncit:C111361:
      d4cg_label: "FVC"
      description: "The maximum volume of air that can be exhaled after forced maximum inhalation."
      last_updated: 2026-08-17

    ncit:C111383:
      d4cg_label: "modified_rankin_scale"
      description: "A standardized clinical classification originally developed by John Rankin in 1957, and later modified by Van Swieten et al in 1988, which is used to assess the degree of disability or dependence in the daily activities of individuals who have suffered a stroke. It also allows comparison between subjects with different kinds of neurologic deficits. The questionnaire contains a '0 to 6' scale, ranging from 'no symptoms at all' (scored 0) to 'dead' (scored 6)."
      last_updated: 2026-08-17

    ncit:C111618:
      d4cg_label: "EBER"
      description: "Small non-coding RNA that is encoded by Epstein-Barr virus DNA and transcribed by virally-infected cells throughout the latent cycle. Expression of these oligonucleotides may be associated with the regulation of host ribosome function."
      last_updated: 2026-08-17

    ncit:C111655:
      d4cg_label: "Ventricular Dysfunction"
      description: "Impairment of the ventricle to either fill or eject adequately."
      last_updated: 2026-08-17

    ncit:C111802:
      d4cg_label: "Dyskeratosis Congenita"
      description: "A rare genetic disorder characterized by nail dystrophy, reticulated skin pigmentation especially on the neck and chest, and oral leukoplakia.  In about half the cases mutations in the TERT, TERC, DKC1, or TINF2 genes are identified.  Patients are at an increased risk of developing bone marrow failure, myelodysplastic syndrome, leukemia, or cancer, especially in the head and neck region."
      last_updated: 2026-08-17

    ncit:C112114:
      d4cg_label: "Necrosis"
      description: "Death of one or more layers of skin."
      last_updated: 2026-08-17

    ncit:C112364:
      d4cg_label: "Involvement of Emissary Channels"
      description: "The number of channels, or elements, in the coil component of the device."
      last_updated: 2026-08-17

    ncit:C1126:
      d4cg_label: "HiB (Haemophilus influenza type B)"
      description: "A vaccine against serotype b of the Gram-negative bacterium H. influenzae (Hib). Hib vaccines contain polysaccharide-protein conjugate antigens that produce greater host immune responses than first-generation purified polysaccharide vaccine. These vaccines may differ with regard to use of protein carriers, polysaccharides, diluents, and preservatives."
      last_updated: 2026-08-17

    ncit:C112835:
      d4cg_label: "Growth Hormone Deficiency"
      description: "Insufficient growth hormone secretion."
      last_updated: 2026-08-17

    ncit:C113053:
      d4cg_label: "age_at_recovery"
      description: "Recovery and purification of stem cells from human sources, including umbilical cord blood."
      last_updated: 2026-08-17

    ncit:C113164:
      d4cg_label: "Tisotumab Vedotin"
      description: "An antibody-drug conjugate (ADC) comprised of tisotumab, a monoclonal antibody against human tissue factor (TF) covalently coupled, via a protease-cleavable peptide linker, to monomethyl auristatin E (MMAE), an auristatin derivative and potent microtubule disrupting agent, with potential antiangiogenic, anticoagulant and antineoplastic activities. Upon administration of tisotumab vedotin, the tisotumab moiety binds to cell surface TF and is internalized. Tisotumab binds to factor VIIa (FVIIa), which interferes with the activation of factor X (FX) into FXa. This may prevent thrombin formation and cancer-associated venous thromboembolism, and may inhibit angiogenesis and tumor cell proliferation. After internalization of the agent, the MMAE moiety is released by proteolytic cleavage. It then binds to tubulin and inhibits its polymerization, which results in G2/M phase arrest and apoptosis. TF, a transmembrane protein and initiator of the coagulation cascade, is overexpressed in many tumor cells and tumor-resident endothelial cells. Expression of TF is correlated with metastasis, angiogenesis, tumor cell growth and tumor-associated thrombosis."
      last_updated: 2026-08-17

    ncit:C113237:
      d4cg_label: "ALC"
      description: "The number of lymphocytes found in a given volume of blood."
      last_updated: 2026-08-17

    ncit:C113243:
      d4cg_label: "ctDNA"
      description: "A type of cell-free DNA composed of small fragments of tumor DNA that are released by tumor cells into the bloodstream of the host."
      last_updated: 2026-08-17

    ncit:C113673:
      d4cg_label: "Reactive Airway Disease"
      description: "A term describing any condition in which the airways are hyperreactive to stimulation."
      last_updated: 2026-08-17

    ncit:C113716:
      d4cg_label: "Low Anterior Resection"
      description: "Resection of the rectum for cancer through an incision in the lower abdomen."
      last_updated: 2026-08-17

    ncit:C113747:
      d4cg_label: "Buccal Swab"
      description: "The collection of cells from the inside of a person's cheek using a swab collection device."
      last_updated: 2026-08-17

    ncit:C113792:
      d4cg_label: "Dordaviprone"
      description: "A water soluble, orally bioavailable inhibitor of the serine/threonine protein kinase Akt (protein kinase B) and extracellular signal-regulated kinase (ERK), with potential antineoplastic activity. Upon administration, dordaviprone binds to and inhibits the activity of Akt and ERK, which may result in inhibition of the phosphatidylinositol 3-kinase (PI3K)/Akt signal transduction pathway as well as the mitogen-activated protein kinase (MAPK)/ERK-mediated pathway. This may lead to the induction of tumor cell apoptosis mediated by tumor necrosis factor (TNF)-related apoptosis-inducing ligand (TRAIL)/TRAIL death receptor type 5 (DR5) signaling in AKT/ERK-overexpressing tumor cells. The PI3K/Akt signaling pathway and MAPK/ERK pathway are upregulated in a variety of tumor cell types and play a key role in tumor cell proliferation, differentiation and survival by inhibiting apoptosis. In addition, ONC201 is able to cross the blood-brain barrier."
      last_updated: 2026-08-17

    ncit:C114215:
      d4cg_label: "Reticulocyte Mean Corpuscular Volume"
      description: "A measurement of the mean volume of reticulocytes in a biological specimen."
      last_updated: 2026-08-17

    ncit:C114357:
      d4cg_label: "Juvenile Idiopathic Arthritis"
      description: "A group of chronic, inflammatory childhood disorders of unknown etiology that primarily involve joints."
      last_updated: 2026-08-17

    ncit:C114476:
      d4cg_label: "Allergic Reaction"
      description: "A disorder characterized by an adverse local or general response from exposure to an allergen."
      last_updated: 2026-08-17

    ncit:C114867:
      d4cg_label: "MRA"
      description: "A type of magnetic resonance imaging that is used to construct images of blood vessels."
      last_updated: 2026-08-17

    ncit:C114879:
      d4cg_label: "RANO"
      description: "An update to the MacDonald criteria for assessing disease progression and treatment response in glioblastoma multiforme (GBM)."
      last_updated: 2026-08-17

    ncit:C114934:
      d4cg_label: "Small for Gestational Age"
      description: "A newborn infant who has weight and/or length at birth more than two standard deviations below the mean for the reference population of the same sex and gestational age."
      last_updated: 2026-08-17

    ncit:C115207:
      d4cg_label: "Congenital Amegakaryocytic Thrombocytopenia"
      description: "A rare, autosomal recessive inherited disorder caused by mutation in the c-Mpl gene.  It is characterized by thrombocytopenia and absence of megakaryocytes.  It presents with bleeding in the first month of life."
      last_updated: 2026-08-17

    ncit:C115459:
      d4cg_label: "Renal Toxicity"
      description: "Toxicity that impairs or damages the kidney. This condition is often caused by the administration of a pharmaceutical agent that causes damage to the kidney."
      last_updated: 2026-08-17

    ncit:C115811:
      d4cg_label: "Massive Choroidal Extension, one focus more than 3mm"
      description: "Paced Auditory Serial Addition Test (PASAT) Did it take more than one attempt to get one successful trial?"
      last_updated: 2026-08-17

    ncit:C115965:
      d4cg_label: "Mucositis"
      description: "Inflammation of the mucous membranes."
      last_updated: 2026-08-17

    ncit:C116151:
      d4cg_label: "Cytogenetics, Microarray, SNP Array"
      description: "A genomic microarray-based method able to detect single nucleotide polymorphisms."
      last_updated: 2026-08-17

    ncit:C116161:
      d4cg_label: "PCR, MLPA"
      description: "A type of high-throughput, multiplex PCR method that uses a single pair of PCR primers to amplify multiple targets and to determine changes in complex genomes."
      last_updated: 2026-08-17

    ncit:C116396:
      d4cg_label: "CKIT Mutation - Ex17"
      description: "A molecular genetic abnormality indicating the presence of a mutation in exon 17 of the KIT gene located within 4q11-q12."
      last_updated: 2026-08-17

    ncit:C116466:
      d4cg_label: "Autologous, Tandem"
      description: "Therapy that combines cytoreductive-therapy from high-dose therapy and autologous hematopoietic cell transplantation with adoptive immunotherapy (from autologous hematopoietic cell transplantation) as a treatment strategy for multiple myeloma."
      last_updated: 2026-08-17

    ncit:C116471:
      d4cg_label: "Reduced Intensity Conditioning/Reduced Toxicity Conditioning"
      description: "A conditioning regimen intended to produce enough immunosuppression without eradicating host hematopoietic stem cells to allow engraftment of allogeneic hematopoietic stem cells via transplantation."
      last_updated: 2026-08-17

    ncit:C116566:
      d4cg_label: "Intracerebral, Convection-Enhanced Delivery"
      description: "The delivery of pharmacological agents to a brain tumor or resection cavity via specially placed catheters that bypass the blood brain barrier."
      last_updated: 2026-08-17

    ncit:C116649:
      d4cg_label: "Radioembolization"
      description: "A treatment for hepatocellular carcinoma that uses radioactive microspheres to both cause hepatic artery embolization and to deliver regional radiotherapy."
      last_updated: 2026-08-17

    ncit:C116722:
      d4cg_label: "Gilteritinib"
      description: "An orally bioavailable inhibitor of the receptor tyrosine kinases (RTKs) FMS-like tyrosine kinase 3 (FLT3; STK1; FLK2), AXL (UFO; JTK11), anaplastic lymphoma kinase (ALK; CD246), and leukocyte receptor tyrosine kinase (LTK), with potential antineoplastic activity. Upon administration, gilteritinib binds to and inhibits both the wild-type and mutated forms of FLT3, AXL, ALK and LTK. This may result in an inhibition of FLT3-, AXL-, ALK-, and LTK-mediated signal transduction pathways and reduced proliferation in cancer cells that overexpress these RTKs. FLT3, AXL, ALK, and LTK, which are overexpressed or mutated in a variety of cancer cell types, play key roles in tumor cell growth and survival."
      last_updated: 2026-08-17

    ncit:C116832:
      d4cg_label: "cns_disease_status"
      description: "The status describing the extent of central nervous system involvement at the time of leukemia diagnosis."
      last_updated: 2026-08-17

    ncit:C116833:
      d4cg_label: "CNS1"
      description: "Central nervous system status defined as puncture nontraumatic without leukemic blasts after cytocentrifugation. (Smith M, Arthur D, Camitta B, Carroll AJ, Crist W, Gaynon P, Gelber R, Heerema N, Korn EL, Link M, Murphy S, Pui CH, Pullen J, Reamon G, Sallan SE, Sather H, Shuster J, Simon R, Trigg M, Tubergen D, Uckun F, Ungerleider R. Uniform approach to risk classification and treatment assignment for children with acute lymphoblastic leukemia. J Clin Oncol. 1996 Jan;14(1):18-24.)"
      last_updated: 2026-08-17

    ncit:C116834:
      d4cg_label: "CNS2"
      description: "Central nervous system status defined as puncture nontraumatic with less than or equal to 5 WBC/uL in cerebral spinal fluid with identifiable blasts.(Smith M, Arthur D, Camitta B, Carroll AJ, Crist W, Gaynon P, Gelber R, Heerema N, Korn EL, Link M, Murphy S, Pui CH, Pullen J, Reamon G, Sallan SE, Sather H, Shuster J, Simon R, Trigg M, Tubergen D, Uckun F, Ungerleider R. Uniform approach to risk classification and treatment assignment for children with acute lymphoblastic leukemia. J Clin Oncol. 1996 Jan;14(1):18-24.)"
      last_updated: 2026-08-17

    ncit:C116835:
      d4cg_label: "CNS3"
      description: "Central nervous system status defined as puncture nontraumatic with greater than 5 WBC/uL in cerebral spinal fluid with identifiable blasts. (Smith M, Arthur D, Camitta B, Carroll AJ, Crist W, Gaynon P, Gelber R, Heerema N, Korn EL, Link M, Murphy S, Pui CH, Pullen J, Reamon G, Sallan SE, Sather H, Shuster J, Simon R, Trigg M, Tubergen D, Uckun F, Ungerleider R. Uniform approach to risk classification and treatment assignment for children with acute lymphoblastic leukemia. J Clin Oncol. 1996 Jan;14(1):18-24.)"
      last_updated: 2026-08-17

    ncit:C116836:
      d4cg_label: "CNS2a"
      description: "The status of central nervous system leukemia at diagnosis, where there are less than 10 red blood cells and less than 5 white blood cells per microliter on a cerebral spinal fluid cytospin preparation that is positive for blasts."
      last_updated: 2026-08-17

    ncit:C116837:
      d4cg_label: "CNS2b"
      description: "The status of central nervous system leukemia at diagnosis, where there are 10 or more red blood cells and less than 5 white blood cells per microliter on a cerebral spinal fluid cytospin preparation that is positive for blasts."
      last_updated: 2026-08-17

    ncit:C116838:
      d4cg_label: "CNS2c"
      description: "The status of central nervous system leukemia at diagnosis, where there are 10 or more red blood cells and 5 or more white blood cells per microliter on a cerebral spinal fluid cytospin preparation that is positive for blasts and is considered negative by Steinherz/Bleyer algorithm."
      last_updated: 2026-08-17

    ncit:C116840:
      d4cg_label: "CNS3a"
      description: "The status of central nervous system leukemia at diagnosis, where there are less than 10 red blood cells and 5 or more white blood cells per microliter on a cerebral spinal fluid cytospin preparation that is positive for blasts."
      last_updated: 2026-08-17

    ncit:C116841:
      d4cg_label: "CNS3b"
      description: "The status of central nervous system leukemia at diagnosis, where there are 10 or more red blood cells and 5 or more white blood cells per microliter on a cerebral spinal fluid cytospin preparation that is considered positive by Steinherz/Bleyer algorithm."
      last_updated: 2026-08-17

    ncit:C116843:
      d4cg_label: "CNS3c"
      description: "The status of central nervous system leukemia at diagnosis, where there are clinical signs of central system leukemia (such as facial nerve palsy, brain/eye involvement, or hypothalamic syndrome)."
      last_updated: 2026-08-17

    ncit:C117142:
      d4cg_label: "laboratory_test"
      description: "A character or string that represents the full name of the laboratory assessment."
      last_updated: 2026-08-17

    ncit:C117624:
      d4cg_label: "Morphology Method"
      description: "The technique used to administer the morphologic assessment."
      last_updated: 2026-08-17

    ncit:C11764:
      d4cg_label: "FOLFIRINOX"
      description: "A regimen consisting of fluorouracil, irinotecan, leucovorin and oxaliplatin that can be used for the treatment of pancreatic and colorectal cancers; occult primary, ampullary, appendiceal and small bowel adenocarcinomas; well-differentiated grade 3 neuroendocrine tumors (NETs), and extrapulmonary poorly differentiated neuroendocrine carcinoma, large or small cell carcinoma and mixed neuroendocrine-non-neuroendocrine neoplasm."
      last_updated: 2026-08-17

    ncit:C11778:
      d4cg_label: "Semaxanib"
      description: ""
      last_updated: 2026-08-17

    ncit:C118286:
      d4cg_label: "EBRT, Stereotactic Body"
      description: "A type of external radiation therapy that uses special equipment to position a patient and precisely deliver radiation to tumors in the body (except the brain). The total dose of radiation is divided into smaller doses given over several days. This type of radiation therapy helps spare normal tissue."
      last_updated: 2026-08-17

    ncit:C118385:
      d4cg_label: "Avascular Necrosis"
      description: "Tissue death resulting from an interruption to the blood supply."
      last_updated: 2026-08-17

    ncit:C118396:
      d4cg_label: "TP53"
      description: "A change in the nucleotide sequence of the TP53 gene."
      last_updated: 2026-08-17

    ncit:C118669:
      d4cg_label: "ALRN 6924"
      description: "An orally available peptide inhibitor of both murine double minute 2 (MDM2) and murine double minute X (MDMX), with potential antineoplastic activity. Upon oral administration, sulanemadlin binds to both MDM2 and MDMX and interferes with their interaction with the transcriptional activation domain of the tumor suppressor protein p53. By preventing MDM2-p53 and MDMX-p53 interactions, p53 activity is restored, which leads to p53-mediated induction of tumor cell apoptosis. MDM2 and MDMX, negative regulators of p53 function, are often overexpressed in cancer cells."
      last_updated: 2026-08-17

    ncit:C118764:
      d4cg_label: "Amblyopia (Lazy Eye)"
      description: "Decreased vision that results from abnormal visual development."
      last_updated: 2026-08-17

    ncit:C119546:
      d4cg_label: "FEF at 25-75%"
      description: "The mean forced expiratory flow rate at 25-75% of the forced vital capacity as a proportion of the predicted normal value."
      last_updated: 2026-08-17

    ncit:C119608:
      d4cg_label: "t(8;21)"
      description: "A cytogenetic abnormality that involves a translocation between chromosomes 8 and 21."
      last_updated: 2026-08-17

    ncit:C1197:
      d4cg_label: "Pirarubicin"
      description: "An analogue of the anthracycline antineoplastic antibiotic doxorubicin.  Pirarubicin intercalates into DNA and interacts with topoisomerase II, thereby inhibiting DNA replication and repair and RNA and protein synthesis.  This agent is less cardiotoxic than doxorubicin and exhibits activity against some doxorubicin-resistant cell lines. (NCI04)"
      last_updated: 2026-08-17

    ncit:C119940:
      d4cg_label: "tissue_type"
      description: "The type of material sample taken from a biological entity for tumor findings assessment testing."
      last_updated: 2026-08-17

    ncit:C120197:
      d4cg_label: "46XX"
      description: "Gonadal dysgenesis in an individual with 46,XX karyotype and female phenotype."
      last_updated: 2026-08-17

    ncit:C120198:
      d4cg_label: "46XY"
      description: "Gonadal dysgenesis in an individual with 46,XY karyotype and female phenotype. There is an increased risk of gonadal tumor."
      last_updated: 2026-08-17

    ncit:C120222:
      d4cg_label: "t(4;19)(q35;q13)"
      description: "A cytogenetic abnormality that refers to the translocation involving the genes CIC (capicua transcriptional suppressor) on chromosome 19 and DUX4 (double homeobox 4) on chromosome 4 resulting in CIC-DUX4 fusion."
      last_updated: 2026-08-17

    ncit:C120223:
      d4cg_label: "t(10;19)(q26;q13)"
      description: "A cytogenetic abnormality that refers to the translocation involving the genes CIC (capicua transcriptional suppressor) on chromosome 19 and DUX4L (double homeobox 4-like) on chromosome 10 resulting in CIC-DUX4L fusion."
      last_updated: 2026-08-17

    ncit:C120224:
      d4cg_label: "CIC-Rearranged Sarcoma"
      description: "An undifferentiated, high grade small round cell sarcoma affecting predominantly young adults. It is characterized by a recurrent translocation involving the CIC gene on chromosome 19 and either DUX4 gene on chromosome 4 or DUX4L gene on chromosome 10. The translocation results in either CIC-DUX4, t(4;19)(q35;q13) or CIC-DUX4L, t(10;19)(q26;q13) fusions."
      last_updated: 2026-08-17

    ncit:C120322:
      d4cg_label: "Pectoral Nodes"
      description: "An axillary lymph node located along the lower edge of the pectoralis minor."
      last_updated: 2026-08-17

    ncit:C120625:
      d4cg_label: "Anti-Mullerian Hormone (AMH)"
      description: "A measurement of the anti-Mullerian hormone in a biological specimen."
      last_updated: 2026-08-17

    ncit:C121127:
      d4cg_label: "Massive Choroidal Extension, multiple foci more than 3mm"
      description: "A subjective response indicating that something was more difficult than expected."
      last_updated: 2026-08-17

    ncit:C121139:
      d4cg_label: "Simultaneous Integrated"
      description: "A modification of intensity modulated radiation therapy that allows for the simultaneous delivery of different dose levels to different target volumes within a single treatment fraction. This can result in better sparing of critical structures, more efficient delivery, shorter treatment duration, and better biologic effectiveness."
      last_updated: 2026-08-17

    ncit:C1213:
      d4cg_label: "Rebeccamycin"
      description: "A substance that is being studied in the treatment of cancer. It belongs to the family of drugs called antineoplastic antibiotics."
      last_updated: 2026-08-17

    ncit:C121331:
      d4cg_label: "Intravenous Immunoglobulin Therapy"
      description: "Blood product derived from pooled Ig antibodies extracted from donor plasma delivered intravenously"
      last_updated: 2026-08-17

    ncit:C121447:
      d4cg_label: "Clavien-Dindo, Grade I"
      description: "Any deviation from the normal postoperative course without the need for pharmacological treatment or surgical, endoscopic, and radiological interventions."
      last_updated: 2026-08-17

    ncit:C121449:
      d4cg_label: "Clavien-Dindo, Grade III"
      description: "A complication requiring surgical, endoscopic, or radiological intervention."
      last_updated: 2026-08-17

    ncit:C121450:
      d4cg_label: "Clavien-Dindo, Grade IIIa"
      description: "A complication requiring intervention not under general anesthesia."
      last_updated: 2026-08-17

    ncit:C121451:
      d4cg_label: "Clavien-Dindo, Grade IIIb"
      description: "A complication requiring intervention under general anesthesia."
      last_updated: 2026-08-17

    ncit:C121452:
      d4cg_label: "Clavien-Dindo, Grade IV"
      description: "A life-threatening complication."
      last_updated: 2026-08-17

    ncit:C121453:
      d4cg_label: "Clavien-Dindo, Grade IVa"
      description: "Single organ dysfunction."
      last_updated: 2026-08-17

    ncit:C121454:
      d4cg_label: "Clavien-Dindo, Grade IVb"
      description: "Multiorgan dysfunction."
      last_updated: 2026-08-17

    ncit:C121455:
      d4cg_label: "Clavien-Dindo, Grade V"
      description: "Death of a patient."
      last_updated: 2026-08-17

    ncit:C121618:
      d4cg_label: "Seminoma/Dysgerminoma/Germinoma"
      description: "A malignant germ cell tumor characterized by the presence of primitive, large germ cells and lymphocytes. These tumors (germinoma, seminoma, or dysgerminoma) are histologically identical, and are distinguished only by their location."
      last_updated: 2026-08-17

    ncit:C121627:
      d4cg_label: "Impaired Consciousness"
      description: "A level of awareness and arousal other than normal."
      last_updated: 2026-08-17

    ncit:C121668:
      d4cg_label: "Pseudomyogenic Hemangioendothelioma"
      description: "An intermediate, rarely metastasizing blood vessel neoplasm that more frequently affects young adult males and usually arises in the lower limbs.  In approximately half of the affected patients the tumor is painful and in two-thirds of the patients the tumor is multifocal.  Morphologically it is characterized by the presence of sheets and fascicles of spindle cells with abundant eosinophilic cytoplasm and vesicular nuclei.  Cytologic atypia is usually mild.  Approximately 60% of the patients develop local recurrences or additional tumors in the same anatomic region."
      last_updated: 2026-08-17

    ncit:C121671:
      d4cg_label: "Angiosarcoma Of Soft Tissue"
      description: "An angiosarcoma that arises from the soft tissues, usually in the deep muscles of the lower extremities, retroperitoneum, mediastinum, and mesentery."
      last_updated: 2026-08-17

    ncit:C121686:
      d4cg_label: "Hybrid Nerve Sheath Tumor"
      description: "A benign nerve sheath tumor characterized by the combination of histologic features seen in schwannomas, neurofibromas, and perineuriomas."
      last_updated: 2026-08-17

    ncit:C121752:
      d4cg_label: "Hemosiderotic Fibrolipomatous Tumor"
      description: "A non-encapsulated, slow-growing, locally aggressive subcutaneous tumor characterized by the presence of adipocytes, hemosiderin-laden spindle cells, hemosiderin-laden macrophages, osteoclast-like giant cells, and scattered chronic inflammatory cells. It usually arises from the dorsum of the foot, ankle, dorsum of the hand, thigh, calf, or cheek.  It may recur if it is not completely excised but does not metastasize."
      last_updated: 2026-08-17

    ncit:C121774:
      d4cg_label: "Ossifying Fibromyxoid Tumor, Malignant"
      description: "An ossifying fibromyxoid tumor characterized by the presence of high grade nuclear features or increased cellularity and more than two mitotic figures per 50 HPFs."
      last_updated: 2026-08-17

    ncit:C121786:
      d4cg_label: "Mixed Tumour NOS"
      description: "A benign myoepithelioma characterized by the presence of a minor ductal component."
      last_updated: 2026-08-17

    ncit:C121788:
      d4cg_label: "Phosphaturic Mesenchymal Tumor, Benign"
      description: "A phosphaturic mesenchymal tumor with benign histologic features.  It may recur locally but does not metastasize.  Complete excision is curative."
      last_updated: 2026-08-17

    ncit:C121789:
      d4cg_label: "Phosphaturic Mesenchymal Tumor, Malignant"
      description: "A phosphaturic mesenchymal tumor characterized by the presence of nuclear atypia, high mitotic activity, increased cellularity, marked pleomorphism, and necrosis. It usually develops in lesions that have recurred locally and metastasizes to other sites."
      last_updated: 2026-08-17

    ncit:C121791:
      d4cg_label: "Pecoma NOS, Benign"
      description: "A tumor with perivascular epithelioid cell differentiation characterized by the absence of pleomorphism and scarcity or absence of mitotic figures."
      last_updated: 2026-08-17

    ncit:C121792:
      d4cg_label: "Pecoma NOS, Malignant"
      description: "A usually large and aggressive tumor with perivascular epithelioid cell differentiation characterized by the presence of marked nuclear atypia, pleomorphism, increased mitotic activity, necrosis, and infiltrative margins.  The most common metastatic sites are liver, lungs, lymph nodes, and bone."
      last_updated: 2026-08-17

    ncit:C121797:
      d4cg_label: "Undifferentiated Spindle Cell Sarcoma"
      description: "An undifferentiated soft tissue sarcoma characterized by the presence of a malignant spindle cell infiltrate with amphophilic or palely eosinophilic cytoplasm."
      last_updated: 2026-08-17

    ncit:C121799:
      d4cg_label: "Undifferentiated Ewing Tumor"
      description: "An undifferentiated soft tissue sarcoma characterized by the presence of uniform round or ovoid malignant cells with a high nuclear to cytoplasmic ratio."
      last_updated: 2026-08-17

    ncit:C121802:
      d4cg_label: "Undifferentiated Epithelioid Sarcoma"
      description: "An undifferentiated soft tissue sarcoma characterized by the presence of a malignant cellular infiltrate with epithelioid morphology."
      last_updated: 2026-08-17

    ncit:C121804:
      d4cg_label: "Undifferentiated Sarcoma, NOS"
      description: "An undifferentiated soft tissue sarcoma which cannot be further characterized."
      last_updated: 2026-08-17

    ncit:C122080:
      d4cg_label: "Systemic Corticosteroid"
      description: "Treatment with corticosteroids via a delivery method that will affect the entire body (oral, intramuscular, intravenous)."
      last_updated: 2026-08-17

    ncit:C122139:
      d4cg_label: "Oligoclonal Bands"
      description: "A measurement of the oligoclonal bands in a biological specimen."
      last_updated: 2026-08-17

    ncit:C12220:
      d4cg_label: "Lip"
      description: "Fleshy fold which surrounds the opening of the mouth."
      last_updated: 2026-08-17

    ncit:C12229:
      d4cg_label: "Palate"
      description: "The roof of the mouth. The front portion is bony (hard palate), and the back portion is muscular (soft palate)."
      last_updated: 2026-08-17

    ncit:C122394:
      d4cg_label: "Choi"
      description: "A composite set of criteria developed by Choi et al. using imaging techniques in the evaluation of gastrointestinal stromal tumors response to imatinib mesylate treatment. These criteria integrate changes in tumor size and tumor density."
      last_updated: 2026-08-17

    ncit:C122437:
      d4cg_label: "Positive Blood Culture"
      description: "A laboratory test result demonstrating the presence of a specific organism in a blood sample after culture."
      last_updated: 2026-08-17

    ncit:C12246:
      d4cg_label: "Hypopharynx"
      description: "Bottom part of the pharynx that connects to the esophagus."
      last_updated: 2026-08-17

    ncit:C122623:
      d4cg_label: "MLL Rearrangement (Translocation)"
      description: "A molecular abnormality indicating rearrangement of the KMT2A (MLL) gene."
      last_updated: 2026-08-17

    ncit:C12263:
      d4cg_label: "Duodenum"
      description: "A jointed tube 25-30 cm long that connects the stomach to the jejunum."
      last_updated: 2026-08-17

    ncit:C12265:
      d4cg_label: "Ascending Colon"
      description: "Section of colon which is distal to the cecum and proximal to the transverse colon."
      last_updated: 2026-08-17

    ncit:C12266:
      d4cg_label: "Hepatic Flexure"
      description: "Hepatic (or the right colic) flexure is the sharp bend between the ascending and the transverse colon. The right colic flexure is adjacent to the liver, and is therefore also known as the hepatic flexure. Thus, the left colic flexure is also known as the splenic flexure (as it is close to the spleen). The hepatic flexure lies in the right upper quadrant of the abdomen in humans."
      last_updated: 2026-08-17

    ncit:C12267:
      d4cg_label: "Splenic Flexure"
      description: "The bend at the junction of the transverse and descending colon."
      last_updated: 2026-08-17

    ncit:C12268:
      d4cg_label: "Descending Colon"
      description: "The fourth portion of the large intestine (colon) that communicates with the transverse colon in the left-upper quadrant of the abdomen and the rectum below."
      last_updated: 2026-08-17

    ncit:C122689:
      d4cg_label: "t(7;12)(q36;p13) / HLXB9(MNX1)/ETV6(TEL)"
      description: "A chromosomal translocation involving the ETV6 gene on chromosome 12p13 and HLXB9 gene on chromosome 7q36."
      last_updated: 2026-08-17

    ncit:C12274:
      d4cg_label: "Middle Ear"
      description: "The middle ear is the air-filled cavity within the skull of vertebrates that lies between the outer ear and the inner ear. It is linked to the pharynx (and therefore to outside air) via the Eustachian tube and in mammals contains the three ear ossicles, which transmit auditory vibrations from the outer ear (via the tympanum) to the inner ear (via the oval window)[GO]."
      last_updated: 2026-08-17

    ncit:C12290:
      d4cg_label: "Mandible"
      description: "A dentary bone that is the only bone in one of the lateral halves of the lower jaw skeleton."
      last_updated: 2026-08-17

    ncit:C12291:
      d4cg_label: "Skin of the Lip"
      description: "The skin portion of the lip that contains hair."
      last_updated: 2026-08-17

    ncit:C12296:
      d4cg_label: "Skin of the Upper Limb and Shoulder"
      description: "The integumentary covering of the upper limb and shoulder region."
      last_updated: 2026-08-17

    ncit:C12298:
      d4cg_label: "Retroperitoneum"
      description: "Anatomical space in the abdominal cavity behind (retro) the peritoneum. It has no specific delineating anatomical structures. Organs are retroperitoneal if they only have peritoneum on their anterior side."
      last_updated: 2026-08-17

    ncit:C1230:
      d4cg_label: "Sodium Thiosulfate"
      description: "A substance that is used in medicine as an antidote to cyanide poisoning and to decrease side effects of the anticancer drug cisplatin."
      last_updated: 2026-08-17

    ncit:C123031:
      d4cg_label: "Dysplastic Kidney"
      description: "Abnormal development of the kidney that is characterized by atretic ureter, multiple cysts of different sizes that are separated by dysplastic parenchyma, and complete lack of function."
      last_updated: 2026-08-17

    ncit:C12311:
      d4cg_label: "Cervix"
      description: "Lower, narrow portion of the uterus where it joins with the top end of the vagina."
      last_updated: 2026-08-17

    ncit:C12328:
      d4cg_label: "Epididymis"
      description: "A crescent-like structure located adjacent to the testis. It consists of a single highly coiled duct and is divided into 3 regions: caput (head), corpus (body) and cauda (tail)."
      last_updated: 2026-08-17

    ncit:C123317:
      d4cg_label: "DICER1 Syndrome"
      description: "An autosomal dominant inherited tumor predisposition syndrome caused by germline mutations of the DICER1 gene. Carriers are at an increased risk of developing benign and malignant neoplasms, including pleuropulmonary blastoma, childhood cystic nephroma, goiter, thyroid carcinoma, pineoblastoma, DICER1-mutant ovarian Sertoli-Leydig cell tumor, embryonal tumor with multilayered rosettes, and primary intracranial sarcoma, DICER1-mutant."
      last_updated: 2026-08-17

    ncit:C123329:
      d4cg_label: "Multiple Endocrine Neoplasia Type 2"
      description: "Multiple endocrine neoplasia caused by mutation of the RET gene. It includes the following neoplastic processes: multiple endocrine neoplasia type 2A, multiple endocrine neoplasia type 2B, and hereditary thyroid gland medullary carcinoma."
      last_updated: 2026-08-17

    ncit:C123333:
      d4cg_label: "Reese-Ellsworth"
      description: "A staging system for intraocular retinoblastoma that was developed in the 1960s, when children were treated with external beam radiation therapy. This system can help determine the likelihood of preserving the vision while the tumor is being treated. It is divided into 5 stages, and each stage predicts the potential to save the eye with external beam radiation therapy. Today, radiation therapy is reserved as a last resort to save a second eye, when all other treatments have failed. As a result, the Reese-Ellsworth classification is now rarely used."
      last_updated: 2026-08-17

    ncit:C12341:
      d4cg_label: "Involvement of Conjunctiva"
      description: "A thin tissue divided into the palpebral conjunctiva (covering the inner side of the eye lid) and the bulbar conjunctiva (covering the eyeball). (NCI)"
      last_updated: 2026-08-17

    ncit:C12344:
      d4cg_label: "Eye, Choroid"
      description: "A blood vessel-containing membrane of the eye that lies between the retina and the sclera."
      last_updated: 2026-08-17

    ncit:C12345:
      d4cg_label: "Involvement of Ciliary Body"
      description: "A part of the middle layer of the wall of the eye. The ciliary body includes the ring-shaped muscle that changes the size of the pupil and the shape of the lens when the eye focuses. It also makes the fluid that fills the eye."
      last_updated: 2026-08-17

    ncit:C123452:
      d4cg_label: "Continuation"
      description: "A period in a clinical study during which subjects receive continuation therapy. This therapy is usually different from the therapy given during the induction phase and administered over a longer period of time."
      last_updated: 2026-08-17

    ncit:C12347:
      d4cg_label: "Orbit"
      description: "The bony cavity of the skull which contains the eye, anterior portion of the optic nerve, ocular muscles and ocular adnexa. Seven bones contribute to the structure of the orbit: the frontal, maxillary, zygomatic, sphenoid, lacrimal, ethmoid, and palatine bones."
      last_updated: 2026-08-17

    ncit:C12348:
      d4cg_label: "Meninges"
      description: "Any one of three membranes that surround the brain and spinal cord."
      last_updated: 2026-08-17

    ncit:C12352:
      d4cg_label: "Frontal Cortex"
      description: "Frontal lobe is the anterior-most of five lobes of the cerebral hemisphere. It is bounded by the central sulcus on its posterior border and by the longitudinal cerebral fissure on its medial border."
      last_updated: 2026-08-17

    ncit:C12353:
      d4cg_label: "Temporal Cortex"
      description: "Lower lateral part of the cerebral hemisphere. (MSH)."
      last_updated: 2026-08-17

    ncit:C12354:
      d4cg_label: "Parietal Cortex"
      description: "One of the lobes of the cerebral hemisphere located superiorly to the occipital lobe and posteriorly to the frontal lobe. Cognition and visuospatial processing are its main function. (NCI)"
      last_updated: 2026-08-17

    ncit:C12355:
      d4cg_label: "Occipital Lobe"
      description: "One of the four regions of cortex in each cerebral hemisphere, located posterior to the temporal lobe and inferior to the parietal lobe."
      last_updated: 2026-08-17

    ncit:C123590:
      d4cg_label: "System NOS >> Major Response"
      description: "A major decrease in signs of cancer, supported by pathological examination and based on pre-defined thresholds."
      last_updated: 2026-08-17

    ncit:C123598:
      d4cg_label: "System NOS >> Minor Response"
      description: "A finding indicating that there is an improvement in the measures of disease burden, meeting a predetermined threshold, but not meeting partial response criteria."
      last_updated: 2026-08-17

    ncit:C123618:
      d4cg_label: "System NOS >> Very Good Partial Response"
      description: "Partial response with additional serum and urine M-protein reduction, but not meeting complete response."
      last_updated: 2026-08-17

    ncit:C12366:
      d4cg_label: "Bone, NOS"
      description: "Calcified connective tissue that forms the skeletal components of the body. (NCI)"
      last_updated: 2026-08-17

    ncit:C12376:
      d4cg_label: "Bile Duct"
      description: "A tube through which bile passes in and out of the liver."
      last_updated: 2026-08-17

    ncit:C12377:
      d4cg_label: "Gallbladder"
      description: "A pear-shaped organ located under the liver that stores and concentrates bile secreted by the liver. From the gallbladder the bile is delivered through the bile ducts into the intestine thereby aiding the digestion of fat-containing foods."
      last_updated: 2026-08-17

    ncit:C12380:
      d4cg_label: "Appendix"
      description: "A blind-ended tube connected to the cecum, from which it develops embryologically."
      last_updated: 2026-08-17

    ncit:C12381:
      d4cg_label: "Cecum"
      description: "A blind pouch-like commencement of the colon in the right lower quadrant of the abdomen at the end of the small intestine and the start of the large intestine."
      last_updated: 2026-08-17

    ncit:C12382:
      d4cg_label: "Colon"
      description: "The longest part of the large intestine, which is a tube-like organ connected to the small intestine at one end and the anus at the other. The colon removes water and some nutrients and electrolytes from partially digested food. The remaining material, solid waste called stool, moves through the colon to the rectum and leaves the body through the anus."
      last_updated: 2026-08-17

    ncit:C12384:
      d4cg_label: "Sigmoid Colon"
      description: "The S-shaped section of the colon that connects to the rectum."
      last_updated: 2026-08-17

    ncit:C12385:
      d4cg_label: "Transverse Colon"
      description: "The proximal-distal subdivision of colon that runs transversely across the upper part of the abdomen, from the right to the left colic flexure. Continuous with the descending colon."
      last_updated: 2026-08-17

    ncit:C12386:
      d4cg_label: "Small Intestine"
      description: "Subdivision of digestive tract that connects the stomach to the large intestine and is where much of the digestion and absorption of food takes place (with the exception of ruminants). The mammalian small intestine is long and coiled and can be differentiated histologically into: duodenum, jejunum, ileum."
      last_updated: 2026-08-17

    ncit:C12389:
      d4cg_label: "Esophagus"
      description: "The muscular tube through which food passes from the throat to the stomach."
      last_updated: 2026-08-17

    ncit:C12390:
      d4cg_label: "Rectum"
      description: "The last several inches of the large intestine closest to the anus."
      last_updated: 2026-08-17

    ncit:C12391:
      d4cg_label: "Stomach"
      description: "An expanded region of the vertebrate alimentary tract that serves as a food storage compartment and digestive organ. A stomach is lined, in whole or in part by a glandular epithelium."
      last_updated: 2026-08-17

    ncit:C12392:
      d4cg_label: "Liver"
      description: "A large organ located in the upper abdomen. The liver cleanses the blood and aids in digestion by secreting bile."
      last_updated: 2026-08-17

    ncit:C12393:
      d4cg_label: "Pancreas"
      description: "A digestive organ in the abdomen that has both endocrine and exocrine functions."
      last_updated: 2026-08-17

    ncit:C12398:
      d4cg_label: "Pineal"
      description: "A midline, cone like structure located in the dorso-caudal roof of the 3rd ventricle, attached by peduncles to the habenular and posterior commissures. The stalk contains nerve fibers, blood vessels, connective tissue and parenchymal cells (Paxinos, The Rat Central Nervous System, 2nd ed, pg 399)."
      last_updated: 2026-08-17

    ncit:C12400:
      d4cg_label: "Thyroid"
      description: "A gland located beneath the larynx (voice box) that makes thyroid hormone and calcitonin. The thyroid gland helps regulate growth and metabolism."
      last_updated: 2026-08-17

    ncit:C12401:
      d4cg_label: "Eye"
      description: "An organ that detects light."
      last_updated: 2026-08-17

    ncit:C12403:
      d4cg_label: "Fallopian Tube"
      description: "A slender tube through which eggs pass from an ovary to the uterus. In the female reproductive tract, there is one ovary and one fallopian tube on each side of the uterus."
      last_updated: 2026-08-17

    ncit:C12404:
      d4cg_label: "Ovary"
      description: "One of the paired female reproductive glands containing the ova or germ cells; the ovary's stroma is a vascular connective tissue containing numbers of ovarian follicles enclosing the ova."
      last_updated: 2026-08-17

    ncit:C12405:
      d4cg_label: "Uterus"
      description: "A hollow muscular organ within which the fertilized egg implants and the embryo/fetus develops during pregnancy."
      last_updated: 2026-08-17

    ncit:C12407:
      d4cg_label: "Vagina"
      description: "A fibromuscular tubular tract leading from the uterus to the exterior of the body in female placental mammals and marsupials, or to the cloaca in female birds, monotremes, and some reptiles."
      last_updated: 2026-08-17

    ncit:C12408:
      d4cg_label: "Vulva"
      description: "External genital organs of the female mammal."
      last_updated: 2026-08-17

    ncit:C12409:
      d4cg_label: "Penis"
      description: "An external male reproductive organ. It contains a tube called the urethra, which carries semen and urine to the outside of the body."
      last_updated: 2026-08-17

    ncit:C12410:
      d4cg_label: "Bladder/Prostate"
      description: "A gland in the male reproductive system. The prostate surrounds the part of the urethra (the tube that empties the bladder) just below the bladder, and produces a fluid that forms part of the semen."
      last_updated: 2026-08-17

    ncit:C12412:
      d4cg_label: "Testis"
      description: "A gonad of a male animal. A gonad produces and releases sperm."
      last_updated: 2026-08-17

    ncit:C12414:
      d4cg_label: "Bladder"
      description: "Distensible musculomembranous organ situated in the anterior part of the pelvic cavity in which urine collects before excretion."
      last_updated: 2026-08-17

    ncit:C124147:
      d4cg_label: "Symptom Scale"
      description: "A patient reported questionnaire composed of rating scales developed to measure the degree of distress experienced by the patient for specific symptoms."
      last_updated: 2026-08-17

    ncit:C12415:
      d4cg_label: "Cervical Vertebra"
      description: "A paired organ of the urinary tract which has the production of urine as its primary function."
      last_updated: 2026-08-17

    ncit:C12416:
      d4cg_label: "Ureter"
      description: "Muscular duct that propels urine from the kidneys to the urinary bladder, or related organs."
      last_updated: 2026-08-17

    ncit:C12418:
      d4cg_label: "Hand Phalanges"
      description: "For oncology, an area of the body generally construed to comprise the base of skull and facial bones, sinuses, orbits, salivary glands, oral cavity, oropharynx, larynx, thyroid, facial and neck musculature and lymph nodes draining these areas."
      last_updated: 2026-08-17

    ncit:C12419:
      d4cg_label: "Head"
      description: "The anterior and superior part of a human bearing the mouth, the brain and sensory organs."
      last_updated: 2026-08-17

    ncit:C12420:
      d4cg_label: "Larynx"
      description: "A continuation of the pharynx that is involved in breathing, sound production, and protecting the trachea against food aspiration."
      last_updated: 2026-08-17

    ncit:C12421:
      d4cg_label: "Oral Cavity"
      description: "Anatomical cavity at the start of the digestive tract that that is enclosed by the mouth. The boundaries and contents vary depending on the species. In vertebrates, the boundaries are the oral opening, the cheeks, the palate and (if present) the palatoglossal arch - if this is not present then the mouth and pharynx form the oropharyngeal cavity. The buccal cavity contains the teeth, tongue and palate (when present)."
      last_updated: 2026-08-17

    ncit:C12422:
      d4cg_label: "Tongue"
      description: "A muscular organ in the floor of the mouth."
      last_updated: 2026-08-17

    ncit:C124224:
      d4cg_label: "Pigment Changes"
      description: "Abnormal skin pigmentation."
      last_updated: 2026-08-17

    ncit:C12423:
      d4cg_label: "Nasopharynx"
      description: "The part of the pharynx above the soft palate, which is continuous with the nasal cavity and extends to the oropharynx."
      last_updated: 2026-08-17

    ncit:C12424:
      d4cg_label: "Nasal Cavity"
      description: "An anatomical cavity that is part of the olfactory apparatus. This includes the space bounded anteriorly by the nares and posteriorly by the choanae, when these structures are present."
      last_updated: 2026-08-17

    ncit:C12425:
      d4cg_label: "Pharynx"
      description: "A hollow tube that starts posterior to the mouth and nasal cavity and ends superior to the trachea and esophagus."
      last_updated: 2026-08-17

    ncit:C12426:
      d4cg_label: "Salivary Gland"
      description: "A gland in the mouth that produces saliva."
      last_updated: 2026-08-17

    ncit:C124261:
      d4cg_label: "Sequencing, NGS, RNA-seq"
      description: "A procedure that can determine the nucleotide sequence for all of the RNA transcripts in an individual."
      last_updated: 2026-08-17

    ncit:C12427:
      d4cg_label: "Parotid"
      description: "The largest of the three paired salivary glands, located in front of the ear."
      last_updated: 2026-08-17

    ncit:C12428:
      d4cg_label: "Trachea"
      description: "The airway that leads from the larynx (voice box) to the bronchi (large airways that lead to the lungs)."
      last_updated: 2026-08-17

    ncit:C12429:
      d4cg_label: "Limb"
      description: "A body region referring to an upper or lower extremity."
      last_updated: 2026-08-17

    ncit:C12431:
      d4cg_label: "Bone Marrow"
      description: "The soft tissue that fills the cavities of bones."
      last_updated: 2026-08-17

    ncit:C12432:
      d4cg_label: "Spleen"
      description: "An abdominal organ that is part of the hematopoietic and immune systems. It is composed of the white pulp and the red pulp and is surrounded by a capsule."
      last_updated: 2026-08-17

    ncit:C12433:
      d4cg_label: "Thymus"
      description: "A bi-lobed organ surrounded by a connective tissue capsule. It is located in the upper anterior portion of the chest, behind the sternum. It is composed predominantly of lymphocytes and fewer epithelial cells. Connective tissue septa separate the lobes into lobules. The lobules contain an outer portion (cortical zone) which is rich in lymphocytes and an inner portion (medullary zone) which is rich in epithelial cells. It is an organ essential for the development of the immune system. Its function is the maturation of the progenitor lymphoid cells to thymocytes and subsequently to mature T-cells. It reaches its greatest weight at puberty and subsequently begins to involute."
      last_updated: 2026-08-17

    ncit:C12438:
      d4cg_label: "Central Nervous System"
      description: "The brain and spinal cord."
      last_updated: 2026-08-17

    ncit:C12439:
      d4cg_label: "Basin"
      description: "An organ composed of gray and white matter that is the center for intelligence and reasoning. It is protected by the bony cranium."
      last_updated: 2026-08-17

    ncit:C1244:
      d4cg_label: "Temsirolimus"
      description: "A drug that is used to treat certain types of brain tumors in adults and is being studied in the treatment of other types of cancer. It belongs to the family of drugs called alkylating agents."
      last_updated: 2026-08-17

    ncit:C12442:
      d4cg_label: "Medulla"
      description: "Organ component of neuraxis that has as its parts the medullary reticular formation, inferior olivary complex and cochlear nuclear complex, among other structures[FMA]. The medulla oblongata lies directly above the spinal cord and controls vital autonomic functions such as digestion, breathing and the control of heart rate[GO]."
      last_updated: 2026-08-17

    ncit:C124435:
      d4cg_label: "gestational_age_at_birth"
      description: "The gestational age of the subject at birth."
      last_updated: 2026-08-17

    ncit:C124446:
      d4cg_label: "number_nodes_numeric"
      description: "The number of lymph nodes that were examined."
      last_updated: 2026-08-17

    ncit:C12445:
      d4cg_label: "Cerebellum"
      description: "Brain structure derived from the anterior hindbrain, and perhaps including posterior midbrain. The cerebellum plays a role in somatic motor function, the control of muscle tone, and balance."
      last_updated: 2026-08-17

    ncit:C12446:
      d4cg_label: "Corpus Callosum"
      description: "A white matter structure within the brain that connects the left and right cerebral hemispheres."
      last_updated: 2026-08-17

    ncit:C12459:
      d4cg_label: "Thalamus"
      description: "An area of the brain that helps process information from the senses and transmit it to other parts of the brain."
      last_updated: 2026-08-17

    ncit:C12463:
      d4cg_label: "Muscles and Joints"
      description: "A rod-shaped embryonic midline structure that is found in all chordates. Notochords, comprised of stiff cartilage-like material, are oriented from head to tail and are the basis for axial skeleton development."
      last_updated: 2026-08-17

    ncit:C12464:
      d4cg_label: "Spinal Cord"
      description: "A column of nerve tissue that runs from the base of the skull down the back. It is surrounded by three protective membranes, and is enclosed within the vertebrae (back bones). The spinal cord and the brain make up the central nervous system, and spinal cord nerves carry most messages between the brain and the rest of the body."
      last_updated: 2026-08-17

    ncit:C12468:
      d4cg_label: "Lung"
      description: "A thoracic organ that has variable lobation and is the primary respiratory organ of mammals."
      last_updated: 2026-08-17

    ncit:C12469:
      d4cg_label: "Lung/Pleura"
      description: "A thin layer of tissue that covers the lungs and lines the interior wall of the chest cavity. It protects and cushions the lungs. This tissue secretes a small amount of fluid that acts as a lubricant, allowing the lungs to move smoothly in the chest cavity while breathing."
      last_updated: 2026-08-17

    ncit:C12470:
      d4cg_label: "Skin"
      description: "An organ that constitutes the external surface of the body. It consists of the epidermis, dermis, and skin appendages."
      last_updated: 2026-08-17

    ncit:C12471:
      d4cg_label: "Soft Tissue"
      description: "A general term comprising tissue that is not hardened or calcified; including muscle, fat, blood vessels, nerves, tendons, ligaments and fascia."
      last_updated: 2026-08-17

    ncit:C12472:
      d4cg_label: "Involvement of Adipose Tissue"
      description: "A specialized form of connective tissue consisting primarily of adipocytes (fat cells), surrounded by a meshwork of collagen fibers."
      last_updated: 2026-08-17

    ncit:C124793:
      d4cg_label: "SMO Variant"
      description: "A molecular genetic abnormality that refers to the mutation of the SMO gene located on chromosome 7q32.3."
      last_updated: 2026-08-17

    ncit:C12482:
      d4cg_label: "Fibroblast"
      description: "A connective tissue cell that makes and secretes collagen proteins."
      last_updated: 2026-08-17

    ncit:C124874:
      d4cg_label: "iAMP21"
      description: "A cytogenetic abnormality that refers to the allelic gain of an internal part of chromosome 21. It is a rare high-risk chromosomal abnormality that occurs in approximately 2-5% of pediatric patients with B-cell precursor Acute Lymphoblastic Leukemia. This abnormality has been associated with a poor outcome in patients treated by standard protocols."
      last_updated: 2026-08-17

    ncit:C12497:
      d4cg_label: "Fetal Amniocytes"
      description: "A bony prominence situated on the upper surface of the body of the sphenoid bone housing the pituitary gland."
      last_updated: 2026-08-17

    ncit:C12505:
      d4cg_label: "Buccal Mucosa"
      description: "The inner lining of the cheeks and lips."
      last_updated: 2026-08-17

    ncit:C12510:
      d4cg_label: "Midbrain"
      description: "The midbrain is the middle division of the three primary divisions of the developing chordate brain or the corresponding part of the adult brain (in vertebrates, includes a ventral part containing the cerebral peduncles and a dorsal tectum containing the corpora quadrigemina and that surrounds the aqueduct of Sylvius connecting the third and fourth ventricles)[GO]."
      last_updated: 2026-08-17

    ncit:C12511:
      d4cg_label: "Pons"
      description: "Part of the central nervous system, located at the base of the brain, between the medulla oblongata and the midbrain. It is part of the brainstem."
      last_updated: 2026-08-17

    ncit:C12520:
      d4cg_label: "Platelets"
      description: "A tiny piece of a cell found in the blood that breaks off from a large cell found in the bone marrow. Platelets help wounds heal and prevent bleeding by forming blood clots."
      last_updated: 2026-08-17

    ncit:C12533:
      d4cg_label: "Neutrophil"
      description: "A type of immune cell that is one of the first cell types to travel to the site of an infection. Neutrophils help fight infection by ingesting microorganisms and releasing enzymes that kill the microorganisms. A neutrophil is a type of white blood cell, a type of granulocyte, and a type of phagocyte."
      last_updated: 2026-08-17

    ncit:C12535:
      d4cg_label: "Lymphocytes"
      description: "A type of immune cell that is made in the bone marrow and is found in the blood and in lymph tissue. The two main types of lymphocytes are B lymphocytes and T lymphocytes. B lymphocytes make antibodies, and T lymphocytes help kill tumor cells and help control immune responses. A lymphocyte is a type of white blood cell."
      last_updated: 2026-08-17

    ncit:C125459:
      d4cg_label: "Improved"
      description: "A subjective response indicating that something has improved or gotten better."
      last_updated: 2026-08-17

    ncit:C125599:
      d4cg_label: "Weaver Syndrome"
      description: "A rare syndrome caused by mutations in the EZH2 gene, and rarely mutations in the NSD1 gene. It is characterized by advanced bone age, foot deformities, permanently bent joints, macrocephaly, flattened back of the head, a broad forehead, hypertelorism, large, low-set ears, micrognathia, delayed development of motor skills, and mild intellectual disability."
      last_updated: 2026-08-17

    ncit:C12563:
      d4cg_label: "Histiocytes"
      description: "A macrophage present in connective tissue."
      last_updated: 2026-08-17

    ncit:C125738:
      d4cg_label: "FIGO"
      description: "A set of staging terms for gynecologic cancers developed by the International Federation of Gynecology and Obstetrics (FIGO)."
      last_updated: 2026-08-17

    ncit:C125932:
      d4cg_label: "response_system"
      description: "A standard from which a judgment concerning tumor response to therapy can be established."
      last_updated: 2026-08-17

    ncit:C12598:
      d4cg_label: "Oocyte"
      description: "The female gamete, germ cells in stages between the prophase of the first maturation division and the completion of the second maturation division."
      last_updated: 2026-08-17

    ncit:C126031:
      d4cg_label: "mRECIST"
      description: "Modified RECIST criteria for assessment of response in malignant pleural mesothelioma. (Byrne MJ, Nowak AK. Modified RECIST criteria for assessment of response in malignant pleural mesothelioma. Ann Oncol. 2004 Feb;15(2):257-60.)"
      last_updated: 2026-08-17

    ncit:C126039:
      d4cg_label: "PERCIST"
      description: "A set of rules that define when tumors in cancer patients respond, stabilize, or progress during treatment with respect to positron emission tomography."
      last_updated: 2026-08-17

    ncit:C126102:
      d4cg_label: "Chimeric Antigen Receptor T-cell Therapy"
      description: "A type of treatment in which a patient's T cells (a type of immune system cell) are changed in the laboratory so they will attack cancer cells. T cells are taken from a patient's blood. Then the gene for a special receptor that binds to a certain protein on the patient's cancer cells is added in the laboratory. The special receptor is called a chimeric antigen receptor (CAR). Large numbers of the CAR T cells are grown in the laboratory and given to the patient by infusion. Chimeric antigen receptor T-cell therapy is being studied in the treatment of some types of cancer."
      last_updated: 2026-08-17

    ncit:C126298:
      d4cg_label: "Non-Match"
      description: "The state when a recipient of a hematopoietic stem cell transplant is not fully matched with their donor for HLA-A, HLA-B, HLA-C, and HLA-DRB1."
      last_updated: 2026-08-17

    ncit:C126344:
      d4cg_label: "Lymphoproliferative Syndrome 1/ITK Deficiency"
      description: "An autosomal recessive immunodeficiency caused but mutation(s) in the ITK gene, encoding tyrosine-protein kinase ITK/TSK. It is characterized by the early childhood onset of Epstein-Barr virus (EBV)-associated immune dysregulation leading to lymphoma, lymphomatoid granulomatosis, hemophagocytic lymphohistiocytosis, and/or hypogammaglobulinemia."
      last_updated: 2026-08-17

    ncit:C126349:
      d4cg_label: "GATA2 Deficiency"
      description: "A condition of decreased or absent presence or activity of endothelial transcription factor GATA-2 protein. Deficiency of this protein is associated with immunodeficiency 21 and autosomal dominant and sporadic monocytopenia and mycobacterial infection syndrome (MonoMAC)."
      last_updated: 2026-08-17

    ncit:C126382:
      d4cg_label: "Occasional / Social"
      description: "An individual who drinks from time to time, but generally less than once per week."
      last_updated: 2026-08-17

    ncit:C126384:
      d4cg_label: "Heavy"
      description: "A man who drinks more than 14 standard drinks per week or a woman who drinks more than 7 standard drinks per week."
      last_updated: 2026-08-17

    ncit:C12664:
      d4cg_label: "Abdomen"
      description: "The area of the body that contains the pancreas, stomach, intestine, liver, gallbladder, and other organs."
      last_updated: 2026-08-17

    ncit:C12666:
      d4cg_label: "Adrenal Gland"
      description: "A flattened, roughly triangular body resting upon the upper end of each kidney; it is one of the ductless glands furnishing internal secretions (epinephrine and norepinephrine from the medulla and steroid hormones from the cortex)."
      last_updated: 2026-08-17

    ncit:C12667:
      d4cg_label: "Eye, Anterior Chamber"
      description: "The space in the eye filled with aqueous humor and bounded by the cornea, a small portion of the sclera, a small portion of the ciliary body, the iris and lens. (Cline et al., Dictionary of Visual Science, 4th ed, p109)"
      last_updated: 2026-08-17

    ncit:C12671:
      d4cg_label: "Upper Extremity"
      description: "The part of the forelimb extending from the shoulder to the autopod."
      last_updated: 2026-08-17

    ncit:C12674:
      d4cg_label: "Axilla"
      description: "The axilla is the area directly under the joint where the forelimb connects to the shoulder."
      last_updated: 2026-08-17

    ncit:C12678:
      d4cg_label: "Liver/Biliary Tract"
      description: "The duct system that transports bile from its origination by hepatocytes in the liver to the small intestine. It is comprised of the common bile duct that connects the liver and gall bladder to the small intestine and the cystic duct that connects the gall bladder to the common bile duct. (NCI)"
      last_updated: 2026-08-17

    ncit:C126819:
      d4cg_label: "KIT Variant"
      description: "A variation in the amino acid sequence for the mast/stem cell growth factor receptor Kit protein."
      last_updated: 2026-08-17

    ncit:C126823:
      d4cg_label: "MPL Variant"
      description: "A variation in the amino acid sequence for the thrombopoietin receptor protein."
      last_updated: 2026-08-17

    ncit:C12683:
      d4cg_label: "Bronchus"
      description: "The large air passages that lead from the trachea (windpipe) to the lungs."
      last_updated: 2026-08-17

    ncit:C126832:
      d4cg_label: "SDHA Variant"
      description: "A variation in the amino acid sequence for the succinate dehydrogenase [ubiquinone] flavoprotein subunit, mitochondrial protein."
      last_updated: 2026-08-17

    ncit:C12688:
      d4cg_label: "Carpal Bone"
      description: "Any of the bones of the joint located between the radius and ulna and metacarpus."
      last_updated: 2026-08-17

    ncit:C12689:
      d4cg_label: "Cauda Equina Spinal Cord"
      description: "The cauda equina is a structure within the lower end of the spinal column of most vertebrates, that consists of nerve roots and rootlets from above. The space in which the cerebrospinal fluid is present is actually an extension of the subarachnoid space."
      last_updated: 2026-08-17

    ncit:C12692:
      d4cg_label: "Cerebrospinal Fluid"
      description: "A clear, colorless, bodily fluid, that occupies the subarachnoid space and the ventricular system around and inside the brain and spinal cord."
      last_updated: 2026-08-17

    ncit:C12693:
      d4cg_label: "Dorsal Vertebra"
      description: "Any one of the seven vertebrae that are caudal to the skull, denoted as C1, C2, C3, C4, C5, C6 or C7."
      last_updated: 2026-08-17

    ncit:C12695:
      d4cg_label: "Clavicle"
      description: "One of a pair of bones at the base of the front of the neck. The clavicles connect the breastbone to the shoulder blades."
      last_updated: 2026-08-17

    ncit:C12696:
      d4cg_label: "Coccyx"
      description: "A small bone located at the bottom of the spine. The coccyx is a result of 3-5 fused rudimentary vertebrae."
      last_updated: 2026-08-17

    ncit:C12697:
      d4cg_label: "Cranium"
      description: "The cochlear portion of cranial nerve VIII (the vestibulocochlear nerve), which transmits auditory sensory impulses to the cochlear nucleus in the brainstem."
      last_updated: 2026-08-17

    ncit:C12701:
      d4cg_label: "Dermis"
      description: "The cells and connective tissue from the inner layer of the two main layers of the skin. The dermis has connective tissue, blood vessels, oil and sweat glands, nerves, hair follicles, and other structures. It is made up of a thin upper layer called the papillary dermis, and a thick lower layer called the reticular dermis."
      last_updated: 2026-08-17

    ncit:C12711:
      d4cg_label: "Ethmoid Bone"
      description: "A light and spongy bone that is cubical in shape. This bone is positioned at the anterior part of the cranium, sitting between the two orbits, at the roof of the nose. It consists of four parts: a horizontal or cribriform plate; a perpendicular plate; and two lateral masses or labyrinths."
      last_updated: 2026-08-17

    ncit:C12713:
      d4cg_label: "Eyelid"
      description: "A fold of skin that covers and protects part of the eyeball. Examples: upper eyelid, lower eyelid, nictitating membrane."
      last_updated: 2026-08-17

    ncit:C12717:
      d4cg_label: "Femur"
      description: "Endochondral long bone connecting the pelvic girdle with posterior zeugopodium skeleton."
      last_updated: 2026-08-17

    ncit:C12718:
      d4cg_label: "Fibula"
      description: "The long bone that is lateral to the tibia."
      last_updated: 2026-08-17

    ncit:C12724:
      d4cg_label: "Glottis"
      description: "The middle part of the larynx; the area where the vocal cords are located."
      last_updated: 2026-08-17

    ncit:C12726:
      d4cg_label: "Groin"
      description: "The area where the thigh meets the abdomen."
      last_updated: 2026-08-17

    ncit:C12727:
      d4cg_label: "Heart"
      description: "A hollow muscular organ which receives the blood from the veins and pumps it into the arteries."
      last_updated: 2026-08-17

    ncit:C12731:
      d4cg_label: "Humerus"
      description: "Paired endochondral long bone that extends between the pectoral girdle and the skeletal parts of the forelimb."
      last_updated: 2026-08-17

    ncit:C12736:
      d4cg_label: "Intestine"
      description: "Segment of the alimentary canal extending from the stomach to the anus and, in humans and other mammals, consists of two segments, the small intestine and the large intestine."
      last_updated: 2026-08-17

    ncit:C12742:
      d4cg_label: "Lower Extremity"
      description: "The limb that is composed of the hip, thigh, leg and foot."
      last_updated: 2026-08-17

    ncit:C12744:
      d4cg_label: "Scapula"
      description: "Any of the vertebrae situated between the thoracic vertebrae and the sacrum in the lower part of the spine."
      last_updated: 2026-08-17

    ncit:C12745:
      d4cg_label: "Lymph Node"
      description: "A bean-shaped organ surrounded by a connective tissue capsule. It is part of the lymphatic system and is found throughout the body. It is composed predominantly of lymphocytes and its main function is immune protection."
      last_updated: 2026-08-17

    ncit:C12748:
      d4cg_label: "Mediastinum"
      description: "An anatomic site along the midline and under the sternum that contains the heart and pericardium, the bases of the great vessels, the trachea and bronchi, esophagus, thymus, lymph nodes, thoracic duct, phrenic and vagus nerves, and other structures and tissues."
      last_updated: 2026-08-17

    ncit:C1275:
      d4cg_label: "Vinorelbine"
      description: "A semisynthetic vinca alkaloid. Vinorelbine binds to tubulin and prevents formation of the mitotic spindle, resulting in the arrest of tumor cell growth in metaphase. This agent may also interfere with amino acid, cyclic AMP. and glutathione metabolism; calmodulin-dependent Ca++ -transport ATPase activity; cellular respiration; and nucleic acid and lipid biosynthesis."
      last_updated: 2026-08-17

    ncit:C12751:
      d4cg_label: "Metacarpals"
      description: "Any of the bones between the carpus and the phalanges."
      last_updated: 2026-08-17

    ncit:C12752:
      d4cg_label: "Metatarsals"
      description: "A bone belonging to the middle part of the foot located between toes and ankle. There are 5 metatarsal bones and they are numbered from the medial side."
      last_updated: 2026-08-17

    ncit:C12757:
      d4cg_label: "Occipital Bone"
      description: "The trapezoidal-shaped bone on the posterior portion of the skull that forms part of the base of the skull."
      last_updated: 2026-08-17

    ncit:C12761:
      d4cg_label: "Optic Nerve"
      description: "A cranial nerve extending between the retina and optic chiasma, which innervates the eye."
      last_updated: 2026-08-17

    ncit:C12762:
      d4cg_label: "Oropharynx"
      description: "The part of the pharynx between the soft palate and the upper portion of the epiglottis."
      last_updated: 2026-08-17

    ncit:C12763:
      d4cg_label: "Nasal Cavity and Paranasal Sinuses"
      description: "Any one of the air-filled spaces within the ethmoid, frontal, maxillary, or sphenoid bones, which communicate with the nasal cavity."
      last_updated: 2026-08-17

    ncit:C12766:
      d4cg_label: "Parietal Bone"
      description: "A bone of the skull that forms the sides and roof of the skull."
      last_updated: 2026-08-17

    ncit:C12767:
      d4cg_label: "Pelvis, NOS"
      description: "The bony, basin-shaped structure formed by the bones of the pelvis."
      last_updated: 2026-08-17

    ncit:C12770:
      d4cg_label: "Peritoneum"
      description: "A serous membrane that lines the peritoneal cavity."
      last_updated: 2026-08-17

    ncit:C12777:
      d4cg_label: "Radius"
      description: "The long bone of the forearm that extends from the lateral aspect of the elbow to the thumb-side of the wrist."
      last_updated: 2026-08-17

    ncit:C127797:
      d4cg_label: "pmid_ref"
      description: "A globally unique identifier for a biomedical article, as assigned by PubMed."
      last_updated: 2026-08-17

    ncit:C12782:
      d4cg_label: "Rib"
      description: "An intersegmental rod-shaped bone that forms in the peritoneal membrane and attach to the vertebral parapophyses."
      last_updated: 2026-08-17

    ncit:C12783:
      d4cg_label: "Shoulder"
      description: "A bone that articulates with the humerus and is part of the scapulohumeral joint."
      last_updated: 2026-08-17

    ncit:C12789:
      d4cg_label: "Skull, NOS"
      description: "Anatomical structure that is part of the head consisting entirely of cranium and mandible."
      last_updated: 2026-08-17

    ncit:C12790:
      d4cg_label: "Sphenoid Bone"
      description: "The butterfly-shaped bone located at the base of the skull that forms the orbit of the eye."
      last_updated: 2026-08-17

    ncit:C12793:
      d4cg_label: "Sternum"
      description: "A midventral endochondral skeletal element which represents the origin site of the pectoral muscles."
      last_updated: 2026-08-17

    ncit:C12796:
      d4cg_label: "Tarsal Bone"
      description: "Any of the short bones between the tibiotarsal joint and the tarsometatarsal joint."
      last_updated: 2026-08-17

    ncit:C12797:
      d4cg_label: "Temporal Bone"
      description: "A large irregular bone situated at the base and side of the skull, connected with the mandible via the temporomandibular joint. The temporal bone consists of the squamous, tympanic and petrous parts. The petrous portion of the temporal bone contains the vestibulocochlear organ of the inner ear."
      last_updated: 2026-08-17

    ncit:C12798:
      d4cg_label: "Thoracic Vertebra"
      description: "Any of the vertebrae situated between the cervical and lumbar vertebrae."
      last_updated: 2026-08-17

    ncit:C12799:
      d4cg_label: "Thorax"
      description: "Subdivision of trunk proper, which is demarcated from the neck by the plane of the superior thoracic aperture and from the abdomen internally by the inferior surface of the diaphragm and externally by the costal margin and associated with the thoracic vertebral column and ribcage and from the back of the thorax by the external surface of the posterolateral part of the rib cage, the anterior surface of the thoracic vertebral column and the posterior axillary lines; together with the abdomen and the perineum, it constitutes the trunk proper."
      last_updated: 2026-08-17

    ncit:C12800:
      d4cg_label: "Tibia"
      description: "A bone located between the femur and the tarsus, being part of the lower leg."
      last_updated: 2026-08-17

    ncit:C12802:
      d4cg_label: "Tonsil"
      description: "A secondary lymphoid tissue in the mucosa of the pharynx."
      last_updated: 2026-08-17

    ncit:C12803:
      d4cg_label: "Eye, Trabecular Meshwork"
      description: "Mesh-like tissue responsible for draining the aqueous humor from the eye that is located at the iridocorneal angle of the eye, between the anterior chamber and the venous sinus of the sclera."
      last_updated: 2026-08-17

    ncit:C12809:
      d4cg_label: "Ulna"
      description: "One of the bones that comprise the forearm. The largest aspect articulates with the humerus at the elbow joint and the smallest portion of the ulna articulates with the carpal bones in the wrist."
      last_updated: 2026-08-17

    ncit:C128173:
      d4cg_label: "PDGFRB Variant"
      description: "A variation in the amino acid sequence of the platelet-derived growth factor receptor beta protein."
      last_updated: 2026-08-17

    ncit:C128192:
      d4cg_label: "Mosaic Variegated Aneuploidy Syndrome 1"
      description: "A mosaic variegated aneuploidy syndrome caused by mutations in the BUB1B gene. Clinical manifestations include growth retardation and an increased risk of developing malignant neoplasms, usually acute lymphoblastic leukemia, rhabdomyosarcoma, and Wilms tumor."
      last_updated: 2026-08-17

    ncit:C1282:
      d4cg_label: "Carboplatin"
      description: "A drug that is used to treat advanced ovarian cancer that has never been treated or symptoms of ovarian cancer that has come back after treatment with other anticancer drugs. It is also used with other drugs to treat advanced, metastatic, or recurrent non-small cell lung cancer and is being studied in the treatment of other types of cancer. Paraplatin is a form of the anticancer drug cisplatin and causes fewer side effects in patients. It attaches to DNA in cells and may kill cancer cells. It is a type of platinum compound."
      last_updated: 2026-08-17

    ncit:C128269:
      d4cg_label: "CGE"
      description: "A unit of relative biological effectiveness of protons equivalent to 60 cobalt gamma rays."
      last_updated: 2026-08-17

    ncit:C12827:
      d4cg_label: "Third Ventricle"
      description: "A centrally placed component of the ventricular system of the brain located in the diencephalon. Cerebrospinal fluid from the lateral ventricles flows into the third ventricle via the foramina of Monroe and exits the third ventricle via the aqueduct of Sylvius. The thalamus and hypothalamus border the lateral walls of the third ventricle."
      last_updated: 2026-08-17

    ncit:C128274:
      d4cg_label: "cfDNA"
      description: "DNA found in blood plasma and other bodily fluids that is not associated with cells."
      last_updated: 2026-08-17

    ncit:C12828:
      d4cg_label: "Fourth Ventricle"
      description: "A diamond-shaped cavity filled with cerebrospinal fluid within the pons extending between the obex in the caudal medulla and the aqueduct of Sylvius in the cerebellum."
      last_updated: 2026-08-17

    ncit:C128320:
      d4cg_label: "Infection, NOS"
      description: "The invasion of an organism's body tissues by disease-causing agents and their multiplication, as well as the reaction by the host to these organisms and/or toxins that the organisms produce."
      last_updated: 2026-08-17

    ncit:C12834:
      d4cg_label: "Lateral Ventricle"
      description: "The rostral extensions of the ventricular system of the brain consisting of two cavities, one on each side of the brain within the central regions of each cerebral hemisphere.  Cerebrospinal fluid flows from the lateral ventricles into the centrally third ventricle via the foramen of Monroe."
      last_updated: 2026-08-17

    ncit:C128642:
      d4cg_label: "t(11;22)"
      description: "A cytogenetic abnormality that involves a translocation between chromosomes 11 and 22."
      last_updated: 2026-08-17

    ncit:C128654:
      d4cg_label: "E2A/PBX1 t(1;19)"
      description: "A cytogenetic abnormality that involves a translocation between chromosomes 1 and 19."
      last_updated: 2026-08-17

    ncit:C128660:
      d4cg_label: "CKIT Mutation - Ex8"
      description: "A molecular genetic abnormality indicating the presence of a mutation in exon 8 of the KIT gene located within 4q11-q12."
      last_updated: 2026-08-17

    ncit:C128799:
      d4cg_label: "Trastuzumab Deruxtecan"
      description: "An antibody-drug conjugate (ADC) composed of trastuzumab, a monoclonal antibody targeting human epidermal growth factor receptor 2 (ERBB2; EGFR2; HER2) conjugated to deruxtecan, a derivative of the camptothecin analog exatecan (DXd; DX-8951 derivative), a DNA topoisomerase 1 (topoisomerase I; Top1) inhibitor, with antineoplastic activity. Upon administration of trastuzumab deruxtecan, trastuzumab targets and binds to HER2 on tumor cells. Upon antibody/antigen binding and internalization, deruxtecan binds to and inhibits Top1-DNA complexes, which results in an inhibition of DNA replication, cell cycle arrest and tumor cell apoptosis. HER2, a tyrosine kinase receptor, is overexpressed by many cancer cell types. In addition, trastuzumab deruxtecan induces antibody-dependent cell-mediated cytotoxicity (ADCC) and causes a bystander killing effect."
      last_updated: 2026-08-17

    ncit:C128817:
      d4cg_label: "CDKN2A"
      description: "A change in the nucleotide sequence of the CDKN2A gene."
      last_updated: 2026-08-17

    ncit:C12894:
      d4cg_label: "Thoracic Spinal Cord"
      description: "The portion of the spinal cord located in the thoracic region."
      last_updated: 2026-08-17

    ncit:C12895:
      d4cg_label: "Lumbar Spinal Cord"
      description: "The portion of the spinal cord located in the lumbar region."
      last_updated: 2026-08-17

    ncit:C128974:
      d4cg_label: "Plasma Cells"
      description: "A measurement of the total plasma cells in a biological specimen."
      last_updated: 2026-08-17

    ncit:C129000:
      d4cg_label: "Registry"
      description: "Observational studies which include an organized system that uses observational methods to collect uniform data (clinical and other) prospectively for a population defined by a particular disorder/disease, condition (including susceptibility to a disorder), or exposure (including products, health care services, and/or procedures) and that serves a predetermined scientific, clinical, or policy purpose. Patient registries may be single purpose or on-going data collection programs that address one or more questions. (AHRQ)"
      last_updated: 2026-08-17

    ncit:C12903:
      d4cg_label: "Supraclavicular Lymph Node"
      description: "A lymph node which is located above the clavicle."
      last_updated: 2026-08-17

    ncit:C12904:
      d4cg_label: "Axillary Nodes"
      description: "A lymph node in the armpit region that drains lymph from the breast and nearby areas."
      last_updated: 2026-08-17

    ncit:C129274:
      d4cg_label: "Diffuse Astrocytoma, MYB- Or MYBL1-Altered"
      description: "Diffuse astrocytoma lacking mutations in IDH1 or IDH2 genes."
      last_updated: 2026-08-17

    ncit:C129308:
      d4cg_label: "Schinzel-Giedion Syndrome"
      description: "An autosomal dominant disorder associated with mutation(s) in the SETBP1 gene, encoding SET-binding protein. It is characterized by unique facial features, including midface hypoplasia, skeletal abnormalities, and mental retardation."
      last_updated: 2026-08-17

    ncit:C129318:
      d4cg_label: "Oligodendroglioma, IDH-Mutant, And 1P/19Q-Codeleted"
      description: "An oligodendroglioma carrying IDH gene family mutation and combined whole-arm losses of 1p and 19q (1p/19q codeletion)."
      last_updated: 2026-08-17

    ncit:C129355:
      d4cg_label: "Chromothripsis"
      description: "A cytogenetic abnormality characterized by the occurrence of a large number of chromosomal rearrangements that are restricted to sites in one or a few chromosomes. Chromothripsis may result from a single catastrophic event that causes multiple double-strand breaks, which are subsequently repaired or reassembled by error-prone DNA repair pathways or through aberrant DNA replication mechanisms."
      last_updated: 2026-08-17

    ncit:C129427:
      d4cg_label: "Multinodular and Vacuolated Neuronal Tumor"
      description: "A low-grade tumor affecting the cerebral hemispheres. It is composed of cells with glial and/or neuronal differentiation forming multiple nodules with prominent vacuolation."
      last_updated: 2026-08-17

    ncit:C129431:
      d4cg_label: "Rosette-Forming Glioneuronal Tumor"
      description: "A central nervous system neoplasm mostly occurring in the fourth ventricle region. It is characterized by the presence of neurocytes forming pseudorosettes and astrocytes which contain Rosenthal fibers. Cytologic atypia is minimal."
      last_updated: 2026-08-17

    ncit:C129436:
      d4cg_label: "Medulloblastoma, Large Cell/Anaplastic"
      description: "A medulloblastoma composed of sheets of large cells mixed with cells characterized by marked nuclear pleomorphism and high mitotic activity."
      last_updated: 2026-08-17

    ncit:C129440:
      d4cg_label: "Medulloblastoma, WNT-Activated"
      description: "A molecular subtype of medulloblastoma associated with activation of the WNT pathway. TP53 mutations may be present or absent. WNT pathway activation in medulloblastomas is associated with good outcome."
      last_updated: 2026-08-17

    ncit:C129442:
      d4cg_label: "Medulloblastoma, SHH-Activated and TP53-Mutant"
      description: "Medulloblastoma associated with activation of the sonic hedgehog (SHH) pathway and the presence of TP53 mutations."
      last_updated: 2026-08-17

    ncit:C129443:
      d4cg_label: "Medulloblastoma, SHH-Activated and TP53-Wildtype"
      description: "Medulloblastoma associated with activation of the sonic hedgehog (SHH) pathway and the absence of TP53 mutations."
      last_updated: 2026-08-17

    ncit:C129444:
      d4cg_label: "Medulloblastoma, Non-WNT/Non-SHH"
      description: "Medulloblastoma not associated with activation of the WNT pathway or sonic hedgehog (SHH) pathway. TP53 mutations are absent. This molecular subtype includes medulloblastomas numerically designated as \"group 3\" and \"group 4\"."
      last_updated: 2026-08-17

    ncit:C129445:
      d4cg_label: "Medulloblastoma, Group 3"
      description: "Medulloblastoma not associated with activation of the WNT pathway or sonic hedgehog (SHH) pathway. MYC amplifications may be present. TP53 mutations are absent. Patients in this group are usually young children. The overall survival is the worst among all the molecular groups."
      last_updated: 2026-08-17

    ncit:C129446:
      d4cg_label: "Medulloblastoma, Group 4"
      description: "Medulloblastoma not associated with activation of the WNT pathway or sonic hedgehog (SHH) pathway. MYC amplifications are absent. TP53 mutations are absent. Chromosome 17 abnormalities may be present."
      last_updated: 2026-08-17

    ncit:C129461:
      d4cg_label: "Paraspinal"
      description: "Pertaining to muscles and/or tissue adjacent to the spinal column."
      last_updated: 2026-08-17

    ncit:C129462:
      d4cg_label: "Submandibular"
      description: "Beneath the mandible."
      last_updated: 2026-08-17

    ncit:C129493:
      d4cg_label: "PROMIS Fatigue Short Form"
      description: "A self-report tool that evaluates fatigue over a range of symptoms, from mild subjective feelings of tiredness to an overwhelming, debilitating, and sustained sense of exhaustion that likely decreases one's ability to execute daily activities and function normally in family or social roles. The fatigue short form is generic rather than disease specific and assesses fatigue over the past seven days."
      last_updated: 2026-08-17

    ncit:C129498:
      d4cg_label: "C19MC Amplification"
      description: "A genetic finding indicating the presence of amplification of the C19MC region on chromosome 19 (19q13.42)."
      last_updated: 2026-08-17

    ncit:C129574:
      d4cg_label: "ALK Rearrangement"
      description: "A molecular abnormality indicating rearrangement of the ALK gene."
      last_updated: 2026-08-17

    ncit:C129600:
      d4cg_label: "Central Nervous System Mature T-Cell and NK-Cell Non-Hodgkin Lymphoma"
      description: "A primary central nervous system non-Hodgkin lymphoma derived from mature or post-thymic T-cells or NK-cells."
      last_updated: 2026-08-17

    ncit:C12971:
      d4cg_label: "Breast"
      description: "Glandular organ located on the chest. The breast is made up of connective tissue, fat, and breast tissue that contains the glands that can make milk."
      last_updated: 2026-08-17

    ncit:C129718:
      d4cg_label: "47XXX"
      description: "A condition caused by the presence of an extra X chromosome resulting in 47,XXX karyotype in an individual with female phenotype. The condition is characterized by tall stature, increased risk of learning disabilities, and delayed development of speech and language."
      last_updated: 2026-08-17

    ncit:C129782:
      d4cg_label: "WHO, Version 4 >> AML with Biallelic Mutations of CEBPA"
      description: "An acute myeloid leukemia with double mutations of the CEBPA gene."
      last_updated: 2026-08-17

    ncit:C129785:
      d4cg_label: "WHO, Version 4 >> Provisional Entity: AML with BCR-ABL1"
      description: "A rare, de novo acute myeloid leukemia in which the blasts harbor BCR-ABL1 translocation in the absence of a history and clinical and laboratory features of chronic myelogenous leukemia."
      last_updated: 2026-08-17

    ncit:C129786:
      d4cg_label: "WHO, Version 4 >> Provisional Entity: AML with Mutated RUNX1"
      description: "Acute myeloid leukemia characterized by the presence of RUNX1 gene mutation."
      last_updated: 2026-08-17

    ncit:C12982:
      d4cg_label: "Inferior Limb"
      description: "A bone of the leg (lower extremity)."
      last_updated: 2026-08-17

    ncit:C12989:
      d4cg_label: "Involvement of Episclera"
      description: "A thin fibrous membrane that covers the outer surface of the anteriors sclera and contains blood vessels which supply the sclera."
      last_updated: 2026-08-17

    ncit:C129972:
      d4cg_label: "Match"
      description: "The state when a recipient and their donor have the same alleles for tissue markers. A full match includes HLA-A, HLA-B, HLA-C, and HLA-DRB1. HLA match typing may also include alleles in the HLA-DQ serogroup."
      last_updated: 2026-08-17

    ncit:C12998:
      d4cg_label: "Spine"
      description: "A series of bones, muscles, tendons, and other tissues reaching from the base of the skull to the tailbone. The vertebral column forms the axis of the skeleton and encloses as well as protects the spinal cord and the fluid surrounding the spinal cord."
      last_updated: 2026-08-17

    ncit:C130053:
      d4cg_label: "Biologically Unrelated"
      description: "A person who is biologically unrelated to another individual."
      last_updated: 2026-08-17

    ncit:C130202:
      d4cg_label: "Constitutional Mismatch Repair Deficiency"
      description: "A rare childhood cancer predisposition syndrome caused by biallelic inheritance of mutations in MLH1, MSH2, MSH6, or PMS2 genes. It is characterized by the development of childhood cancers, usually hematological malignancies and/or brain tumors, and colorectal cancers with multiple intestinal polyps. The majority of patients show signs of neurofibromatosis type 1."
      last_updated: 2026-08-17

    ncit:C130236:
      d4cg_label: "ROS1 Rearranged"
      description: "A molecular abnormality indicating rearrangement of the ROS1 gene."
      last_updated: 2026-08-17

    ncit:C13039:
      d4cg_label: "Female Reproductive System Part"
      description: "Any component of the female organs and tissues involved in the production and maturation of gametes and in their union and subsequent development as offspring."
      last_updated: 2026-08-17

    ncit:C1306:
      d4cg_label: "O6-Benzylguanine"
      description: "A drug that may improve the response of cancer cells to chemotherapy."
      last_updated: 2026-08-17

    ncit:C13063:
      d4cg_label: "Neck"
      description: "An organism subdivision that extends from the head to the pectoral girdle, encompassing the cervical vertebral column."
      last_updated: 2026-08-17

    ncit:C13066:
      d4cg_label: "Ileocecal Valve"
      description: "The valve between the ileum of the small intestine and the cecum of the large intestine."
      last_updated: 2026-08-17

    ncit:C13068:
      d4cg_label: "Bone Foot"
      description: "One of the seven tarsal, five metatarsal, or 14 phalangeal bones in the foot."
      last_updated: 2026-08-17

    ncit:C13070:
      d4cg_label: "Cheek"
      description: "A fleshy subdivision of one side of the face bounded by an eye, ear and the nose."
      last_updated: 2026-08-17

    ncit:C13071:
      d4cg_label: "Face"
      description: "The anterior portion of the head extending from the forehead to the chin and ear to ear. The facial structures contain the eyes, nose and mouth, cheeks and jaws."
      last_updated: 2026-08-17

    ncit:C131002:
      d4cg_label: "Simpson-Golabi-Behmel Syndrome"
      description: "An X-linked recessive syndrome caused by mutation(s) in the GPC3, OFD1, or rarely the GPC4 gene, encoding glypican 3, oral-facial-digital syndrome 1 protein, and glypican 4, respectively. The condition is characterized by macrosomia, coarse facies, cryptorchidism, congenital heart, kidney, liver, spleen, and musculoskeletal abnormalities."
      last_updated: 2026-08-17

    ncit:C131006:
      d4cg_label: "WT1 Syndromes"
      description: "A group of syndromes caused by autosomal dominant mutation(s) in the WT1 gene, encoding Wilms tumor protein."
      last_updated: 2026-08-17

    ncit:C1311:
      d4cg_label: "Tacrolimus"
      description: "A drug used to help reduce the risk of rejection by the body of organ and bone marrow transplants."
      last_updated: 2026-08-17

    ncit:C131131:
      d4cg_label: "iRANO"
      description: "Response assessment criteria for the evaluation of patients undergoing immunotherapy for the treatment of malignant glioma. These recommendations integrate guidance for the determination and confirmation of tumor progression based on the response assessment in neuro-oncology (RANO) working group and the immune-related response criteria (irRC)."
      last_updated: 2026-08-17

    ncit:C131136:
      d4cg_label: "ALK Amplification"
      description: "A molecular genetic abnormality indicating the presence of multiple copies of the ALK gene."
      last_updated: 2026-08-17

    ncit:C13115:
      d4cg_label: "Myelocyte"
      description: "A cell derived from a promyelocyte. It differentiates into a metamyelocyte. It has a diameter of 10-18 micrometer, and an oval or round nucleus with finely granulated chromatin."
      last_updated: 2026-08-17

    ncit:C131462:
      d4cg_label: "MSH2 Variant"
      description: "A variation in the amino acid sequence for DNA mismatch repair protein Msh2."
      last_updated: 2026-08-17

    ncit:C131467:
      d4cg_label: "BRCA1 Variant"
      description: "A variation in the amino acid sequence for breast cancer type 1 susceptibility protein."
      last_updated: 2026-08-17

    ncit:C131468:
      d4cg_label: "BRCA2 Variant"
      description: "A variation in the amino acid sequence for breast cancer type 2 susceptibility protein."
      last_updated: 2026-08-17

    ncit:C131491:
      d4cg_label: "BXQ-350 Nanovesicle Formulation"
      description: "A stable, nanovesicle formulation composed of a synthetic form of the human glycoprotein saposin C (SapC) linked to the phospholipid dioleoylphosphatidylserine (DOPS), with potential antineoplastic activity. Upon intravenous administration, the BXQ-350 nanovesicle formulation selectively targets and preferentially accumulates in tumor vessels and cells, due to the leaky nature of tumor vasculature and the presence of phosphatidylserine (PS) lipids in tumor cell membranes. Upon binding to the phospholipids in the tumor cell membrane, SapC fuses with the membrane and is internalized leading to its accumulation within the internal membrane. SapC becomes active in the acidic tumor microenvironment and as a lysosomal sphingolipid activator protein, activates lysosomal enzymes, such as beta-glucosidase, acid sphingomyelinase, and beta-galactosylceramidase. This leads to the degradation of glucosylceramide and sphingomyelin, and the conversion of galactosylceramide to ceramide, respectively. This elevates intracellular ceramide levels, activates caspases and induces ceramide-mediated apoptosis, which together lead to an inhibition of tumor cell growth. SapC plays key roles in lipid transport and organization of biological membranes and has strong lipid membrane binding activity."
      last_updated: 2026-08-17

    ncit:C131503:
      d4cg_label: "t(5;11)(q35;p15) / NSD1/NUP98"
      description: "A cytogenetic abnormality that refers to the translocation of chromosome 11p15 with chromosome 5q35. It results in the formation of NUP98/NSD1 fusion gene. It is associated with the development of acute myeloid leukemia with t(5;11)(q35;p15); NUP98-NSD1."
      last_updated: 2026-08-17

    ncit:C131505:
      d4cg_label: "t(11;15)(p15;q35) / NUP98/JARID1A"
      description: "A cytogenetic abnormality that refers to the translocation of chromosome 11p15 with chromosome 15q35. It results in the formation of NUP98/JARID1A fusion gene. It is associated with the development of acute myeloid leukemia with t(11;15)(p15;q35); NUP98-JARID1A."
      last_updated: 2026-08-17

    ncit:C131533:
      d4cg_label: "Bohring-Opitz Syndrome"
      description: "An autosomal dominant condition caused by mutation(s) in the ASXL1 gene, encoding putative polycomb group protein ASXL1. It is characterized by severe intrauterine growth retardation, profound mental retardation, craniofacial dysmorphisms, and flexion deformities of the upper limbs."
      last_updated: 2026-08-17

    ncit:C131672:
      d4cg_label: "Gross Total"
      description: "Surgical removal of an entire visible lesion, with no obvious lesion detected on post-operative evaluation; microscopic residual disease may be present."
      last_updated: 2026-08-17

    ncit:C131679:
      d4cg_label: "Myeloablative"
      description: "A conditioning regimen with high doses of chemotherapy or radiation to eliminate host hematopoietic stem cells prior to restitution via transplantation."
      last_updated: 2026-08-17

    ncit:C131680:
      d4cg_label: "Partial Resection"
      description: "Resection of part of an organ or tissue structure."
      last_updated: 2026-08-17

    ncit:C131785:
      d4cg_label: "CCND2 Amplification"
      description: "A molecular genetic abnormality indicating the presence of multiple copies of the CCND2 gene."
      last_updated: 2026-08-17

    ncit:C13202:
      d4cg_label: "chromosome"
      description: "A structural unit composed of a nucleic acid molecule which controls its own replication through the interaction of specific proteins at one or more origins of replication.  [Sequence Ontology:  SO:0000340 (SOWiki)  http://www.sequenceontology.org/browser/current_svn/term/SO:0000340]  EXAMPLE(S): Most humans have 23 pairs of chromosomes--22 pairs of numbered chromosomes, called autosomes, and one pair of sex chromosomes, X and Y.  OTHER NAME(S):  NOTE(S): This class can represent eukaryotic (e.g. human), mitochondrial, bacterial, and viral chromosomes, for example."
      last_updated: 2026-08-17

    ncit:C13204:
      d4cg_label: "1"
      description: "The designation for each member of the largest human autosomal chromosome pair. Chromosome 1 spans about 247 million nucleotide base pairs and represents about 8% of the total DNA in normal diploid cells."
      last_updated: 2026-08-17

    ncit:C13205:
      d4cg_label: "10"
      description: "The designation for each member of the tenth largest human autosomal chromosome pair. Chromosome 10 spans about 135 million base pairs and represents between 4 and 4.5% of the total DNA in normal diploid cells."
      last_updated: 2026-08-17

    ncit:C13206:
      d4cg_label: "11"
      description: "The designation for each member of the eleventh largest human autosomal chromosome pair. Chromosome 11 spans about 134.5 million base pairs and represents between 4 and 4.5% of the total DNA in normal diploid cells."
      last_updated: 2026-08-17

    ncit:C132067:
      d4cg_label: "Low-Grade Glioma, NOS or NEC"
      description: "A grade I or grade II glioma arising from the central nervous system. This category includes pilocytic astrocytoma, diffuse astrocytoma, subependymal giant cell astrocytoma, ependymoma, oligodendroglioma, oligoastrocytoma, and angiocentric glioma."
      last_updated: 2026-08-17

    ncit:C13207:
      d4cg_label: "12"
      description: "The designation for each member of the twelfth largest human autosomal chromosome pair. Chromosome 12 spans about 143 million base pairs and represents between 4 and 4.5% of the total DNA in normal diploid cells."
      last_updated: 2026-08-17

    ncit:C13208:
      d4cg_label: "13"
      description: "The designation for each member of the thirteenth largest human autosomal chromosome pair. Chromosome 13 spans about 113 million base pairs and represents between 3.5 and 4% of the total DNA in normal diploid cells."
      last_updated: 2026-08-17

    ncit:C13209:
      d4cg_label: "14"
      description: "The designation for each member of the fourteenth largest human autosomal chromosome pair. Chromosome 14 spans about 105 million base pairs and represents between 3 and 3.5% of the total DNA in normal diploid cells."
      last_updated: 2026-08-17

    ncit:C13210:
      d4cg_label: "15"
      description: "The designation for each member of the fifteenth largest human autosomal chromosome pair. Chromosome 15 spans about 106 million base pairs and represents between 3 and 3.5% of the total DNA in normal diploid cells."
      last_updated: 2026-08-17

    ncit:C132102:
      d4cg_label: "t(10;11)(p12;q23) / MLL-MLLT10(AF10)"
      description: "A cytogenetic abnormality that refers to the translocation of chromosome 10p12 with chromosome 11q23. It is associated with acute myeloid leukemia in childhood."
      last_updated: 2026-08-17

    ncit:C13211:
      d4cg_label: "16"
      description: "The designation for each member of the sixteenth largest human autosomal chromosome pair. Chromosome 16 spans about 90 million base pairs and represents just under 3% of the total DNA in normal diploid cells."
      last_updated: 2026-08-17

    ncit:C13212:
      d4cg_label: "17"
      description: "The designation for each member of the seventeenth largest human autosomal chromosome pair. Chromosome 17 spans more than 81 million base pairs and represents between 2.5 and 3% of the total DNA in normal diploid cells."
      last_updated: 2026-08-17

    ncit:C13213:
      d4cg_label: "18"
      description: "The designation for each member of the eighteenth largest human autosomal chromosome pair. Chromosome 18 spans about 76 million base pairs and represents about 2.5% of the total DNA in normal diploid cells."
      last_updated: 2026-08-17

    ncit:C13214:
      d4cg_label: "19"
      description: "The designation for each member of the nineteenth largest human autosomal chromosome pair. Chromosome 19 spans more than 63 million base pairs and represents between 2 and 2.5% of the total DNA in normal diploid cells."
      last_updated: 2026-08-17

    ncit:C13215:
      d4cg_label: "2"
      description: "The designation for each member of the second largest human autosomal chromosome pair. Chromosome 2 spans more than 237 million base pairs and represents almost 8% of the total DNA in normal diploid cells."
      last_updated: 2026-08-17

    ncit:C13216:
      d4cg_label: "20"
      description: "The designation for each member of the third smallest human autosomal chromosome pair. Chromosome 20 spans around 63 million base pairs and represents between 2 and 2.5% of the total DNA in normal diploid cells."
      last_updated: 2026-08-17

    ncit:C13217:
      d4cg_label: "21"
      description: "The designation for each member of the second smallest human autosomal chromosome pair. Chromosome 21 spans around 47 million nucleotides and represents about 1.5% of the total DNA in normal diploid cells."
      last_updated: 2026-08-17

    ncit:C13218:
      d4cg_label: "22"
      description: "The designation for each member of the smallest human autosomal chromosome pair. Chromosome 22 spans about 49 million base pairs and represents between 1.5 and 2% of the total DNA in normal diploid cells."
      last_updated: 2026-08-17

    ncit:C13219:
      d4cg_label: "3"
      description: "The designation for each member of the third largest human autosomal chromosome pair. Chromosome 3 spans almost 200 million base pairs and represents about 6.5% of the total DNA in normal diploid cells."
      last_updated: 2026-08-17

    ncit:C13220:
      d4cg_label: "4"
      description: "The designation for each member of the fourth largest human autosomal chromosome pair. Chromosome 4 spans more than 186 million base pairs and represents between 6 and 6.5% of the total DNA in normal diploid cells."
      last_updated: 2026-08-17

    ncit:C13221:
      d4cg_label: "5"
      description: "The designation for each member of the fifth largest human autosomal chromosome pair. Chromosome 5 spans about 181 million base pairs and represents almost 6% of the total DNA in normal diploid cells."
      last_updated: 2026-08-17

    ncit:C13222:
      d4cg_label: "6"
      description: "The designation for each member of the sixth largest human autosomal chromosome pair. Chromosome 6 spans more than 170 million base pairs and represents between 5.5 and 6% of the total DNA in normal diploid cells."
      last_updated: 2026-08-17

    ncit:C13223:
      d4cg_label: "7"
      description: "The designation for each member of the seventh largest human autosomal chromosome pair. Chromosome 7 spans more than 158 million base pairs and represents between 5 and 5.5% of the total DNA in normal diploid cells."
      last_updated: 2026-08-17

    ncit:C13224:
      d4cg_label: "8"
      description: "The designation for each member of the eighth largest human autosomal chromosome pair. Chromosome 8 spans about 145 million base pairs and represents between 4.5 and 5.0% of the total DNA in normal diploid cells."
      last_updated: 2026-08-17

    ncit:C132248:
      d4cg_label: "AJCC, v8 >> Stage 0"
      description: "A cancer stage defined according to the AJCC 8th edition criteria."
      last_updated: 2026-08-17

    ncit:C13225:
      d4cg_label: "9"
      description: "The designation for each member of the ninth largest human autosomal chromosome pair. Chromosome 9 spans about 145 million base pairs of nucleic acids and represents between 4 and 4.5% of the total DNA in normal diploid cells."
      last_updated: 2026-08-17

    ncit:C132424:
      d4cg_label: "Clinical Non-Pediatrician (General Practitioner, Optometrist)"
      description: "A physician with a Doctor of Optometry degree (or analogous) that specializes in the diagnosis and treatment of eye disorders."
      last_updated: 2026-08-17

    ncit:C13249:
      d4cg_label: "Intron"
      description: "Non-coding, intervening sequences of DNA that are transcribed, but are removed from within the primary gene transcript and rapidly degraded during maturation of messenger RNA."
      last_updated: 2026-08-17

    ncit:C1326:
      d4cg_label: "DOX"
      description: "A drug that is used to treat many types of cancer and is being studied in the treatment of other types of cancer. Adriamycin PFS comes from the bacterium Streptomyces peucetius. It damages DNA and may kill cancer cells. It is a type of anthracycline antitumor antibiotic."
      last_updated: 2026-08-17

    ncit:C13271:
      d4cg_label: "t(9;22)(q34;q11.2) / ABL/BCR"
      description: "A translocation between chromosomes 9 and 22 that is associated with the Philadelphia chromosome."
      last_updated: 2026-08-17

    ncit:C13283:
      d4cg_label: "Urine"
      description: "Fluid containing water and waste products. Urine is made by the kidneys, stored in the bladder, and leaves the body through the urethra."
      last_updated: 2026-08-17

    ncit:C13285:
      d4cg_label: "X"
      description: "The larger of the two human sex chromosomes. It is usually present singly in males and doubly in females."
      last_updated: 2026-08-17

    ncit:C13286:
      d4cg_label: "Y"
      description: "The smaller of the two human sex chromosome. Its presence usually determines the development of a fetus as male, while its absence usually determines the development of a fetus as female."
      last_updated: 2026-08-17

    ncit:C13297:
      d4cg_label: "Promoter"
      description: "A DNA sequence at which RNA polymerase binds and initiates transcription."
      last_updated: 2026-08-17

    ncit:C13300:
      d4cg_label: "Cord Blood"
      description: "Blood from the umbilical cord of a newborn baby. This blood contains high concentrations of stem cells (cells from which all blood cells develop)."
      last_updated: 2026-08-17

    ncit:C13316:
      d4cg_label: "Cutaneous"
      description: "Having to do with the skin."
      last_updated: 2026-08-17

    ncit:C133261:
      d4cg_label: "Bone Marrow Aspirate"
      description: "Aspirate from bone marrow."
      last_updated: 2026-08-17

    ncit:C133278:
      d4cg_label: "Platelets"
      description: "Platelets collected from a single donor and suspended in a specified volume of original plasma."
      last_updated: 2026-08-17

    ncit:C133280:
      d4cg_label: "RBC"
      description: "Red blood cells remaining after separating plasma from human blood, or collected by apheresis."
      last_updated: 2026-08-17

    ncit:C133281:
      d4cg_label: "WBC"
      description: "White blood cells intended as source material for further manufacturing use."
      last_updated: 2026-08-17

    ncit:C1333:
      d4cg_label: "Dexrazoxane"
      description: "A bisdioxopiperazine with iron-chelating, chemoprotective, cardioprotective, and antineoplastic activities. After hydrolysis to an active form that is similar to ethylenediaminetetraacetic acid (EDTA), dexrazoxane chelates iron, limiting the formation of free radical-generating anthracycline-iron complexes, which may minimize anthracycline-iron complex-mediated oxidative damage to cardiac and soft tissues. This agent also inhibits the catalytic activity of topoisomerase II, which may result in tumor cell growth inhibition."
      last_updated: 2026-08-17

    ncit:C13332:
      d4cg_label: "Bilateral"
      description: "Affecting both sides of the body or a matched pair of organs."
      last_updated: 2026-08-17

    ncit:C133427:
      d4cg_label: "INRGSS"
      description: "A clinical staging system for neuroblastoma based on preoperative imaging and determined prior to any treatment, including surgery. It includes two stages of localized disease (L1 and L2) and two stages of metastatic disease (M and MS)."
      last_updated: 2026-08-17

    ncit:C13352:
      d4cg_label: "Intraperitoneal"
      description: "Relating to the peritoneal cavity as the intended site of administration."
      last_updated: 2026-08-17

    ncit:C13356:
      d4cg_label: "Plasma"
      description: "Plasma is the fluid (noncellular) portion of the circulating blood, as distinguished from the serum that is the fluid portion of the blood obtained by removal of the fibrin clot and blood cells after coagulation."
      last_updated: 2026-08-17

    ncit:C1336:
      d4cg_label: "Cladribine"
      description: "A purine nucleoside antimetabolite analogue. Cladribine triphosphate, a phosphorylated metabolite of cladribine, incorporates into DNA, resulting in single-strand breaks in DNA, depletion of nicotinamide adenine dinucleotide (NAD) and adenosine triphosphate (ATP), and apoptosis.  Because this agent is resistant to adenosine deaminase, an enzyme that inactivates some antineoplastic agents, it is selectively toxic to lymphocytes and monocytes which exhibit little deoxynucleotide deaminase activity. (NCI04)"
      last_updated: 2026-08-17

    ncit:C13361:
      d4cg_label: "Nuclear Moulding"
      description: "Pertaining to the nucleus."
      last_updated: 2026-08-17

    ncit:C133669:
      d4cg_label: "PTCH1 Variant"
      description: "A change in the nucleotide sequence of the PTCH1 gene."
      last_updated: 2026-08-17

    ncit:C133696:
      d4cg_label: "RB Mutation"
      description: "A change in the nucleotide sequence of the RB1 gene."
      last_updated: 2026-08-17

    ncit:C13371:
      d4cg_label: "5' UTR"
      description: "Sequences on the 5' end of messenger RNAs that are not translated into protein.  5'UTR extends from the transcription start site to just before the ATG translation initiation codon.  This region contains the ribosome binding site and other transcription and translation regulating sequences."
      last_updated: 2026-08-17

    ncit:C13373:
      d4cg_label: "3' UTR"
      description: "Sequences on the 3' end of messenger RNAs that are not translated into protein. The 3'UTR is involved in many post-transcriptional regulatory pathways, including regulating translation efficiency, mRNA stability, and polyadenylation signals."
      last_updated: 2026-08-17

    ncit:C134731:
      d4cg_label: "Hilar Nodes"
      description: "A pathologic finding about one or more characteristics of perihilar bile duct cancer, following the rules of the TNM AJCC v8 classification system as they pertain to staging of regional lymph nodes."
      last_updated: 2026-08-17

    ncit:C134969:
      d4cg_label: "AIDS-Related Kaposi Sarcoma Stage"
      description: "A term that refers to the staging of AIDS-related Kaposi sarcoma according to the AIDS Clinical Trials Group system. The latter incorporates the extent of tumor (T), the status of the immune system (I), as measured by the number of CD4 cells present in the blood, and the extent of involvement within the body or systemic illness (S). Under each major heading, there are 2 subgroups: either a 0 (good risk) or a 1 (poor risk) group. (American Cancer Society)"
      last_updated: 2026-08-17

    ncit:C134970:
      d4cg_label: "kaposi_sarcoma_t"
      description: "A term that refers to the tumor status of AIDS-related Kaposi sarcoma according to the AIDS Clinical Trials Group system. (American Cancer Society)"
      last_updated: 2026-08-17

    ncit:C134976:
      d4cg_label: "T1"
      description: "AIDS-related Kaposi sarcoma involving the lungs."
      last_updated: 2026-08-17

    ncit:C134978:
      d4cg_label: "kaposi_sarcoma_i"
      description: "A term that refers to the immune system status of AIDS-related Kaposi sarcoma according to the AIDS Clinical Trials Group system. The immune status is assessed using the CD4 count test. (American Cancer Society)"
      last_updated: 2026-08-17

    ncit:C134979:
      d4cg_label: "I0"
      description: "AIDS-related Kaposi sarcoma in which the CD4 cell count is 150 or more cells per cubic mm."
      last_updated: 2026-08-17

    ncit:C134980:
      d4cg_label: "I1"
      description: "AIDS-related Kaposi sarcoma in which the CD4 cell count is lower than 150 cells per cubic mm."
      last_updated: 2026-08-17

    ncit:C134981:
      d4cg_label: "kaposi_sarcoma_s"
      description: "A term that refers to the systemic illness status of AIDS-related Kaposi sarcoma according to the AIDS Clinical Trials Group system. (American Cancer Society)"
      last_updated: 2026-08-17

    ncit:C134982:
      d4cg_label: "S0"
      description: "AIDS-related Kaposi sarcoma in which no systemic illness is present; there is no history of opportunistic infections or thrush and no B symptoms lasting more than 2 weeks. The Karnofsky performance status score is 70 or higher. (American Cancer Society)"
      last_updated: 2026-08-17

    ncit:C134983:
      d4cg_label: "S1"
      description: "AIDS-related Kaposi sarcoma in which systemic illness is present; one or more of the following is true: history of opportunistic infections or thrush; one or more B symptoms is present; Karnofsky performance status score is under 70; other HIV-related illness is present, such as neurological disease or lymphoma. (American Cancer Society)"
      last_updated: 2026-08-17

    ncit:C135727:
      d4cg_label: "Liquid Biopsy"
      description: "Sampling and analysis of non-solid biological material (primarily blood), usually to determine if cancer cells or circulating-free cancer DNA is present."
      last_updated: 2026-08-17

    ncit:C136286:
      d4cg_label: "MET Variant"
      description: "A variation in the amino acid sequence for the hepatocyte growth factor receptor protein."
      last_updated: 2026-08-17

    ncit:C13727:
      d4cg_label: "ETV6-RUNX1 t(12;21)(p13;q22)(formerly TEL-AML1)"
      description: "A translocation between chromosomes 12 and 21 involved in TEL-AML1 oncogene formation. The translocation produces a chimeric gene encoding a protein consisting of the N-terminal HLH domain of the TEL ETS-like transcription factor fused with a nearly complete AML1 protein. t(12;21) is the most frequent translocation causing ALL, accounting for 20% of ALL cases."
      last_updated: 2026-08-17

    ncit:C137698:
      d4cg_label: "M1 (Less Than 5% blasts)"
      description: "A semi-quantitative microscopic finding indicating that 5 percent or less of the nucleated cells in a bone marrow sample are immature mononuclear cells."
      last_updated: 2026-08-17

    ncit:C137812:
      d4cg_label: "boost_type"
      description: "One or more extra radiation treatments targeted at the tumor bed, given after the regular sessions of radiation are complete."
      last_updated: 2026-08-17

    ncit:C137815:
      d4cg_label: "distance_from_margin"
      description: "The distance of the closest surgical margin from tumor after surgical resection of the tumor. The closest distance between a tumor and its resection margin has prognostic significance."
      last_updated: 2026-08-17

    ncit:C1379:
      d4cg_label: "Fulvestrant"
      description: "A drug used to treat certain types of breast cancer in postmenopausal women. It is also being studied in the treatment of other types of cancer. Faslodex blocks estrogen activity in the body and is a type of antiestrogen."
      last_updated: 2026-08-17

    ncit:C138163:
      d4cg_label: "Endocrine Toxicity"
      description: "Indicates that a toxicity adverse effect has been experienced during endocrine drug treatment."
      last_updated: 2026-08-17

    ncit:C138207:
      d4cg_label: "Segment Score 0"
      description: "Unprepared colon segment with mucosa not seen due to solid stool that cannot be cleared."
      last_updated: 2026-08-17

    ncit:C138208:
      d4cg_label: "Segment Score 1"
      description: "Portion of mucosa of the colon segment seen, but other areas of the colon segment not well seen due to staining, residual stool and/or opaque liquid."
      last_updated: 2026-08-17

    ncit:C138209:
      d4cg_label: "Segment Score 2"
      description: "Minor amount of residual staining, small fragments of stool and/or opaque liquid, but mucosa of colon segment seen well."
      last_updated: 2026-08-17

    ncit:C138210:
      d4cg_label: "Segment Score 3"
      description: "Entire mucosa of colon segment seen well with no residual staining, small fragments of stool or opaque liquid."
      last_updated: 2026-08-17

    ncit:C138901:
      d4cg_label: "BMI"
      description: "The result of a body mass index measurement."
      last_updated: 2026-08-17

    ncit:C138982:
      d4cg_label: "mitotic_rate"
      description: "A score assigned to a biopsy sample to indicate the number of mitotic cells present in a tumor."
      last_updated: 2026-08-17

    ncit:C138983:
      d4cg_label: "Score 1: 0-9 Mitoses per 10 HPF"
      description: "A finding of less than or equal to 3 mitoses per mm2 (less than or equal to 7 per 10 hpf)."
      last_updated: 2026-08-17

    ncit:C138984:
      d4cg_label: "Score 2: 10-19 Mitoses per 10 HPF"
      description: "A finding of 4-7 mitoses per mm2 (8-14 per 10 hpf)."
      last_updated: 2026-08-17

    ncit:C138985:
      d4cg_label: "Score 3: > 19 Mitoses per 10 HPF"
      description: "A finding of greater than or equal to 8 mitoses per mm2 (greater than 15 per 10 hpf)."
      last_updated: 2026-08-17

    ncit:C139286:
      d4cg_label: "Microsatellite Instability Test"
      description: "An assessment of the variability in length of an individual's microsatellite sequences; microsatellite length instability may be due to mismatch repair protein mutation."
      last_updated: 2026-08-17

    ncit:C1394:
      d4cg_label: "Mifamurtide"
      description: "A drug being studied in the treatment of young adults with bone cancer that has gotten worse or come back. L-MTP-PE activates certain types of white blood cells and helps the immune system kill cancer cells. It is a type of immunostimulant."
      last_updated: 2026-08-17

    ncit:C139578:
      d4cg_label: "R0 - Complete Resection, Negative Margins"
      description: "No detectable presence of residual tumor after treatment"
      last_updated: 2026-08-17

    ncit:C139579:
      d4cg_label: "R1 - Complete Resection, Positive Margins"
      description: "Presence of microscopic residual tumor after treatment."
      last_updated: 2026-08-17

    ncit:C139580:
      d4cg_label: "R2 - Gross Residual Disease"
      description: "Presence of macroscopic residual tumor after treatment."
      last_updated: 2026-08-17

    ncit:C139663:
      d4cg_label: "CIC-DUX4"
      description: "A fusion gene that results from a chromosomal translocation t(4;19)(q35;q13) which fuses exon 20 of the CIC gene to exon 1 of the DUX4 gene. This fusion is associated with soft tissue sarcoma."
      last_updated: 2026-08-17

    ncit:C139666:
      d4cg_label: "CCNB3-BCOR"
      description: "A fusion gene that results from a paracentric chromosomal inversion inv(X)(p11.4;p11.22) which fuses the stop codon of the BCOR gene to exon 5 of the CCNB3 gene. This fusion is associated with bone sarcomas."
      last_updated: 2026-08-17

    ncit:C139668:
      d4cg_label: "EWSR1-PBX1"
      description: "A fusion gene that results from a chromosomal translocation t(1;22)(q23;q12) which fuses exon 8 of the EWSR1 gene to exon 5 of the PBX1 gene. This fusion may be associated with myoepithelioma."
      last_updated: 2026-08-17

    ncit:C139731:
      d4cg_label: "EWSR1-ZNF444"
      description: "A fusion gene that results from a chromosomal translocation t(19;22)(q13;q12) which fuses exon 8 of the EWSR1 gene to exon 5 of the ZNF444 gene. This fusion may be associated with myoepithelioma."
      last_updated: 2026-08-17

    ncit:C140251:
      d4cg_label: "HRAS Variant"
      description: "A variation in the amino acid sequence for the GTPase HRas protein."
      last_updated: 2026-08-17

    ncit:C140258:
      d4cg_label: "Enneking Staging System"
      description: "A staging system for malignant mesenchymal tumors that takes into account the surgical grade, local extent, and presence or absence of metastasis."
      last_updated: 2026-08-17

    ncit:C140270:
      d4cg_label: "International Society of Pediatric Oncology Staging System"
      description: "A staging system for Wilms' Tumor that is based on the extent of tumor spread at surgery, after the patient has received neo-adjuvant chemotherapy."
      last_updated: 2026-08-17

    ncit:C140271:
      d4cg_label: "Childrens Oncology Group/National Wilms Tumor Study Group Staging System"
      description: "A staging system for Wilms' Tumor that is based on the postoperative, pre-chemotherapy pathological features and findings relating to the extent of tumor spread."
      last_updated: 2026-08-17

    ncit:C140330:
      d4cg_label: "M3 (Greater Than 25% Blasts)"
      description: "A semi-quantitative microscopic finding indicating that 25 percent or more of the nucleated cells in a bone marrow sample are immature mononuclear cells."
      last_updated: 2026-08-17

    ncit:C140885:
      d4cg_label: "Navigation and Robotics"
      description: "A surgical technique that uses a specially designed robotic system to aid with the surgical procedure."
      last_updated: 2026-08-17

    ncit:C1411:
      d4cg_label: "Paclitaxel"
      description: "A compound extracted from the Pacific yew tree Taxus brevifolia with antineoplastic activity.  Paclitaxel binds to tubulin and inhibits the disassembly of microtubules, thereby resulting in the inhibition of cell division.  This agent also induces apoptosis by binding to and blocking the function of the apoptosis inhibitor protein Bcl-2 (B-cell Leukemia 2). (NCI04)"
      last_updated: 2026-08-17

    ncit:C141133:
      d4cg_label: "PRETEXT Staging System"
      description: "A staging system designed by the International Childhood Liver Tumor Strategy Group (SIOPEL) for staging and risk stratification of liver tumors. A PRETEXT stage number is based on the number of contiguous liver sections not involved by tumor, corresponding to a rough estimate of the difficulty of the expected surgical procedure. It is used to describe tumor extent before any therapy, thus allowing more effective comparison between studies conducted by different groups."
      last_updated: 2026-08-17

    ncit:C141147:
      d4cg_label: "Lugano Stage"
      description: "An adult non-Hodgkin lymphoma and adult and childhood Hodgkin lymphoma stage defined according to the Lugano classification criteria."
      last_updated: 2026-08-17

    ncit:C141180:
      d4cg_label: "Lugano Stage >> Stage 1"
      description: "Stage I: Involvement of a single lymphatic site (i.e., nodal region, Waldeyer's ring, thymus, or spleen). (from AJCC 8th Ed.)"
      last_updated: 2026-08-17

    ncit:C141181:
      d4cg_label: "Lugano Stage >> Stage 1E"
      description: "Stage IE: Single extralymphatic site in the absence of nodal involvement (rare in Hodgkin lymphoma). (from AJCC 8th Ed.)"
      last_updated: 2026-08-17

    ncit:C141182:
      d4cg_label: "Lugano Stage >> Stage 2"
      description: "Stage II: Involvement of two or more lymph node regions on the same side of the diaphragm. (from AJCC 8th Ed.)"
      last_updated: 2026-08-17

    ncit:C141183:
      d4cg_label: "Lugano Stage >> Stage 2E"
      description: "Stage IIE: Contiguous extralymphatic extension from a nodal site with or without involvement of other lymph node regions on the same side of the diaphragm. (from AJCC 8th Ed.)"
      last_updated: 2026-08-17

    ncit:C141186:
      d4cg_label: "Lugano Stage >> Stage 3"
      description: "Stage III: Involvement of lymph node regions on both sides of the diaphragm; nodes above the diaphragm with spleen involvement. (from AJCC 8th Ed.)"
      last_updated: 2026-08-17

    ncit:C141187:
      d4cg_label: "Lugano Stage >> Stage 4"
      description: "Stage IV: Diffuse or disseminated involvement of one or more extralymphatic organs, with or without associated lymph node involvement; or noncontiguous extralymphatic organ involvement in conjunction with nodal stage II disease; or any extralymphatic organ involvement in nodal stage III disease. Stage IV includes any involvement of the bone marrow, liver, or lungs (other than by direct extension in stage IIE disease). (from AJCC 8th Ed.)"
      last_updated: 2026-08-17

    ncit:C141216:
      d4cg_label: "St. Jude Stage"
      description: "A stage defined according to St. Jude Children's Research Hospital staging system for childhood non-Hodgkin lymphoma."
      last_updated: 2026-08-17

    ncit:C141218:
      d4cg_label: "St. Jude Stage >> Stage 1"
      description: "Stage I: A single tumor (extranodal) or single anatomic area (nodal), with the exclusion of the mediastinum or abdomen. (from AJCC 8th Ed.)"
      last_updated: 2026-08-17

    ncit:C141219:
      d4cg_label: "St. Jude Stage >> Stage 2"
      description: "Stage II: A single tumor (extranodal) with regional node involvement. Two or more nodal areas on the same side of the diaphragm. Two single (extranodal) tumors with or without regional node involvement on the same side of the diaphragm. A primary gastrointestinal tract tumor, usually in the ileocecal area, with or without involvement of associated mesenteric nodes only. (from AJCC 8th Ed.)"
      last_updated: 2026-08-17

    ncit:C141220:
      d4cg_label: "St. Jude Stage >> Stage 3"
      description: "Stage III: Two single tumors (extranodal) on opposite sides of the diaphragm. Two or more nodal areas above and below the diaphragm. All the primary intrathoracic tumors (mediastinal, pleural, and thymic). All extensive primary intra-abdominal disease. All paraspinal or epidural tumors, regardless of other tumor site(s). (from AJCC 8th Ed.)"
      last_updated: 2026-08-17

    ncit:C141221:
      d4cg_label: "St. Jude Stage >> Stage 4"
      description: "Stage IV: Any tumor, with initial CNS and/or bone marrow involvement. (from AJCC 8th Ed.)"
      last_updated: 2026-08-17

    ncit:C1413:
      d4cg_label: "Trametinib"
      description: "A drug used to treat certain types of ovarian cancer, lung cancer, and cervical cancer. Topotecan is a type of topoisomerase inhibitor."
      last_updated: 2026-08-17

    ncit:C14172:
      d4cg_label: "Benign"
      description: "For neoplasms, a non-infiltrating and non-metastasizing neoplastic process that is characterized by the absence of morphologic features associated with malignancy (e.g., severe atypia, nuclear pleomorphism, tumor cell necrosis, and abnormal mitoses). For other conditions, a process that is mild in nature and not dangerous to health."
      last_updated: 2026-08-17

    ncit:C14175:
      d4cg_label: "Diffuse"
      description: "Widely spread; not localized or confined."
      last_updated: 2026-08-17

    ncit:C14187:
      d4cg_label: "Bacteria"
      description: "A large group of single-cell microorganisms.  Some cause infections and disease in animals and humans.  The singular of bacteria is bacterium."
      last_updated: 2026-08-17

    ncit:C14209:
      d4cg_label: "Fungus"
      description: "A eukaryotic, heterotrophic organism that lives as a saprobe or parasite, and includes yeasts and molds. It reproduces either sexually or asexually, and has a life cycle that ranges from simple to complex."
      last_updated: 2026-08-17

    ncit:C142099:
      d4cg_label: "Trisomy 21 Mosaicism"
      description: "The presence of cells with and without three copies of chromosome 21 in either somatic or germinal tissue."
      last_updated: 2026-08-17

    ncit:C142126:
      d4cg_label: "SMARCA4 Variant"
      description: "A change in the nucleotide sequence of the SMARCA4 gene."
      last_updated: 2026-08-17

    ncit:C142170:
      d4cg_label: "On Treatment"
      description: "A patient is receiving treatment."
      last_updated: 2026-08-17

    ncit:C142175:
      d4cg_label: "study_type"
      description: "The nature of the investigation for which study information is being collected. (After clinicaltrials.gov)"
      last_updated: 2026-08-17

    ncit:C142318:
      d4cg_label: "Skin of the Back"
      description: "The integument that covers the back."
      last_updated: 2026-08-17

    ncit:C142444:
      d4cg_label: "Study Discontinuation"
      description: "The act of concluding participation by an enrolled subject prior to completion of all protocol-required elements in a study. NOTE: Four categories of discontinuation are distinguished: a) dropout: Active discontinuation by a subject (also a noun referring to such a discontinued subject); b) investigator initiated discontinuation (e.g., for cause); c) loss to follow-up: cessation of participation without notice or action by the subject; d) sponsor initiated discontinuation. Note that subject discontinuation does not necessarily imply exclusion of subject data from analysis. \"Termination of subject\" has a history of synonymous use, but is now considered nonstandard. [After ICH E3, section 10.1 and FDA Guidance for Industry: Submission of Abbreviated Reports & Synopses in Support of Marketing Applications, IV A] (CDISC Glossary)"
      last_updated: 2026-08-17

    ncit:C14283:
      d4cg_label: "Virus"
      description: "An infectious agent that comprises two parts: genetic material and a protein coat. These organisms lack independent metabolism, and they must infect the cells of other types of organisms to reproduce."
      last_updated: 2026-08-17

    ncit:C143014:
      d4cg_label: "Neurofibromatosis Type I"
      description: "Progressive, symptomatic neurofibromatosis type 1 associated with plexiform neurofibromas that cannot be removed surgically without risk of substantial morbidity."
      last_updated: 2026-08-17

    ncit:C143190:
      d4cg_label: "Eosinophilia"
      description: "A disorder characterized by laboratory test results that indicate an increased number of eosinophils in the blood."
      last_updated: 2026-08-17

    ncit:C143191:
      d4cg_label: "Methemoglobinemia"
      description: "A disorder characterized by laboratory test results that indicate increased methemoglobin in the blood."
      last_updated: 2026-08-17

    ncit:C143194:
      d4cg_label: "Hypopituitarism"
      description: "A disorder characterized by a decrease in production of hormones from the pituitary gland."
      last_updated: 2026-08-17

    ncit:C143195:
      d4cg_label: "Testosterone Deficiency"
      description: "A disorder characterized by low testosterone."
      last_updated: 2026-08-17

    ncit:C143196:
      d4cg_label: "Vision Decreased"
      description: "A disorder characterized by a decrease in visual acuity."
      last_updated: 2026-08-17

    ncit:C143197:
      d4cg_label: "Anal Fissure"
      description: "A disorder characterized by a tear in the lining of the anus."
      last_updated: 2026-08-17

    ncit:C143198:
      d4cg_label: "Belching"
      description: "To expel gas noisily from the mouth."
      last_updated: 2026-08-17

    ncit:C143199:
      d4cg_label: "Chylous Ascites"
      description: "A disorder characterized by accumulation of milky fluid in the peritoneal cavity."
      last_updated: 2026-08-17

    ncit:C143200:
      d4cg_label: "Rectal Fissure"
      description: "A disorder characterized by a tear in the lining of the rectum."
      last_updated: 2026-08-17

    ncit:C143250:
      d4cg_label: "Immune Checkpoint Inhibitors"
      description: "An agent that inhibits any of the immune checkpoint inhibitory proteins."
      last_updated: 2026-08-17

    ncit:C143253:
      d4cg_label: "Abdominal Distension"
      description: "A disorder characterized by swelling of the abdomen."
      last_updated: 2026-08-17

    ncit:C143255:
      d4cg_label: "Abdominal Pain"
      description: "A disorder characterized by a sensation of marked discomfort in the abdominal region."
      last_updated: 2026-08-17

    ncit:C143275:
      d4cg_label: "Anal Fistula"
      description: "A disorder characterized by an abnormal communication between the opening in the anal canal to the perianal skin."
      last_updated: 2026-08-17

    ncit:C143276:
      d4cg_label: "Anal Hemorrhage"
      description: "A disorder characterized by bleeding from the anal region."
      last_updated: 2026-08-17

    ncit:C143277:
      d4cg_label: "Anal Mucositis"
      description: "A disorder characterized by ulceration or inflammation of the mucous membrane of the anus."
      last_updated: 2026-08-17

    ncit:C143278:
      d4cg_label: "Anal Necrosis"
      description: "A disorder characterized by a necrotic process occurring in the anal region."
      last_updated: 2026-08-17

    ncit:C143279:
      d4cg_label: "Anal Pain"
      description: "A disorder characterized by a sensation of marked discomfort in the anal region."
      last_updated: 2026-08-17

    ncit:C143280:
      d4cg_label: "Anal Stenosis"
      description: "A disorder characterized by a narrowing of the lumen of the anal canal."
      last_updated: 2026-08-17

    ncit:C143281:
      d4cg_label: "Anal Ulcer"
      description: "A disorder characterized by a circumscribed, erosive lesion on the mucosal surface of the anal canal."
      last_updated: 2026-08-17

    ncit:C143290:
      d4cg_label: "Aortic Valve Disease"
      description: "A disorder characterized by a defect in aortic valve function or structure."
      last_updated: 2026-08-17

    ncit:C143300:
      d4cg_label: "Ascites"
      description: "A disorder characterized by accumulation of serous or hemorrhagic fluid in the peritoneal cavity."
      last_updated: 2026-08-17

    ncit:C143308:
      d4cg_label: "Atrioventricular Block Complete"
      description: "A disorder characterized by a dysrhythmia with complete failure of atrial electrical impulse conduction through the AV node to the ventricles."
      last_updated: 2026-08-17

    ncit:C143309:
      d4cg_label: "Atrioventricular Block First Degree"
      description: "A disorder characterized by a dysrhythmia with a delay in the time required for the conduction of an electrical impulse through the atrioventricular (AV) node beyond 0.2 seconds; prolongation of the PR interval greater than 200 milliseconds."
      last_updated: 2026-08-17

    ncit:C143322:
      d4cg_label: "Bloating"
      description: "A disorder characterized by subject-reported feeling of uncomfortable fullness of the abdomen."
      last_updated: 2026-08-17

    ncit:C143351:
      d4cg_label: "Cardiac Arrest"
      description: "A disorder characterized by cessation of the pumping function of the heart."
      last_updated: 2026-08-17

    ncit:C143352:
      d4cg_label: "Cardiac Disorders - Other, Specify"
      description: "Other specified types of cardiac disorders."
      last_updated: 2026-08-17

    ncit:C143358:
      d4cg_label: "Cecal Hemorrhage"
      description: "A disorder characterized by bleeding from the cecum."

      d4cg_label: "NTRK1 Variant"
      description: "A variation in the amino acid sequence for the high affinity nerve growth factor receptor protein."
      last_updated: 2026-08-17

    ncit:C169009:
      d4cg_label: "hla_match"
      description: "A process in which blood or tissue samples are analyzed to determine their human leukocyte antigen (HLA) profiles so that transplant materials can be transferred into a patient with the same or similar profile."

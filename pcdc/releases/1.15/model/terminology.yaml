      d4cg_label: "PTPN11 Variant"
      description: "A variation in the amino acid sequence for the tyrosine-protein phosphatase non-receptor type 11 protein."
      last_updated: 2026-08-17

    ncit:C169031:
      d4cg_label: "RB1 Variant"
      description: "A variation in the amino acid sequence for the retinoblastoma-associated protein."
      last_updated: 2026-08-17

    ncit:C169033:
      d4cg_label: "SDHB Variant"
      description: "A variation in the amino acid sequence for the succinate dehydrogenase [ubiquinone] iron-sulfur subunit, mitochondrial protein."
      last_updated: 2026-08-17

    ncit:C169036:
      d4cg_label: "SDHD Variant"
      description: "A variation in the amino acid sequence for the succinate dehydrogenase [ubiquinone] cytochrome b small subunit, mitochondrial protein."
      last_updated: 2026-08-17

    ncit:C169090:
      d4cg_label: "XPC Variant"
      description: "A variation in the amino acid sequence for the DNA repair protein complementing XP-C cells."
      last_updated: 2026-08-17

    ncit:C169096:
      d4cg_label: "MUTYH Variant"
      description: "A variation in the amino acid sequence for the adenine DNA glycosylase protein."
      last_updated: 2026-08-17

    ncit:C1691:
      d4cg_label: "Trabectedin"
      description: "A substance that comes from a type of sea squirt and is being studied in the treatment of cancer. It binds to DNA and causes breaks in the DNA. It also blocks the ability of the cell to repair the DNA damage, and may cause cancer cells to die. Trabectedin is also made in the laboratory. It is a type of DNA excision repair inhibitor."
      last_updated: 2026-08-17

    ncit:C169110:
      d4cg_label: "T0"
      description: "AIDS-related Kaposi sarcoma localized on the palate. The lesions are small and flat rather than raised. This stage is associated with good risk of recovery."
      last_updated: 2026-08-17

    ncit:C16950:
      d4cg_label: "Palpation"
      description: "A method of feeling with the hands during a physical examination. The health care provider touches and feels the patient's body to examine the size, consistency, texture, location and tenderness of an organ or body part."
      last_updated: 2026-08-17

    ncit:C16958:
      d4cg_label: "Surgical Pathology"
      description: "A field of anatomical pathology in which tissue or cells removed from a living organism are macroscopically and microscopically reviewed for the purpose of disease diagnosis."
      last_updated: 2026-08-17

    ncit:C1699:
      d4cg_label: "Zoledronic Acid"
      description: "A drug used to treat patients with hypercalcemia (high blood levels of calcium) caused by cancer. It is also used together with other drugs to treat multiple myeloma and to prevent bone fractures and reduce bone pain in people who have cancer that has spread to the bone. It is a type of bisphosphonate."
      last_updated: 2026-08-17

    ncit:C17003:
      d4cg_label: "PCR"
      description: "A laboratory method used to make many copies of a specific DNA sequence."
      last_updated: 2026-08-17

    ncit:C17007:
      d4cg_label: "PET Scan"
      description: "A procedure in which a small amount of radioactive glucose (sugar) is injected into a vein, and a scanner is used to make detailed, computerized pictures of areas inside the body where the glucose is used. Because cancer cells often use more glucose than normal cells, the pictures can be used to find cancer cells in the body."
      last_updated: 2026-08-17

    ncit:C1703:
      d4cg_label: "Tipifarnib"
      description: "A nonpeptidomimetic quinolinone with potential antineoplastic activity. Tipifarnib binds to and inhibits the enzyme farnesyl protein transferase, an enzyme involved in protein processing (farnesylation) for signal transduction.  By inhibiting the farnesylation of proteins, this agent prevents the activation of Ras oncogenes, inhibits cell growth, induces apoptosis, and inhibits angiogenesis. (NCI04)"
      last_updated: 2026-08-17

    ncit:C17049:
      d4cg_label: "race"
      description: "A geographic ancestral origin category that is assigned to a population group based mainly on physical characteristics that are thought to be distinct and inherent."
      last_updated: 2026-08-17

    ncit:C17085:
      d4cg_label: "religion_type"

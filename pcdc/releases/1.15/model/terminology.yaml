      d4cg_label: "Nausea"
      description: "A disorder characterized by a queasy sensation and/or the urge to vomit."
      last_updated: 2026-08-17

    ncit:C146770:
      d4cg_label: "Photophobia"
      description: "A disorder characterized by fear and avoidance of light."
      last_updated: 2026-08-17

    ncit:C146774:
      d4cg_label: "Stomach Pain"
      description: "A disorder characterized by a sensation of marked discomfort in the stomach."
      last_updated: 2026-08-17

    ncit:C146789:
      d4cg_label: "Pancreatitis"
      description: "A disorder characterized by inflammation of the pancreas with no documented pancreas infection."
      last_updated: 2026-08-17

    ncit:C1468:
      d4cg_label: "Cellcept (MMF)"
      description: "A drug used to prevent graft-versus-host disease (GVHD) after organ transplants. It is also being studied in the prevention of GVHD after stem cell transplants for cancer, and in the treatment of some autoimmune disorders. Mycophenolate mofetil is a type of immunosuppressive agent."
      last_updated: 2026-08-17

    ncit:C146818:
      d4cg_label: "Sequencing, NGS, Long-Read, Nanopore"
      description: "A proprietary next-generation DNA sequencing technology from Oxford Nanopore Technologies that can directly identify and sequence a DNA molecule as it passes through a nanopore, driven by electrophoresis."
      last_updated: 2026-08-17

    ncit:C146819:
      d4cg_label: "Sequencing, NGS, Long-Read, SMRT"
      description: "A proprietary third-generation DNA sequencing system from Pacific Biosciences that uses zero-mode waveguides (ZMWs) and phospholinked nucleotides. A single DNA polymerase enzyme is affixed at the bottom of a ZMW structure with a single molecule of DNA as a template. A fluorescent tag is cleaved off with each base addition and is detected to create the sequence."
      last_updated: 2026-08-17

    ncit:C146926:
      d4cg_label: "CDK4 Variant"
      description: "A variation in the amino acid sequence for a protein encoded by the CDKN2A gene."
      last_updated: 2026-08-17

    ncit:C1474:
      d4cg_label: "Filgrastim"
      description: "A colony-stimulating factor that stimulates the production of neutrophils (a type of white blood cell). It is a cytokine that is a type of hematopoietic (blood-forming) agent."
      last_updated: 2026-08-17

    ncit:C147530:
      d4cg_label: "MIRAGE Syndrome"
      description: "An autosomal dominant condition caused by mutation(s) in the SAMD9 gene, encoding sterile alpha motif domain-containing protein 9A. It is a syndromic condition comprising myelodysplasia, infection, restriction of growth, adrenal hypoplasia, genital abnormalities, and enteropathy."
      last_updated: 2026-08-17

    ncit:C147948:
      d4cg_label: "Central Nervous System B-Cell Non-Hodgkin Lymphoma"
      description: "A B-cell non-Hodgkin lymphoma that arises from the brain, meninges, or spinal cord."
      last_updated: 2026-08-17

    ncit:C148010:
      d4cg_label: "Intergroup Rhabdomyosarcoma Study Group Clinical Staging and Grouping System"
      description: "Staging and grouping for rhabdomyosarcoma that groups patients into low, intermediate, or high clinical risk groups based on: histologic type, tumor site, tumor size, and pathologic TNM. Note: this is not the TNM system described in AJCC."
      last_updated: 2026-08-17

    ncit:C148012:
      d4cg_label: "Intergroup Rhabdomyosarcoma Study Group Clinical Staging and Grouping System >> Group 1"
      description: "Localized disease, excised."
      last_updated: 2026-08-17

    ncit:C148015:
      d4cg_label: "Intergroup Rhabdomyosarcoma Study Group Clinical Staging and Grouping System >> Group 2"
      description: "Total gross resection with regional disease spread."
      last_updated: 2026-08-17

    ncit:C148019:
      d4cg_label: "Intergroup Rhabdomyosarcoma Study Group Clinical Staging and Grouping System >> Stage 3"
      description: "Gross residual disease."
      last_updated: 2026-08-17

    ncit:C148022:
      d4cg_label: "Intergroup Rhabdomyosarcoma Study Group Clinical Staging and Grouping System >> Stage 4"
      description: "Distant metastasis."
      last_updated: 2026-08-17

    ncit:C148412:
      d4cg_label: "T3d"
      description: "A TNM finding term that refers to choroidal and ciliary body melanoma, conjunctival melanoma, or retinoblastoma TNM staging. For choroidal and ciliary body melanoma it means tumor size category 3 with ciliary body involvement and extraocular extension 5 mm or less in largest diameter. For conjunctival melanoma it means tumor of any size invading the nasolacrimal duct and/or lacrimal sac and/or paranasal sinuses. For retinoblastoma it means hyphema and/or massive vitreous hemorrhage (clinical) or full-thickness invasion into the outer third of the sclera and/or invasion into or around emissary channels (pathologic). (from AJCC 8th Ed.)"
      last_updated: 2026-08-17

    ncit:C148649:
      d4cg_label: "Start Lost"
      description: "A mutation occurring within the start codon of a gene that results in a sequence that no longer encodes a start codon. This can result in a gene deletion or gene transcription may start from an alternative start site."
      last_updated: 2026-08-17

    ncit:C148650:
      d4cg_label: "Stop Lost"
      description: "A mutation occurring within the stop codon of a gene that results in a sequence that no longer encodes a stop codon and results in the transcription of non-coding regions downstream of the gene."
      last_updated: 2026-08-17

    ncit:C1493:
      d4cg_label: "Satraplatin"
      description: "A substance being studied in the treatment of prostate and other types of cancer. It contains the metal platinum and may kill cancer cells by damaging their DNA and stopping them from dividing. It is a type of alkylating agent."
      last_updated: 2026-08-17

    ncit:C150742:
      d4cg_label: "Marital or Civil Status Not Disclosed"
      description: "An indication that the marital or civil status of a relationship has not been disclosed."
      last_updated: 2026-08-17

    ncit:C150887:
      d4cg_label: "Daughter"
      description: "A female progeny with genetic makeup inherited from the parent."
      last_updated: 2026-08-17

    ncit:C150888:
      d4cg_label: "Son"
      description: "A male progeny with genetic makeup inherited from the parent."
      last_updated: 2026-08-17

    ncit:C15189:
      d4cg_label: "Biopsy"
      description: "Patient required removal of tissue or fluid specimen to establish a diagnosis, including biopsy and blood samples."
      last_updated: 2026-08-17

    ncit:C151909:
      d4cg_label: "ANKRD26 Variant"
      description: "A change in the nucleotide sequence of the ANKRD26 gene."
      last_updated: 2026-08-17

    ncit:C15191:
      d4cg_label: "Apheresis"
      description: "A procedure in which blood is collected, part of the blood such as platelets or white blood cells is taken out, and the rest of the blood is returned to the donor."
      last_updated: 2026-08-17

    ncit:C15192:
      d4cg_label: "Transfusion"
      description: "Patient required an infusion of whole blood or a blood component directly into the bloodstream."
      last_updated: 2026-08-17

    ncit:C15193:
      d4cg_label: "Bone Marrow Biopsy"
      description: "A biopsy involving the removal of a core tissue containing bone spicules and hematopoietic elements embedded in the marrow stroma.  This procedure is done in the hip area mainly for the diagnosis and evaluation of neoplastic and non-neoplastic hematopoietic disorders (e.g. anemias, leukemias, lymphomas) and the evaluation of the spread of solid tumors (e.g. carcinomas, sarcomas) and lymphomas for therapeutic purposes."
      last_updated: 2026-08-17

    ncit:C15195:
      d4cg_label: "Brachytherapy"
      description: "A type of radiation therapy in which radioactive material is placed inside the body, into a tumor or body cavity."
      last_updated: 2026-08-17

    ncit:C152088:
      d4cg_label: "ACD Variant"
      description: "A change in the nucleotide sequence of the ACD gene."
      last_updated: 2026-08-17

    ncit:C15209:
      d4cg_label: "Colectomy"
      description: "An operation to remove all or part of the colon. When only part of the colon is removed, it is called a partial colectomy. In an open colectomy, one long incision is made in the wall of the abdomen and doctors can see the colon directly. In a laparoscopic-assisted colectomy, several small incisions are made and a thin, lighted tube attached to a video camera is inserted through one opening to guide the surgery. Surgical instruments are inserted through the other openings to perform the surgery."
      last_updated: 2026-08-17

    ncit:C15217:
      d4cg_label: "Cystectomy"
      description: "Surgery to remove all or part of the bladder (the organ that holds urine) or to remove a cyst (a sac or capsule in the body)."
      last_updated: 2026-08-17

    ncit:C15220:
      d4cg_label: "diagnosis"
      description: "A process to identify the disease, condition, or injury that explains the symptoms and signs occurring in a patient."
      last_updated: 2026-08-17

    ncit:C15236:
      d4cg_label: "Gastrectomy"
      description: "An operation to remove all or part of the stomach."
      last_updated: 2026-08-17

    ncit:C15246:
      d4cg_label: "Heart Transplant"
      description: "A surgical procedure in which a damaged heart is removed and replaced by another heart from a suitable donor."
      last_updated: 2026-08-17

    ncit:C15256:
      d4cg_label: "Hysterectomy"
      description: "A surgical procedure to remove the uterine body (partial hysterectomy) or the uterine body and cervix (total hysterectomy)."
      last_updated: 2026-08-17

    ncit:C15262:
      d4cg_label: "Immunotherapy"
      description: "A therapy designed to induce changes in a patient's immune status."
      last_updated: 2026-08-17

    ncit:C15277:
      d4cg_label: "Mastectomy"
      description: "Surgery to remove the breast (or as much of the breast tissue as possible)."
      last_updated: 2026-08-17

    ncit:C15284:
      d4cg_label: "Nephrectomy"
      description: "A surgical procedure to completely or partially remove a kidney. With a complete nephrectomy, the attached adrenal gland, perinephric fat, and regional lymph nodes are often removed as well. With a partial nephrectomy, the removed tissue contains the tumor and a rim of normal renal parenchyma only."
      last_updated: 2026-08-17

    ncit:C15291:
      d4cg_label: "Oophorectomy, NOS"
      description: "Partial or complete removal of one or both of the ovaries."
      last_updated: 2026-08-17

    ncit:C15292:
      d4cg_label: "Palliative Treatment"
      description: "The patient- and family-centered active holistic care of patients with advanced, progressive disease. Essential components of palliative care are: pain and symptom control, communication regarding treatment and alternatives, prognosis, and available services, rehabilitation services, care that addresses treatment and palliative concerns, intellectual, emotional, social, and spiritual needs, terminal care, support in bereavement. The goal of palliative care is an achievement of the best quality of life for patients and their families."
      last_updated: 2026-08-17

    ncit:C15300:
      d4cg_label: "Proctectomy"
      description: "Treatment with drugs that become active when exposed to light. These activated drugs may kill cancer cells."
      last_updated: 2026-08-17

    ncit:C15303:
      d4cg_label: "Pilot"
      description: "A small study that is done to test a process before starting a larger study. (https://mrctcenter.org/glossaryterm/pilot-study/)"
      last_updated: 2026-08-17

    ncit:C15304:
      d4cg_label: "Plasmapheresis"
      description: "A procedure that collects plasma from the peripheral blood while returning the rest to the donor's circulation."
      last_updated: 2026-08-17

    ncit:C15307:
      d4cg_label: "Prostatectomy"
      description: "An operation to remove part or all of the prostate. Radical (or total) prostatectomy is the removal of the entire prostate and some of the tissue around it."
      last_updated: 2026-08-17

    ncit:C15313:
      d4cg_label: "energy_type"
      description: "Patient required additional radiation therapy."
      last_updated: 2026-08-17

    ncit:C15329:
      d4cg_label: "Surgery"
      description: "A diagnostic or treatment procedure performed by manual and/or instrumental means, often involving an incision and the removal or replacement of a diseased organ or tissue; of or relating to or involving or used in surgery or requiring or amenable to treatment by surgery."
      last_updated: 2026-08-17

    ncit:C15337:
      d4cg_label: "Thoracotomy"
      description: "A surgical procedure in which an large incision is made into the chest wall, for the purpose of accessing organs inside the thoracic cavity."
      last_updated: 2026-08-17

    ncit:C15350:
      d4cg_label: "prior_tbi"
      description: "A procedure involving irradiation of the whole body."
      last_updated: 2026-08-17

    ncit:C153513:
      d4cg_label: "STAG2"
      description: "A change in the nucleotide sequence of the STAG2 gene."
      last_updated: 2026-08-17

    ncit:C15356:
      d4cg_label: "Whipple Pancreaticoduodenectomy"
      description: "A type of surgery used to treat pancreatic cancer. The head of the pancreas, the duodenum, a portion of the stomach, and other nearby tissues are removed."
      last_updated: 2026-08-17

    ncit:C15357:
      d4cg_label: "Esophagectomy"
      description: "An operation to remove a portion of the esophagus."
      last_updated: 2026-08-17

    ncit:C15358:
      d4cg_label: "EBRT, Stereotactic Radiosurgery"
      description: "A non-surgical procedure that was developed to deliver one or several maximum dose targeted radiation treatments for cancers in the brain or spine."
      last_updated: 2026-08-17

    ncit:C15361:
      d4cg_label: "Fine-Needle Aspiration"
      description: "The removal of tissue or fluid with a thin needle for examination under a microscope."
      last_updated: 2026-08-17

    ncit:C15366:
      d4cg_label: "Platelets Transfusion"
      description: "The infusion of platelets into the bloodstream."
      last_updated: 2026-08-17

    ncit:C15386:
      d4cg_label: "Incisional Biopsy"
      description: "A procedure in which a surgical incision (cut) is made through the skin to expose and remove tissues. The biopsy tissue is examined under a microscope by a pathologist. An open biopsy may be done in the doctor's office or in the hospital, and may use local anesthesia or general anesthesia. A lumpectomy to remove a breast tumor is a type of open biopsy."
      last_updated: 2026-08-17

    ncit:C15409:
      d4cg_label: "Red Blood Cells Transfusion"
      description: "The intravenous administration of red blood cells (whole blood without the plasma) into an individual."
      last_updated: 2026-08-17

    ncit:C15430:
      d4cg_label: "Peripheral Blood"
      description: "A method of hematopoietic reconstitution utilizing stem cells harvested from the circulating blood of a patient or donor. Peripheral blood stem cell transplantation (PBSCT) is used for the treatment of certain blood disorders, following partial or complete bone marrow ablation, or following high dose chemotherapy or radiation treatment for cancer. Immature circulating blood cells, similar to stem cells in the bone marrow, are removed before treatment. The cells are then given to the patient after treatment to help the bone marrow recover and continue producing healthy blood cells. Transplantation may be autologous (the patient's own blood cells are used), allogeneic (blood cells are donated by someone else), or syngeneic (blood cells are donated by an identical twin)."
      last_updated: 2026-08-17

    ncit:C15431:
      d4cg_label: "Stem Cell Transplant"
      description: "A therapeutic procedure that involves the transplantation of hematopoietic stem cells from a donor to a recipient."
      last_updated: 2026-08-17

    ncit:C154628:
      d4cg_label: "age_at_measurement"
      description: "The procedures for measurements of the body's basic functions that provide insight into the health status of the person."
      last_updated: 2026-08-17

    ncit:C15474:
      d4cg_label: "Hematologic Toxicity"
      description: "A treatment designed to reduce or prevent damage to the hematologic system due to adverse events from other drug therapies."
      last_updated: 2026-08-17

    ncit:C155304:
      d4cg_label: "Pituitary Gland Blastoma"
      description: "A rare developmental early childhood neoplasm, arising within the fetal anterior pituitary. It is associated with DICER1 mutations. Patients present with features of Cushing disease, with elevated blood ACTH levels and hypercortisolism. Ophthalmoplegia is a frequent symptom. The overall prognosis is poor. (WHO)"
      last_updated: 2026-08-17

    ncit:C15538:
      d4cg_label: "subgroup_name"
      description: "A group of participants in a research study who all receive the same study treatment. (https://mrctcenter.org/glossaryterm/arm/)"
      last_updated: 2026-08-17

    ncit:C15549:
      d4cg_label: "Stool-Based Colorectal Cancer Screening"
      description: "Checking an individual for the presence or absence of colorectal cancer."
      last_updated: 2026-08-17

    ncit:C1555:
      d4cg_label: "Pegylated Liposomal Doxorubicin Hydrochloride"
      description: "A form of the anticancer drug doxorubicin that is contained in very tiny, fat-like particles. It may have fewer side effects and work better than doxorubicin. Doxil is used to treat ovarian cancer, AIDS-related Kaposi sarcoma, and multiple myeloma in patients whose disease has not gotten better after treatment with other anticancer drugs. It may be used together with other anticancer drugs. It is also being studied in the treatment of other types of cancer. Doxil is a type of anthracycline antitumor antibiotic."
      last_updated: 2026-08-17

    ncit:C155885:
      d4cg_label: "Tegavivint"
      description: "A small molecule inhibitor of the Wnt/beta-catenin pathway with potential antineoplastic activity. Upon intravenous administration, tegavivint binds to transducin beta-like protein 1 (TBL1) and disrupts the binding of beta-catenin to TBL1. This promotes beta-catenin degradation, attenuates nuclear and cytoplasmic levels of beta-catenin, and reduces transcriptional activity of transcription factor 4 (TCF4) and expression of its target genes, cyclin D1, c-Myc and survivin. The Wnt/beta-catenin signaling pathway regulates cell morphology, motility, and proliferation; aberrant regulation of this pathway leads to neoplastic proliferation. Beta-catenin is frequently mutated in various tumors."
      last_updated: 2026-08-17

    ncit:C155992:
      d4cg_label: "ETV6 Rearranged"
      description: "A molecular abnormality indicating rearrangement of the ETV6 gene."
      last_updated: 2026-08-17

    ncit:C15600:
      d4cg_label: "Phase 1"
      description: "A clinical research protocol designed to test a new biomedical intervention in a small group of people for the first time. A Phase I trial can be to establish the toxicity of a new treatment with escalating intensity of the treatment administered and/or to determine the side effects of a new treatment for a particular indication in subjects."
      last_updated: 2026-08-17

    ncit:C15601:
      d4cg_label: "Phase 2"
      description: "A clinical research protocol designed to study a biomedical or behavioral intervention in a larger group of people (several hundred), to evaluate the drug's effectiveness for a particular indication in patients with the disease or condition under study, and to determine the common short-term side effects and risks associated with the intervention."
      last_updated: 2026-08-17

    ncit:C15602:
      d4cg_label: "Phase 3"
      description: "A clinical research protocol designed to investigate the efficacy of the biomedical or behavioral intervention in large groups of human subjects (from several hundred to several thousand), to confirm efficacy, to monitor adverse reactions to the new medication or treatment regimen with respect to long-term use and by comparing the intervention to other standard or experimental interventions as well as to a placebo."
      last_updated: 2026-08-17

    ncit:C156056:
      d4cg_label: "Sequencing, NGS, ATAC-seq"
      description: "A molecular genetic technique that isolates and sequences chromosomal regions that are rich in open chromatin. First, nuclei are harvested from a cellular sample. Then a hyperactive Tn5 transposase is added to the nuclei where it excises non-nucleosomal DNA strands and ligates co-administered high-throughput sequencing adapters (tagmentation).  The tagged DNA fragments are isolated, amplified by PCR and sequenced. The number of reads for specific region of DNA correlate with increased chromatin accessibility and this method can identify regions of transcription factor and nucleosome binding."
      last_updated: 2026-08-17

    ncit:C156057:
      d4cg_label: "MicroRNA Sequencing"
      description: "A next-generation or massively parallel high-throughput DNA sequencing-based procedure that can identify and quantify the microRNA sequences present in a biological sample."
      last_updated: 2026-08-17

    ncit:C15607:
      d4cg_label: "Clinical"
      description: "A diagnosis made from a study of the signs and symptoms of a disease."
      last_updated: 2026-08-17

    ncit:C15608:
      d4cg_label: "stage_category"
      description: "Performing exams and tests to learn the extent of the cancer within the body, especially whether the disease has spread from the original site to other parts of the body. It is important to know the stage of the disease in order to plan the best treatment."
      last_updated: 2026-08-17

    ncit:C15632:
      d4cg_label: "Chemotherapy, NOS"
      description: "Non-systemic chemotherapy treatment (e.g., intra-peritoneal, intra-cavitary, intra-thecal), or chemotherapy not described by Chemotherapy Single Agent Systemic or Multi-Agent Systemic."
      last_updated: 2026-08-17

    ncit:C15640:
      d4cg_label: "Cord Blood"
      description: "A therapeutic procedure that involves the transplantation of hematopoietic stem cells collected from the umbilical cord or placenta."
      last_updated: 2026-08-17

    ncit:C156450:
      d4cg_label: "iscn"
      description: "An international standard for human chromosome nomenclature, which includes band names, symbols and abbreviated terms used in the description of human chromosome and chromosome abnormalities."
      last_updated: 2026-08-17

    ncit:C156541:
      d4cg_label: "Separated"
      description: "A person who is separated from their spouse, whether or not there is a legal arrangement."
      last_updated: 2026-08-17

    ncit:C156587:
      d4cg_label: "mentrual_regularity"
      description: "A description of how an individual's menstrual cycle conforms to a consistent temporal pattern."
      last_updated: 2026-08-17

    ncit:C156660:
      d4cg_label: "Genitourinary Disorder"
      description: "A non-neoplastic or neoplastic disorder that affects the genitourinary system."
      last_updated: 2026-08-17

    ncit:C156729:
      d4cg_label: "Itacnosertib"
      description: "An orally bioavailable inhibitor of activin A receptor type 1 (activin receptor-like kinase 2; ALK2; ALK-2; ACRV1), with potential antineoplastic activity. Upon oral administration,itacnosertib targets, binds to and inhibits the activity of ALK-2. This prevents ALK-2-mediated signaling and inhibits cell growth in ALK-2-overexpressing tumor cells. In addition, in cancer and inflammatory conditions, ALK-2 is upregulated in response to increased signaling of pro-inflammatory cytokines, especially interleukin-6 (IL-6), and enhances the secretion of hepcidin, a peptide liver hormone and a key modulator of iron homeostasis. Blocking ALK-2-mediated pathways in inflammation and cancer leads to a decrease of hepcidin expression and restores plasma iron levels, thereby preventing low serum iron levels and anemia of chronic disease (ACD). ALK-2, a serine/threonine receptor kinase, is constitutively activated due to activating mutations or upregulated upstream signaling pathways in inflammatory conditions and certain types of cancer."
      last_updated: 2026-08-17

    ncit:C156762:
      d4cg_label: "PPM1D Amplification"
      description: "A molecular genetic abnormality indicating the presence of multiple copies of the PPM1D gene."
      last_updated: 2026-08-17

    ncit:C15679:
      d4cg_label: "Consolidation"
      description: "Treatment that is given after cancer has disappeared following the initial therapy. Consolidation therapy is used to kill any cancer cells that may be left in the body. It may include radiation therapy, a stem cell transplant, or treatment with drugs that kill cancer cells."
      last_updated: 2026-08-17

    ncit:C156813:
      d4cg_label: "Initial Diagnosis"
      description: "The first diagnosis of the disease."
      last_updated: 2026-08-17

    ncit:C15688:
      d4cg_label: "Maintenance"
      description: "Continuation of treatment for an extended period of time to prevent relapse."
      last_updated: 2026-08-17

    ncit:C15697:
      d4cg_label: "regimen"
      description: "A description of the schedule and periodicity of a treatment or vaccination regimen."
      last_updated: 2026-08-17

    ncit:C157120:
      d4cg_label: "procedure_site"
      description: "The anatomic site of the tumor."
      last_updated: 2026-08-17

    ncit:C157425:
      d4cg_label: "Tumor, Focal"
      description: "The characterization of the location of the tumor."
      last_updated: 2026-08-17

    ncit:C157443:
      d4cg_label: "extent"
      description: "A description of the relative amount of tissue, blood vessel, or organ that has been removed."
      last_updated: 2026-08-17

    ncit:C157449:
      d4cg_label: "Multiple Endocrine Neoplasia Type 4"
      description: "An autosomal dominant tumor syndrome caused by germline CDKN1B mutations that result in a phenotype similar to that of multiple endocrine neoplasia type 1, characterized by endocrine neoplasms, particularly in the parathyroid glands, pituitary, and pancreas. (WHO 2017)"
      last_updated: 2026-08-17

    ncit:C15755:
      d4cg_label: "Lumpectomy"
      description: "Surgery to remove abnormal tissue or cancer from the breast and a small amount of normal tissue around it. It is a type of breast-sparing surgery."
      last_updated: 2026-08-17

    ncit:C157569:
      d4cg_label: "CEBPA Mutation - Biallelic"
      description: "The presence of mutations in both alleles of the CEBPA gene."
      last_updated: 2026-08-17

    ncit:C157797:
      d4cg_label: "Gallbladder Surgery"
      description: "Any surgical procedures to treat bladder cancer."
      last_updated: 2026-08-17

    ncit:C157826:
      d4cg_label: "Core Decompression"
      description: "A surgical procedure in which areas of dead bone are drilled to increase blood flow, slow or stop tissue destruction and decrease pressure."
      last_updated: 2026-08-17

    ncit:C157837:
      d4cg_label: "Endoscopic Submucosal Dissection"
      description: "A surgical procedure on the gastric tract to remove deep tumors via endoscope."
      last_updated: 2026-08-17

    ncit:C15791:
      d4cg_label: "Clinical Testing"
      description: "Small-scale testing (usually on SBIRs) of new technology in a small group of patients or normal volunteers. Does not meet the rigorous criteria of a clinical trial."
      last_updated: 2026-08-17

    ncit:C158080:
      d4cg_label: "Basal Ganglia-Thalamus"
      description: "The gray matter that includes the basal ganglia and/or thalamus."
      last_updated: 2026-08-17

    ncit:C158140:
      d4cg_label: "PAX5 Variant"
      description: "A variation in the amino acid sequence for paired box protein Pax-5."
      last_updated: 2026-08-17

    ncit:C158252:
      d4cg_label: "Sequencing, NGS, Targeted RNA Panel"
      description: "A type of whole transcriptome shotgun sequencing technique in which select portions of the transcriptome are selected for sequencing."
      last_updated: 2026-08-17

    ncit:C158253:
      d4cg_label: "Sequencing, NGS, Targeted DNA Panel"
      description: "A DNA sequencing technique in which selected regions of an individual's genome are sequenced."
      last_updated: 2026-08-17

    ncit:C158711:
      d4cg_label: "miR-371a-3p"
      description: "The human MIR371A wild-type allele is located in the vicinity of 19q13.42 and is approximately 67 bases in length. This allele, which encodes MIR371A pre-miRNA, may be involved in the regulation of target gene expression. Alteration in the expression of this gene is associated with malignant germ cell tumors."
      last_updated: 2026-08-17

    ncit:C158758:
      d4cg_label: "Surgical Resection"
      description: "A surgical procedure in which tissue is removed from the body."
      last_updated: 2026-08-17

    ncit:C158876:
      d4cg_label: "Induction"
      description: "The first choice of treatment for a particular type of cancer."
      last_updated: 2026-08-17

    ncit:C158954:
      d4cg_label: "genetic_analysis_method"
      description: "A request to enter the specific molecular analysis method used to detect abnormalities in the study."
      last_updated: 2026-08-17

    ncit:C159156:
      d4cg_label: "HER2 Inhibitor"
      description: "Any agent that inhibits the human epidermal growth factor receptor 2 (HER2; HER-2; ERBB2)."
      last_updated: 2026-08-17

    ncit:C159203:
      d4cg_label: "Ascitic Fluid"
      description: "A biospecimen of ascitic fluid."
      last_updated: 2026-08-17

    ncit:C159355:
      d4cg_label: "Abdominal Peritoneum"
      description: "A membranous lining of the abdominal cavity and abdominal organs."
      last_updated: 2026-08-17

    ncit:C159481:
      d4cg_label: "necrosis"
      description: "A quantitative measurement of the percent of cells undergoing necrosis compared to the number of total cells present in a sample."
      last_updated: 2026-08-17

    ncit:C159488:
      d4cg_label: "Bone Marrow Core/Trephine Biopsy"
      description: "A specimen of bone marrow tissue obtained by using a relatively large diameter needle designed to acquire a core specimen."
      last_updated: 2026-08-17

    ncit:C159546:
      d4cg_label: "RECIST >> Stable Disease"
      description: "Neither sufficient shrinkage to qualify for partial response nor sufficient increase to qualify for progressive disease, taking as reference the smallest sum longest diameter since start of treatment."
      last_updated: 2026-08-17

    ncit:C159547:
      d4cg_label: "RECIST >> Partial Response"
      description: "At least a 30% decrease in the sum of the longest diameter of target lesions, taking as reference the baseline sum longest diameter."
      last_updated: 2026-08-17

    ncit:C159710:
      d4cg_label: "Ever"
      description: "An indication that an individual used something at least one time."
      last_updated: 2026-08-17

    ncit:C159716:
      d4cg_label: "RECIST >> Progressive Disease"
      description: "At lease a 20% increase in the sum of the longest diameter of target lesions, taking as reference the smallest sum longest diameter recorded since the treatment started or the appearance of one or more new lesions."
      last_updated: 2026-08-17

    ncit:C159957:
      d4cg_label: "Lymph Node Response"
      description: "Criteria for the response to treatment in lymph nodes, as a component of global response."
      last_updated: 2026-08-17

    ncit:C160080:
      d4cg_label: "Liposomal Doxorubicin"
      description: "A regimen consisting of liposomal doxorubicin that may be used in the treatment of desmoid tumors (aggressive fibromatoses); soft tissue, uterine, and Kaposi sarcomas; mycosis fungoides and Sezary syndrome; Castleman disease; and ovarian, fallopian tube, primary peritoneal, breast, and endometrial cancers."
      last_updated: 2026-08-17

    ncit:C160199:
      d4cg_label: "Right"
      description: "A finding indicating the tumor location is on the right side of the specimen."
      last_updated: 2026-08-17

    ncit:C160200:
      d4cg_label: "Left"
      description: "A finding indicating the tumor location is on the left side of the specimen."
      last_updated: 2026-08-17

    ncit:C16035:
      d4cg_label: "EBRT, 3D Conformal"
      description: "A procedure that uses a computer to create a 3-dimensional picture of the tumor. This allows doctors to give the highest possible dose of radiation to the tumor, while sparing the normal tissue as much as possible."
      last_updated: 2026-08-17

    ncit:C160424:
      d4cg_label: "Distant Lymph Nodes"
      description: "Lymph nodes located outside the region of interest."
      last_updated: 2026-08-17

    ncit:C160565:
      d4cg_label: "FLOT"
      description: "A regimen consisting of 5-fluorouracil, leucovorin, oxaliplatin and docetaxel that can be used in the treatment of gastric, esophageal and esophagogastric junction cancers."
      last_updated: 2026-08-17

    ncit:C1606:
      d4cg_label: "Labradimil"
      description: "A substance that is being studied for its ability to help other drugs reach the brain. It belongs to the family of drugs called bradykinin agonists."
      last_updated: 2026-08-17

    ncit:C160603:
      d4cg_label: "Camizestrant"
      description: "An orally available selective estrogen receptor degrader (SERD), with potential antineoplastic activity. Upon administration, camizestrant binds to the estrogen receptor (ER) and induces a conformational change that results in the degradation of the receptor. This prevents ER-mediated signaling and inhibits the growth and survival of ER-expressing cancer cells."
      last_updated: 2026-08-17

    ncit:C160684:
      d4cg_label: "Tetrathiomolybdate (TM)"
      description: "An orally bioavailable metal copper (Cu) chelator, with potential antiangiogenic, anti-metastatic and antitumor activities. Upon oral administration, tetrathiomolybdate (TM) targets and binds to copper and food protein in the gastrointestinal (GI) tract, thereby forming stable complexes and preventing copper uptake and reabsorption. Additionally, absorbed free TM targets and binds to copper and serum albumin in the bloodstream. This depletes systemic copper reserves and deprives the tumor microenvironment (TME) from copper. Chelation of copper by TM downregulates the expression of angiogenic factors of which copper is a cofactor, such as vascular endothelial growth factor (VEGF) and basic fibroblast growth factor (bFGF), and prevents the production of nuclear factor-kappa B (NF-kB). Copper deprivation also inhibits the activity and levels of copper-dependent angiogenic enzymes, such as vascular endothelial growth factor receptor (VEGFR). This modulates the activity of VEGFR-positive endothelial progenitor cells (EPCs) that are necessary for metastasis. EPC deficiency results in the inhibition of angiogenesis and prevents metastasis. TM also inhibits the activities of other copper-containing metalloenzymes, including superoxide dismutase 1 (SOD1) in endothelial cells, cytochrome C oxidase, vascular adhesion protein-1 (VAP-1), antioxidant 1 copper chaperone (ATOX-1) and matrix metalloproteinase 9 (MMP-9). Inhibition of these enzymes interferes with the activation of several signal transduction pathways required for cellular proliferation and angiogenesis. TM also inhibits the activity and levels of lysyl oxidase-like 2 (LOXL2; lysyl oxidase homolog 2), a copper dependent amine oxidase that is critical for modeling the pre-metastatic niche and promotes metastasis, tumor cell migration and invasiveness. In addition, copper depletion also attenuates the activation of host cells within the tumor microenvironment including cancer-associated fibroblasts (CAFs), modulates tumor associated macrophages (TAMs) and promotes cytotoxic T-lymphocyte (CTL)-mediated anti-tumor immune responses."
      last_updated: 2026-08-17

    ncit:C1607:
      d4cg_label: "Anastrozole"
      description: "A nonsteroidal inhibitor of estrogen synthesis that resembles paclitaxel in chemical structure.  As a third-generation aromatase inhibitor, anastrozole selectively binds to and reversibly inhibits aromatase, a cytochrome P-450 enzyme complex found in many tissues including those of the premenopausal ovary, liver, and breast; aromatase catalyzes the aromatization of androstenedione and testosterone into estrone and estradiol, the final step in estrogen biosynthesis.  In estrogen-dependent breast cancers, ananstrozole may inhibit tumor growth. (NCI04)"
      last_updated: 2026-08-17

    ncit:C160903:
      d4cg_label: "ICD-O"
      description: "A code for the primary site of a tumor being reported using either ICD-O-2 or ICD-O-3."
      last_updated: 2026-08-17

    ncit:C1613:
      d4cg_label: "Antineoplaston AS2-1"
      description: "A 4:1 mixture of phenylacetate and phenylacetylgluatmine, degradation products of the antineoplaston agent A10.  Antineoplaston AS2-1 inhibits the incorporation of L-glutamine into tumor-cell proteins, leading to cell cycle arrest in the G1 phase and inhibition of mitosis.  This agent may also inhibit RAS oncogene expression and activate tumor suppressor gene p53, resulting in cell differentiation and apoptosis. (NCI04)"
      last_updated: 2026-08-17

    ncit:C161351:
      d4cg_label: "Kappa to Lambda Ratio"
      description: "A relative measurement (ratio) of the total kappa light chain to total lambda light chain in a biological specimen."
      last_updated: 2026-08-17

    ncit:C161379:
      d4cg_label: "Skin of the Chest"
      description: "The integument that covers the chest."
      last_updated: 2026-08-17

    ncit:C161381:
      d4cg_label: "Heel (calcaneus)"
      description: "The rounded back part of the foot below the ankle and behind the arch."
      last_updated: 2026-08-17

    ncit:C1614:
      d4cg_label: "Aspacytarabine"
      description: "A semisynthetic derivative of the nucleoside-like antineoplastic antibiotic spicamycin, originally isolated from the bacterium Streptomyces alanosinicus.  KRN 5500 inhibits protein synthesis by interfering with endoplasmic reticulum and Golgi apparatus functions.  This agent also induces cell differentiation and caspase-dependent apoptosis. (NCI04)"
      last_updated: 2026-08-17

    ncit:C16145:
      d4cg_label: "Donor Lymphocyte Infusion"
      description: "A type of therapy in which lymphocytes from the blood of a donor are given to a patient who has already received a stem cell transplant from the same donor. The donor lymphocytes may kill remaining cancer cells. Donor lymphocyte infusion is used to treat chronic myelogenous leukemia (CML) that has come back and myeloma. It is being studied in the treatment of other types of cancer."
      last_updated: 2026-08-17

    ncit:C161601:
      d4cg_label: "procedure"
      description: "A categorization of surgical procedures by type or purpose."
      last_updated: 2026-08-17

    ncit:C162491:
      d4cg_label: "Paratesticular"
      description: "A small anatomical compartment that contains the testicular collecting system, and mesothelial and mesenchymal components that represent extensions of the abdominal cavity and retroperitoneum."
      last_updated: 2026-08-17

    ncit:C162623:
      d4cg_label: "Normal"
      description: "Tissue sample with cellular composition and architectural patterns expected for the particular anatomic site in which it belongs. There is no evidence of abnormal cellular infiltrates or tumor mass formation."
      last_updated: 2026-08-17

    ncit:C162696:
      d4cg_label: "Familial Platelet Disorder and AML Syndrome"
      description: "An autosomal dominant condition caused by mutation(s) in the RUNX1 gene, encoding runt-related transcription factor 1. It is characterized by thrombocytopenia, abnormal platelet function, and a propensity to develop acute myeloid leukemia."
      last_updated: 2026-08-17

    ncit:C162818:
      d4cg_label: "Parapharyngeal Area"
      description: "A cone-shaped lateral neck space with its base on the base of the skull and its apex at the hyoid bone."
      last_updated: 2026-08-17

    ncit:C16290:
      d4cg_label: "Angiogram"
      description: "An image of blood vessels."
      last_updated: 2026-08-17

    ncit:C162993:
      d4cg_label: "High-Grade Glioma"
      description: "A grade 3 or 4 glioma that arises from the brain. This category includes anaplastic astrocytoma, anaplastic ependymoma, anaplastic oligoastrocytoma, anaplastic oligodendroglioma, anaplastic pleomorphic xanthoastrocytoma (all grade 3 gliomas), and glioblastoma (grade 4 glioma)."
      last_updated: 2026-08-17

    ncit:C16313:
      d4cg_label: "Autoimmune Reaction"
      description: "A specific humoral or cell-mediated immune response against autologous (self) antigens."
      last_updated: 2026-08-17

    ncit:C16352:
      d4cg_label: "Black or African American"
      description: "A person having origins in any of the black racial groups of Africa. Terms such as \"Haitian\" or \"Negro\" can be used in addition to \"Black or African American.\" (FDA)"
      last_updated: 2026-08-17

    ncit:C16357:
      d4cg_label: "Western Blot"
      description: "A laboratory procedure for the detection or identification of proteins or peptides that have been separated by gel electrophoresis and transferred onto nitrocellulose or other type of paper or nylon membrane. The proteins are then detected by reaction with enzymatically labeled or radiolabeled antibody probes."
      last_updated: 2026-08-17

    ncit:C163732:
      d4cg_label: "Increased Cell Mitotic Activity"
      description: "An increase in the frequency of mitotic activity."
      last_updated: 2026-08-17

    ncit:C164157:
      d4cg_label: "surgical_complications"
      description: "A disease or disorder that occurs during, soon after or as a result of a surgical procedure."
      last_updated: 2026-08-17

    ncit:C164163:
      d4cg_label: "Therapuetic Growth Hormone"
      description: "Any agent that is chemically identical to, similar to or can be used as a replacement for endogenous human growth hormone (GH)."
      last_updated: 2026-08-17

    ncit:C164173:
      d4cg_label: "APC Variant"
      description: "A variation in the amino acid sequence for adenomatosis polyposis coli protein."
      last_updated: 2026-08-17

    ncit:C164265:
      d4cg_label: "CDC73 Variant"
      description: "A variation in the amino acid sequence for the parafibromin protein."
      last_updated: 2026-08-17

    ncit:C164287:
      d4cg_label: "DICER1 Variant"
      description: "A variation in the amino acid sequence for the endoribonuclease Dicer protein."
      last_updated: 2026-08-17

    ncit:C16450:
      d4cg_label: "Lower Endoscopy, Colonoscopy"
      description: "Endoscopic examination of the luminal surface of the colon."
      last_updated: 2026-08-17

    ncit:C16451:
      d4cg_label: "Colposcopy"
      description: "Endoscopic examination of the uterine cervix and vagina."
      last_updated: 2026-08-17

    ncit:C164550:
      d4cg_label: "laterality"
      description: "A coded value specifying the side of the entity."
      last_updated: 2026-08-17

    ncit:C164634:
      d4cg_label: "Height"
      description: "A measurement that describes the vertical measurement or distance from the base, or bottom, of the patient, to the top of the patient; this can be taken as the dimension of extension of a patient who cannot stand."
      last_updated: 2026-08-17

    ncit:C164815:
      d4cg_label: "reference_genome"
      description: "The source-specific version of the genome assembly.  EXAMPLE(S):  (Human Genome) Build 35  OTHER NAME(S):  NOTE(S):"
      last_updated: 2026-08-17

    ncit:C16487:
      d4cg_label: "Cytogenetics, NOS"
      description: "The branch of biology that studies the cellular aspects of heredity, especially the chromosomes. Includes the study of disease states caused by numerical and structural chromosome abnormalities."
      last_updated: 2026-08-17

    ncit:C16491:
      d4cg_label: "Cytology"
      description: "The light microscopic study of normal and abnormal cells in fine needle aspirates (FNAs), body cavity fluids, and smears."
      last_updated: 2026-08-17

    ncit:C16493:
      d4cg_label: "data_source"
      description: "Source of information collected in the course of a clinical trial, specifically used to differentiate between data as collected versus data that are derived or calculated. NOTE: In CDISC, a metadata attribute defined for each dataset variable in the Define.xml document of an SDTM submission that refers to the source of a variable (e.g., CRF, derived, sponsor defined, PRO, etc.). See also data element originator."
      last_updated: 2026-08-17

    ncit:C165222:
      d4cg_label: "DNA Methylation, Array"
      description: "The use of a high-throughput microarray where all of the known CpG islands either in a single specimen or all of the known promoter sequences of a specimen or a population group are coupled to beads or microwells to determine which are methylated."
      last_updated: 2026-08-17

    ncit:C16525:
      d4cg_label: "Echocardiogram"
      description: "A procedure that uses high-frequency sound waves (ultrasound) to create an image of the heart."
      last_updated: 2026-08-17

    ncit:C16546:
      d4cg_label: "Video Capsule Endoscopy"
      description: "A diagnostic or therapeutic procedure in which an endoscope is inserted in a tubular organ to examine the structural architecture and/or remove abnormal tissues."
      last_updated: 2026-08-17

    ncit:C165502:
      d4cg_label: "EBRT, Pencil Beam Scanning"
      description: "A precise form of proton therapy that uses an electronically guided scanning system and magnets to deliver a proton beam that is millimeters wide. With this system, beam position and depth can be controlled, allowing for highly precise deposition of radiation to be delivered in all three dimensions of the tumor."
      last_updated: 2026-08-17

    ncit:C165503:
      d4cg_label: "CDH1 Variant"
      description: "A change in the nucleotide sequence of the CDH1 gene that is associated with a pathogenic or likely pathogenic prognosis."
      last_updated: 2026-08-17

    ncit:C165564:
      d4cg_label: "ERCC2 Variant"
      description: "A variation in the amino acid sequence for the general transcription and DNA repair factor IIH helicase subunit XPD protein."
      last_updated: 2026-08-17

    ncit:C165569:
      d4cg_label: "PTEN Variant"
      description: "A variation in the amino acid sequence for phosphatidylinositol 3,4,5-trisphosphate 3-phosphatase and dual-specificity protein phosphatase PTEN."
      last_updated: 2026-08-17

    ncit:C165603:
      d4cg_label: "FBXW7 Variant"
      description: "A variation in the amino acid sequence for F-box/WD repeat-containing protein 7."
      last_updated: 2026-08-17

    ncit:C16564:
      d4cg_label: "ethnicity"
      description: "A social group characterized by a distinctive social and cultural tradition that is maintained from generation to generation. Members share a common history and origin and a sense of identification with the group. They have similar and distinctive features in their lifestyle habits and shared experiences. They often have a common genetic heritage which may be reflected in their experience of health and disease."
      last_updated: 2026-08-17

    ncit:C165667:
      d4cg_label: "EWSR1 Rearranged"
      description: "A molecular abnormality indicating rearrangement of the EWSR1 gene."
      last_updated: 2026-08-17

    ncit:C165668:
      d4cg_label: "CIC Rearranged"
      description: "A molecular abnormality indicating rearrangement of the CIC gene."
      last_updated: 2026-08-17

    ncit:C165682:
      d4cg_label: "Integrated"
      description: "Combining things, people, or ideas of different types in one effective unit, group, or system."
      last_updated: 2026-08-17

    ncit:C165755:
      d4cg_label: "FGFR4 Variant"
      description: "A variation in the amino acid sequence for the fibroblast growth factor receptor 4 protein."
      last_updated: 2026-08-17

    ncit:C16576:
      d4cg_label: "Female"
      description: "A person who belongs to the sex that normally produces ova. The term is used to indicate biological sex distinctions, or cultural gender role distinctions, or both. [The NCI Thesaurus contains biomedical terminologies that NCI does not own or control. This concept contains gender-related content that does not comply with Executive Order 14168.]"
      last_updated: 2026-08-17

    ncit:C16580:
      d4cg_label: "In Vitro Fertilization"
      description: "A procedure in which eggs are removed from a woman's ovary and combined with sperm outside the body to form embryos. The embryos are grown in the laboratory for several days and then either placed in a woman's uterus or cryopreserved (frozen) for future use."
      last_updated: 2026-08-17

    ncit:C16585:
      d4cg_label: "Flow Cytometry"
      description: "A method of measuring the number of cells in a sample, the percentage of live cells in a sample, and certain characteristics of cells, such as size, shape, and the presence of tumor markers on the cell surface. The cells are stained with a light-sensitive dye, placed in a fluid, and passed in a stream before a laser or other type of light. The measurements are based on how the light-sensitive dye reacts to the light."
      last_updated: 2026-08-17

    ncit:C166035:
      d4cg_label: "EBV DNA"
      description: "A measurement of the Epstein-Barr virus DNA in a biological specimen."
      last_updated: 2026-08-17

    ncit:C16604:
      d4cg_label: "Upper Endoscopy, Colonoscope"
      description: "Endoscopic examination of the stomach."
      last_updated: 2026-08-17

    ncit:C16605:
      d4cg_label: "Amplification"
      description: "An increase in the number of copies of a gene. There may also be an increase in the RNA and protein made from that gene. Gene amplification is common in cancer cells, and some amplified genes may cause cancer cells to grow or become resistant to anticancer drugs. Genes may also be amplified in the laboratory for research purposes."
      last_updated: 2026-08-17

    ncit:C16606:
      d4cg_label: "Deletion"
      description: "A deletion that results in the loss of a DNA segment encompassing an entire gene sequence."
      last_updated: 2026-08-17

    ncit:C166064:
      d4cg_label: "ddPCR"
      description: "A type of digital polymerase chain reaction technique in which the sample is fractionated into thousands of tiny droplets using a water-oil emulsion droplet technology, within which individual PCR reactions occur in each droplet."
      last_updated: 2026-08-17

    ncit:C166114:
      d4cg_label: "Biological Parent"
      description: "The male who supplied the sperm or the female who supplied the egg which resulted in one's conception."
      last_updated: 2026-08-17

    ncit:C166165:
      d4cg_label: "Treatment-Related Mortality"
      description: "A death that is considered to be causally linked to a treatment."
      last_updated: 2026-08-17

    ncit:C166200:
      d4cg_label: "ae_grade"
      description: "A numeric value corresponding to the degree of severity of an adverse event."
      last_updated: 2026-08-17

    ncit:C166208:
      d4cg_label: "cycle_number"
      description: "The number of the individual chemotherapeutic cycle."
      last_updated: 2026-08-17

    ncit:C166232:
      d4cg_label: "disease_site"
      description: "Specifies the anatomic site of a localized pathological or traumatic structural change, damage, deformity, or discontinuity of tissue, organ, or body part."
      last_updated: 2026-08-17

    ncit:C166384:
      d4cg_label: "MTOR Variant"
      description: "A variation in the amino acid sequence for the serine/threonine-protein kinase mTOR protein."
      last_updated: 2026-08-17

    ncit:C166880:
      d4cg_label: "Methylprednisolone"
      description: ""
      last_updated: 2026-08-17

    ncit:C167058:
      d4cg_label: "NF1 Variant"
      description: "A variation in the amino acid sequence for the neurofibromin protein."
      last_updated: 2026-08-17

    ncit:C167144:
      d4cg_label: "MLL Rearrangement (Translocation)"
      description: "A cytogenetic abnormality that refers to any translocation involving the MLL (KMT2A) gene."
      last_updated: 2026-08-17

    ncit:C167194:
      d4cg_label: "t(8;16)MOZ/CBP"
      description: "A cytogenetic abnormality that refers to the translocation of the short arm (p11.2) of chromosome 8 and the short arm (p13.3) of chromosome 16. It is associated with KAT6A/CREBBP fusions and acute myeloid leukemia."
      last_updated: 2026-08-17

    ncit:C167195:
      d4cg_label: "inv(16)(p13.3q24.3) / CBFA2T3-GLIS2"
      description: "A pericentric chromosomal inversion that involves chromosome 16. It is associated with CBFA2T3/GLIS2 fusions and pediatric acute megakaryoblastic leukemia."
      last_updated: 2026-08-17

    ncit:C167213:
      d4cg_label: "Sleeve Gastrectomy"
      description: "A robotic bariatric procedure that removes most of the stomach, with the remaining stomach reformed into a tube."
      last_updated: 2026-08-17

    ncit:C16739:
      d4cg_label: "Artifical Insemination"
      description: "Introduction of sperm into the female reproductive tract by artificial means in order to achieve fertilization."
      last_updated: 2026-08-17

    ncit:C16805:
      d4cg_label: "Lymphangiogram"
      description: "An x-ray image of the lymphatic system using a radiopaque imaging agent."
      last_updated: 2026-08-17

    ncit:C16809:
      d4cg_label: "measurement3"
      description: "A procedure in which radio waves and a powerful magnet linked to a computer are used to create detailed pictures of areas inside the body. These pictures can show the difference between normal and diseased tissue. NMRI makes better images of organs and soft tissue than other scanning techniques, such as computed tomography (CT) or x-ray. NMRI is especially useful for imaging the brain, the spine, the soft tissue of joints, and the inside of bones."
      last_updated: 2026-08-17

    ncit:C168186:
      d4cg_label: "EKG"
      description: "A line graph that shows changes in the electrical activity of the heart over time. It is made by an instrument called an electrocardiograph. The graph can show that there are abnormal conditions, such as blocked arteries, changes in electrolytes (particles with electrical charges), and changes in the way electrical currents pass through the heart tissue."
      last_updated: 2026-08-17

    ncit:C168217:
      d4cg_label: "Heart Defect"
      description: "Genetic anomalies and collections of malformations that are known to cluster together that can be associated with congenital heart defects."
      last_updated: 2026-08-17

    ncit:C168296:
      d4cg_label: "Alcohol"
      description: "An indication that the patient has a history of alcohol use."
      last_updated: 2026-08-17

    ncit:C16848:
      d4cg_label: "DNA Methylation, NOS"
      description: "A chemical reaction in which a small molecule called a methyl group is added to other molecules. Methylation of proteins or nucleic acids may affect how they act in the body."
      last_updated: 2026-08-17

    ncit:C168483:
      d4cg_label: "Ventriculoperitoneal Shunt"
      description: "A therapeutic procedure that involves the placement of a tube in one of the ventricles of the brain to allow for drainage of cerebrospinal fluid (CSF) into the peritoneal cavity. It is used to relieve hydrocephalus."
      last_updated: 2026-08-17

    ncit:C1685642:
      d4cg_label: "Scheduling Issues"
      description: ""
      last_updated: 2026-08-17

    ncit:C1687:
      d4cg_label: "Imatinib Mesylate"
      description: "A drug used to treat different types of leukemia and other cancers of the blood, gastrointestinal stromal tumors, skin tumors called dermatofibrosarcoma protuberans, and a rare condition called systemic mastocytosis. It is also being studied in the treatment of other types of cancer. Imatinib mesylate blocks the protein made by the bcr/abl oncogene. It is a type of tyrosine kinase inhibitor."
      last_updated: 2026-08-17

    ncit:C168758:
      d4cg_label: "t(10;11)(p11.2;q23)"
      description: "A cytogenetic abnormality that refers to the translocation of the short arm (p11.2) of chromosome 10 and the long arm (q23) of chromosome 11. It is associated with KMT2A (MLL)/ABI1 fusions and acute myeloid leukemia."
      last_updated: 2026-08-17

    ncit:C168759:
      d4cg_label: "t(1;11)(q21;q23) / MLL-MLLT11(AF1Q)"
      description: "A cytogenetic abnormality that refers to the translocation of the long arm (q21) of chromosome 1 and the long arm (q23) of chromosome 11. It is associated with KMT2A (MLL)/MLLT11 (AF1Q) fusions, acute myeloid leukemia and some cases of acute lymphoblastic leukemia."
      last_updated: 2026-08-17

    ncit:C168760:
      d4cg_label: "t(11;17)(AF17)"
      description: "A cytogenetic abnormality that refers to the translocation of the long arm (q23) of chromosome 11 and the long arm (q12-21) of chromosome 19. It is associated with KMT2A (MLL) fusions, including those with MLLT6 (AF17), and acute myeloid leukemia."
      last_updated: 2026-08-17

    ncit:C168764:
      d4cg_label: "t(11;19)(q23;p13) / (MLL-ENL)/(MLL-ELL)"
      description: "A cytogenetic abnormality that refers to the translocation of the long arm (q23) of chromosome 11 and the short arm (p13) of chromosome 19. It is associated with KMT2A (MLL) fusions, including those with MLLT1 (ENL) and ELL, and acute myeloid leukemia."
      last_updated: 2026-08-17

    ncit:C168766:
      d4cg_label: "t(3;12)(q23;p12.3)(ETV6/EVI1)"
      description: "A cytogenetic abnormality that refers to the translocation of the long arm (q23) of chromosome 3 and the short arm (p12.3) of chromosome 12. It is associated with ETV6/MECOM (EVI1) fusions, myeloproliferative disorders, myelodysplastic syndromes and acute myelogenous leukemia."
      last_updated: 2026-08-17

    ncit:C168769:
      d4cg_label: "del(5q)(5q31-q32)"
      description: "A cytogenetic abnormality that refers to deletion of chromosome bands 31-32 on the long arm of chromosome 5."
      last_updated: 2026-08-17

    ncit:C168770:
      d4cg_label: "del(13q)(13q 14 - 21)"
      description: "A cytogenetic abnormality that refers to deletion of chromosome bands 14-21 on the long arm of chromosome 13."
      last_updated: 2026-08-17

    ncit:C168771:
      d4cg_label: "Non-KMT2A MLLT10"
      description: "An indication that a cytogenetic rearrangement involving MLLT10 but not involving KMT2A was detected in a sample."
      last_updated: 2026-08-17

    ncit:C168773:
      d4cg_label: "t(16;21)(q24;q22) / RUNX1-CBFA2T3"
      description: "A cytogenetic abnormality that refers to the translocation of the long arm (q24) of chromosome 16 and the long arm (q22) of chromosome 22. It is associated with RUNX1/CBFA2T3 fusions, myelodysplastic syndromes and acute myeloid leukemia."
      last_updated: 2026-08-17

    ncit:C168774:

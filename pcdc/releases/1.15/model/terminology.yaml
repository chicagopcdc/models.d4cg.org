    ncit:C185322:
      d4cg_label: "nodular_splenic"
      description: "A finding indicating that Hodgkin lymphoma has spread to the spleen focally and there is associated involvement of the hilar lymph nodes."
      last_updated: 2026-08-17

    ncit:C185323:

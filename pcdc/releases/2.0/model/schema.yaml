id: https://models.d4cg.org/pcdc
name: pcdc
title: PCDC Data Model
license: CC BY-NC 4.0
version: 2.0
prefixes:
  pcdc: https://example.org/pcdc/
  linkml: https://w3id.org/linkml/
  ncit: http://purl.obolibrary.org/obo/NCIT_
  so: http://purl.obolibrary.org/obo/SO_
  uberon: http://purl.obolibrary.org/obo/UBERON_
  icdo: 'https://bioregistry.io/icdo:'
  ucum: 'https://bioregistry.io/ucum:'
  rxnorm: 'https://bioregistry.io/rxnorm:'
default_prefix: pcdc
default_range: string
imports:
- linkml:types
- slots
- enums
subsets:
  base:
    name: base
    title: Base Model
    description: The PCDC data model represents a harmonized consensus data model developed across all participating PCDC disease groups and consortia. It serves as the canonical model from which disease-specific and dataset-specific views are derived.
  all:
    name: all
    title: Acute Lymphoblastic Leukemia
    description: The ALL view of the PCDC data model represents consensus data modeling by an international group of pediatric acute lymphoblastic leukemia experts and is maintained by Data for the Common Good (D4CG) at the University of Chicago. It is based on the collective requirements of its contributors.
  aml:
    name: aml
    title: Acute Myeloid Leukemia
    description: The AML view of the PCDC data model represents consensus data modeling by an international group of pediatric acute myeloid leukemia experts and is maintained by Data for the Common Good (D4CG) at the University of Chicago in collaboration with the International Acute Myeloid Leukemia Consortium (INTERACT). It is based on the collective requirements of its contributors.
  cns:
    name: cns
    title: Central Nervous System Tumors
    description: The CNS view of the PCDC data model represents consensus data modeling by an international group of pediatric central nervous system tumor experts and is maintained by Data for the Common Good (D4CG) at the University of Chicago in collaboration with the International Central Nervous System Pediatric Research Consortium (INSPiRE). It is based on the collective requirements of its contributors.
  ews:
    name: ews
    title: Ewing Sarcoma
    description: The EWS view of the PCDC data model represents consensus data modeling by an international group of pediatric Ewing sarcoma experts and is maintained by Data for the Common Good (D4CG) at the University of Chicago in collaboration with the Harmonization International Bone Sarcoma Consortium (HIBiSCus). It is based on the collective requirements of its contributors.
  fa:
    name: fa
    title: Fanconi Anemia
    description: The FA view of the PCDC data model represents consensus data modeling by an international group of Fanconi Anemia experts and is maintained by Data for the Common Good (D4CG) at the University of Chicago in collaboration with the Fanconi Research Initiative for Education, Networking, and Data Sharing Consortium (FRIENDS). It is based on the collective requirements of its contributors.
  fprh:
    name: fprh
    title: Fertility Preservation and Reproductive Health
    description: The FPRH view of the PCDC data model represents consensus data modeling by an international group of oncology-related fertility preservation and reproductive health experts and is maintained by Data for the Common Good (D4CG) at the University of Chicago in collaboration with the Reproductive Hope Consortium (R-HOPE). It is based on the collective requirements of its contributors.
  gct:
    name: gct
    title: Germ Cell Tumors
    description: The GCT view of the PCDC data model represents consensus data modeling by an international group of pediatric germ cell tumor experts and is maintained by Data for the Common Good (D4CG) at the University of Chicago in collaboration with the Malignant Germ Cell International Consortium (MaGIC). It is based on the collective requirements of its contributors.
  hl:
    name: hl
    title: Hodgkin Lymphoma
    description: The HL view of the PCDC data model represents consensus data modeling by an international group of pediatric Hodgkin lymphoma experts and is maintained by Data for the Common Good (D4CG) at the University of Chicago in collaboration with the Hodgkin Lymphoma Data Collaboration (NODAL). It is based on the collective requirements of its contributors.
  ls:
    name: ls
    title: Lynch Syndrome
    description: The LS view of the PCDC data model represents consensus data modeling by an international group of Lynch Syndrome experts and is maintained by Data for the Common Good (D4CG) at the University of Chicago in collaboration with the Lynch Syndrome Integrative Epidemiology and Genetics Consortium (LINEAGE). It is based on the collective requirements of its contributors.
  lt:
    name: lt
    title: Liver Tumors
    description: The LT view of the PCDC data model represents consensus data modeling by an international group of pediatric liver tumor experts and is maintained by Data for the Common Good (D4CG) at the University of Chicago in collaboration with the Children's Hepatic Tumors International Collaboration (CHIC). It is based on the collective requirements of its contributors.
  nbl:
    name: nbl
    title: Neuroblastoma
    description: The NBL view of the PCDC data model represents consensus data modeling by an international group of pediatric neuroblastoma experts and is maintained by Data for the Common Good (D4CG) at the University of Chicago in collaboration with the International Neuroblastoma Risk Group (INRG). It is based on the collective requirements of its contributors.
  npc:
    name: npc
    title: Nasopharyngeal Carcinoma
    description: The NPC view of the PCDC data model represents consensus data modeling by an international group of pediatric nasopharyngeal carcinoma experts and is maintained by Data for the Common Good (D4CG) at the University of Chicago in collaboration with the Nasopharyngeal Carcinoma Global Partnership (NOBLE). It is based on the collective requirements of its contributors.
  nrsts:
    name: nrsts
    title: Non-rhabdomyosarcoma Soft Tissue Sarcomas
    description: The NRSTS view of the PCDC data model represents consensus data modeling by an international group of pediatric non-rhabdomyosarcoma soft tissue sarcoma experts and is maintained by Data for the Common Good (D4CG) at the University of Chicago in collaboration with the International Soft Tissue Sarcoma Consortium (INSTRuCT). It is based on the collective requirements of its contributors.
  os:
    name: os
    title: Osteosarcoma
    description: The OS view of the PCDC data model represents consensus data modeling by an international group of pediatric osteosarcoma experts and is maintained by Data for the Common Good (D4CG) at the University of Chicago in collaboration with the Harmonization International Bone Sarcoma Consortium (HIBiSCus). It is based on the collective requirements of its contributors.
  pre:
    name: pre
    title: Cancer Predisposition
    description: The PRE view of the PCDC data model represents consensus data modeling by an international group of cancer predisposition experts and is maintained by Data for the Common Good (D4CG) at the University of Chicago in collaboration with the Consortium for Childhood Cancer Predisposition (C3P). It is based on the collective requirements of its contributors.
  rb:
    name: rb
    title: Retinoblastoma
    description: The RB view of the PCDC data model represents consensus data modeling by an international group of pediatric retinoblastoma experts and is maintained by Data for the Common Good (D4CG) at the University of Chicago in collaboration with the Global Retinoblastoma Alliance for Children (Global REACH). It is based on the collective requirements of its contributors.
  rms:
    name: rms
    title: Rhabdomyosarcoma
    description: The RMS view of the PCDC data model represents consensus data modeling by an international group of pediatric rhabdomyosarcoma experts and is maintained by Data for the Common Good (D4CG) at the University of Chicago in collaboration with the International Soft Tissue Sarcoma Consortium (INSTRuCT). It is based on the collective requirements of its contributors.
classes:
  Person:
    description: Person represents an internal person-level record used to connect one or more subject records that may refer to the same underlying individual.
    slots:
    - submitter_id
    comments:
    - This is a class used by D4CG to group Subjects across data contributors and is not necessary in exports.
    in_subset:
    - base
    annotations:
      domain: internal
      cardinality: 1..1
      ignore_in_export: 'true'
    slot_usage:
      submitter_id:
        in_subset:
        - base
        required: false
        annotations:
          priority: []
